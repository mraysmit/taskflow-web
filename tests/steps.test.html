<!-- Button steps that end or repeat a run: a Delete step still sends the button's alerts and webhooks, and buttons that run each
     other in a loop run once (with a warning) and can't be saved in Configuration. Phase 1 adds the buttons to the saved
     workspace (as an imported or shared file could) and reloads; phase 2 uses them. -->
<script>
window.addEventListener('error', e => { (window.__errs = window.__errs || []).push(e.message + ' @' + e.lineno); });
window.addEventListener('load', async () => {
  const phase = sessionStorage.getItem('sphase') || '1';
  const out = JSON.parse(sessionStorage.getItem('sout') || '[]');
  const ok = (n, c) => out.push((c ? 'PASS ' : 'FAIL ') + n);
  const q = s => document.querySelector(s), qa = s => [...document.querySelectorAll(s)];
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const setv = (el, v) => { el.value = v; el.dispatchEvent(new Event('input', { bubbles: true })); el.dispatchEvent(new Event('change', { bubbles: true })); };
  const login = async u => { q('#loginUser').value = u; q('#loginPass').value = 'demo'; q('#loginForm').requestSubmit(); await wait(300); qa('.toast').forEach(t => t.remove()); };
  const card = ref => qa('#board .card').find(c => c.querySelector('.card-ref') && c.querySelector('.card-ref').textContent === ref);
  const btn = (ref, label) => card(ref) && [...card(ref).querySelectorAll('[data-action]')].find(b => b.textContent === label);
  const store = () => JSON.parse(localStorage.getItem('taskhub.v2'));
  const fetches = []; window.fetch = (url, opts) => { fetches.push({ url, opts }); return Promise.resolve({ status: 202 }); };
  const finish = () => {
    if (window.__errs) out.push('JSERRS: ' + window.__errs.join(' | '));
    sessionStorage.clear(); try { localStorage.clear(); } catch (e) {}
    const fails = out.filter(l => !l.startsWith('PASS'));
    const pre = document.createElement('pre');
    pre.textContent = `${out.length - fails.length} passed, ${fails.length} failed\n\n` + (fails.join('\n') || '(no failures)') + '\n\n' + out.join('\n');
    pre.style.cssText = 'position:fixed;inset:0;margin:0;z-index:2147483647;background:#fff;color:#000;font:13px/1.4 monospace;padding:12px;white-space:pre-wrap';
    document.body.appendChild(pre);
    if (window.__report) window.__report(out);
  };
  const button = (id, label, steps) => ({ id, label, color: '#2e3394', outline: false, width: 'md', show: { statuses: ['*'], filterId: '' }, steps });
  try {
    await wait(200);
    if (phase === '1') {
      q('[data-load-default]').click(); await wait(300);
      await login('achan');
      const s = store();
      s.config.actions.push(
        button('a_remove', 'Remove', [
          { type: 'notify', who: 'person', personId: 'p2', message: '{ref} "{title}" was removed by {actor}.' },
          { type: 'webhook', method: 'POST', url: 'https://example.test/removed', body: '{"ref":"{ref}"}' },
          { type: 'delete' },
        ]),
        button('a_loopA', 'Loop A', [{ type: 'createItem', title: 'Loop copy of {ref}', notify: false }, { type: 'runButton', actionId: 'a_loopB' }]),
        button('a_loopB', 'Loop B', [{ type: 'runButton', actionId: 'a_loopA' }]),
        button('a_hook', 'Tell chat', [{ type: 'webhook', method: 'POST', url: 'https://hooks.example.test/services/T000/SECRET123?token=abc', body: '{"ref":"{ref}"}' }]),
      );
      localStorage.setItem('taskhub.v2', JSON.stringify(s));
      sessionStorage.setItem('sout', JSON.stringify(out)); sessionStorage.setItem('sphase', '2');
      location.reload(); return;
    }

    // ---------- Delete with messages ----------
    ok('The added buttons are on the cards', !!btn('OMD-001', 'Remove') && !!btn('OMD-002', 'Loop A'));
    btn('OMD-001', 'Remove').click(); await wait(30);
    ok('Delete asks first', q('#dlg').open);
    q('#dlgOk').click(); await wait(100);
    ok('The item is deleted', !card('OMD-001') && !store().items.some(i => i.ref === 'OMD-001'));
    ok('The button’s webhook is still called', fetches.some(f => f.url === 'https://example.test/removed' && String(f.opts.body).includes('OMD-001')));
    ok('The button’s alert is still sent', store().alerts.some(a => a.toId === 'p2' && String(a.text).includes('OMD-001') && String(a.text).includes('removed')));
    ok('The deletion is logged', store().activity.some(a => a.msg.includes('OMD-001 deleted')));

    // ---------- A webhook's address can hold its key: it is not written to the history everyone can read ----------
    btn('OMD-003', 'Tell chat').click(); await wait(100);
    ok('The webhook is called with its full address', fetches.some(f => f.url === 'https://hooks.example.test/services/T000/SECRET123?token=abc'));
    const hookLog = store().activity.filter(a => a.msg.includes('Webhook for OMD-003')).map(a => a.msg).join(' | ');
    ok('The history records the webhook and which site it went to', hookLog.includes('hooks.example.test') && hookLog.includes('202'));
    ok('…but not the rest of its address, which can hold a key', !hookLog.includes('SECRET123') && !hookLog.includes('token=abc'));

    // ---------- Buttons that run each other ----------
    qa('.toast').forEach(t => t.remove());
    const before = store().items.length;
    btn('OMD-002', 'Loop A').click(); await wait(100);
    const copies = store().items.filter(i => i.title === 'Loop copy of OMD-002').length;
    ok('A loop of buttons runs each step once', copies === 1 && store().items.length === before + 1);
    ok('…and warns about the loop', qa('.toast').some(t => /loop/i.test(t.textContent)));

    q('#sideConfig').click(); await wait(30); q('[data-cfg-nav="workflow"]').click(); await wait(30);
    const i = store().config.actions.findIndex(a => a.id === 'a_loopB');
    setv(q(`[data-bind="actions.${i}.label"]`), 'Loop B (renamed)'); await wait(30);
    q('[data-cfg-cmd="save"]').click(); await wait(50);
    ok('Configuration refuses to save a loop of buttons', store().config.actions[i].label === 'Loop B' && /runs itself/.test(q('#view-config').textContent));
    q('[data-cfg-cmd="discard"]').click(); await wait(30);
    if (q('#dlg').open) { q('#dlgOk').click(); await wait(30); }
    ok('no JS errors', !(window.__errs || []).length);
  } catch (e) { out.push('ERROR (phase ' + phase + ') ' + e.message + '\n' + e.stack); }
  finish();
});
</script>
