<!-- Board, card buttons, handoffs, comments, the form, pages and the Configuration screen. -->
<script>
window.addEventListener('error', e => { (window.__errs = window.__errs || []).push(e.message + ' @' + e.lineno); });
window.addEventListener('load', async () => {
  const out = []; const ok = (n, c) => out.push((c ? 'PASS ' : 'FAIL ') + n);
  const q = s => document.querySelector(s), qa = s => [...document.querySelectorAll(s)];
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const card = ref => qa('#board .card').find(c => c.querySelector('.card-ref') && c.querySelector('.card-ref').textContent === ref);
  const btn = (ref, label) => [...card(ref).querySelectorAll('[data-action]')].find(b => b.textContent === label);
  const colCount = st => q(`.col[data-status="${st}"] .count`).textContent;
  const fieldVal = (ref, lbl) => { const f = [...card(ref).querySelectorAll('.field')].find(x => x.querySelector('.field-l').textContent === lbl); return f && f.querySelector('.field-v').textContent; };
  const statVals = () => qa('.stat-value').map(x => x.textContent).join(',');
  const dlgOpen = () => q('#dlg').open;
  const okDlg = () => q('#dlgOk').click();
  const cancelDlg = () => q('#dlg button[value="cancel"]').click();
  const setv = (el, v, ev = 'input') => { el.value = v; el.dispatchEvent(new Event(ev, { bubbles: true })); if (ev === 'input') el.dispatchEvent(new Event('change', { bubbles: true })); };
  const B = path => q(`#view-config [data-bind="${path}"]`);
  const nav = s => q(`[data-cfg-nav="${s}"]`).click();
  const addRow = list => q(`#view-config [data-op="add"][data-list="${list}"]`).click();
  const saveCfg = async () => { q('[data-cfg-cmd="save"]').click(); await wait(20); };
  const tick = () => wait(10);
  const store = () => JSON.parse(localStorage.getItem('taskhub.v2'));
  const board = async () => { q('#tabs [data-tab="board"]').click(); await tick(); };
  const downloads = []; HTMLAnchorElement.prototype.click = function () { downloads.push(this.download); };
  const sideCount = label => { const b = qa('#sideNav .side-item').find(x => x.firstElementChild.textContent === label); return b ? (b.querySelector('.n') || {}).textContent : null; };
  try {
    await wait(200); document.querySelector('[data-load-default]').click(); await wait(300); const loginAs = async (u, p = 'demo') => { document.querySelector('#loginUser').value = u; document.querySelector('#loginPass').value = p; document.querySelector('#loginForm').requestSubmit(); await new Promise(r => setTimeout(r, 60)); }; await loginAs('achan');
    // ---------- board basics ----------
    ok('4 sample cards in 5 columns (incl. Verification)', qa('#board .card').length === 4 && qa('.col').length === 5);
    ok('stats 3,1,0,1,0', statVals() === '3,1,0,1,0');
    ok('sidebar counts', sideCount('All work') === '3' && sideCount('Assigned to me') === '1' && sideCount('Awaiting my acceptance') === '0' && sideCount('Coming to me next') === '0' && sideCount('Blocked') === '1');
    ok('All work highlighted by default', qa('#sideNav .side-item.active').map(b => b.firstElementChild.textContent).join() === 'All work');
    ok('card buttons from config', [...card('OMD-001').querySelectorAll('[data-action]')].map(b => b.textContent).join('|') === 'Start|Complete & handoff|Block|Set next|Edit|Delete');
    ok('in-progress shows Pause', !!btn('OMD-002', 'Pause') && !btn('OMD-002', 'Start'));
    ok('blocked shows Unblock', !!btn('OMD-003', 'Unblock') && !btn('OMD-003', 'Block'));
    ok('completed shows Edit/Delete', [...card('OMD-004').querySelectorAll('[data-action]')].map(b => b.textContent).join('|') === 'Edit|Delete');
    btn('OMD-001', 'Start').click(); ok('Start', colCount('progress') === '2');
    btn('OMD-001', 'Pause').click(); ok('Pause', colCount('assigned') === '1');
    btn('OMD-001', 'Block').click(); ok('Block asks reason', dlgOpen() && !!q('[data-reason]')); setv(q('[data-reason]'), 'Waiting'); okDlg();
    ok('Blocked with reason', colCount('blocked') === '2' && card('OMD-001').textContent.includes('Waiting'));
    btn('OMD-001', 'Unblock').click(); ok('Unblock returns to Assigned', colCount('assigned') === '1');
    // Handoff with handover note and acceptance
    btn('OMD-001', 'Complete & handoff').click();
    ok('Handoff asks for a handover note', dlgOpen() && qa('[data-note]').length === 3);
    okDlg(); ok('Summary is required', dlgOpen() && q('#m_err').textContent.includes('Summary'));

    ok('Handoff button hidden while offer pending', !btn('OMD-001', 'Complete & handoff') && !!btn('OMD-001', 'Withdraw handoff'));
    setv(q('#fViewer'), 'p2', 'change'); await wait(300);
    ok('B. Lee: handoff request + popup', q('#inboxUnread').textContent === '1 unread' && !!q('.toast.pop') && q('.alert-meta').textContent.includes('HANDOFF REQUEST'));
    ok('Awaiting my acceptance view counts it', sideCount('Awaiting my acceptance') === '1');
    ok('Receiver sees Accept/Decline on card', !!btn('OMD-001', 'Accept') && !!btn('OMD-001', 'Decline'));
    q('[data-inbox-action]').click();
    ok('Accept dialog shows handover note', dlgOpen() && q('#dlgBody').textContent.includes('Scope agreed'));
    setv(q('[data-reason]'), 'Understood: scope agreed, watch recs'); okDlg(); await tick();
    ok('Accept moves owner', fieldVal('OMD-001', 'Current owner') === 'B. Lee' && !card('OMD-001').querySelector('.offer-banner'));
    ok('Auto-route next team + lead', fieldVal('OMD-001', 'Next team') === 'Controls' && fieldVal('OMD-001', 'Next owner') === 'C. Wong');
    setv(q('#fViewer'), 'p1', 'change'); await wait(300);
    ok('Sender told it was accepted, with read-back', qa('.alert-msg').some(m => m.textContent.includes('accepted') && m.textContent.includes('Understood')));
    q('#btnMarkRead').click(); ok('Mark alerts read', q('#inboxUnread').textContent === '0 unread');
    setv(q('#fViewer'), 'p3', 'change'); await wait(300);
    ok('C. Wong told they are next in line', qa('.alert-msg').some(m => m.textContent.includes('next in line')));
    q('#btnMarkRead').click();
    setv(q('#fViewer'), 'p1', 'change');
    // Decline and withdraw (OMD-002: C. Wong -> D. Patel)
    btn('OMD-002', 'Complete & handoff').click(); setv(q('[data-note="0"]'), 'Exceptions listed'); okDlg(); await tick();
    ok('Person who sent it can withdraw', !!btn('OMD-002', 'Withdraw handoff'));

    ok('Decline keeps owner and clears offer', fieldVal('OMD-002', 'Current owner') === 'C. Wong' && !card('OMD-002').querySelector('.offer-banner'));

    setv(q('#fViewer'), 'p1', 'change');
    btn('OMD-002', 'Complete & handoff').click(); setv(q('[data-note="0"]'), 'Second try'); okDlg(); await tick();
    btn('OMD-002', 'Withdraw handoff').click(); await tick();
    ok('Withdraw clears offer', !card('OMD-002').querySelector('.offer-banner') && !!btn('OMD-002', 'Complete & handoff'));
    // Item details: handover records, comments, history
    card('OMD-001').querySelector('[data-open-item]').click();
    ok('Details show accepted handover with note and read-back', dlgOpen() && q('#dlgBody').textContent.includes('Accepted') && q('#dlgBody').textContent.includes('Scope agreed') && q('#dlgBody').textContent.includes('Understood'));
    ok('Details show item history', qa('#dlgBody .hist').length >= 3);
    setv(q('#d_comment'), 'Please check the recon owners'); q('#d_addComment').click(); await tick();
    ok('Comment added', qa('#dlgBody .comment').length === 1);
    okDlg();
    ok('Card shows handover and comment counts', card('OMD-001').textContent.includes('1 comment') && card('OMD-001').textContent.includes('1 handover'));
    setv(q('#fViewer'), 'p2', 'change'); await wait(300);
    ok('Owner alerted about comment', qa('.alert-msg').some(m => m.textContent.includes('commented')));
    q('#btnMarkRead').click();
    setv(q('#fViewer'), 'p1', 'change');
    btn('OMD-002', 'Set next').click(); setv(q('#m_owner'), 'p7', 'change'); ok('Set next auto team', q('#m_team').value === 't5'); okDlg();
    ok('Set next saved', fieldVal('OMD-002', 'Next owner') === 'G. Lim');
    btn('OMD-003', 'Edit').click(); ok('Edit loads form', q('#formMode').textContent === 'Editing OMD-003');
    setv(q('#f_nextOwner'), ''); q('#form').requestSubmit(); await tick();
    btn('OMD-003', 'Complete & handoff').click(); ok('No next owner -> confirm close', dlgOpen() && q('#dlgBody').textContent.includes('No next owner')); okDlg();
    ok('Finishing sends it to Verification, not Completed', colCount('verify') === '1' && colCount('completed') === '1' && !!card('OMD-003').querySelector('.verify-banner'));
    btn('OMD-004', 'Delete').click(); cancelDlg(); ok('Delete cancel', !!card('OMD-004'));
    btn('OMD-004', 'Delete').click(); okDlg(); ok('Delete', !card('OMD-004'));
    q('#btnNew').click(); setv(q('#f_title'), 'Form item'); setv(q('#f_owner'), 'Z. New'); setv(q('#f_team'), 'Risk');
    q('#form').requestSubmit(); await tick();
    ok('Form creates item', qa('#board .card').some(c => c.textContent.includes('Form item')));
    ok('New person in View as', [...q('#fViewer').options].some(o => o.textContent === 'Z. New'));
    ok('New team in filter', [...q('#fTeam').options].some(o => o.textContent === 'Risk'));

    const tgt = q('.col[data-status="completed"]');
    tgt.dispatchEvent(new DragEvent('dragover', { bubbles: true, cancelable: true, dataTransfer: dt }));

    qa('#sideNav .side-item').find(b => b.textContent.includes('Assigned to me')).click(); await tick();
    const mineOpen = JSON.parse(localStorage.getItem('taskhub.v2')).items.filter(i => i.ownerId === 'p1' && i.statusId !== 'completed').length;
    ok('Board view filters and the title names it', qa('#board .card').length === mineOpen && qa('#board .card').every(c => fieldVal(c.querySelector('.card-ref').textContent, 'Current owner') === 'A. Chan') && q('#boardTitle').textContent.includes('Assigned to me') && q('#fFocus').value === 'bv_mine');

    qa('.stat')[1].click(); ok('Stat click selects matching view', q('#fFocus').value === 'bv_mine');

    q('#tabs [data-tab="overview"]').click(); await tick(); ok('Team overview tab', !q('#view-overview').hidden && q('#boardTitle').textContent === 'Team overview');
    q('#tabs [data-tab="board"]').click(); await tick();

    q('#sideConfig').click();
    ok('Config page opens', !q('#view-config').hidden && q('#hero').hidden && qa('.cfg-nav [data-cfg-nav]').length === 15);
    ok('Bar clean initially', q('#cfgBar').classList.contains('clean'));
    setv(B('general.appName'), 'Ops Hub');
    ok('Bar dirty after edit', !q('#cfgBar').classList.contains('clean'));
    setv(B('general.refPrefix'), 'OPS-'); ok('Ref preview live', q('[data-live="refPreview"]').textContent === 'OPS-001');
    setv(B('general.refPrefix'), 'OMD-');
    await saveCfg(); ok('Save applies app name', q('#brandTitle').textContent === 'Ops Hub');
    setv(B('general.boardTitle'), 'Changed'); q('[data-cfg-cmd="discard"]').click(); await tick();
    ok('Discard', B('general.boardTitle').value === 'Operations Handoff Board');
    setv(B('general.boardTitle'), 'Changed again'); q('#tabs [data-tab="board"]').click();
    ok('Unsaved guard dialog', dlgOpen()); cancelDlg(); ok('Stays on config', !q('#view-config').hidden);
    q('[data-cfg-cmd="discard"]').click(); await tick();
    nav('teams'); ok('Route shown', q('.route').textContent.includes('Done'));
    const ti = qa('#view-config [data-bind$=".name"]').find(i => i.value === 'Controls');
    setv(ti, 'Control Office'); await tick(); await saveCfg(); await board();
    ok('Team rename on cards', qa('#board .tag').some(t => t.textContent === 'Control Office'));
    ok('Team rename in filter', [...q('#fTeam').options].some(o => o.textContent === 'Control Office'));
    q('#sideConfig').click(); nav('people');
    const pi = qa('#view-config [data-bind^="people."][data-bind$=".name"]').findIndex(i => i.value === 'B. Lee');
    q(`#view-config [data-op="del"][data-list="people"][data-i="${pi}"]`).click();
    ok('Remove in-use person asks', dlgOpen() && !!q('#m_repl')); setv(q('#m_repl'), 'p1', 'change'); okDlg(); await tick();
    await saveCfg(); await board();
    ok('Items reassigned', fieldVal('OMD-001', 'Current owner') === 'A. Chan');
    ok('Removed person gone from View as', ![...q('#fViewer').options].some(o => o.textContent === 'B. Lee'));
    q('#sideConfig').click(); nav('priorities'); addRow('priorities');
    const prows = qa('#view-config [data-bind^="priorities."][data-bind$=".name"]');
    setv(prows[prows.length - 1], 'Critical'); await tick();
    for (let k = 0; k < 3; k++) { const ups = qa('#view-config [data-op="up"][data-list="priorities"]'); ups[ups.length - 1 - k].click(); }
    ok('Reorder', qa('#view-config [data-bind^="priorities."][data-bind$=".name"]')[0].value === 'Critical');
    await saveCfg(); await board();
    ok('Priority filter has Critical first', q('#fPriority').options[1].textContent === 'Critical');
    q('#btnNew').click(); setv(q('#f_priority'), [...q('#f_priority').options].find(o => o.textContent === 'High').value, 'change');
    ok('Priority pre-fills due date', q('#f_due').value !== '');
    q('#formCancel').click();
    // Statuses + a new button
    q('#sideConfig').click(); nav('statuses'); addRow('statuses');
    const srows = qa('#view-config [data-bind^="statuses."][data-bind$=".name"]');
    setv(srows[srows.length - 1], 'Review'); await tick();
    nav('workflow'); addRow('actions'); await tick();
    const ai = qa('#view-config [data-bind^="actions."][data-bind$=".label"]').length - 1;
    setv(B(`actions.${ai}.label`), 'Send to review'); await tick();
    const reviewId = [...B(`actions.${ai}.steps.0.to`).options].find(o => o.textContent === 'Review').value;
    setv(B(`actions.${ai}.steps.0.to`), reviewId, 'change'); await tick();
    ok('Preview renders card', !!q('.cfg-preview .card'));
    await saveCfg(); await board();
    ok('New column on board', qa('.col').length === 6);
    ok('New button on cards', !!btn('OMD-001', 'Send to review'));
    btn('OMD-001', 'Send to review').click(); await tick();
    ok('Button moves item', !!q(`.col[data-status="${reviewId}"] #` + card('OMD-001').id));
    q('#sideConfig').click(); nav('statuses');
    const ri = qa('#view-config [data-bind^="statuses."][data-bind$=".name"]').findIndex(i => i.value === 'Review');
    q(`#view-config [data-op="del"][data-list="statuses"][data-i="${ri}"]`).click(); setv(q('#m_repl'), 'assigned', 'change'); okDlg(); await tick();
    await saveCfg(); await board();
    ok('Status removed, items remapped', qa('.col').length === 5 && !!q('.col[data-status="assigned"] #' + card('OMD-001').id));
    ok('Button step remapped to replacement', store().config.actions.find(a => a.label === 'Send to review').steps[0].to === 'assigned');
    // Fields
    q('#sideConfig').click(); nav('fields');
    setv(B('fields.labels.owner'), 'Holder'); await tick();
    addRow('fields.custom'); await tick();
    setv(B('fields.custom.0.label'), 'Risk rating'); await tick();
    setv(B('fields.custom.0.type'), 'multiselect', 'change'); await tick();
    setv(B('fields.custom.0.options'), 'Low, High'); await tick();
    B('fields.custom.0.required').click();
    addRow('fields.custom'); await tick();
    setv(B('fields.custom.1.label'), 'Spec link'); await tick();
    setv(B('fields.custom.1.type'), 'url', 'change'); await tick();
    addRow('card.fields'); await tick();
    const cfRow = qa('#view-config [data-bind^="card.fields."]').pop();
    setv(cfRow, [...cfRow.options].find(o => o.textContent === 'Risk rating').value, 'change'); await tick();
    await saveCfg(); await board();
    ok('Built-in label renamed on card', !!fieldVal('OMD-001', 'Holder'));
    ok('Multi-select field in form', !!q('#customFields [data-multi]'));
    q('#btnNew').click(); setv(q('#f_title'), 'Needs risk'); q('#form').requestSubmit(); await tick();
    ok('Required multi-select enforced', q('#formError').textContent.includes('Risk rating'));
    q('#customFields [data-multi] input[value="High"]').click();
    setv(q('#customFields input[type=url]'), 'not a url'); q('#form').requestSubmit(); await tick();
    ok('URL validated', q('#formError').textContent.includes('web address'));
    setv(q('#customFields input[type=url]'), 'https://example.com/spec'); q('#form').requestSubmit(); await tick();
    const rr = qa('#board .card-ref').map(x => x.textContent).find(r => card(r).textContent.includes('Needs risk'));

    nav('views'); addRow('views'); await tick();
    const dvi = qa('#view-config [data-bind^="views."][data-bind$=".label"]').length - 1;

    await saveCfg(); await board();
    ok('Stat hidden', qa('.stat').length === 4);
    ok('View in Focus dropdown but not in sidebar', [...q('#fFocus').options].some(o => o.textContent === 'Due soon') && sideCount('Due soon') === null);

    ok('New sidebar view with count', sideCount('My open work') !== null);

    ok('View filters by rule', qa('#board .card').length > 0 && qa('#board .card').every(c => fieldVal(c.querySelector('.card-ref').textContent, 'Holder') === 'A. Chan'));
    // Filters & rules: "Urgent open" = open AND priority High

    const fi = qa('#view-config [data-bind^="filters."][data-bind$=".name"]').length - 1;

    ok('Live match count shown', !!q('.match-pill'));

    nav('workflow');
    const bi = qa('#view-config [data-bind^="actions."][data-bind$=".label"]').findIndex(i => i.value === 'Unblock');
    q(`#view-config [data-toggle="actions.${bi}.show.statuses"][value="${waitId}"]`).click(); await tick();
    await saveCfg(); await board();
    const dt2 = new DataTransfer(); const mv = qa('#board .card').find(c => c.closest('.col').dataset.status === 'progress' || c.closest('.col').dataset.status === 'assigned');
    const mvRef = mv.querySelector('.card-ref').textContent; const fromCol = mv.closest('.col').dataset.status;
    mv.dispatchEvent(new DragEvent('dragstart', { bubbles: true, dataTransfer: dt2 }));
    q(`.col[data-status="${waitId}"]`).dispatchEvent(new DragEvent('dragover', { bubbles: true, cancelable: true, dataTransfer: dt2 }));
    q(`.col[data-status="${waitId}"]`).dispatchEvent(new DragEvent('drop', { bubbles: true, cancelable: true, dataTransfer: dt2 }));
    ok('Drag into custom hold status', !!q(`.col[data-status="${waitId}"] #` + card(mvRef).id));
    ok('Hold status counts as Blocked', qa('.stat').find(s => s.querySelector('.stat-label').textContent === 'Blocked').querySelector('.stat-value').textContent !== '0');
    btn(mvRef, 'Unblock').click(); await tick();
    ok('Unblock returns to status before hold', !!q(`.col[data-status="${fromCol}"] #` + card(mvRef).id));
    // Form alerts toggle
    q('#sideConfig').click(); nav('notifications'); B('notifications.assigned').click(); await saveCfg(); await board();
    const before = store().alerts.length;
    q('#btnNew').click(); setv(q('#f_title'), 'Quiet item'); setv(q('#f_owner'), 'F. Ho');
    q('#customFields [data-multi] input[value="Low"]').click(); q('#form').requestSubmit(); await tick();
    ok('Form assigned alert switched off', store().alerts.length === before && qa('#board .card').some(c => c.textContent.includes('Quiet item')));
    // Validation
    q('#sideConfig').click(); nav('teams'); setv(B('teams.0.name'), ''); await tick(); await saveCfg();
    ok('Validation blocks save', !!q('.cfg-errors') && q('.cfg-nav .err') !== null);
    q('[data-cfg-cmd="discard"]').click(); await tick();
    nav('filters'); addRow('filters'); await tick();
    const vfi = qa('#view-config [data-bind^="filters."][data-bind$=".name"]').length - 1;
    setv(B(`filters.${vfi}.name`), 'Incomplete'); setv(B(`filters.${vfi}.conds.0.subject`), 'owner', 'change'); await tick();
    setv(B(`filters.${vfi}.conds.0.op`), 'is', 'change'); await tick(); await saveCfg();
    ok('Condition value required', !!q('.cfg-errors') && q('.cfg-errors').textContent.includes('needs a value'));
    q('[data-cfg-cmd="discard"]').click(); await tick();
    // Data
    nav('data'); q('[data-cfg-cmd="export-config"]').click(); q('[data-cfg-cmd="export-all"]').click();
    ok('Exports', downloads.includes('task-hub-config.json') && downloads.includes('task-hub-backup.json'));
    q('[data-cfg-cmd="defaults"]').click(); await tick(); ok('Defaults loaded into draft', !q('#cfgBar').classList.contains('clean'));
    q('[data-cfg-cmd="discard"]').click(); await tick();
    for (const t of ['posts', 'files', 'notes', 'board']) { q(`#tabs [data-tab="${t}"]`).click(); await tick(); ok('tab ' + t, !q('#view-' + t).hidden); }
    q('#sideConfig').click(); nav('general'); B('general.modules.files').click(); await saveCfg();
    ok('Module toggle hides tab', !q('#tabs [data-tab="files"]'));
    const saved = store();
    ok('Persisted config v7 with ids', saved.config.version === 7 && saved.items.every(i => 'ownerId' in i && 'statusId' in i));
    ok('no JS errors', !(window.__errs || []).length);
  } catch (e) { out.push('ERROR ' + e.message + '\n' + e.stack); }
  if (window.__errs) out.push('JSERRS: ' + window.__errs.join(' | '));
  try { localStorage.clear(); } catch (e) {}
  const fails = out.filter(l => !l.startsWith('PASS'));
  const pre = document.createElement('pre');
  pre.textContent = `${out.filter(l => l.startsWith('PASS')).length} passed, ${fails.length} failed\n\n` + (fails.join('\n') || '(no failures)') + '\n\n' + out.join('\n');
  pre.style.cssText = 'position:fixed;inset:0;margin:0;z-index:99999;background:#fff;color:#000;font:12px/1.35 monospace;padding:12px;white-space:pre-wrap;column-count:2';
  document.body.appendChild(pre);
  if (window.__report) window.__report(out);
});
</script>
