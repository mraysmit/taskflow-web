<!-- The list view and CSV export: the board can be shown as a table of the same items (the same filters, views and search
     apply), sorted by any column; the choice is remembered in this browser only; Export CSV downloads exactly the rows shown, in
     the order shown, safely quoted for spreadsheets (commas, quotes, line breaks, and cells that would run as formulas). -->
<script>
window.addEventListener('error', e => { (window.__errs = window.__errs || []).push(e.message + ' @' + e.lineno); });
// Downloads are captured instead of saved.
window.__downloads = [];
const realClick = HTMLAnchorElement.prototype.click;
HTMLAnchorElement.prototype.click = function () { if (this.download) { window.__downloads.push({ name: this.download, href: this.href }); return; } return realClick.call(this); };
// An in-memory shared data file, to see what this browser writes to it.
window.__disk = { name: '', text: '', lm: 0 };
class FakeHandle {
  constructor(name) { this.name = name; this.kind = 'file'; }
  async queryPermission() { return 'granted'; }
  async requestPermission() { return 'granted'; }
  async getFile() { return { lastModified: window.__disk.lm, text: async () => window.__disk.text }; }
  async createWritable() { let buf = ''; return { write: async t => { buf += t; }, close: async () => { window.__disk.text = buf; window.__disk.lm++; } }; }
}
window.showOpenFilePicker = async () => [new FakeHandle(window.__disk.name)];
window.showSaveFilePicker = async o => { Object.assign(window.__disk, { name: o.suggestedName, text: '', lm: 1 }); return new FakeHandle(o.suggestedName); };
window.addEventListener('load', async () => {
  const phase = sessionStorage.getItem('lphase') || '1';
  const out = JSON.parse(sessionStorage.getItem('lout') || '[]');
  const ok = (n, c) => out.push((c ? 'PASS ' : 'FAIL ') + n);
  const q = s => document.querySelector(s), qa = s => [...document.querySelectorAll(s)];
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const setv = (el, v) => { el.value = v; el.dispatchEvent(new Event('input', { bubbles: true })); el.dispatchEvent(new Event('change', { bubbles: true })); };
  const login = async u => { q('#loginUser').value = u; q('#loginPass').value = 'demo'; q('#loginForm').requestSubmit(); await wait(300); qa('.toast').forEach(t => t.remove()); };
  const rows = () => qa('#list tbody tr');
  // Columns use the workspace's own field names (e.g. “Current owner”), so they are found by part of the name.
  const col = name => { const i = qa('#list thead th').findIndex(th => th.textContent.toLowerCase().includes(name.toLowerCase())); return rows().map(r => r.children[i].textContent.trim()); };
  const sortBy = async key => { q(`#list [data-sort="${key}"]`).click(); await wait(30); };
  const search = async v => { const s = q('#search'); s.value = v; s.dispatchEvent(new Event('input', { bubbles: true })); await wait(30); };
  // Read as bytes: Response.text() would quietly drop a byte-order mark.
  const csvOf = async () => {
    const d = window.__downloads.pop(); if (!d) return null;
    const bytes = new Uint8Array(await (await fetch(d.href)).arrayBuffer());
    return { name: d.name, bytes, text: new TextDecoder('utf-8', { ignoreBOM: true }).decode(bytes) };
  };
  // A small CSV reader (RFC 4180: quoted fields, doubled quotes, line breaks inside quotes).
  const parseCsv = t => { const rs = []; let row = [], f = '', qd = false; for (let i = 0; i < t.length; i++) { const c = t[i];
    if (qd) { if (c === '"' && t[i + 1] === '"') { f += '"'; i++; } else if (c === '"') qd = false; else f += c; }
    else if (c === '"') qd = true; else if (c === ',') { row.push(f); f = ''; } else if (c === '\n' || c === '\r') { if (c === '\r' && t[i + 1] === '\n') i++; row.push(f); rs.push(row); row = []; f = ''; } else f += c; }
    if (f || row.length) { row.push(f); rs.push(row); } return rs; };
  const finish = () => {
    if (window.__errs) out.push('JSERRS: ' + window.__errs.join(' | '));
    sessionStorage.clear(); try { localStorage.clear(); } catch (e) {}
    const fails = out.filter(l => !l.startsWith('PASS'));
    const pre = document.createElement('pre');
    pre.textContent = `${out.length - fails.length} passed, ${fails.length} failed\n\n` + (fails.join('\n') || '(no failures)') + '\n\n' + out.join('\n');
    pre.style.cssText = 'position:fixed;inset:0;margin:0;z-index:2147483647;background:#fff;color:#000;font:13px/1.4 monospace;padding:12px;white-space:pre-wrap';
    document.body.appendChild(pre);
    if (window.__report) window.__report(out);
  };
  try {
    await wait(200);
    if (phase === '1') {
      q('[data-load-default]').click(); await wait(300);
      await login('achan');
      // A title is one line; the description can hold line breaks.
      q('#btnNew').click(); setv(q('#f_title'), 'Comma, "quoted" title'); setv(q('#f_desc'), 'First line\nsecond line, with a comma'); q('#form').requestSubmit(); await wait(50);
      q('#btnNew').click(); setv(q('#f_title'), '=HYPERLINK("http://evil.test","click")'); q('#form').requestSubmit(); await wait(50);
      const onBoard = qa('#board .card .card-ref').map(r => r.textContent).sort();

      // ---------- The list ----------
      ok('Board and List are offered', !!q('[data-mode="board"]') && !!q('[data-mode="list"]'));
      q('[data-mode="list"]').click(); await wait(30);
      ok('List shows a table instead of columns', !q('#list').hidden && q('#board').hidden && !!q('#list table'));
      ok('…with the same items as the board', col('Ref').sort().join() === onBoard.join());
      ok('…and the usual columns', ['Ref', 'Title', 'Status', 'Priority', 'Owner', 'Next owner', 'Team', 'Due', 'Updated'].every(h => qa('#list thead th').some(th => th.textContent.toLowerCase().includes(h.toLowerCase()))));
      await sortBy('title');
      const t1 = col('Title');
      ok('Sorting by a column orders the rows', t1.join('|') === [...t1].sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' })).join('|'));
      ok('…and says so on the column', q('#list [data-sort="title"]').closest('th').getAttribute('aria-sort') === 'ascending');
      await sortBy('title');
      ok('Sorting again reverses it', col('Title').join('|') === [...t1].reverse().join('|') && q('#list [data-sort="title"]').closest('th').getAttribute('aria-sort') === 'descending');
      await sortBy('due');
      const due = col('Due');
      const dated = due.filter(d => d !== '—');
      ok('Sorting by due date puts undated items last', dated.join() === [...dated].sort().join() && due.slice(dated.length).every(d => d === '—'));
      await search('maker');
      ok('Search and filters apply to the list', rows().length === 1 && col('Ref')[0] === 'OMD-002');
      await search('');
      rows().find(r => r.textContent.includes('OMD-001')).querySelector('[data-open-item]').click(); await wait(30);
      ok('A title opens the item’s details', q('#dlg').open && q('#dlgTitle').textContent.includes('OMD-001'));
      q('#dlg').close();

      // ---------- CSV ----------
      await sortBy('ref');
      q('#btnCsv').click(); await wait(50);
      const csv = await csvOf();
      ok('Export CSV downloads a .csv file', !!csv && /\.csv$/.test(csv.name));
      const table = csv ? parseCsv(csv.text.replace(/^﻿/, '')) : [];
      const head = table[0] || [];
      const at = name => head.findIndex(x => x.toLowerCase().includes(name.toLowerCase()));
      ok('It starts with a byte-order mark, so Excel reads accented names correctly', !!csv && csv.bytes[0] === 0xEF && csv.bytes[1] === 0xBB && csv.bytes[2] === 0xBF);
      ok('Its header names the columns, including the description', ['Ref', 'Title', 'Status', 'Priority', 'Owner', 'Due', 'Description'].every(h => at(h) >= 0));
      ok('One row per item listed, in the order shown', table.slice(1).map(r => r[at('Ref')]).join() === col('Ref').join());
      const tIdx = at('Title');
      ok('Commas, quotes and line breaks survive', table.some(r => r[tIdx] === 'Comma, "quoted" title' && r[at('Description')] === 'First line\nsecond line, with a comma'));
      ok('A cell that would run as a spreadsheet formula is made plain text', table.some(r => r[tIdx] === '\'=HYPERLINK("http://evil.test","click")') && !table.some(r => r[tIdx].startsWith('=')));
      await search('maker');
      q('#btnCsv').click(); await wait(50);
      ok('Export follows the filters too', parseCsv((await csvOf()).text.replace(/^﻿/, '')).length === 2);
      await search('');

      // ---------- The choice belongs to this browser, not to everyone sharing the data file ----------
      q('#sideConfig').click(); await wait(20); q('[data-cfg-nav="data"]').click(); await wait(20);
      q('[data-file-cmd="new"]').click(); await wait(300);
      q('#tabs [data-tab="board"]').click(); await wait(30);
      q('#btnNew').click(); setv(q('#f_title'), 'Saved to the shared file'); q('#form').requestSubmit(); await wait(800);
      const shared = JSON.parse(window.__disk.text);
      ok('The list setting is kept out of the shared data file', shared.items.some(i => i.title === 'Saved to the shared file') && !('listView' in shared));
      ok('…and kept in this browser', !!JSON.parse(localStorage.getItem('taskhub.v2')).listView);
      q('#sideConfig').click(); await wait(20); q('[data-cfg-nav="data"]').click(); await wait(20);
      q('[data-file-cmd="disconnect"]').click(); await wait(100);
      q('#tabs [data-tab="board"]').click(); await wait(30);
      sessionStorage.setItem('lout', JSON.stringify(out)); sessionStorage.setItem('lphase', '2');
      location.reload(); return;
    }

    // ---- Phase 2 ----
    ok('The list (and its sort) is remembered in this browser', !q('#list').hidden && q('#list [data-sort="ref"]').closest('th').getAttribute('aria-sort') === 'ascending');
    q('[data-mode="board"]').click(); await wait(30);
    ok('Board brings the columns back', !q('#board').hidden && q('#list').hidden && qa('#board .card').length > 0);
    q('#btnCsv').click(); await wait(50);
    const csv = await csvOf();
    ok('Export CSV works from the board too', !!csv && parseCsv(csv.text.replace(/^﻿/, '')).length - 1 === qa('#board .card').length);
    ok('no JS errors', !(window.__errs || []).length);
  } catch (e) { out.push('ERROR (phase ' + phase + ') ' + e.message + '\n' + e.stack); }
  finish();
});
</script>
