<!-- Button steps that change who owns an item. Phase 1 adds the buttons a workspace might set up (as an imported or shared
     file could) and reloads; phase 2 uses them. -->
<script>
window.addEventListener('error', e => { (window.__errs = window.__errs || []).push(e.message + ' @' + e.lineno); });
window.addEventListener('load', async () => {
  const phase = sessionStorage.getItem('hophase') || '1';
  const out = JSON.parse(sessionStorage.getItem('hoout') || '[]');
  const ok = (n, c) => out.push((c ? 'PASS ' : 'FAIL ') + n);
  const q = s => document.querySelector(s), qa = s => [...document.querySelectorAll(s)];
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const setv = (el, v) => { el.value = v; el.dispatchEvent(new Event('input', { bubbles: true })); el.dispatchEvent(new Event('change', { bubbles: true })); };
  const login = async u => { q('#loginUser').value = u; q('#loginPass').value = 'demo'; q('#loginForm').requestSubmit(); await wait(300); qa('.toast').forEach(t => t.remove()); };
  const logout = async () => { q('[data-logout]').click(); await wait(30); };
  const card = title => qa('#board .card').find(c => c.textContent.includes(title));
  const btn = (title, label) => card(title) && [...card(title).querySelectorAll('[data-action]')].find(b => b.textContent === label);
  const store = () => JSON.parse(localStorage.getItem('taskhub.v2'));
  const itemNamed = title => store().items.find(i => i.title === title);
  const finish = () => {
    if (window.__errs) out.push('JSERRS: ' + window.__errs.join(' | '));
    sessionStorage.clear(); try { localStorage.clear(); } catch (e) {}
    const fails = out.filter(l => !l.startsWith('PASS'));
    const pre = document.createElement('pre');
    pre.textContent = `${out.length - fails.length} passed, ${fails.length} failed\n\n` + (fails.join('\n') || '(no failures)') + '\n\n' + out.join('\n');
    pre.style.cssText = 'position:fixed;inset:0;margin:0;z-index:2147483647;background:#fff;color:#000;font:13px/1.4 monospace;padding:12px;white-space:pre-wrap';
    document.body.appendChild(pre);
    if (window.__report) window.__report(out);
  };
  const button = (id, label, steps, filterId = '') => ({ id, label, color: '#2e3394', outline: false, width: 'md', show: { statuses: ['*'], filterId }, steps });
  try {
    await wait(200);
    if (phase === '1') {
      q('[data-load-default]').click(); await wait(300);
      await login('achan');
      const s = store();
      s.config.actions.push(
        button('a_mine', 'Assign to me', [{ type: 'setOwner', to: 'viewer' }]),
        button('a_toFHo', 'Hand to F. Ho', [{ type: 'setNext', to: 'p6' }, { type: 'transfer' }]),
        button('a_offerFHo', 'Offer to F. Ho', [{ type: 'setNext', to: 'p6' }, { type: 'offer' }]),
        button('a_scriptOwner', 'Script: give to G. Lim', [{ type: 'x:xs_owner', params: {} }]),
      );
      s.config.extensions.scriptsEnabled = true;
      s.config.extensions.steps.push({ id: 'xs_owner', name: 'Give to G. Lim', mode: 'script', params: [], script: 'ctx.set("owner", "G. Lim");', steps: [] });
      localStorage.setItem('taskhub.v2', JSON.stringify(s));
      sessionStorage.setItem('hoout', JSON.stringify(out)); sessionStorage.setItem('hophase', '2');
      location.reload(); return;
    }

    // ---------- Taking an item out of a role queue with an ordinary button ----------
    await login('achan');
    q('#btnNew').click(); setv(q('#f_title'), 'Steward question'); setv(q('#f_owner'), 'Queue: Data stewards'); q('#form').requestSubmit(); await wait(50);
    ok('The item starts in the Data stewards queue', itemNamed('Steward question').queueId === 'r_steward');
    btn('Steward question', 'Assign to me').click(); await wait(50);
    ok('Assigning a queued item to someone takes it out of the queue', itemNamed('Steward question').ownerId === 'p1' && !itemNamed('Steward question').queueId);
    ok('…and clears the queue’s alerts about it', store().alerts.filter(a => a.kind === 'queue' && a.itemId === itemNamed('Steward question').id).every(a => a.read));
    q('#btnNew').click(); setv(q('#f_title'), 'Steward follow-up'); setv(q('#f_owner'), 'Queue: Data stewards'); q('#form').requestSubmit(); await wait(50);
    btn('Steward follow-up', 'Hand to F. Ho').click(); await wait(50);
    ok('Handing a queued item straight to someone takes it out of the queue', itemNamed('Steward follow-up').ownerId === 'p6' && !itemNamed('Steward follow-up').queueId);
    q('#btnNew').click(); setv(q('#f_title'), 'Steward offer'); setv(q('#f_owner'), 'Queue: Data stewards'); q('#form').requestSubmit(); await wait(50);
    btn('Steward offer', 'Offer to F. Ho').click(); await wait(50);
    q('#btnNew').click(); setv(q('#f_title'), 'Steward script'); setv(q('#f_owner'), 'Queue: Data stewards'); q('#form').requestSubmit(); await wait(50);
    btn('Steward script', 'Script: give to G. Lim').click(); await wait(50);
    ok('A script that sets the owner of a queued item takes it out of the queue', itemNamed('Steward script').ownerId === 'p7' && !itemNamed('Steward script').queueId);
    ok('A queued item can be offered to someone', !!itemNamed('Steward offer').offer && itemNamed('Steward offer').offer.toId === 'p6');
    await logout();
    await login('fho');
    btn('Steward offer', 'Accept').click(); await wait(30);
    if (q('#dlg').open) { q('#dlgOk').click(); await wait(50); }
    ok('Accepting an offered queued item takes it out of the queue', itemNamed('Steward offer').ownerId === 'p6' && !itemNamed('Steward offer').queueId);
    await logout();
    await login('blee');
    ok('…so the queue no longer offers either for pick up', !qa('#board .card').some(c => /Steward (question|follow-up|offer|script)/.test(c.textContent) && [...c.querySelectorAll('[data-action]')].some(b => b.textContent === 'Pick up')));
    ok('no JS errors', !(window.__errs || []).length);
  } catch (e) { out.push('ERROR (phase ' + phase + ') ' + e.message + '\n' + e.stack); }
  finish();
});
</script>
