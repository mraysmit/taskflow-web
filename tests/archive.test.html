<!-- Archiving finished work: a finished item can be archived from its details (open work can't); archived items leave the
     board, its counts and search, and live on the Archive page (searchable, with Open and Restore); people only see archived
     items they could see on the board; finished work is archived automatically after a set number of days (0 = never).
     Phases reload the page with finished dates set in the past. -->
<script>
window.addEventListener('error', e => { (window.__errs = window.__errs || []).push(e.message + ' @' + e.lineno); });
window.addEventListener('load', async () => {
  const phase = sessionStorage.getItem('aphase') || '1';
  const out = JSON.parse(sessionStorage.getItem('aout') || '[]');
  const ok = (n, c) => out.push((c ? 'PASS ' : 'FAIL ') + n);
  const q = s => document.querySelector(s), qa = s => [...document.querySelectorAll(s)];
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const setv = (el, v) => { el.value = v; el.dispatchEvent(new Event('input', { bubbles: true })); el.dispatchEvent(new Event('change', { bubbles: true })); };
  const login = async u => { q('#loginUser').value = u; q('#loginPass').value = 'demo'; q('#loginForm').requestSubmit(); await wait(300); qa('.toast').forEach(t => t.remove()); };
  const logout = async () => { q('[data-logout]').click(); await wait(30); };
  const tab = async t => { q(`#tabs [data-tab="${t}"]`).click(); await wait(30); };
  const card = ref => qa('#board .card').find(c => c.querySelector('.card-ref') && c.querySelector('.card-ref').textContent === ref);
  const store = () => JSON.parse(localStorage.getItem('taskhub.v2'));
  const item = ref => store().items.find(i => i.ref === ref);
  const rows = () => qa('#archiveList tbody tr');
  const rowOf = ref => rows().find(r => r.textContent.includes(ref));
  const search = async v => { const s = q('#search'); s.value = v; s.dispatchEvent(new Event('input', { bubbles: true })); await wait(30); };
  const DAY = 864e5;
  const reloadAs = (p, edit) => {
    const s = store(); edit(s); localStorage.setItem('taskhub.v2', JSON.stringify(s));
    sessionStorage.setItem('aout', JSON.stringify(out)); sessionStorage.setItem('aphase', p); location.reload();
  };
  const finish = () => {
    if (window.__errs) out.push('JSERRS: ' + window.__errs.join(' | '));
    sessionStorage.clear(); try { localStorage.clear(); } catch (e) {}
    const fails = out.filter(l => !l.startsWith('PASS'));
    const pre = document.createElement('pre');
    pre.textContent = `${out.length - fails.length} passed, ${fails.length} failed\n\n` + (fails.join('\n') || '(no failures)') + '\n\n' + out.join('\n');
    pre.style.cssText = 'position:fixed;inset:0;margin:0;z-index:2147483647;background:#fff;color:#000;font:13px/1.4 monospace;padding:12px;white-space:pre-wrap';
    document.body.appendChild(pre);
    if (window.__report) window.__report(out);
  };
  try {
    await wait(200);
    if (phase === '1') {
      q('[data-load-default]').click(); await wait(300);
      await login('achan');
      ok('Finished work (OMD-004) is on the board at first, and not archived automatically yet', !!card('OMD-004') && !item('OMD-004').archivedAt);

      // ---------- Archiving by hand ----------
      card('OMD-002').querySelector('[data-open-item]').click(); await wait(30);
      ok('Open work can’t be archived', q('#dlg').open && !q('#dlgBody [data-archive-item]'));
      q('#dlg').close();
      card('OMD-004').querySelector('[data-open-item]').click(); await wait(30);
      ok('Finished work has Archive in its details', !!q('#dlgBody [data-archive-item]'));
      q('#dlgBody [data-archive-item]').click(); await wait(50);
      ok('Archiving takes it off the board and closes the details', !card('OMD-004') && !q('#dlg').open && item('OMD-004').archivedAt > 0);
      ok('…and it is recorded', item('OMD-004').history[0].text.includes('archived') && store().activity[0].msg.includes('OMD-004 archived'));
      await search(item('OMD-004').title.slice(0, 12));
      ok('Board search no longer finds it', !card('OMD-004') && !qa('#board .card').length);
      await search('');

      // ---------- The Archive page ----------
      await tab('archive');
      ok('The Archive page lists it', !q('#view-archive').hidden && !!rowOf('OMD-004') && q('#archiveCount').textContent === '1 archived item');
      setv(q('#archiveSearch'), 'zzz-nothing'); await wait(30);
      ok('The archive can be searched', !rows().length);
      setv(q('#archiveSearch'), item('OMD-004').title.slice(0, 12)); await wait(30);
      ok('…and finds it', !!rowOf('OMD-004'));
      rowOf('OMD-004').querySelector('[data-open-item]').click(); await wait(30);
      ok('Its details open from the archive, with Restore', q('#dlg').open && !!q('#dlgBody [data-unarchive-item]'));
      q('#dlg').close();
      await logout();
      await login('eng');
      await tab('archive');
      ok('Someone who couldn’t see it on the board doesn’t see it in the archive', !rowOf('OMD-004') && q('#archiveCount').textContent === '0 archived items');
      await logout();
      await login('achan');
      await tab('archive');
      rowOf('OMD-004').querySelector('[data-unarchive]').click(); await wait(50);
      ok('Restore puts it back', !rowOf('OMD-004') && !item('OMD-004').archivedAt);
      await tab('board');
      ok('…in its column on the board', !!card('OMD-004') && card('OMD-004').closest('.col').dataset.status === 'completed');

      // ---------- Automatically: finished more than 30 days ago ----------
      reloadAs('2', s => {
        s.items.find(i => i.ref === 'OMD-004').closedAt = Date.now() - 40 * DAY;
        s.items.find(i => i.ref === 'OMD-003').updated = Date.now() - 90 * DAY; // old but not finished
      });
      return;
    }

    if (phase === '2') {
      ok('Finished more than 30 days ago: archived automatically when the workspace opens', item('OMD-004').archivedAt > 0 && !card('OMD-004'));
      ok('…and the history says so', item('OMD-004').history[0].text.includes('automatically'));
      ok('Old but unfinished work is never archived', !item('OMD-003').archivedAt);
      // ---------- Never, when set to 0 ----------
      q('#sideConfig').click(); await wait(30); q('[data-cfg-nav="general"]').click(); await wait(30);
      ok('Configuration sets when finished work is archived', !!q('[data-bind="general.archiveAfterDays"]') && q('[data-bind="general.archiveAfterDays"]').value === '30');
      setv(q('[data-bind="general.archiveAfterDays"]'), '0'); await wait(20);
      q('[data-cfg-cmd="save"]').click(); await wait(80);
      ok('Saved as 0: never', store().config.general.archiveAfterDays === 0);
      await tab('archive');
      q('#archiveList [data-unarchive]').click(); await wait(50);
      reloadAs('3', s => { s.items.find(i => i.ref === 'OMD-004').closedAt = Date.now() - 400 * DAY; });
      return;
    }

    // ---- Phase 3 (the page reopens where it was left: the Archive) ----
    await tab('board');
    ok('With 0, even long-finished work stays on the board', !item('OMD-004').archivedAt && !!card('OMD-004'));
    ok('no JS errors', !(window.__errs || []).length);
  } catch (e) { out.push('ERROR (phase ' + phase + ') ' + e.message + '\n' + e.stack); }
  finish();
});
</script>
