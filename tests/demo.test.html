<!-- budget: 500000 -->
<!-- Runs every scenario of the built-in automated demo at Instant speed, then checks your own data came back. -->
<script>
window.addEventListener('error', e => { (window.__errs = window.__errs || []).push(e.message + ' @' + e.lineno); });
window.addEventListener('load', async () => {
  const out = []; const ok = (n, c) => out.push((c ? 'PASS ' : 'FAIL ') + n);
  const q = s => document.querySelector(s);
  const wait = ms => new Promise(r => setTimeout(r, ms));
  try {
    await wait(200); document.querySelector('[data-load-default]').click(); await wait(300);
    // Real user data to protect: sign in and create an item.
    q('#loginUser').value = 'achan'; q('#loginPass').value = 'demo'; q('#loginForm').requestSubmit(); await wait(50);
    q('#btnNew').click(); q('#f_title').value = 'MY REAL ITEM'; q('#form').requestSubmit(); await wait(50);
    q('.col-grip[data-grip="side"]').dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight', bubbles: true }));
    const notesBefore = localStorage.getItem('taskhub.notifications'), layoutBefore = localStorage.getItem('taskhub.layout');
    q('[data-open-demo]').click(); await wait(50);
    q('#demoSpeed').value = '0.03'; q('#demoSpeed').dispatchEvent(new Event('change'));
    q('[data-demo="run"]').click();
    const t0 = Date.now();
    await wait(500);
    while (q('[data-demo="run"]').disabled && Date.now() - t0 < 400000) await wait(200);
    ok('Demo finished', !q('[data-demo="run"]').disabled);
    // Each demo check becomes a result line, prefixed with its scenario.
    let scenario = '';
    q('#demoResults').innerText.split('\n').map(l => l.trim()).filter(Boolean).forEach(l => {
      if (l.startsWith('✓')) out.push(`PASS ${scenario} › ${l.slice(1).trim()}`);
      else if (l.startsWith('✗')) out.push(`FAIL ${scenario} › ${l.slice(1).trim()}`);
      else if (!/checks passed/.test(l)) scenario = l.replace(/\s*— stopped$/, '');
    });
    const st = JSON.parse(localStorage.getItem('taskhub.v2'));
    ok('Your own data restored afterwards', st.items.some(i => i.title === 'MY REAL ITEM') && st.session && st.session.userId === 'p1' && !st.config.statuses.some(s => s.name === 'Review'));
    ok('Demo backup cleared', !localStorage.getItem('taskhub.demo-backup'));
    ok('Your notification history is untouched by the demo', !!notesBefore && localStorage.getItem('taskhub.notifications') === notesBefore);
    ok('Your column widths are put back', localStorage.getItem('taskhub.layout') === layoutBefore);
    ok('no JS errors', !(window.__errs || []).length);
  } catch (e) { out.push('ERROR ' + e.message + ' ' + e.stack); }
  if (window.__errs) out.push('JSERRS: ' + window.__errs.join(' | '));
  try { localStorage.clear(); } catch (e) {}
  const fails = out.filter(l => !l.startsWith('PASS'));
  const pre = document.createElement('pre');
  pre.textContent = `${out.length - fails.length} passed, ${fails.length} failed\n\n` + (fails.join('\n') || '(no failures)') + '\n\n' + out.join('\n');
  pre.style.cssText = 'position:fixed;inset:0;margin:0;z-index:2147483647;background:#fff;color:#000;font:12px/1.35 monospace;padding:12px;white-space:pre-wrap';
  document.body.appendChild(pre);
  if (window.__report) window.__report(out);
});
</script>
