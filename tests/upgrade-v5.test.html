<!-- inject: early -->
<!-- Upgrading a version 5 workspace: the Verification column, buttons, filters and routes are added. -->
<script>
// Seeds a workspace saved by the previous version (config v5, no verification) before the app loads.
try {
  localStorage.clear();
  const now = Date.now();
  const roles = [
    { id: 'r_member', name: 'Team member', sees: 'own', viewAs: 'none' }, { id: 'r_sysadmin', name: 'System administrator', sees: 'all', viewAs: 'all', actAs: true, configure: true },
    { id: 'r_reviewer', name: 'Controls reviewers', sees: 'own', viewAs: 'none', queue: true },
  ];
  localStorage.setItem('designhub.v2', JSON.stringify({
    version: 3, viewerId: 'p1', page: 'board', session: { userId: 'p1', time: now },
    config: {
      version: 5,
      general: { appName: 'Old Hub', initialStatusId: 'assigned' },
      teams: [{ id: 't1', name: 'Ops' }],
      people: [
        { id: 'p1', name: 'A. Chan', teamId: 't1', username: 'achan', password: 'demo', roleIds: ['r_member', 'r_sysadmin'] },
        { id: 'p3', name: 'C. Wong', teamId: 't1', username: 'cwong', password: 'demo', roleIds: ['r_member', 'r_reviewer'] },
      ],
      roles,
      priorities: [{ id: 'pr1', name: 'High' }, { id: 'pr2', name: 'Medium' }],
      statuses: [
        { id: 'assigned', name: 'Assigned', closed: false }, { id: 'progress', name: 'Doing', closed: false },
        { id: 'done', name: 'Done', closed: true },
      ],
      filters: [
        { id: 'f_open', name: 'Open', match: 'all', conds: [{ subject: 'state', op: 'open', value: '' }] },
        { id: 'f_noOffer', name: 'No pending handoff or queue', match: 'all', conds: [{ subject: 'offer', op: 'none', value: '' }, { subject: 'queue', op: 'none', value: '' }] },
      ],
      actions: [{ id: 'a_done', label: 'Finish', show: { statuses: ['*'], filterId: 'f_noOffer' }, steps: [{ type: 'setStatus', to: 'done' }] }],
      views: [{ id: 'bv_all', label: 'All work', filterId: '', count: 'f_open' }],
    },
    items: [{ id: 'i1', ref: 'OMD-001', title: 'Old item', priorityId: 'pr2', statusId: 'progress', teamId: 't1', ownerId: 'p1', created: now, updated: now }],
  }));
} catch (e) { window.__seedErr = e.message; }

window.addEventListener('load', async () => {
  const out = []; const ok = (n, c) => out.push((c ? 'PASS ' : 'FAIL ') + n);
  const q = s => document.querySelector(s), qa = s => [...document.querySelectorAll(s)];
  const wait = ms => new Promise(r => setTimeout(r, ms));
  try {
    await wait(300);
    const s = JSON.parse(localStorage.getItem('designhub.v2'));
    const c = s.config;
    ok('saved as config v6', c.version === 6);
    ok('Verification column added before the closing one', c.statuses.map(x => x.id).join() === 'assigned,progress,verify,done');
    ok('Routes kept only for groups that exist', c.approvals.chains.map(x => x.name).join('|') === 'Controls check' && c.approvals.holdStatusId === 'verify');
    ok('Approve / Reject / Withdraw buttons added first', c.actions.slice(0, 3).map(a => a.id).join() === 'a_approve,a_reject,a_recall' && c.actions[3].id === 'a_done');
    ok('Verification filters added', ['f_verifyMine', 'f_verifyPending', 'f_verifyByMe', 'f_high'].every(id => c.filters.some(f => f.id === id)));
    ok('Default “no pending” filter gains the verification condition', c.filters.find(f => f.id === 'f_noOffer').conds.some(x => x.subject === 'approval'));
    ok('Items kept', s.items.length === 1 && s.items[0].title === 'Old item');
    const b = qa('#board .card [data-action]').find(x => x.textContent === 'Finish');
    b.click(); await wait(50);
    const s2 = JSON.parse(localStorage.getItem('designhub.v2'));
    ok('Their own “Finish” button now goes through verification', s2.items[0].statusId === 'verify' && s2.items[0].approvals[0].stages[0].roleId === 'r_reviewer');
    ok('Reviewer alerted', s2.alerts.some(a => a.toId === 'p3' && a.kind === 'approval'));
    ok('no JS errors', !(window.__errs || []).length && !window.__seedErr);
  } catch (e) { out.push('ERROR ' + e.message + '\n' + e.stack); }
  if (window.__errs) out.push('JSERRS: ' + window.__errs.join(' | '));
  try { localStorage.clear(); } catch (e) {}
  const fails = out.filter(l => !l.startsWith('PASS'));
  const pre = document.createElement('pre');
  pre.textContent = `${out.filter(l => l.startsWith('PASS')).length} passed, ${fails.length} failed\n\n` + (fails.join('\n') || '(no failures)') + '\n\n' + out.join('\n');
  pre.style.cssText = 'position:fixed;inset:0;margin:0;z-index:2147483647;background:#fff;color:#000;font:13px/1.4 monospace;padding:12px;white-space:pre-wrap';
  document.body.appendChild(pre);
  if (window.__report) window.__report(out);
});
window.addEventListener('error', e => { (window.__errs = window.__errs || []).push(e.message + ' @' + e.lineno); });
</script>
