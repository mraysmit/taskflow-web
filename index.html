<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task Hub · Operations Handoff Board</title>
<style>
  :root {
    --bg: #e8eaee;
    --side: #16181d;
    --surface: #f4f5f7;
    --surface-2: #f7f8fa;
    --card: #ffffff;
    --field: #f1f2f4;
    --ink: #15171a;
    --ink-2: #2a2e35;
    --muted: #5d636c;
    --red: #b5141e;
    --red-border: #a2111a;
    --tab-active: #d9d9f4;
    --tab-active-line: #b9bbe6;
    --tab-active-ink: #272a6c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  .app {
    position: relative;
    display: grid;
    grid-template-columns: var(--side-w, 236px) minmax(0, 1fr) var(--panel-w, 368px);
    height: 100vh;
  }
  /* Drag handles on the inner edges of both side columns. */
  .col-grip { position: absolute; top: 0; bottom: 0; z-index: 20; width: 10px; cursor: col-resize; touch-action: none; }
  .col-grip[data-grip="side"] { left: calc(var(--side-w, 236px) - 5px); }
  .col-grip[data-grip="panel"] { right: calc(var(--panel-w, 368px) - 5px); }
  .col-grip::after { content: ''; position: absolute; top: 0; bottom: 0; left: 4px; width: 2px; background: transparent; transition: background .12s; }
  .col-grip:hover::after, .col-grip:focus-visible::after, .col-grip.dragging::after { background: #5257c9; }
  .col-grip:focus-visible { outline: none; }
  body.col-resizing { cursor: col-resize; user-select: none; }
  body.col-resizing iframe, body.col-resizing .main { pointer-events: none; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    background: var(--side);
    color: #e6e8eb;
    padding: 26px 16px 18px;
    display: flex;
    flex-direction: column;
    overflow: auto;
  }
  .brand-title { font-size: 30px; line-height: 1.15; font-weight: 800; letter-spacing: -.01em; color: #f2f3f5; overflow-wrap: anywhere; }
  .app-ver { display: inline-block; margin-left: 4px; padding: 1px 6px; border-radius: 999px; background: rgba(255,255,255,.1); color: #9aa0a8; font-size: 10px; font-weight: 700; letter-spacing: .02em; vertical-align: 6px; white-space: nowrap; }
  .login-brand .app-ver { background: #e3e6f4; color: #4a5180; margin-bottom: 8px !important; }
  /* The version sits on its own line under the title. */
  .brand-title .app-ver, .login-brand .app-ver { display: table; margin: 6px 0 0; vertical-align: baseline; line-height: 1.5; }
  .brand-sub { margin-top: 10px; font-size: 14px; line-height: 1.55; color: #9aa0a8; }
  .side-nav { display: flex; flex-direction: column; gap: 6px; margin-top: 40px; }
  .side-nav.admin { margin-top: 18px; padding-top: 14px; border-top: 1px solid #262930; }
  .side-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%; border: 0; background: transparent; cursor: pointer; text-align: left;
    padding: 12px 12px; border-radius: 10px;
    font-size: 16px; font-weight: 700; color: #c3c7cd;
  }
  .side-item:hover { background: #20232a; color: #eef0f2; }
  .side-item.active { background: #272b33; color: #ffffff; }
  .side-item .n { font-size: 13px; font-weight: 600; color: #8b919a; }
  .side-foot { margin-top: auto; padding: 16px 12px 0; font-size: 13px; line-height: 1.5; color: #8b919a; border-top: 1px solid #262930; }
  .side-foot b { color: #d9dce0; }
  .sf-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #7d838c; }
  .side-foot .sf-name { display: block; margin-top: 2px; font-size: 15.5px; color: #f2f3f5; overflow-wrap: anywhere; }
  .sf-team { font-size: 13px; color: #9aa0a8; }
  .sf-roles .role-badge { margin: 6px 5px 0 0; padding: 2px 8px; background: #262a33; color: #c9cdf5; font-size: 11px; }
  .sf-viewing { margin-top: 8px; padding: 6px 8px; border-radius: 8px; background: #3a2f12; color: #f5dc9a; font-size: 12.5px; }
  .sf-viewing b { color: #fff; }
  .sf-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .sf-btn { height: 32px; padding: 0 12px; border: 1px solid #3a3f48; border-radius: 9px; background: #20232a; color: #e6e8eb; font-size: 13px; font-weight: 700; cursor: pointer; }
  .sf-btn:hover { background: #2a2e36; }
  .sf-btn:focus-visible { outline: 2px solid #8f95e6; outline-offset: 1px; }
  .side-demo { margin-top: 12px; }
  .side-sample { margin-top: 2px; }
  /* Data file status: quiet when saved, amber when it needs a click, red when saving is stuck. */
  .side-file { margin-top: auto; margin-bottom: 10px; width: 100%; text-align: left; border: 1px solid #2c3038; background: #1d2026; color: #aeb4bd; border-radius: 10px; padding: 8px 10px; font: inherit; font-size: 12.5px; line-height: 1.4; cursor: pointer; overflow-wrap: anywhere; }
  .side-file b { color: #e6e8eb; font-weight: 600; }
  .side-file.warn { background: #3a2f12; border-color: #7a5d17; color: #f5dc9a; }
  .side-file.bad { background: #3d1518; border-color: #8e2a31; color: #ffc9cd; }
  .side-file.warn b, .side-file.bad b { color: #fff; }
  .side-file:not([hidden]) + .side-foot { margin-top: 0; }
  .login-file { font-size: 13.5px; line-height: 1.5; background: #f4f5f7; border: 1px solid #e1e4e8; border-radius: 10px; padding: 10px 12px; display: grid; gap: 8px; }
  .login-file .btn { height: 36px; font-size: 14px; justify-self: start; }
  .link-btn { border: 0; background: none; padding: 0; color: #2e3394; font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; }
  .file-status { display: grid; gap: 4px; padding: 12px 14px; border-radius: 12px; background: #f4f5f7; border: 1px solid #e1e4e8; margin-bottom: 14px; font-size: 14.5px; line-height: 1.5; }
  .file-status.warn { background: #fff7df; border-color: #e6cf8f; }
  .file-status.bad { background: #fdecee; border-color: #efb9be; }

  /* ---------- Main ---------- */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid #d3d7dc; }
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px;
    background: #eceef1;
    border-bottom: 1px solid #d5d9de;
  }
  .search {
    flex: 1; min-width: 160px;
    display: flex; align-items: center; gap: 10px;
    height: 46px; padding: 0 14px;
    background: var(--surface); border: 1px solid #d0d4da; border-radius: 14px;
  }
  .search:focus-within { border-color: #9da3ac; background: #fff; }
  .search-ico { font-size: 17px; }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 18px; color: var(--ink-2); }
  .search input::placeholder { color: #4b5058; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 44px; padding: 0 16px;
    border: 1px solid #cdd1d7; border-radius: 12px;
    background: var(--surface-2); color: var(--ink);
    font-size: 17px; font-weight: 700; cursor: pointer; white-space: nowrap;
    box-shadow: 0 1px 0 rgba(0,0,0,.04);
    transition: background .12s, filter .12s, transform .05s;
  }
  .btn:hover { background: #fff; }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .5; cursor: default; transform: none; }
  .btn:focus-visible, .btn-sm:focus-visible, .tab:focus-visible { outline: 2px solid #5257c9; outline-offset: 2px; }
  .btn-red { background: var(--red); border-color: var(--red-border); color: #fff; }
  .btn-red:hover { background: #c2161f; }
  .btn-red:disabled:hover { background: var(--red); }
  .topbar .btn { height: 46px; }

  .content { flex: 1; overflow: auto; padding: 18px 18px 20px; }

  .hero {
    background: var(--surface); border: 1px solid #d9dce1; border-radius: 18px;
    padding: 22px 22px 18px; margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(15,20,30,.05);
  }
  .hero h1 { margin: 0 0 10px; font-size: 27px; font-weight: 700; letter-spacing: -.01em; }
  .hero p { margin: 0; max-width: 920px; font-size: 15.5px; line-height: 1.6; color: var(--ink-2); }
  .hero-actions { display: flex; gap: 10px; margin: 18px 0 16px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 10px; flex-wrap: wrap; }
  .tab {
    border: 1px solid #cfd3d9; background: #f6f7f9; border-radius: 999px;
    padding: 8px 16px; font-size: 15px; font-weight: 600; cursor: pointer; color: var(--ink-2);
  }
  .tab:hover { background: #fff; }
  .tab.active { background: var(--tab-active); border-color: var(--tab-active-line); color: var(--tab-active-ink); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 16px; }
  .stat {
    text-align: left; cursor: pointer;
    background: var(--surface); border: 1px solid #d9dce1; border-radius: 16px;
    padding: 18px 16px 16px; box-shadow: 0 1px 2px rgba(15,20,30,.05);
  }
  .stat:hover { background: #fafbfc; }
  .stat.active { border-color: #9a9ee0; box-shadow: 0 0 0 2px #d5d6f4; }
  .stat-label { font-size: 12.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
  .stat-value { margin: 10px 0 6px; font-size: 35px; font-weight: 700; line-height: 1; }
  .stat-sub { font-size: 14.5px; line-height: 1.35; color: var(--ink-2); }

  .filters {
    display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 16px; align-items: end;
    background: var(--surface); border: 1px solid #d9dce1; border-radius: 16px;
    padding: 14px 14px 12px; margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(15,20,30,.05);
  }
  .flabel-top { display: block; margin: 0 0 8px 2px; font-size: 12.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
  .select, .input, .textarea {
    width: 100%; height: 46px; padding: 0 12px;
    border: 1px solid #c9cdd3; border-radius: 12px; background: #fafafb;
    font-size: 18px; color: var(--ink-2); outline: none;
  }
  .select:focus, .input:focus, .textarea:focus { border-color: #8d93c9; box-shadow: 0 0 0 3px #e0e1f6; background: #fff; }
  .textarea { height: auto; min-height: 96px; padding: 10px 12px; resize: vertical; line-height: 1.45; font-size: 16px; }
  .filters .btn { width: 100%; height: 46px; }
  .view-chip { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: -4px 0 12px 2px; font-size: 14px; color: var(--ink-2); }

  /* ---------- Board ---------- */
  .board {
    display: flex; gap: 18px; align-items: stretch;
    overflow: auto; max-height: 660px; min-height: 360px;
    padding-bottom: 6px;
  }
  .col {
    flex: 0 0 290px;
    display: flex; flex-direction: column;
    background: #eef0f3; border: 1px solid #d8dce1; border-radius: 16px;
    transition: background .12s, border-color .12s;
  }
  .col.drop { background: #e4e6f7; border-color: #a6a9e2; }
  .col-head {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: center; gap: 10px;
    padding: 15px 14px; background: #f6f7f9;
    border-bottom: 1px solid #e0e3e7; border-radius: 16px 16px 0 0;
  }
  .dot { width: 13px; height: 13px; border-radius: 50%; flex: none; display: inline-block; }
  .col-head h3 { margin: 0; flex: 1; font-size: 18.5px; font-weight: 700; }
  .count {
    min-width: 27px; height: 27px; padding: 0 6px; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center;
    background: #fff; border: 1px solid #c9ccd2; font-size: 12.5px; font-weight: 700;
  }
  .col-body { padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
  .empty-col {
    border: 1px dashed #c6cad1; border-radius: 12px; padding: 18px 12px;
    text-align: center; color: var(--muted); font-size: 14px; background: rgba(255,255,255,.4);
  }

  .card {
    display: flex; flex-direction: column;
    background: var(--card); border: 1px solid #dfe2e6; border-radius: 14px;
    padding: 14px 14px 16px; box-shadow: 0 1px 3px rgba(20,24,30,.07);
  }
  .card[draggable="true"] { cursor: grab; }
  .card.dragging { opacity: .5; }
  .card.flash, .pcard.flash { animation: flash 1.6s ease-out; }
  @keyframes flash {
    0% { box-shadow: 0 0 0 0 rgba(181,20,30,0); }
    25% { box-shadow: 0 0 0 4px rgba(181,20,30,.45); }
    100% { box-shadow: 0 1px 3px rgba(20,24,30,.07); }
  }
  .card-ref { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; color: var(--muted); }
  .card-title { margin: 3px 0 10px; font-size: 17px; font-weight: 700; line-height: 1.3; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .tag { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; line-height: 1.25; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .field { background: var(--field); border-radius: 10px; padding: 8px 9px 9px; min-width: 0; }
  .field-l { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #3d4148; line-height: 1.2; }
  .field-v { margin-top: 5px; font-size: 15px; font-weight: 600; line-height: 1.3; color: #1d2025; overflow-wrap: break-word; }
  .field-v.overdue { color: var(--red); }
  .desc { margin: 14px 0 0; font-size: 15px; line-height: 1.6; color: #24282e; overflow-wrap: anywhere; }
  .block-reason { margin: 10px 0 0; padding: 8px 10px; border-radius: 10px; background: #fbe9ea; color: #8e1720; font-size: 13.5px; line-height: 1.45; }
  /* Card buttons sit on a 6-column grid pinned to the bottom; each button's width comes from config. */
  .actions {
    margin-top: auto; padding-top: 14px;
    display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px;
  }
  .actions::before { content: ''; grid-column: 1 / -1; border-top: 1px solid #eceef1; margin: 2px 0 6px; }
  .actions:empty { display: none; }
  .span-sm { grid-column: span 2; }
  .span-md { grid-column: span 3; }
  .span-lg { grid-column: span 4; }
  .span-full { grid-column: 1 / -1; }
  .btn-sm {
    border: 1px solid transparent; border-radius: 9px; padding: 8px 12px;
    font-size: 13.5px; font-weight: 700; cursor: pointer; color: #fff; line-height: 1.2;
    transition: filter .12s;
  }
  .btn-sm:hover { filter: brightness(1.12); }
  .actions .btn-sm { width: 100%; padding: 8px 6px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .b-plain { background: #f7f8fa; border-color: #cfd3d9; color: var(--ink); }
  .b-plain:hover { filter: none; background: #fff; }
  .b-indigo { background: #2e3394; border-color: #272b80; }
  .b-del { background: #9b111b; border-color: #850e17; }

  /* ---------- Posts / Files / Notes / Overview ---------- */
  .sheet {
    background: var(--surface); border: 1px solid #d9dce1; border-radius: 18px;
    padding: 20px 20px 22px; box-shadow: 0 1px 2px rgba(15,20,30,.05);
  }
  .sheet-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .sheet-head h2 { margin: 0; font-size: 21px; }
  .muted { color: var(--muted); font-size: 14px; }
  .composer { display: grid; gap: 10px; margin-bottom: 18px; }
  .composer-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .composer-row .select, .composer-row .input { flex: 1; min-width: 180px; font-size: 16px; height: 44px; }
  .entry { background: var(--card); border: 1px solid #dfe2e6; border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .entry-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .entry-top b { font-size: 15.5px; }
  .entry-top .when { color: var(--muted); font-size: 13px; }
  .entry-top .spacer { flex: 1; }
  .entry p { margin: 0; font-size: 15px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
  .dropzone {
    border: 1.5px dashed #bfc4cc; border-radius: 14px; padding: 22px; text-align: center;
    background: #eef0f3; color: var(--ink-2); font-size: 15px; margin-bottom: 14px; cursor: pointer;
  }
  .dropzone.drop { background: #e4e6f7; border-color: #9da1de; }
  .file-row { display: flex; align-items: center; gap: 12px; }
  .file-ico {
    width: 40px; height: 40px; border-radius: 10px; flex: none;
    display: grid; place-items: center; background: #e4e4f7; color: #343a8a; font-size: 11px; font-weight: 700; text-transform: uppercase;
  }
  .file-meta { flex: 1; min-width: 0; }
  .file-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--card); border: 1px solid #dfe2e6; border-radius: 14px; overflow: hidden; }
  .table th, .table td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #eceef1; font-size: 15px; }
  .table th { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: #3d4148; background: #f6f7f9; }
  .table tr:last-child td { border-bottom: 0; }
  .table td.num, .table th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .table tbody tr { cursor: pointer; }
  .table tbody tr:hover td { background: #f8f9fb; }
  .none { text-align: center; color: var(--muted); padding: 22px; border: 1px dashed #c9cdd3; border-radius: 12px; background: #eff1f4; }

  /* ---------- Configuration screen ---------- */
  .cfg-page { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 16px; align-items: start; }
  .cfg-nav {
    position: sticky; top: 0; display: flex; flex-direction: column; gap: 2px;
    background: var(--surface); border: 1px solid #d9dce1; border-radius: 16px; padding: 8px;
    box-shadow: 0 1px 2px rgba(15,20,30,.05);
  }
  .cfg-nav-title { padding: 10px 12px 8px; font-size: 19px; font-weight: 700; }
  .cfg-nav button {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; border: 0; background: transparent; border-radius: 10px; padding: 10px 12px;
    font-size: 15px; font-weight: 600; color: var(--ink-2); cursor: pointer; text-align: left;
  }
  .cfg-nav button:hover { background: #eceef2; }
  .cfg-nav button.active { background: var(--tab-active); color: var(--tab-active-ink); }
  .cfg-nav button.err { color: var(--red); }
  .cfg-nav .n { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .cfg-main { min-width: 0; }
  /* Negative top offsets the scroller's padding so nothing scrolls visibly above the bar. */
  .cfg-bar {
    position: sticky; top: -18px; z-index: 6;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 12px 10px 16px; margin-bottom: 14px;
    border-radius: 14px; border: 1px solid #e6cf8f; background: #fff7df;
    box-shadow: 0 4px 14px rgba(15,20,30,.08);
  }
  .cfg-bar.clean { background: var(--surface); border-color: #d9dce1; box-shadow: none; }
  .cfg-bar-text { flex: 1; min-width: 200px; font-size: 14.5px; }
  .cfg-bar .btn { height: 40px; font-size: 15px; }
  .cfg-errors { border: 1px solid #e7b4b8; background: #fbecee; border-radius: 14px; padding: 12px 16px; margin-bottom: 14px; color: #7d1219; font-size: 14.5px; }
  .cfg-errors ul { margin: 6px 0 0; padding-left: 18px; line-height: 1.6; }
  .cfg-errors button { border: 0; background: none; color: inherit; text-decoration: underline; cursor: pointer; font: inherit; padding: 0; }
  .cfg-section {
    background: var(--surface); border: 1px solid #d9dce1; border-radius: 16px;
    padding: 18px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(15,20,30,.05);
  }
  .cfg-section h2 { margin: 0 0 4px; font-size: 19px; }
  .cfg-section h3 { margin: 20px 0 6px; font-size: 15.5px; }
  .cfg-help { margin: 0 0 14px; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .cfg-hint { margin: 2px 0 8px; color: var(--muted); font-size: 12.5px; line-height: 1.5; }
  .cfg-hint code { background: #e9ebef; border-radius: 4px; padding: 1px 4px; font-size: 12px; color: var(--ink-2); }
  .crow {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px;
    background: #fff; border: 1px solid #dfe2e6; border-radius: 12px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .crow .crow { background: #f7f8fa; margin-bottom: 6px; }
  .crow.block { padding: 14px; border-color: #d3d7dd; }
  .cell { display: flex; flex-direction: column; min-width: 0; }
  .cell.grow { flex: 1 1 170px; }

    flex: none; width: 34px; height: 34px; display: grid; place-items: center;

  }

  .script-box { font-family: Consolas, "SFMono-Regular", Menlo, monospace !important; font-size: 13.5px !important; line-height: 1.5; min-height: 110px; tab-size: 2; white-space: pre; }

  /* Handoff acceptance, item details */
  .offer-banner { margin-top: 12px; padding: 9px 11px; border-radius: 10px; background: #efe9fb; border: 1px solid #d6c9f3; color: #3f2a7a; font-size: 13.5px; line-height: 1.45; }

  .handover { background: #fff; border: 1px solid #dfe2e6; border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; }

  .note-sec b { display: block; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: #5d636c; }
  .comment, .hist { padding: 9px 0; border-bottom: 1px dashed #dde0e4; font-size: 14px; line-height: 1.5; }
  .comment:last-child, .hist:last-child { border-bottom: 0; }
  .comment .who, .hist .when { color: var(--muted); font-size: 12.5px; }
  .view-suffix { color: var(--muted); font-weight: 600; }

  /* Sign-in, roles, queues */
  .login { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px; background: linear-gradient(160deg, #16181d 0%, #262a33 100%); overflow: auto; }
  .login-card { width: min(420px, 100%); background: var(--surface-2); border-radius: 18px; padding: 26px 26px 22px; box-shadow: 0 24px 70px rgba(0,0,0,.4); display: grid; gap: 14px; }
  .login-brand { font-size: 34px; line-height: 1.15; font-weight: 800; color: #1b2a6b; }
  .login-card label > span { display: block; margin: 0 0 5px 2px; font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
  .login-card .btn { width: 100%; }
  .login-hint { font-size: 13px; line-height: 1.55; color: var(--muted); border-top: 1px solid #e1e4e8; padding-top: 12px; }
  .login-hint code { background: #e9ebef; border-radius: 4px; padding: 1px 5px; color: var(--ink-2); }
  .role-badge { display: inline-block; margin: 6px 6px 0 0; padding: 3px 9px; border-radius: 999px; background: #e4e4f7; color: #343a8a; font-size: 12px; font-weight: 700; }
  .ro-banner { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; padding: 10px 14px; border-radius: 12px; background: #fff7df; border: 1px solid #e6cf8f; font-size: 14.5px; }
  .verify-banner { margin-top: 12px; padding: 9px 11px; border-radius: 10px; background: #f1ebfb; border: 1px solid #d9caf2; color: #43277a; font-size: 13.5px; line-height: 1.45; display: grid; gap: 6px; }
  .verify-banner b { color: #2f1760; }
  .vstages { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; font-size: 13px; }
  .vstages .arrow { color: #8b7fae; }
  .vstage { padding: 2px 8px; border-radius: 999px; background: #fff; border: 1px solid #d9caf2; color: #4a3a73; white-space: nowrap; }
  .vstage.approved { background: #e2f3e5; border-color: #b9dcc0; color: #1f6a2f; }
  .vstage.pending { background: #7a4fc9; border-color: #6a3fb8; color: #fff; font-weight: 700; }
  .vstage.rejected { background: #fbe1e3; border-color: #efb9be; color: #8e1720; }
  .vstage.cancelled { opacity: .55; }
  .hstate.recalled { background: #eceef1; color: #3d4148; }
  .queue-banner { margin-top: 12px; padding: 9px 11px; border-radius: 10px; background: #e6f1f6; border: 1px solid #c3dce8; color: #1d4a5e; font-size: 13.5px; line-height: 1.45; }
  .member-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; font-size: 14px; border-bottom: 1px dashed #dde0e4; }
  .member-row:last-child { border-bottom: 0; }
  .member-row .grow { flex: 1; min-width: 0; }
  .member-row .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  /* Demo player: drives the real UI with a visible pointer */
  .demo-panel { position: fixed; left: 12px; bottom: 12px; width: 370px; max-width: calc(100vw - 24px); max-height: 72vh; z-index: 130; display: flex; flex-direction: column; background: #fff; border: 1px solid #cfd3d9; border-radius: 14px; box-shadow: 0 18px 50px rgba(10,12,16,.35); font-size: 14px; color: var(--ink); }
  .demo-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #16181d; color: #fff; border-radius: 14px 14px 0 0; cursor: pointer; }
  .demo-head b { flex: 1; }
  .demo-head button { border: 0; background: transparent; color: #fff; cursor: pointer; font-size: 15px; padding: 2px 6px; }
  .demo-panel.min .demo-body { display: none; }
  .demo-panel.min .demo-head { border-radius: 14px; }
  .demo-body { padding: 10px 12px 12px; overflow: auto; display: grid; gap: 10px; flex: 1 1 auto; min-height: 0; align-content: start; }
  .demo-list { display: grid; gap: 2px; max-height: var(--list-h, 214px); overflow: auto; padding-right: 4px; }
  /* The panel sits in the bottom-left corner, so it resizes from its top and right edges. */
  .demo-panel.sized { width: var(--demo-w); height: var(--demo-h); max-height: calc(100vh - 24px); }
  .demo-panel.sized.min { height: auto; }
  .demo-grip { position: absolute; z-index: 2; touch-action: none; }
  .demo-grip.t { left: 16px; right: 16px; top: -4px; height: 8px; cursor: ns-resize; }
  .demo-grip.r { top: 16px; bottom: 16px; right: -4px; width: 8px; cursor: ew-resize; }
  .demo-grip.tr { top: -4px; right: -4px; width: 18px; height: 18px; cursor: nesw-resize; border-radius: 4px; }
  .demo-grip.tr::after { content: ''; position: absolute; right: 8px; top: 8px; width: 6px; height: 6px; border-top: 2px solid rgba(255,255,255,.8); border-right: 2px solid rgba(255,255,255,.8); border-radius: 0 3px 0 0; }
  .demo-grip.tr:focus-visible { outline: 2px solid #8fb3ff; outline-offset: 1px; }
  .demo-panel.min .demo-grip { display: none; }
  body.demo-resizing { user-select: none; cursor: nesw-resize; }
  .demo-pick { display: flex; gap: 10px; align-items: center; font-size: 13px; color: #4a4f57; }
  .demo-pick button { border: 0; background: none; padding: 0; color: #2e3394; font: inherit; font-weight: 700; cursor: pointer; }
  .demo-list label { display: flex; gap: 8px; align-items: center; padding: 3px 0; cursor: pointer; }
  .demo-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .demo-controls .btn { height: 34px; font-size: 14px; padding: 0 12px; }
  .demo-controls select { height: 34px; border: 1px solid #cfd3d9; border-radius: 9px; padding: 0 8px; background: #fafafb; }
  .demo-caption { background: #fff7df; border: 1px solid #e6cf8f; border-radius: 10px; padding: 8px 10px; line-height: 1.45; }
  .demo-results { font-size: 13px; line-height: 1.55; }
  .demo-results .sc { margin-top: 8px; font-weight: 700; }
  .demo-results .pass { color: #1f6a2f; }
  .demo-results .fail { color: #9b111b; }
  .demo-results .sum { margin-top: 8px; padding-top: 8px; border-top: 1px solid #e1e4e8; font-weight: 700; }
  .demo-pointer { position: fixed; left: -100px; top: -100px; z-index: 2147483647; width: 24px; height: 24px; pointer-events: none; transition: left .45s ease, top .45s ease; filter: drop-shadow(0 2px 3px rgba(0,0,0,.45)); }
  .demo-pointer.clicking::after { content: ''; position: absolute; left: -11px; top: -11px; width: 28px; height: 28px; border-radius: 50%; border: 3px solid #b5141e; animation: demoRipple .45s ease-out; }
  @keyframes demoRipple { from { transform: scale(.3); opacity: 1; } to { transform: scale(1.5); opacity: 0; } }
  .demo-bubble { position: absolute; left: 26px; top: 20px; width: max-content; max-width: 280px; padding: 6px 9px; border-radius: 8px; background: #16181d; color: #fff; font-size: 12.5px; line-height: 1.4; }
  .demo-pointer.flip .demo-bubble { left: auto; right: 26px; }
  .demo-bubble:empty { display: none; }
  .demo-target { outline: 3px solid #b5141e !important; outline-offset: 2px; }
  .demo-shield { position: fixed; inset: 0; z-index: 125; cursor: progress; }
  .login-fields { display: contents; }
  .login-fields[hidden] { display: none; }
  .login-start { display: grid; gap: 10px; padding: 16px; border-radius: 14px; background: linear-gradient(135deg, #eef0ff, #fdf0f4); border: 1px solid #dcdff5; }
  .login-start .ls-title { font-size: 17px; font-weight: 800; }
  .login-start p { margin: 0; font-size: 14.5px; line-height: 1.5; }
  .login-start .btn { height: 48px; font-size: 16.5px; }
  .login-demo { background: transparent; border: 0; color: #343a8a; font-weight: 700; cursor: pointer; padding: 4px 0; text-align: left; font-size: 14px; }
  .side-label { margin: 34px 12px 8px; font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #6c727b; }
  .side-label + .side-nav { margin-top: 0; }

  /* ---------- Right panel ---------- */
  .panel { background: #eef0f3; overflow: auto; padding: 0 14px 18px; }
  .panel-head {
    position: sticky; top: 0; z-index: 3;
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 4px 14px; background: #eef0f3;
  }
  .panel-head h2 { margin: 0; font-size: 17px; font-weight: 700; }
  .unread-pill { font-size: 12.5px; font-weight: 700; }
  .unread-pill.has { color: var(--red); }
  .unread-link { border: 0; background: none; padding: 4px 6px; margin-right: -6px; border-radius: 8px; font-family: inherit; color: inherit; cursor: pointer; }
  .unread-link:hover { background: #e2e5ea; text-decoration: underline; }
  .unread-link:focus-visible { outline: 2px solid #5257c9; outline-offset: 1px; }
  .pcard {
    background: var(--surface-2); border: 1px solid #d9dce1; border-radius: 16px;
    margin-bottom: 16px; box-shadow: 0 1px 2px rgba(15,20,30,.05);
  }
  .pcard-head {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid #e1e4e8; border-radius: 16px 16px 0 0;
  }
  .pcard-head h3 { margin: 0; font-size: 15.5px; font-weight: 700; }
  .pcard-head span { font-size: 12.5px; font-weight: 700; }
  .head-right { display: inline-flex; align-items: center; gap: 10px; }
  /* Accordion behaviour */
  .pcard[data-acc] > .pcard-head { cursor: pointer; user-select: none; transition: background .12s; }
  .pcard[data-acc] > .pcard-head:hover { background: #eef0f3; }
  .pcard[data-acc] > .pcard-head:focus-visible { outline: 2px solid #5257c9; outline-offset: -2px; }
  .chev { display: inline-block; color: var(--muted); font-size: 13px; transition: transform .15s; }
  .pcard.collapsed > .pcard-head { border-bottom: 0; border-radius: 16px; }
  .pcard.collapsed > .pcard-head .chev { transform: rotate(-90deg); }
  .pcard.collapsed > :not(.pcard-head) { display: none !important; }
  .inbox { padding: 12px 14px 14px; max-height: 420px; overflow: auto; }
  .empty-box {
    border: 1px dashed #c9cdd3; background: #eff1f4; border-radius: 12px;
    padding: 16px 14px; text-align: center; font-size: 13.5px; color: #2f343b;
  }
  .alert {
    background: #fff; border: 1px solid #e3d3d5; border-left: 4px solid var(--red);
    border-radius: 12px; padding: 12px 12px 12px 14px; margin-bottom: 10px;
  }
  .alert-msg { font-size: 14px; font-weight: 600; line-height: 1.45; }
  .alert-meta { margin-top: 4px; font-size: 12.5px; color: var(--muted); }
  .alert-actions { display: flex; gap: 8px; margin-top: 10px; }

  /* The form uses most of the window height so all fields are visible without scrolling the form itself. */
  .form-scroll { max-height: calc(100vh - 150px); min-height: 420px; overflow: auto; padding: 14px 18px 18px; }
  .form-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px 14px; }
  .form-grid label, .form-grid .cf-item { min-width: 0; }
  .form-grid .full { grid-column: 1 / -1; }
  .cf-wrap { display: contents; }
  .form-grid label > span, .form-grid .cf-item > span { display: block; margin: 0 0 5px 2px; font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
  .form-grid .input, .form-grid .select { height: 38px; font-size: 15px; padding: 0 12px; border-radius: 10px; }
  .form-grid .textarea { font-size: 15px; border-radius: 10px; }
  .form-grid .input::placeholder, .form-grid .textarea::placeholder { color: #4a4f57; }
  .form-actions { display: flex; gap: 10px; }
  .form-actions .btn { flex: 1; height: 38px; font-size: 14.5px; }
  .form-error { color: var(--red); font-size: 13.5px; font-weight: 700; }

  /* Capped so the feed doesn't push the handoff form far down the panel. */
  .activity { padding: 4px 18px 14px; max-height: 320px; overflow: auto; }
  .act { padding: 10px 0; border-bottom: 1px dashed #dde0e4; }
  .act:last-child { border-bottom: 0; }
  .act-msg { font-size: 14px; font-weight: 600; line-height: 1.45; overflow-wrap: anywhere; }
  .act-meta { margin-top: 3px; font-size: 12px; color: var(--muted); }
  .act-meta .type { text-transform: uppercase; letter-spacing: .02em; }

  /* ---------- Toasts / dialog ---------- */
  .toasts {
    position: fixed; left: 20px; right: 20px; bottom: 20px; z-index: 60; display: flex; flex-direction: column; gap: 10px;
    align-items: flex-end; pointer-events: none; --nd: 300ms; --dy: 28px;
  }
  /* Below the top bar, so "New handoff" and search stay usable while a pop-up is showing. */
  .toasts.pos-top { top: 80px; bottom: auto; --dy: -28px; }
  .toasts.al-left { align-items: flex-start; }
  .toasts.al-center { align-items: center; }
  /* Alerts and messages share one card; only the stripe differs (alerts: needs action, messages: done). */
  /* Tinted with the stripe colour and lifted with a strong shadow, so they stand out from the light page. */
  .toast {
    --accent: var(--msg-accent, #2f7a1e);
    pointer-events: auto; width: 340px; max-width: calc(100vw - 32px);
    background: color-mix(in srgb, var(--accent) 11%, var(--pop-bg, #fff)); color: var(--pop-fg, var(--ink));
    border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); border-left: 6px solid var(--accent);
    border-radius: 12px; padding: 12px 14px 10px; font-size: 14px; line-height: 1.45;
    box-shadow: 0 16px 40px rgba(10,12,16,.34), 0 3px 10px rgba(10,12,16,.16);
    animation: toastSlideIn var(--nd) ease-out both;
  }
  .toast .t-title { font-weight: 700; font-size: 14.5px; margin-bottom: 3px; }
  .toast .t-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 9px; }
  .toast .t-actions .btn-sm { padding: 6px 11px; font-size: 13px; }
  .toasts.an-bounce .toast { animation: toastSlideIn var(--nd) cubic-bezier(.34,1.7,.5,1) both; }
  .toasts.an-fade .toast { animation: toastFadeIn var(--nd) ease-out both; }
  .toasts.an-none .toast { animation: none; }
  .toasts .toast.out { animation: toastSlideOut var(--nd) ease-in forwards; pointer-events: none; }
  .toasts.an-fade .toast.out { animation: toastFadeOut var(--nd) ease-in forwards; }
  .toasts.an-none .toast.out { animation: none; opacity: 0; }
  .toast.pop { --accent: var(--pop-accent, var(--red)); }
  .bell-wrap { position: relative; }

<div class="app">

<script>

  'use strict';

  } catch (e) { /* storage unavailable */ }
  const MAX_FILE_BYTES = 750 * 1024;
  const CONFIG_VERSION = 7;
  // The app's version, shown beside its name in the sidebar and on the sign-in screen.
  const APP_VERSION = '1.0.0';
  // index.html#guide is the User Guide in its own tab. That tab only reads the workspace; it never saves.
  const GUIDE_TAB = location.hash === '#guide';
  const NOTE_COLOURS = ['popBg', 'popText', 'popAccent', 'msgAccent'];
  const NOTE_VARS = [['--pop-bg', 'popBg'], ['--pop-fg', 'popText'], ['--pop-accent', 'popAccent'], ['--msg-accent', 'msgAccent']];
  const SCOPES = [{ v: 'own', l: 'Their own work' }, { v: 'team', l: 'Their team’s work' }, { v: 'all', l: 'Everything' }];
  const VIEW_AS = [{ v: 'none', l: 'Nobody' }, { v: 'team', l: 'Their team' }, { v: 'all', l: 'Anyone' }];
  const RANK = { own: 0, none: 0, team: 1, all: 2 };

  // Compact synchronous SHA-256 (hex). Passwords are stored as salted hashes, never as plain text.
  function sha256(input) {
    const ascii = unescape(encodeURIComponent(String(input)));
    const rr = (v, n) => (v >>> n) | (v << (32 - n));
    const maxWord = 2 ** 32;
    const words = [];
    const bitLen = ascii.length * 8;
    let hash = [];
    const k = [];
    const composite = {};
    for (let c = 2, count = 0; count < 64; c++) {
      if (composite[c]) continue;
      for (let i = 0; i < 313; i += c) composite[i] = c;
      hash[count] = (Math.pow(c, 0.5) * maxWord) | 0;
      k[count++] = (Math.pow(c, 1 / 3) * maxWord) | 0;
    }
    let msg = ascii + '\x80';
    while (msg.length % 64 - 56) msg += '\x00';
    for (let i = 0; i < msg.length; i++) words[i >> 2] |= msg.charCodeAt(i) << ((3 - i) % 4) * 8;
    words[words.length] = (bitLen / maxWord) | 0;
    words[words.length] = bitLen;
    for (let j = 0; j < words.length;) {
      const w = words.slice(j, j += 16);
      const old = hash;
      hash = hash.slice(0, 8);
      for (let i = 0; i < 64; i++) {
        const w15 = w[i - 15], w2 = w[i - 2], a = hash[0], e = hash[4];
        const t1 = hash[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & hash[5]) ^ (~e & hash[6])) + k[i]
          + (w[i] = i < 16 ? w[i] : (w[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + w[i - 7] + (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
        const t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & hash[1]) ^ (a & hash[2]) ^ (hash[1] & hash[2]));
        hash = [(t1 + t2) | 0].concat(hash);
        hash[4] = (hash[4] + t1) | 0;
      }
      for (let i = 0; i < 8; i++) hash[i] = (hash[i] + old[i]) | 0;
    }
    let out = '';
    for (let i = 0; i < 8; i++) for (let j = 3; j + 1; j--) { const b = (hash[i] >> (j * 8)) & 255; out += (b < 16 ? '0' : '') + b.toString(16); }
    return out;
  }
  const hashPassword = (salt, password) => sha256(`${salt}:${password}`);

  // =====================================================================
  // Engine vocabulary. These are the building blocks; everything users see
  // (filters, buttons, fields, statuses) is assembled from them in config.
  // =====================================================================
  const WIDTHS = [{ v: 'sm', l: 'Narrow (⅓)' }, { v: 'md', l: 'Half' }, { v: 'lg', l: 'Wide (⅔)' }, { v: 'full', l: 'Full row' }];
  const BUILTIN_FIELDS = ['title', 'ref', 'priority', 'team', 'owner', 'nextTeam', 'nextOwner', 'due', 'status', 'desc'];
  const FIELD_TYPES = [
    { v: 'text', l: 'Text' }, { v: 'longtext', l: 'Long text' }, { v: 'number', l: 'Number' }, { v: 'date', l: 'Date' },
    { v: 'select', l: 'Dropdown' }, { v: 'multiselect', l: 'Multi-select' }, { v: 'person', l: 'Person' }, { v: 'team', l: 'Team' },
    { v: 'bool', l: 'Yes / No' }, { v: 'url', l: 'Web address' }, { v: 'email', l: 'Email' },
  ];
  const TEMPLATE_KEYS = ['ref', 'title', 'actor', 'owner', 'nextOwner', 'prevOwner', 'team', 'nextTeam', 'status', 'priority', 'due', 'reason', 'created', 'offerTo', 'note'];
  const PARAM_TYPES = [
    { v: 'text', l: 'Text' }, { v: 'number', l: 'Number' }, { v: 'bool', l: 'Yes / No' }, { v: 'person', l: 'Person' },
    { v: 'team', l: 'Team' }, { v: 'status', l: 'Status' }, { v: 'priority', l: 'Priority' },
  ];

  // Steps a button can run. `gather` steps collect input in one dialog before anything changes.
  const STEP_TYPES = {
    confirm:     { name: 'Ask for confirmation',         gather: true, defaults: () => ({ message: 'Are you sure?' }) },
    reason:      { name: 'Ask for a reason',             gather: true, defaults: () => ({ prompt: 'Reason (optional)', required: false }) },
    pickNext:    { name: 'Choose the next owner',        gather: true, defaults: () => ({}) },
    handoverNote: { name: 'Ask for a handover note',     gather: true, defaults: () => ({ sections: 'Summary*, Open actions, Risks and watch-outs' }) },
    offer:       { name: 'Offer the item to the next owner (they accept or decline)', defaults: () => ({}) },
    acceptOffer: { name: 'Accept the offered handoff',   gather: true, defaults: () => ({ land: 'assigned' }) },
    declineOffer: { name: 'Decline the offered handoff', defaults: () => ({}) },

    setStatus:   { name: 'Move to status',               defaults: () => ({ to: '' }) },
    transfer:    { name: 'Hand over to the next owner',  defaults: () => ({}) },
    route:       { name: 'Route to the next team',       defaults: () => ({ useLead: true }) },
    setOwner:    { name: 'Set the owner',                defaults: () => ({ to: 'viewer' }) },
    setNext:     { name: 'Set the next owner',           defaults: () => ({ to: 'none' }) },
    setPriority: { name: 'Set the priority',             defaults: () => ({ to: '' }) },
    setDue:      { name: 'Set the due date',             defaults: () => ({ days: 3, clear: false }) },
    setField:    { name: 'Set a custom field',           defaults: () => ({ fieldId: '', value: '' }) },
    notify:      { name: 'Send an alert',                defaults: () => ({ who: 'owner', personId: '', message: '{ref} "{title}" needs your attention ({actor}).', onlyIfChanged: false }) },
    createItem:  { name: 'Create a linked item',         defaults: () => ({ title: 'Follow-up: {title}', desc: '', team: 'next', owner: 'nextOwner', status: '', priority: 'same', dueDays: '', copyFields: false, linkType: 'Follow-up', notify: true }) },
    email:       { name: 'Send an email (opens a draft)', defaults: () => ({ to: 'owner', personId: '', address: '', subject: '{ref}: {title}', body: '{actor} updated {ref} "{title}". Status: {status}.' }) },
    webhook:     { name: 'Call a webhook',               defaults: () => ({ method: 'POST', url: 'https://', body: '{"ref":"{ref}","title":"{title}","status":"{status}","owner":"{owner}","actor":"{actor}"}' }) },
    runButton:   { name: 'Run another button’s steps',   defaults: () => ({ actionId: '' }) },
    edit:        { name: 'Open in the editor',           defaults: () => ({}) },
    delete:      { name: 'Delete the item (asks first)', gather: true, defaults: () => ({}) },
  };
  // Built-in steps plus the step types defined under Configuration › Extensions.
  const stepOptions = (c, excludeId) => [
    ...Object.entries(STEP_TYPES).map(([v, s]) => ({ v, l: s.name })),
    ...c.extensions.steps.filter(x => x.id !== excludeId).map(x => ({ v: 'x:' + x.id, l: `${x.name || '(unnamed)'} (custom)` })),
  ];
  const isCustomStep = type => String(type).startsWith('x:');
  const PERSON_TARGETS = ['viewer', 'nextOwner', 'lead', 'none'];

  // Conditions filters can test. Op tuples: [key, label, valueKind?]

  const SUBJECTS = {
    state:     { l: () => 'Status type', ops: [['open', 'is open (not closed)'], ['closed', 'is closed'], ['hold', 'is on hold'], ['notHold', 'is not on hold']] },

    due:       { l: c => c.fields.labels.due, ops: [['overdue', 'is overdue'], ['withinDays', 'is due within … days', 'number'], ['before', 'is before', 'date'], ['after', 'is after', 'date'], ['empty', 'is empty'], ['set', 'is set']] },
    created:   { l: () => 'Created', ops: AGE_OPS },
    updated:   { l: () => 'Last updated', ops: AGE_OPS },

    text:      { l: () => 'Title or description', ops: [['contains', 'contains', 'text']] },

    matches:   { l: () => 'Another filter', ops: [['is', 'matches', 'filter'], ['isNot', 'does not match', 'filter']] },
    involves:  { l: () => 'People involved', ops: [['viewer', 'include the viewer'], ['viewerTeam', 'include someone in the viewer’s team']] },
    queue:     { l: () => 'Role queue', ops: [['inMine', 'is in one of the viewer’s queues'], ['inAny', 'is in a queue'], ['none', 'is not in a queue'], ['is', 'is in the queue', 'role'], ['nextSet', 'next owner is a queue'], ['nextNone', 'next owner is not a queue']] },
    offer:     { l: () => 'Handoff offer', ops: [['pending', 'is waiting for acceptance'], ['none', 'has none pending'], ['toViewer', 'is waiting for the viewer to accept'], ['byViewer', 'was offered by the viewer']] },
    approval:  { l: () => 'Verification', ops: [['pending', 'is waiting for verification'], ['none', 'is not waiting for verification'], ['mine', 'is waiting for the viewer to verify'], ['byViewer', 'is the viewer’s, waiting for verification'], ['group', 'is waiting for the group', 'group'], ['passed', 'has passed verification'], ['rejected', 'was sent back by a verifier']] },

  const FIELD_OPS = {
    text: TEXT_OPS, longtext: TEXT_OPS, url: TEXT_OPS, email: TEXT_OPS,
    number: [['equals', 'equals', 'number'], ['gt', 'is greater than', 'number'], ['lt', 'is less than', 'number'], ['empty', 'is empty'], ['set', 'is set']],
    date: [['before', 'is before', 'date'], ['after', 'is after', 'date'], ['withinDays', 'is within the next … days', 'number'], ['empty', 'is empty'], ['set', 'is set']],
    select: [['is', 'is', 'option'], ['isNot', 'is not', 'option'], ['empty', 'is empty'], ['set', 'is set']],

  // ---------- rules engine ----------

      case 'created': return ageTest(it.created);
      case 'updated': return ageTest(it.updated);
      case 'alerts': { const h = S.alerts.some(a => a.toId === S.viewerId && !a.read && a.itemId === it.id); return cd.op === 'hasUnread' ? h : !h; }
      case 'text': { const q = String(v || '').toLowerCase(); return !q || `${it.title} ${it.desc}`.toLowerCase().includes(q); }

  // ---------- normalisation / migration ----------
  function cardFieldOptions(c) {

  // Repairs references inside a config so every id points at something that exists.

  // Version 2 used fixed action kinds, status categories and metric keys; convert them to rules and steps.

  // Version 3 had page links mixed into sidebar views plus a separate Focus list, and instant handoffs.

  function upgradeV3(c) {

  // Version 4 had no sign-in, roles or role queues.

  // Every item carries its own handover records, comments and history.

  // The one rule for the work data, as fixRefs is for the configuration: nothing may point at something that doesn't

  // configuration save, so no path through the app can leave an item, alert, post or file pointing at nothing.
  // People and teams may be former members the app remembers by name; other broken references are cleared, and work
  // that can no longer be finished (a handoff to nobody, a verification by a group that's gone) is withdrawn.

    const queues = ids(c.roles.filter(r => r.queue)), chains = ids(c.approvals.chains), items = ids(s.items);

    const teamRef = v => (v && (teams.has(v) || has(removed.teams, v)) ? v : '');

    const midPrio = (c.priorities[Math.floor((c.priorities.length - 1) / 2)] || {}).id || '';

      it.fields = it.fields || {};

      teamFields.forEach(f => { if (it.fields[f]) it.fields[f] = teamRef(it.fields[f]); });

          s.alerts.forEach(a => { if (a.offerId === o.id) a.read = true; });

  // ---------- default workspace ----------
  // Builds a workspace from default-workspace.js. Dates there are relative ("dueInDays", "minutesAgo"),

  function defaultState(prev, src = defaultWorkspace()) {

    let config = src.config || {};
    if (prev) {
      const keep = normalizeConfig(prev.config);
      ['teams', 'people', 'priorities', 'statuses', 'filters'].forEach(k => (Array.isArray(config[k]) ? config[k] : []).forEach(x => { if (!keep[k].some(y => y.id === x.id)) keep[k].push(clone(x)); }));

      config, items,
      activity: (Array.isArray(src.activity) ? src.activity : []).map(a => timed(a, 'ac')),
      alerts: (Array.isArray(src.alerts) ? src.alerts : []).map(a => timed(a, 'al')),

  // Reads default-workspace.js again, so edits to it are picked up without reloading the page.
  function readDefaultWorkspace() {
    return new Promise(resolve => {
      const el = document.createElement('script');
      const done = () => { el.remove(); resolve(defaultWorkspace()); };
      el.src = `default-workspace.js?t=${Date.now()}`;
      el.onload = done;
      el.onerror = done;
      document.head.appendChild(el);

  // ---------- board filtering ----------
  function customValueText(f, v) {
    if (v === '' || v == null) return '';
    const base = fieldBase(f, cfg());
    const t = fieldTypeDef(f, cfg());
    if (base === 'person') return nameOf(v);
    if (base === 'team') return teamNameOf(v);
    if (base === 'bool') return v === true ? 'Yes' : v === false ? 'No' : '';
    if (Array.isArray(v)) return v.join(', ');
    let s = String(v);
    if (t && base === 'number' && t.decimals !== '' && Number.isFinite(+v)) s = (+v).toFixed(Math.max(0, Math.min(6, +t.decimals)));
    return t ? `${t.prefix}${s}${t.suffix}` : s;
  }
  function haystack(it) {
    const parts = [it.ref, it.title, it.desc, teamNameOf(it.teamId), teamNameOf(it.nextTeamId), nameOf(it.ownerId), nameOf(it.nextOwnerId),
      (priority(it.priorityId) || {}).name, statusName(it.statusId)];
    cfg().fields.custom.forEach(f => parts.push(customValueText(f, (it.fields || {})[f.id])));
    return parts.join(' ').toLowerCase();

  function visibleItems() {
    const f = S.filters;

      if (f.focus && !filterMatches(f.focus, it)) return false;
      if (q && !haystack(it).includes(q)) return false;
      return true;
    }).sort((a, b) => (prioRank(a.priorityId) - prioRank(b.priorityId)) || String(a.due || '9').localeCompare(String(b.due || '9')) || String(a.ref).localeCompare(String(b.ref)));
  }

    if (v.count === 'none') return null;

  function renderGuide() {
    const root = $('#view-guide');
    const sig = JSON.stringify([S.config, sessionId(), dataFile.status, dataFile.name]);
    if (sig !== guideSig || !root.firstChild) {
      guideSig = sig;
      const ch = guideChapters();
      const g = cfg().general;
      root.innerHTML = `

        </div>
        <div class="g-quick">${ch.map(x => `<button class="g-quick-tile" type="button" data-guide-jump="${x.id}" style="--c:${x.color}"><span aria-hidden="true">${x.icon}</span>${esc(x.title)}</button>`).join('')}</div>

          <div class="g-chapters">
            ${ch.map((x, i) => `<section class="g-ch" id="g-${x.id}" style="--c:${x.color}">
              <header class="g-ch-head"><span class="g-ch-ico" aria-hidden="true">${x.icon}</span><div><div class="g-ch-n">Chapter ${i + 1}</div><h2>${esc(x.title)}</h2></div></header>
              <div class="g-ch-body">${x.html}</div>
            </section>`).join('')}
            <p class="g-none" hidden>Nothing in the guide matches your search.</p>
          </div>
        </div>`;
      $('#guideSearch', root).value = guideQuery;
    }
    filterGuide();
  }
  function filterGuide() {
    const root = $('#view-guide');
    const q = guideQuery.trim().toLowerCase();
    let shown = 0;
    $$('.g-ch', root).forEach(sec => {
      const hit = !q || sec.textContent.toLowerCase().includes(q);
      sec.hidden = !hit;
      $(`.g-toc [data-guide-jump="${sec.id.slice(2)}"]`, root).classList.toggle('dim', !hit);
      if (hit) shown++;
      $$('details', sec).forEach(d => { d.open = !!q && d.textContent.toLowerCase().includes(q); });
    });
    $('.g-none', root).hidden = shown > 0;
  }
  const GUIDE_GO = /^(config:[a-z]+|view:[\w-]+|new|demo|app)$/;
  function guideGo(go) {
    if (!GUIDE_GO.test(String(go))) return;
    if (GUIDE_TAB) {
      // Ask the app tab to do it and bring it forward; opened on its own, go to the app and do it there.
      const app = window.opener && !window.opener.closed ? window.opener : null;
      if (app) {
        try { app.postMessage({ taskhubGuide: go }, '*'); app.focus(); } catch (e) { /* ignore */ }
        guideNotice(go === 'app' ? '' : 'Done in the app tab. Switch to it to see the result.');
        return;
      }
      try { if (go !== 'app') sessionStorage.setItem(GUIDE_PENDING_KEY, go); } catch (e) { /* ignore */ }
      location.href = location.href.split('#')[0];
      return;
    }
    if (go === 'app') return;
    const [kind, arg] = go.split(':');
    if (kind === 'config') openConfig(arg);
    else if (kind === 'view') { const v = allViews().find(x => x.id === arg); if (v) applyView(v); else setPage('board'); }
    else if (kind === 'new') { resetForm(); focusForm(); }
    else if (kind === 'demo') openDemoPanel();
  }
  const GUIDE_PENDING_KEY = 'taskhub.guide-go';
  function guideNotice(text) {
    let n = $('#guideNotice');
    if (!text) { if (n) n.remove(); return; }
    if (!n) { n = document.createElement('div'); n.id = 'guideNotice'; n.className = 'g-notice'; n.setAttribute('role', 'status'); document.body.appendChild(n); }
    n.textContent = text;
    clearTimeout(n._t);
    n._t = setTimeout(() => n.remove(), 4000);
  }
  // The sidebar's User Guide opens (or switches to) the guide tab; if pop-ups are blocked it shows here.
  let guideWin = null;
  function openGuideTab() {
    guideWin = window.open(location.href.split('#')[0] + '#guide', 'taskhub-guide');
    if (guideWin) { try { guideWin.focus(); } catch (e) { /* ignore */ } return; }
    setPage('guide');
    $('#content').scrollTop = 0;
    toast('The browser blocked the new tab, so the guide is shown here.');
  }
  // Links clicked in the guide tab arrive here.
  window.addEventListener('message', e => {
    const go = e.data && e.data.taskhubGuide;
    if (typeof go !== 'string' || !GUIDE_GO.test(go)) return;
    let fromGuide = e.source && e.source === guideWin;
    if (!fromGuide) { try { fromGuide = !!e.source && e.source !== window && e.source.opener === window; } catch (err) { fromGuide = false; } }
    if (!fromGuide || !loggedIn()) return;
    window.focus();
    guideGo(go);
  });
  // The guide tab: just the guide, full width, kept up to date with the app tab.
  function startGuideTab() {
    document.body.classList.add('guide-tab');
    const load = () => { S = loadState() || blankState(); S.page = 'guide'; guideSig = ''; };
    load();
    ['board', 'posts', 'files', 'notes', 'overview', 'config'].forEach(p => { $('#view-' + p).hidden = true; });
    $('#view-guide').hidden = false;
    const show = () => { renderGuide(); document.title = `${cfg().general.appName} · User Guide`; };
    show();
    window.addEventListener('storage', e => { if (e.key === STORE_KEY || e.key === null) { load(); show(); } });
  }
