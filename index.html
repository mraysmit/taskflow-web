    modal({ title: `${it.ref} · ${it.title}`, html: itemDetailsHTML(it), ok: 'Close', okClass: 'btn', wide: true, noCancel: true, onOpen: wire, onOk: () => {} });
  }
  // Accept/Decline straight from the Action Inbox run the same configured buttons as on the card.
  const offerAction = (it, stepType) => cfg().actions.find(a => actionVisible(a, it) && a.steps.some(s => s.type === stepType));

  // Shows an item on the board, clearing the filters only if they hide it.
  function showItem(id) {
    if (!getItem(id)) { toast('That item no longer exists.'); return; }
    setPage('board', () => { if (!visibleItems().some(i => i.id === id)) resetFilters(); });
    flashCard(id);
  }
  function gotoItem(id) {
    if (!getItem(id)) { toast('That item no longer exists.'); return; }
    setPage('board', resetFilters);
    flashCard(id);
  }

  // ---------- form ----------
  const F = id => $('#f_' + id);

  function renderFormOptions(want = {}) {
    const fill = (sel, list, wanted, fallback) => {
      const cur = wanted || sel.value || fallback;
      sel.innerHTML = list.map(x => opt(x.v, x.l, x.v === cur)).join('') + (cur && !list.some(x => x.v === cur) ? opt(cur, '(removed)', true) : '');
    };
    fill(F('priority'), cfg().priorities.map(p => ({ v: p.id, l: p.name })), want.priorityId, defaultPriorityId());
    fill(F('status'), cfg().statuses.map(s => ({ v: s.id, l: s.name })), want.statusId, cfg().general.initialStatusId);
    // Verification route: by rule (the first route whose filter matches), a chosen route, or none if allowed.
    const a = ap();
    $('#f_approvalWrap').hidden = !a.enabled || !a.chains.length;
    const routes = [{ v: '', l: 'Automatic (by rule)' }, ...a.chains.filter(usableChain).map(c => ({ v: c.id, l: `${c.name}: ${c.stages.map(s => groupName(s.roleId)).join(c.order === 'parallel' ? ' + ' : ' → ')}` })), ...(a.allowNone ? [{ v: 'none', l: 'No verification' }] : [])];
    fill(F('approval'), routes, want.approvalChainId === undefined ? '' : want.approvalChainId, '');
    if (want.approvalChainId !== undefined) F('approval').value = routes.some(r => r.v === want.approvalChainId) ? want.approvalChainId : '';
  }

  const cfDomId = f => 'cf_' + f.id;
  function customFieldHTML(f, v) {
    const id = cfDomId(f);
    const ph = esc(f.help || '');
    const lbl = `${esc(f.label)}${f.required ? ' *' : ''}`;
    f = Object.assign({}, f, { options: fieldOptions(f, cfg()) });
    switch (fieldBase(f, cfg())) {
      case 'longtext': return `<label class="full"><span>${lbl}</span><textarea class="textarea" id="${id}" placeholder="${ph}">${esc(v || '')}</textarea></label>`;
      case 'multiselect': {
        const vals = Array.isArray(v) ? v : [];
        return `<div class="full cf-item"><span>${lbl}</span><div class="chips" id="${id}" data-multi="1">${f.options.map(o => `<label class="chip"><input type="checkbox" value="${esc(o)}"${vals.includes(o) ? ' checked' : ''}> ${esc(o)}</label>`).join('') || '<span class="muted">No options configured.</span>'}</div></div>`;
      }
      case 'select': return `<label><span>${lbl}</span><select class="select" id="${id}">${opt('', '—', v === '' || v == null)}${f.options.map(o => opt(o, o, o === v)).join('')}${v && !f.options.includes(v) ? opt(v, v, true) : ''}</select></label>`;
      case 'bool': return `<label><span>${lbl}</span><select class="select" id="${id}">${opt('', '—', v !== true && v !== false)}${opt('yes', 'Yes', v === true)}${opt('no', 'No', v === false)}</select></label>`;
      case 'date': return `<label><span>${lbl}</span><input class="input" type="date" id="${id}" value="${esc(v || '')}"></label>`;
      case 'number': return `<label><span>${lbl}</span><input class="input" type="number" id="${id}" value="${esc(v ?? '')}" placeholder="${ph}"${f.min !== '' ? ` min="${esc(f.min)}"` : ''}${f.max !== '' ? ` max="${esc(f.max)}"` : ''}></label>`;
      case 'person': return `<label><span>${lbl}</span><input class="input" id="${id}" list="dlPeople" value="${esc(v ? nameOf(v) : '')}" placeholder="${ph}"></label>`;
      case 'team': return `<label><span>${lbl}</span><input class="input" id="${id}" list="dlTeams" value="${esc(v ? teamNameOf(v) : '')}" placeholder="${ph}"></label>`;
      case 'url': return `<label><span>${lbl}</span><input class="input" type="url" id="${id}" value="${esc(v || '')}" placeholder="${ph || 'https://'}"></label>`;
      case 'email': return `<label><span>${lbl}</span><input class="input" type="email" id="${id}" value="${esc(v || '')}" placeholder="${ph}"></label>`;
    }
    return `<label><span>${lbl}</span><input class="input" id="${id}" value="${esc(v ?? '')}" placeholder="${ph}"></label>`;
  }
  function readCustomRaw() {
    const out = {};
    cfg().fields.custom.forEach(f => {
      const el = document.getElementById(cfDomId(f));
      if (!el) return;
      out[f.id] = el.dataset.multi ? $$('input:checked', el).map(i => i.value) : el.value;
    });
    return out;
  }
  // Rebuilds custom inputs only when their definitions change, so typing isn't interrupted.
  function renderCustomFields(values, force) {
    const sig = JSON.stringify(cfg().fields.custom);
    if (!force && sig === lastCustomSig) return;
    let vals = values;
    if (!vals) {
      const raw = readCustomRaw();
      vals = {};
      cfg().fields.custom.forEach(f => { if (has(raw, f.id)) vals[f.id] = parseCustom(f, raw[f.id]).value; });
    }
    lastCustomSig = sig;
    $('#customFields').innerHTML = cfg().fields.custom.map(f => customFieldHTML(f, vals[f.id])).join('');
  }
  // Parses a raw form/step value using the field's basic type, then any custom field type rules.
  function parseCustom(f, raw) {
    const c = cfg();
    const base = fieldBase(f, c);
    const t = fieldTypeDef(f, c);
    const opts = fieldOptions(f, c);
    const r = parseBase(f, base, opts, t, raw);
    if (r.error || !t || isEmptyValue(r.value)) return r;
    if (t.pattern && typeof r.value === 'string') {
      let re;
      try { re = new RegExp(t.pattern); } catch (e) { re = null; }
      if (re && !re.test(r.value)) return { error: t.patternMsg || `${f.label} doesn’t match the expected format.` };
    }
    if (base === 'number' && t.decimals !== '' && Number.isFinite(+t.decimals)) r.value = +(+r.value).toFixed(Math.max(0, Math.min(6, +t.decimals)));
    if (t.script && c.extensions.scriptsEnabled) {
      try {
        const res = compileScript(t.script, ['value', 'field', 'api'], true)(r.value, { label: f.label, type: t.name }, scriptApi);
        if (res === false) return { error: t.patternMsg || `${f.label} is not valid.` };
        if (typeof res === 'string' && res) return { error: res };
      } catch (e) { return { error: `${f.label}: validation script failed (${e.message}).` }; }
    }
    return r;
  }
  function parseBase(f, base, opts, t, raw) {
    if (base === 'multiselect') {
      const a = Array.isArray(raw) ? raw : String(raw ?? '').split(',').map(x => x.trim()).filter(Boolean);
      return { value: a.filter(x => opts.includes(x)) };
    }
    const v = String(raw ?? '').trim();
    if (v === '') return { value: '' };
    const min = f.min !== '' ? f.min : (t ? t.min : '');
    const max = f.max !== '' ? f.max : (t ? t.max : '');
    switch (base) {
      case 'number': {
        if (!Number.isFinite(+v)) return { error: `${f.label} must be a number.` };
        if (min !== '' && Number.isFinite(+min) && +v < +min) return { error: `${f.label} must be at least ${min}.` };
        if (max !== '' && Number.isFinite(+max) && +v > +max) return { error: `${f.label} must be at most ${max}.` };
        return { value: +v };
      }
      case 'bool': return { value: v === 'yes' || v === 'true' };
      case 'url': return /^https?:\/\/\S+$/i.test(v) ? { value: v } : { error: `${f.label} must be a web address starting with http:// or https://.` };
      case 'email': return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) ? { value: v } : { error: `${f.label} must be an email address.` };
      case 'select': return opts.includes(v) ? { value: v } : { error: `${f.label}: “${v}” is not one of the options.` };
      case 'person': { const p = person(v) || findByName(cfg().people, v); return p ? { value: p.id } : { error: `${f.label}: “${v}” is not in People.` }; }
      case 'team': { const tm = team(v) || findByName(cfg().teams, v); return tm ? { value: tm.id } : { error: `${f.label}: “${v}” is not in Teams.` }; }
    }
    return { value: v };
  }
  const isEmptyValue = v => v === '' || v == null || (Array.isArray(v) && !v.length);

  function renderFormMeta() {
    BUILTIN_FIELDS.forEach(k => { $('#lbl_' + k).textContent = label(k); });
    renderFormOptions();
    renderCustomFields();
  }

  function resetForm() {
    editingId = null;
    ['title', 'ref', 'nextTeam', 'nextOwner', 'due', 'desc'].forEach(k => { F(k).value = ''; });
    F('ref').placeholder = nextRef();
    renderFormOptions({ priorityId: defaultPriorityId(), statusId: cfg().general.initialStatusId, approvalChainId: '' });
    F('team').value = teamNameOf(viewerTeamId());
    F('owner').value = viewerName();
    renderCustomFields({}, true);
    $('#formError').textContent = '';
    $('#formSave').textContent = 'Save handoff';
    $('#formMode').textContent = 'New';
  }
  function fillForm(it) {
    editingId = it.id;
    F('title').value = it.title;
    F('ref').value = it.ref;
    renderFormOptions({ priorityId: it.priorityId, statusId: it.statusId, approvalChainId: it.approvalChainId || '' });
    F('team').value = teamNameOf(it.teamId);
    F('owner').value = ownerLabel(it);
    F('nextTeam').value = teamNameOf(it.nextTeamId);
    F('nextOwner').value = nextLabel(it);
    F('due').value = it.due || '';
    F('desc').value = it.desc || '';
    renderCustomFields(it.fields || {}, true);
    $('#formError').textContent = '';
    $('#formSave').textContent = 'Update handoff';
    $('#formMode').textContent = `Editing ${it.ref}`;
  }
  // ---------- panel accordion ----------
  // Which sections are closed is a per-browser convenience, kept apart from workspace data.
  const PANEL_KEY = 'taskhub.panel';
  let panelClosed = {};
  try { panelClosed = JSON.parse(localStorage.getItem(PANEL_KEY) || '{}') || {}; } catch (e) { panelClosed = {}; }
  function applyPanelState() {
    $$('.pcard[data-acc]').forEach(c => {
      const closed = !!panelClosed[c.dataset.acc];
      c.classList.toggle('collapsed', closed);
      $('.pcard-head', c).setAttribute('aria-expanded', String(!closed));
    });
  }
  function setPanelOpen(key, open) {
    panelClosed[key] = !open;
    // The demo opens and closes sections as it goes; only the person's own choices are remembered.
    if (!demo.running) try { localStorage.setItem(PANEL_KEY, JSON.stringify(panelClosed)); } catch (e) { /* storage unavailable */ }
    applyPanelState();
  }
  $('.panel').addEventListener('click', e => {
    const head = e.target.closest('.pcard[data-acc] > .pcard-head');
    if (!head || e.target.closest('button, a, input, select, textarea')) return;
    const key = head.parentElement.dataset.acc;
    setPanelOpen(key, !!panelClosed[key]);
  });
  $('.panel').addEventListener('keydown', e => {
    const head = e.target.closest('.pcard[data-acc] > .pcard-head');
    if (!head || e.target !== head || (e.key !== 'Enter' && e.key !== ' ')) return;
    e.preventDefault();
    const key = head.parentElement.dataset.acc;
    setPanelOpen(key, !!panelClosed[key]);
  });
  applyPanelState();

  function focusForm() {
    const card = $('#formCard');
    setPanelOpen('form', true);
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    $('#form').scrollTop = 0;
    card.classList.remove('flash'); void card.offsetWidth; card.classList.add('flash');
    setTimeout(() => F('title').focus({ preventScroll: true }), 250);
  }

  F('owner').addEventListener('change', () => { const p = findByName(cfg().people, F('owner').value); if (p && p.teamId) F('team').value = teamNameOf(p.teamId); });
  F('nextOwner').addEventListener('change', () => { const p = findByName(cfg().people, F('nextOwner').value); if (p && p.teamId) F('nextTeam').value = teamNameOf(p.teamId); });
  F('priority').addEventListener('change', () => {
    const p = priority(F('priority').value);
    if (!editingId && !F('due').value && p && p.dueDays > 0) F('due').value = addDays(todayISO(), p.dueDays);
  });
  $('#formCancel').addEventListener('click', () => resetForm());

  // "Queue: Controls reviewers" → that role; null when the text isn't a queue; false when no such queue.
  const queueFor = name => {
    const m = /^queue:\s*(.+)$/i.exec(String(name || '').trim());
    if (!m) return null;
    return cfg().roles.find(r => r.queue && r.name.toLowerCase() === m[1].trim().toLowerCase()) || false;
  };
  function genUsername(name) {
    const base = String(name || 'user').toLowerCase().replace(/[^a-z0-9]/g, '') || 'user';
    let u = base;
    for (let n = 2; cfg().people.some(p => p.username === u) || (cfgDraft && cfgDraft.people.some(p => p.username === u)); n++) u = base + n;
    return u;
  }

  $('#form').addEventListener('submit', e => {
    e.preventDefault();
    if (!guardWrite()) return;
    const err = (msg, el) => { $('#formError').textContent = msg; if (el) el.focus(); };
    const title = F('title').value.trim();
    const ownerName = F('owner').value.trim();
    const nextOwnerName = F('nextOwner').value.trim();
    if (!title) return err(`${label('title')} is required.`, F('title'));
    if (!ownerName) return err(`${label('owner')} is required. Enter a person or a role queue.`, F('owner'));
    if (nextOwnerName && nextOwnerName.toLowerCase() === ownerName.toLowerCase()) return err(`${label('nextOwner')} must be different from ${label('owner').toLowerCase()}.`, F('nextOwner'));
    const ownerQueue = queueFor(ownerName);
    const nextQueue = queueFor(nextOwnerName);
    if (ownerQueue === false) return err(`There is no role queue called “${ownerName.replace(/^queue:\s*/i, '')}”.`, F('owner'));
    if (nextQueue === false) return err(`There is no role queue called “${nextOwnerName.replace(/^queue:\s*/i, '')}”.`, F('nextOwner'));
    for (const n of [ownerName, nextOwnerName]) {
      const p = findByName(cfg().people, n);
      if (p && !p.active) return err(`${p.name} is inactive. Reactivate them in Configuration › People.`);
    }
    const ref = F('ref').value.trim() || nextRef();
    if (S.items.some(i => i.ref.toLowerCase() === ref.toLowerCase() && i.id !== editingId)) return err(`Reference ${ref} is already in use.`, F('ref'));
    const custom = {};
    const raw = readCustomRaw();
    for (const f of cfg().fields.custom) {
      const r = parseCustom(f, raw[f.id]);
      const el = document.getElementById(cfDomId(f));
      if (r.error) return err(r.error, el);
      if (f.required && isEmptyValue(r.value)) return err(`${f.label} is required.`, el && el.dataset.multi ? null : el);
      custom[f.id] = r.value;
    }

    // Names typed that aren't configured yet are added to the configuration (and any open draft).
    const added = [];
    const teamFor = name => {
      if (!name) return '';
      let t = findByName(cfg().teams, name);
      if (!t) {
        t = { id: uid('t'), name, color: '#343a8a', bg: '#e4e4f7', leadId: '', nextTeamId: '' };
        cfg().teams.push(t);
        if (cfgDraft) cfgDraft.teams.push(clone(t));
        added.push(`team “${name}”`);
      }
      return t.id;
    };
    const personFor = (name, teamId) => {
      if (!name) return '';
      let p = findByName(cfg().people, name);
      if (!p) {
        // New people get a username and the basic role; they can sign in once an admin sets a password.
        p = { id: uid('p'), name, teamId, role: '', email: '', active: true, username: genUsername(name), roleIds: ['r_member'].filter(r => role(r)), salt: '', passwordHash: '' };
        cfg().people.push(p);
        if (cfgDraft) cfgDraft.people.push(clone(p));
        added.push(`“${name}”`);
      }
      return p.id;
    };
    let teamId = teamFor(F('team').value.trim());
    const ownerId = ownerQueue ? '' : personFor(ownerName, teamId);
    let nextTeamId = teamFor(F('nextTeam').value.trim());
    const nextOwnerId = nextQueue ? '' : personFor(nextOwnerName, nextTeamId);
    if (!teamId) teamId = personTeam(ownerId);
    if (nextOwnerId && !nextTeamId) nextTeamId = personTeam(nextOwnerId);
    const d = {
      title, ref, priorityId: F('priority').value, teamId, ownerId, nextTeamId, nextOwnerId, due: F('due').value, desc: F('desc').value.trim(),
      queueId: ownerQueue ? ownerQueue.id : '', nextQueueId: nextQueue ? nextQueue.id : '',
      approvalChainId: F('approval').value || '',
    };
    const queueAlert = it => `${it.ref} "${it.title}" was placed in the ${queueName(it.queueId)} queue by ${viewerName()}. Pick it up to take ownership.`;
    const newStatus = F('status').value;

    let id;
    if (editingId && getItem(editingId)) {
      const it = getItem(editingId);
      const before = clone(it);
      Object.assign(it, d, { fields: Object.assign({}, it.fields, custom), updated: Date.now() });
      const moved = moveStatus(it, newStatus, it.blockReason);
      const gparts = [];
      const gtype = gateParts(gparts, {});
      id = it.id;
      log(`${it.ref} updated by ${viewerName()}.`, 'EDIT', it);
      if (moved) log(`${it.ref} moved to ${statusName(it.statusId)} by ${viewerName()}.`, 'STATUS', it);
      if (gparts.length) { log(`${it.ref} ${gparts.join('; ')} by ${viewerName()}.`, gtype, it); toast(`${it.ref} ${gparts.join('; ')}.`, undefined, { itemId: it.id }); }
      if (it.ownerId !== before.ownerId) notifyKind('assigned', it.ownerId, it);
      if (it.queueId && it.queueId !== before.queueId) notifyQueue(it.queueId, it, queueAlert(it));
      if (it.nextOwnerId && it.nextOwnerId !== before.nextOwnerId) notifyKind('next', it.nextOwnerId, it);
      toast(`${it.ref} updated.`, undefined, { itemId: it.id });
    } else {
      const now = Date.now();
      const it = itemDefaults(Object.assign({ id: uid('i'), created: now, updated: now, statusId: cfg().general.initialStatusId, prevStatusId: '', blockReason: '', createdBy: S.viewerId }, d, { fields: custom }));
      S.items.push(it);
      moveStatus(it, newStatus);
      const gparts = [];
      const gtype = gateParts(gparts, {});
      id = it.id;
      log(`${it.ref} created by ${viewerName()}.`, 'CREATE', it);
      if (gparts.length) log(`${it.ref} ${gparts.join('; ')} by ${viewerName()}.`, gtype, it);
      notifyKind('assigned', it.ownerId, it);
      if (it.queueId) notifyQueue(it.queueId, it, queueAlert(it));
      if (it.nextOwnerId) notifyKind('next', it.nextOwnerId, it);
      toast(`${it.ref} created.`, undefined, { itemId: it.id });
    }
    if (added.length) toast(`Added ${added.join(', ')} to Configuration.`);
    resetForm();
    if (S.page !== 'config') S.page = 'board';
    commit();
    if (S.page === 'board') {
      if (!visibleItems().some(i => i.id === id)) toast('Saved item is hidden by the current filters.');
      flashCard(id);
    }
  });

  // =====================================================================
  // ---------- Configuration screen ----------
  // =====================================================================
  const CFG_NAV = [
    { id: 'general', label: 'General' },
    { id: 'teams', label: 'Teams & routing', count: d => d.teams.length },
    { id: 'people', label: 'People', count: d => d.people.length },
    { id: 'roles', label: 'Roles', count: d => d.roles.length },

  ];
  const USAGE = {
    teams: id => S.items.filter(i => i.teamId === id || i.nextTeamId === id).length,

  const getPath = (o, path) => path.split('.').reduce((a, k) => (a == null ? a : a[k]), o);

  // Markup helpers. Every control carries a data-bind path into the draft.

    { id: 'midnight', name: 'Midnight', popBg: '#1d2340', popText: '#eef0ff', popAccent: '#ff6b8a', msgAccent: '#4cd39a' },
    { id: 'sunshine', name: 'Sunshine', popBg: '#fff6d6', popText: '#3d2c00', popAccent: '#d9480f', msgAccent: '#5a8f00' },
    { id: 'mint',     name: 'Mint',     popBg: '#e3f6ea', popText: '#0f3d22', popAccent: '#c2185b', msgAccent: '#0b7dda' },

  const noteSampleVars = n => NOTE_VARS
    .map(([v, k]) => `${v}:${esc(n[k] || BASE_CONFIG.notifications[k])}`).join(';');
  // WCAG contrast ratio between two hex colours.
  function contrast(a, b) {
    const lum = hex => {
      const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
      if (!m) return 1;
      const n = parseInt(m[1], 16);
      const [r, g, bl] = [16, 8, 0].map(s => { const c = ((n >> s) & 255) / 255; return c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; });
      return 0.2126 * r + 0.7152 * g + 0.0722 * bl;
    };
    const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p);
    return (x + 0.05) / (y + 0.05);
  }
  function noteContrastHTML(n) {
    return contrast(n.popText, n.popBg) < 4.5
      ? '<span class="match-pill bad">Hard to read</span> The text may be hard to read on this background. Choose colours that differ more in lightness.'
      : '<span class="match-pill">Easy to read</span> The text and background have enough contrast.';
  }
  const swatch = (path, val, aria) => `<input type="color" class="swatch" ${bind(path)} value="${esc(val)}" aria-label="${esc(aria)}" title="${esc(aria)}">`;
  const cell = (lbl, html, cls = 'grow') => `<div class="cell ${cls}"><span class="mini-label">${esc(lbl)}</span>${html}</div>`;
  const chkCell = (html, cls = 'w-auto') => `<div class="cell ${cls}"><span class="mini-label">&nbsp;</span><div class="inline">${html}</div></div>`;
  const toggleChips = (path, values, options, o = {}) => `<div class="chips">${o.any ? `<label class="chip"><input type="checkbox" data-toggle="${esc(path)}" value="*"${values.includes('*') ? ' checked' : ''}> ${esc(o.any)}</label>` : ''}${options.map(x => `<label class="chip"><input type="checkbox" data-toggle="${esc(path)}" value="${esc(x.v)}"${values.includes(x.v) || values.includes('*') ? ' checked' : ''}${values.includes('*') ? ' disabled' : ''}> ${esc(x.l)}</label>`).join('')}</div>`;
  const usesTag = (list, id) => {

  // Previews render with the draft swapped in, so they show exactly what saving would produce.
  function withConfig(c, fn) { const saved = S.config; S.config = c; try { return fn(); } finally { S.config = saved; } }
  const previewItem = d => S.items[0] || { id: 'preview', ref: nextRef(d), title: 'Preview item', priorityId: (d.priorities[0] || {}).id, statusId: (d.statuses[0] || {}).id, teamId: (d.teams[0] || {}).id, ownerId: (d.people[0] || {}).id, nextTeamId: '', nextOwnerId: '', due: todayISO(), desc: 'Description text appears here.', fields: {}, created: Date.now(), updated: Date.now() };

  // Where an extension block is referenced; used for the "Used by" line and to guard deletion.
  function extUses(d, list, id) {
    const out = [];
    const condRefs = pred => d.filters.forEach(f => { if (f.conds.some(pred)) out.push(`filter “${f.name}”`); });
    if (list === 'extensions.flags') condRefs(cd => cd.subject === 'flag' && cd.value === id);
    if (list === 'extensions.conditions') condRefs(cd => cd.subject === 'x:' + id);
    if (list === 'extensions.fieldTypes') d.fields.custom.forEach(f => { if (f.type === 'x:' + id) out.push(`field “${f.label}”`); });
    if (list === 'extensions.steps') {
      d.actions.forEach(a => { if (a.steps.some(s => s.type === 'x:' + id)) out.push(`button “${a.label}”`); });
      d.extensions.steps.forEach(x => { if (x.id !== id && x.steps.some(s => s.type === 'x:' + id)) out.push(`step type “${x.name}”`); });
    }
    return out;
  }

  // Where a filter is referenced; used for the "Used by" line and to guard deletion.
  function filterUses(d, fid) {
    const uses = [];
    d.filters.forEach(f => { if (f.id !== fid && f.conds.some(cd => cd.subject === 'matches' && cd.value === fid)) uses.push({ kind: 'filter', text: `filter “${f.name}”` }); });
    d.stats.forEach(s => { if (s.filterId === fid) uses.push({ kind: 'stat', text: `stat card “${s.label}”` }); });
    d.views.forEach(v => { if (v.filterId === fid || v.count === fid) uses.push({ kind: 'view', text: `board view “${v.label}”` }); });
    d.actions.forEach(a => {
      if (a.show.filterId === fid) uses.push({ kind: 'action', text: `button “${a.label}” (shown when)` });
      if (a.steps.some(s => s.when && s.when.split(':')[1] === fid)) uses.push({ kind: 'action', text: `button “${a.label}” (step condition)` });
    });
    d.approvals.chains.forEach(ch => { if (ch.filterId === fid) uses.push({ kind: 'route', text: `verification route “${ch.name}”` }); });
    return uses;
  }

  function routeHTML(d) {
    const targets = new Set(d.teams.map(t => t.nextTeamId).filter(Boolean));
    const seen = new Set();
    const walk = start => {
      const chain = [];
      const local = new Set();
      let cur = start;
      while (cur && !local.has(cur.id)) { chain.push(cur); local.add(cur.id); seen.add(cur.id); cur = d.teams.find(x => x.id === cur.nextTeamId); }
      return { chain, loop: !!cur };
    };
    const chains = d.teams.filter(t => !targets.has(t.id)).map(walk);
    d.teams.forEach(t => { if (!seen.has(t.id)) chains.push(walk(t)); });
    if (!chains.length) return '<div class="muted">No teams yet.</div>';
    return chains.map(({ chain, loop }) => `<div class="route-line">${chain.map(t => tagHTML(t.name || '(unnamed)', teamStyle(t))).join('<span class="arrow">→</span>')}${loop ? '<span class="arrow">↺ loops back</span>' : '<span class="arrow">→</span><span class="route-end">Done</span>'}</div>`).join('');
  }

  function condRowHTML(d, i, j, cd, n) {

      default:

  function renderConfig() {
    if (!cfgDraft) cfgDraft = clone(S.config);
    fixRefs(cfgDraft);
    const d = cfgDraft;
    const dirty = cfgDirty();
    const errSections = new Set(cfgErrors.map(e => e.section));
    const focusKey = focusKeyOf(document.activeElement);
    $('#view-config').innerHTML = `<div class="cfg-page">
        <nav class="cfg-nav" aria-label="Configuration sections">
          <div class="cfg-nav-title">Configuration</div>
          ${CFG_NAV.map(n => `<button type="button" data-cfg-nav="${n.id}" class="${n.id === cfgSection ? 'active' : ''}${errSections.has(n.id) ? ' err' : ''}"><span>${n.label}</span>${n.count ? `<span class="n">${n.count(d)}</span>` : ''}</button>`).join('')}
        </nav>
        <div class="cfg-main">
          <div class="cfg-bar${dirty ? '' : ' clean'}" id="cfgBar">
            <div class="cfg-bar-text" id="cfgBarText">${dirty ? '<b>Unsaved changes.</b> They apply to the whole workspace when you save.' : 'All changes saved.'}</div>
            <button class="btn" type="button" data-cfg-cmd="discard"${dirty ? '' : ' disabled'}>Discard</button>
            <button class="btn btn-red" type="button" data-cfg-cmd="save"${dirty ? '' : ' disabled'}>Save configuration</button>
          </div>
          ${cfgErrors.length ? `<div class="cfg-errors"><b>Please fix these before saving:</b><ul>${cfgErrors.map(e => `<li><button type="button" data-cfg-nav="${e.section}">${esc(CFG_NAV.find(n => n.id === e.section).label)}</button>: ${esc(e.msg)}</li>`).join('')}</ul></div>` : ''}
          ${SECTIONS[cfgSection](d)}
        </div>
      </div>`;
    if (focusKey) { const el = findByFocusKey(focusKey); if (el) el.focus({ preventScroll: true }); }
  }
  function updateCfgBar() {
    const dirty = cfgDirty();
    const bar = $('#cfgBar');
    if (!bar) return;
    bar.classList.toggle('clean', !dirty);
    $('#cfgBarText').innerHTML = dirty ? '<b>Unsaved changes.</b> They apply to the whole workspace when you save.' : 'All changes saved.';
    $$('[data-cfg-cmd="discard"], [data-cfg-cmd="save"]', bar).forEach(b => { b.disabled = !dirty; });
  }
  const focusKeyOf = el => {
    if (!el || !el.closest || !el.closest('#view-config')) return '';
    if (el.dataset.bind) return 'b:' + el.dataset.bind;
    if (el.dataset.toggle) return `t:${el.dataset.toggle}:${el.value}`;
    if (el.dataset.op) return `o:${el.dataset.op}:${el.dataset.list}:${el.dataset.i || ''}`;
    if (el.dataset.cfgNav) return 'n:' + el.dataset.cfgNav;
    return '';
  };
  const findByFocusKey = key => {
    const [t, ...rest] = key.split(':');
    const v = rest.join(':');
    if (t === 'b') return $(`#view-config [data-bind="${CSS.escape(v)}"]`);
    if (t === 'n') return $(`#view-config [data-cfg-nav="${CSS.escape(v)}"]`);
    if (t === 't') { const i = v.lastIndexOf(':'); return $(`#view-config [data-toggle="${CSS.escape(v.slice(0, i))}"][value="${CSS.escape(v.slice(i + 1))}"]`); }
    if (t === 'o') { const [op, list, i] = v.split(':'); return $(`#view-config [data-op="${op}"][data-list="${CSS.escape(list)}"]${i ? `[data-i="${i}"]` : ''}`); }
    return null;
  };
  const deferRender = () => setTimeout(() => { if (S.page === 'config') renderConfig(); }, 0);

  function readControl(el) {
    if (el.type === 'checkbox') return el.checked;
    if (el.dataset.num) return el.value === '' ? 0 : Number(el.value);
    if (el.dataset.csv) return el.value.split(/[,\n]/).map(s => s.trim()).filter(Boolean);
    return el.value;

  // Side effects of editing particular paths (derived colours, resetting dependent values).
  function afterSet(path, value) {
    let m;
    if ((m = /^teams\.(\d+)\.color$/.exec(path))) cfgDraft.teams[+m[1]].bg = tint(value, 0.86);
    if ((m = /^priorities\.(\d+)\.fg$/.exec(path))) cfgDraft.priorities[+m[1]].bg = tint(value);
    if ((m = /^statuses\.(\d+)\.closed$/.exec(path)) && value) cfgDraft.statuses[+m[1]].hold = false;
    if ((m = /^filters\.(\d+)\.conds\.(\d+)\.(subject|op)$/.exec(path))) {
      const cd = cfgDraft.filters[+m[1]].conds[+m[2]];
      const def = subjectDef(cd.subject, cfgDraft);
      if (!def) return;
      if (m[3] === 'subject') cd.op = def.ops[0][0];
      cd.value = kindDefault(opKind(def, cd.op));
      if (def.custom) cd.params = paramDefaults(def.custom); else delete cd.params;
    }
    if ((m = /^(.+\.steps)\.(\d+)\.type$/.exec(path))) {
      const steps = getPath(cfgDraft, m[1]);
      const old = steps[+m[2]];
      if (isCustomStep(value)) {
        const x = cfgDraft.extensions.steps.find(y => 'x:' + y.id === value);
        steps[+m[2]] = { type: value, when: old.when || '', params: x ? paramDefaults(x) : {} };
      } else {
        steps[+m[2]] = Object.assign({ type: value, when: old.when || '' }, STEP_TYPES[value].defaults(), stepContextDefaults(value));
      }
    }
  }
  function stepContextDefaults(type) {
    const d = cfgDraft;
    if (type === 'setStatus') return { to: (d.statuses.find(s => !s.closed) || d.statuses[0] || {}).id || '' };
    if (type === 'setPriority') return { to: (d.priorities[0] || {}).id || '' };
    if (type === 'setField') return { fieldId: (d.fields.custom[0] || {}).id || '' };
    return {};
  }

    people: () => ({ id: uid('p'), name: '', teamId: (cfgDraft.teams[0] || {}).id || '', role: '', email: '', active: true, username: '', roleIds: cfgDraft.roles.some(r => r.id === 'r_member') ? ['r_member'] : [], salt: '', passwordHash: '' }),
    roles: () => ({ id: uid('r'), name: '', description: '', sees: 'own', viewAs: 'none', actAs: false, configure: false, queue: false }),
    priorities: () => ({ id: uid('pr'), name: '', fg: '#4a4f57', bg: tint('#4a4f57'), dueDays: 3 }),
    statuses: () => ({ id: uid('s'), name: '', color: '#6b7280', closed: false, hold: false }),
    filters: () => ({ id: uid('f'), name: '', match: 'all', count: 'items', conds: [{ subject: 'state', op: 'open', value: '' }] }),
    'filters.*.conds': () => ({ subject: 'state', op: 'open', value: '' }),
    actions: () => ({ id: uid('a'), label: '', color: '#2e3394', outline: false, width: 'md', show: { statuses: ['*'], filterId: '' }, steps: [Object.assign({ type: 'setStatus', when: '' }, stepContextDefaults('setStatus'))] }),
    'actions.*.steps': () => Object.assign({ type: 'notify', when: '' }, STEP_TYPES.notify.defaults()),
    'fields.custom': () => ({ id: uid('cf'), label: '', type: 'text', options: [], required: false, help: '', min: '', max: '' }),
    'card.fields': () => { const used = new Set(cfgDraft.card.fields); return (cardFieldOptions(cfgDraft).find(o => !used.has(o.v)) || cardFieldOptions(cfgDraft)[0]).v; },
    stats: () => ({ id: uid('st'), filterId: (cfgDraft.filters.find(f => f.id === 'f_dueSoon') || cfgDraft.filters[0] || {}).id || '', label: 'Due soon', sub: '', visible: true }),
    views: () => ({ id: uid('v'), label: '', filterId: '', count: 'match', sidebar: true }),
    'approvals.chains': () => ({ id: uid('ap'), name: '', filterId: '', order: 'sequence', stages: [{ roleId: (cfgDraft.roles.find(r => r.queue) || cfgDraft.roles[0] || {}).id || '' }] }),
    'approvals.chains.*.stages': () => ({ roleId: '' }),
    'extensions.flags': () => ({ id: uid('fl'), name: '', help: '' }),
    'extensions.fieldTypes': () => ({ id: uid('ft'), name: '', base: 'text', pattern: '', patternMsg: '', min: '', max: '', decimals: '', prefix: '', suffix: '', options: [], script: '' }),
    'extensions.conditions': () => ({ id: uid('xc'), name: '', params: [], script: '!item.closed' }),
    'extensions.conditions.*.params': () => ({ key: '', label: '', type: 'text' }),
    'extensions.steps': () => ({ id: uid('xs'), name: '', mode: 'macro', params: [], script: '', steps: [] }),
    'extensions.steps.*.params': () => ({ key: '', label: '', type: 'text' }),
    'extensions.steps.*.steps': () => Object.assign({ type: 'notify', when: '' }, STEP_TYPES.notify.defaults()),
  };

  function cfgOp(op, list, i) {
    const arr = getPath(cfgDraft, list);
    if (op === 'up' || op === 'down') {
      const j = op === 'up' ? i - 1 : i + 1;
      if (j < 0 || j >= arr.length) return;
      [arr[i], arr[j]] = [arr[j], arr[i]];
      renderConfig();
      const btn = $(`#view-config [data-op="${op}"][data-list="${CSS.escape(list)}"][data-i="${j}"]`);
      if (btn && !btn.disabled) btn.focus();
      return;
    }
    if (op === 'add') {
      const make = NEW_ROW[rowKey(list)];
      if (!make) return;
      arr.push(make());
      renderConfig();
      const rows = $$(`#view-config [data-op="up"][data-list="${CSS.escape(list)}"]`);
      const last = rows.length ? rows[rows.length - 1].closest('.crow') : null;
      const first = last && last.querySelector('input.input, select');
      if (first) { first.focus(); first.scrollIntoView({ block: 'center' }); }
      return;
    }
    if (op === 'del') deleteCfgRow(list, i);
  }

  // Rewrites references inside the draft when an entity is removed or replaced.
  function remapDraftRefs(d, list, from, to) {
    const m = v => (v === from ? to : v);
    if (list === 'people') {
      d.teams.forEach(t => { t.leadId = m(t.leadId); });
      d.actions.forEach(a => a.steps.forEach(s => {
        if ((s.type === 'setOwner' || s.type === 'setNext') && s.to === from) s.to = to || 'none';
        if (s.type === 'notify' && s.personId === from) s.personId = to;
      }));
    }
    if (list === 'teams') {
      d.teams.forEach(t => { t.nextTeamId = m(t.nextTeamId); });
      d.people.forEach(p => { p.teamId = m(p.teamId); });
    }
    if (list === 'statuses') {
      d.general.initialStatusId = m(d.general.initialStatusId);
      d.approvals.holdStatusId = m(d.approvals.holdStatusId) || '';
      d.approvals.appliesTo = uniq(d.approvals.appliesTo.map(m).filter(Boolean));
      if (!d.approvals.appliesTo.length) d.approvals.appliesTo = ['*'];
      d.actions.forEach(a => {
        a.show.statuses = uniq(a.show.statuses.map(m).filter(Boolean));
        a.steps.forEach(s => { if (s.type === 'setStatus') s.to = m(s.to); if (s.type === 'acceptOffer') s.land = m(s.land); });
      });
    }
    if (list === 'priorities') d.actions.forEach(a => a.steps.forEach(s => { if (s.type === 'setPriority') s.to = m(s.to); }));
    d.filters.forEach(f => f.conds.forEach(cd => {
      const def = subjectDef(cd.subject, d);
      if (!def) return;
      const k = opKind(def, cd.op);
      if ((k === 'person' && list === 'people') || (k === 'team' && list === 'teams')) cd.value = m(cd.value);
      if ((k === 'statuses' && list === 'statuses') || (k === 'priorities' && list === 'priorities')) cd.value = uniq((cd.value || []).map(m).filter(Boolean));
    }));
  }

  function deleteCfgRow(list, i) {
    const arr = getPath(cfgDraft, list);
    const row = arr[i];
    if (list === 'filters') { deleteFilter(i); return; }
    if (/^extensions\.(flags|fieldTypes|conditions|steps)$/.test(list)) {
      const uses = extUses(cfgDraft, list, row.id);
      if (uses.length) {
        modal({ title: `“${row.name || 'This block'}” is in use`, html: `<div>It is used by ${esc(uses.join(', '))}. Change those first.</div>`, ok: 'OK', okClass: 'btn', onOk: () => {} });
        return;
      }
      if (list === 'extensions.flags') cfgDraft.statuses.forEach(s => { s.flags = (s.flags || []).filter(x => x !== row.id); });
    }
    if (!REMAPPABLE.includes(list)) { arr.splice(i, 1); renderConfig(); return; }
    const saved = S.config[list].some(x => x.id === row.id);
    const map = cfgRemap[list];
    // Rows removed earlier in this draft whose items were moved to this one: their items move again now.
    const inbound = Object.keys(map).filter(k => map[k] === row.id);
    const usage = (saved ? USAGE[list](row.id) : 0) + inbound.reduce((n, k) => n + USAGE[list](k), 0);
    const remove = replacement => {
      arr.splice(i, 1);
      remapDraftRefs(cfgDraft, list, row.id, replacement === '__keep' ? '' : replacement);
      // “Keep as a former member” leaves those items with the person who originally had them.
      inbound.forEach(k => { if (replacement === '__keep') delete map[k]; else map[k] = replacement; });
      if (saved && replacement !== '__keep') map[row.id] = replacement;
      renderConfig();
    };
    if (!usage) { remove(list === 'people' ? '__keep' : ''); return; }
    const others = arr.filter(x => x.id !== row.id);
    const name = row.name || '(unnamed)';
    let options;
    if (list === 'people') options = [...others.map(p => ({ v: p.id, l: `Reassign to ${p.name || '(unnamed)'}` })), { v: '__keep', l: 'Keep on items as a former member' }, { v: '', l: 'Leave unassigned' }];
    else if (list === 'teams') options = [...others.map(t => ({ v: t.id, l: `Move to ${t.name || '(unnamed)'}` })), { v: '', l: 'Clear the team' }];
    else options = others.map(x => ({ v: x.id, l: `Move to ${x.name || '(unnamed)'}` }));
    if (!options.length) { toast(`Add another one before removing “${name}”.`); return; }
    modal({
      title: `Remove “${name}”?`,
      html: `<div>${plural(usage, 'item')} currently use${usage === 1 ? 's' : ''} “${esc(name)}”. When you save, they will be updated as chosen below.</div>
        <label><span>What happens to those items</span><select class="select" id="m_repl">${options.map(o => opt(o.v, o.l, false)).join('')}</select></label>`,
      ok: 'Remove',
      onOk: body => remove($('#m_repl', body).value),
    });
  }

  // A filter used by a button can't be removed (it would change what the button does); other uses are cleared.
  function deleteFilter(i) {
    const f = cfgDraft.filters[i];
    const uses = filterUses(cfgDraft, f.id);
    const blocking = uses.filter(u => u.kind === 'action' || u.kind === 'filter' || u.kind === 'route');
    if (blocking.length) {
      modal({ title: `“${f.name || 'Filter'}” is in use`, html: `<div>It is used by ${esc(blocking.map(u => u.text).join(', '))}. Change those first so their behaviour stays predictable.</div>`, ok: 'OK', okClass: 'btn', onOk: () => {} });
      return;
    }
    const go = () => {
      cfgDraft.filters.splice(i, 1);
      cfgDraft.stats = cfgDraft.stats.filter(s => s.filterId !== f.id);
      cfgDraft.views.forEach(v => { if (v.filterId === f.id) v.filterId = ''; if (v.count === f.id) v.count = 'match'; });
      renderConfig();
    };
    if (!uses.length) { go(); return; }
    modal({ title: `Remove “${f.name || 'Filter'}”?`, html: `<div>It is used by ${esc(uses.map(u => u.text).join(', '))}. Those stat cards will be removed, and those board views will show all items.</div>`, ok: 'Remove', onOk: go });
  }

  function validateDraft(d) {
    const e = [];
    const add = (sectionId, msg) => e.push({ section: sectionId, msg });
    const g = d.general;
    if (!String(g.appName || '').trim()) add('general', 'Workspace name is required.');
    if (!(Number.isInteger(+g.refDigits) && +g.refDigits >= 1 && +g.refDigits <= 8)) add('general', 'Reference digits must be a whole number from 1 to 8.');
    const uniqNames = (items, key, sectionId, noun) => {
      const seen = new Set();
      items.forEach((x, i) => {
        const v = String(x[key] || '').trim();
        x[key] = v;
        if (!v) add(sectionId, `${noun} #${i + 1} needs a name.`);
        else if (seen.has(v.toLowerCase())) add(sectionId, `${noun} “${v}” is listed twice.`);
        seen.add(v.toLowerCase());
      });
    };
    uniqNames(d.teams, 'name', 'teams', 'Team');
    uniqNames(d.people, 'name', 'people', 'Person');
    uniqNames(d.roles, 'name', 'roles', 'Role');
    // Sign-in: unique usernames, and someone must still be able to sign in and configure.
    const seenU = new Set();
    d.people.forEach(p => {
      p.username = String(p.username || '').trim().toLowerCase();
      if (!p.username) add('people', `${p.name || 'A person'} needs a username.`);
      else if (!/^[a-z0-9._-]+$/.test(p.username)) add('people', `Username “${p.username}” can only use letters, numbers, dots, dashes and underscores.`);
      else if (seenU.has(p.username)) add('people', `Username “${p.username}” is used twice.`);
      seenU.add(p.username);
      if (p.newPassword && String(p.newPassword).length < 4) add('people', `${p.name}: passwords need at least 4 characters.`);
    });
    const canSignIn = p => p.active && (p.passwordHash || p.newPassword);
    const admins = d.people.filter(p => canSignIn(p) && (p.roleIds || []).some(id => (d.roles.find(r => r.id === id) || {}).configure));
    if (!admins.length) add('roles', 'At least one active person with a password must hold a role that can configure the workspace, or nobody could change these settings again.');
    if (!d.roles.length) add('roles', 'Add at least one role.');
    uniqNames(d.priorities, 'name', 'priorities', 'Priority');
    uniqNames(d.statuses, 'name', 'statuses', 'Status');
    uniqNames(d.filters, 'name', 'filters', 'Filter');
    uniqNames(d.fields.custom, 'label', 'fields', 'Custom field');
    if (!d.teams.length) add('teams', 'Add at least one team.');
    if (!d.people.some(p => p.active)) add('people', 'At least one person must be active.');
    if (!d.priorities.length) add('priorities', 'Add at least one priority.');
    if (!d.statuses.some(s => !s.closed)) add('statuses', 'Add at least one status that doesn’t close the item.');
    if (!d.statuses.some(s => s.closed)) add('statuses', 'Add at least one status that closes the item.');
    if (!d.statuses.some(s => s.id === g.initialStatusId && !s.closed)) add('workflow', 'Choose the status new items start in.');
    d.filters.forEach(f => f.conds.forEach((cd, j) => {
      const def = subjectDef(cd.subject, d);
      const k = def ? opKind(def, cd.op) : '';
      const v = cd.value;
      const missing = k && (Array.isArray(v) ? !v.length : (v === '' || v == null));
      if (missing) add('filters', `Filter “${f.name || '(unnamed)'}”, condition ${j + 1}, needs a value.`);
    }));
    d.actions.forEach((a, i) => {
      a.label = String(a.label || '').trim();
      const nm = a.label || `#${i + 1}`;
      if (!a.label) add('workflow', `Button #${i + 1} needs a label.`);
      if (!a.show.statuses.length) add('workflow', `Button “${nm}” isn’t shown for any status.`);
      if (!a.steps.length) add('workflow', `Button “${nm}” has no steps.`);
      validateSteps(d, a.steps, `Button “${nm}”`, 'workflow', add);
    });
    // Buttons (and step types) that run one another must not end up running themselves.
    const runs = (steps, out = []) => { steps.forEach(s => { if (s.type === 'runButton' && s.actionId) out.push('a:' + s.actionId); else if (isCustomStep(s.type)) out.push(s.type); }); return out; };
    const nodeName = k => (k.startsWith('a:') ? `Button “${(d.actions.find(a => 'a:' + a.id === k) || {}).label || '(unnamed)'}”` : `Step type “${(d.extensions.steps.find(x => 'x:' + x.id === k) || {}).name || '(unnamed)'}”`);
    const callees = k => {
      if (k.startsWith('a:')) { const a = d.actions.find(y => 'a:' + y.id === k); return runs(a ? a.steps : []); }
      const x = d.extensions.steps.find(y => 'x:' + y.id === k);
      return runs(x && x.mode === 'macro' ? x.steps : []);
    };
    const reported = new Set();
    [...d.actions.map(a => 'a:' + a.id), ...d.extensions.steps.map(x => 'x:' + x.id)].forEach(start => {
      // Depth-first search for a way back to `start`.
      const seen = new Set();
      const find = (k, trail) => {
        for (const n of callees(k)) {
          if (n === start) return trail;
          if (!seen.has(n)) { seen.add(n); const t = find(n, [...trail, n]); if (t) return t; }
        }
        return null;
      };
      const trail = find(start, []);
      if (!trail) return;
      const key = [start, ...trail].sort().join('|');
      if (reported.has(key)) return;
      reported.add(key);
      add(start.startsWith('a:') ? 'workflow' : 'extensions', `${nodeName(start)} runs itself${trail.length ? ` through ${trail.map(nodeName).join(' → ')}` : ''}. Remove one of the steps that runs another button or step type.`);
    });
    BUILTIN_FIELDS.forEach(k => { d.fields.labels[k] = String(d.fields.labels[k] || '').trim(); if (!d.fields.labels[k]) add('fields', `The built-in “${BASE_CONFIG.fields.labels[k]}” field needs a label.`); });
    d.fields.custom.forEach(f => {
      const base = fieldBase(f, d);
      if ((base === 'select' || base === 'multiselect') && !fieldOptions(f, d).length) add('fields', `Field “${f.label || '(unnamed)'}” needs at least one option.`);
      if (base === 'number' && f.min !== '' && f.max !== '' && +f.min > +f.max) add('fields', `Field “${f.label}”: minimum is greater than maximum.`);
    });
    // Extensions
    const x = d.extensions;
    uniqNames(x.flags, 'name', 'extensions', 'Status flag');
    uniqNames(x.fieldTypes, 'name', 'extensions', 'Field type');
    uniqNames(x.conditions, 'name', 'extensions', 'Condition type');
    uniqNames(x.steps, 'name', 'extensions', 'Step type');
    const checkScript = (code, args, auto, what) => {
      if (!String(code || '').trim()) { add('extensions', `${what} needs a script.`); return; }
      try { new Function(...args, (auto && !/\breturn\b/.test(code) ? `return (${code});` : code)); } catch (err) { add('extensions', `${what}: ${err.message}`); }
    };
    const checkParams = (params, what) => {
      const seen = new Set();
      params.forEach(p => {
        p.key = String(p.key || '').trim();
        if (!/^[A-Za-z_$][\w$]*$/.test(p.key)) add('extensions', `${what}: parameter key “${p.key}” must be a simple name like “amount”.`);
        else if (seen.has(p.key)) add('extensions', `${what}: parameter “${p.key}” is listed twice.`);
        seen.add(p.key);
      });
    };
    x.fieldTypes.forEach(t => {
      if (t.pattern) { try { new RegExp(t.pattern); } catch (err) { add('extensions', `Field type “${t.name}”: pattern is not a valid regular expression.`); } }
      if (t.script.trim()) checkScript(t.script, ['value', 'field', 'api'], true, `Field type “${t.name}” validator`);
      if ((t.base === 'select' || t.base === 'multiselect') && !t.options.length && d.fields.custom.some(f => f.type === 'x:' + t.id && !f.options.length)) add('extensions', `Field type “${t.name}” needs shared options (or give each field its own).`);
    });
    x.conditions.forEach(c => { checkParams(c.params, `Condition “${c.name}”`); checkScript(c.script, ['item', 'params', 'viewer', 'today', 'api'], true, `Condition “${c.name}”`); });
    x.steps.forEach(s => {
      if (s.mode === 'script') { checkParams(s.params, `Step type “${s.name}”`); checkScript(s.script, ['ctx'], false, `Step type “${s.name}”`); }
      else if (!s.steps.length) add('extensions', `Step type “${s.name}” has no steps.`);
      else validateSteps(d, s.steps, `Step type “${s.name}”`, 'extensions', add);
    });
    d.stats.forEach((s, i) => { if (!String(s.label || '').trim()) add('dashboard', `Stat card #${i + 1} needs a label.`); if (!d.filters.some(f => f.id === s.filterId)) add('dashboard', `Stat card #${i + 1} needs a filter.`); });
    d.views.forEach((v, i) => { if (!String(v.label || '').trim()) add('views', `Board view #${i + 1} needs a label.`); });
    const apv = d.approvals;
    if (apv.holdStatusId && !d.statuses.some(s => s.id === apv.holdStatusId && !s.closed)) add('approvals', 'The waiting column must be an open status.');
    apv.chains.forEach((ch, i) => {
      const nm = ch.name.trim() || `#${i + 1}`;
      if (!ch.name.trim()) add('approvals', `Verification route #${i + 1} needs a name.`);
      if (!ch.stages.length) add('approvals', `Verification route “${nm}” needs at least one group.`);
      ch.stages.forEach((s, j) => { if (!d.roles.some(r => r.id === s.roleId)) add('approvals', `Verification route “${nm}”, step ${j + 1}, needs a group.`); });
      const dup = ch.stages.map(s => s.roleId).find((r, j, all) => r && all.indexOf(r) !== j);
      if (dup) add('approvals', `Verification route “${nm}” lists ${(d.roles.find(r => r.id === dup) || {}).name || 'a group'} twice.`);
    });
    if (!d.views.length) add('views', 'Add at least one board view.');
    const nt = d.notifications;
    if (!(+nt.popupSeconds >= 2 && +nt.popupSeconds <= 120)) add('notifications', 'Pop-up duration must be between 2 and 120 seconds.');
    if (!(+nt.toastSeconds >= 1 && +nt.toastSeconds <= 60)) add('notifications', 'Message duration must be between 1 and 60 seconds.');
    if (!(+nt.animMs >= 50 && +nt.animMs <= 2000)) add('notifications', 'Animation speed must be between 50 and 2000 milliseconds.');
    if (!(+nt.volume >= 0 && +nt.volume <= 100)) add('notifications', 'Volume must be between 0 and 100.');
    return e;
  }

  function validateSteps(d, steps, owner, sectionId, add) {
    const has2 = (s, k) => String(s[k] || '').trim();
    steps.forEach((s, j) => {
      const at = `${owner}, step ${j + 1}`;
      if (s.type === 'setStatus' && s.to !== '__prev' && !d.statuses.some(x => x.id === s.to)) add(sectionId, `${at}: choose a status.`);
      if (s.type === 'setField' && !d.fields.custom.some(f => f.id === s.fieldId)) add(sectionId, `${at}: choose a custom field.`);
      if (s.type === 'notify' && !has2(s, 'message')) add(sectionId, `${at}: the alert needs a message.`);
      if (s.type === 'notify' && s.who === 'person' && !s.personId) add(sectionId, `${at}: choose who receives the alert.`);
      if (s.type === 'confirm' && !has2(s, 'message')) add(sectionId, `${at}: the confirmation needs a message.`);
      if (s.type === 'createItem' && !has2(s, 'title')) add(sectionId, `${at}: the new item needs a title.`);
      if (s.type === 'email' && s.to === 'person' && !s.personId) add(sectionId, `${at}: choose who receives the email.`);
      if (s.type === 'email' && s.to === 'address' && !has2(s, 'address')) add(sectionId, `${at}: enter an email address.`);
      if (s.type === 'webhook' && !/^https?:\/\/\S+/i.test(s.url || '')) add(sectionId, `${at}: the webhook needs a URL starting with http:// or https://.`);
      if (s.type === 'runButton' && !d.actions.some(a => a.id === s.actionId)) add(sectionId, `${at}: choose a button to run.`);
      if (s.type === 'handoverNote' && !noteSections(s).length) add(sectionId, `${at}: list at least one note section.`);
      if (s.type === 'acceptOffer' && !d.statuses.some(x => x.id === s.land && !x.closed)) add(sectionId, `${at}: choose the status after accepting.`);
      if (isCustomStep(s.type) && !d.extensions.steps.some(x => 'x:' + x.id === s.type)) add(sectionId, `${at}: that step type no longer exists.`);
    });
  }

  const configHasScripts = c => c.extensions.conditions.some(x => x.script.trim()) || c.extensions.steps.some(x => x.mode === 'script' && x.script.trim()) || c.extensions.fieldTypes.some(x => x.script.trim());

  function resolveChains(map) {
    const out = {};
    Object.keys(map).forEach(k => {
      let v = map[k];
      const seen = new Set([k]);
      while (v && has(map, v) && !seen.has(v)) { seen.add(v); v = map[v]; }
      out[k] = v;
    });
    return out;
  }

  function saveDraft() {
    const errs = validateDraft(cfgDraft);
    if (errs.length) {
      cfgErrors = errs;
      cfgSection = errs[0].section;
      renderConfig();
      $('#content').scrollTop = 0;
      toast('Fix the listed problems before saving.');
      return;
    }
    const d = normalizeConfig(cfgDraft);
    const R = {};
    Object.keys(cfgRemap).forEach(k => { R[k] = resolveChains(cfgRemap[k]); });
    const mp = (map, v) => (v && has(map, v) ? map[v] : v);
    const pIds = new Set(d.people.map(p => p.id));
    const tIds = new Set(d.teams.map(t => t.id));
    S.config.people.forEach(p => { if (!pIds.has(p.id)) S.removed.people[p.id] = p.name; });

  function renderDemoResults() {
    const total = demo.results.reduce((n, r) => n + r.checks.length, 0);
    const passed = demo.results.reduce((n, r) => n + r.checks.filter(c => c.pass).length, 0);
    // Also published as data, so tests and tools read results without depending on how they are worded on screen.
    $('#demoResults').dataset.results = JSON.stringify(demo.results);
    $('#demoResults').innerHTML = demo.results.map(r => `<div class="sc">${esc(r.title)}${r.error ? ' <span class="fail">— stopped</span>' : ''}</div>
      ${r.checks.map(c => `<div class="${c.pass ? 'pass' : 'fail'}">${c.pass ? '✓' : '✗'} ${esc(c.label)}${c.note ? ` (${esc(c.note)})` : ''}</div>`).join('')}
      ${r.error ? `<div class="fail">✗ ${esc(r.error)}</div>` : ''}`).join('') +
      (demo.results.length && !demo.running ? (() => {
        const stopped = demo.results.filter(r => r.error).length;
        const good = passed === total && !stopped;
        return `<div class="sum ${good ? 'pass' : 'fail'}">${passed} of ${total} checks passed${stopped ? `; ${plural(stopped, 'scenario')} didn’t finish` : ''}. Your own data has been restored.</div>`;
      })() : '');
  }

  // The demo window's size is a per-browser convenience, remembered apart from workspace data.
  const DEMO_SIZE_KEY = 'taskhub.demo-size';
  function setDemoSize(size) {
    if (!size) {
      demoPanel.classList.remove('sized');
      ['--demo-w', '--demo-h', '--list-h'].forEach(p => demoPanel.style.removeProperty(p));
      return;
    }
    const w = Math.round(Math.max(300, Math.min(window.innerWidth - 24, size.w)));
    const h = Math.round(Math.max(220, Math.min(window.innerHeight - 24, size.h)));
    demoPanel.classList.add('sized');
    demoPanel.style.setProperty('--demo-w', w + 'px');
    demoPanel.style.setProperty('--demo-h', h + 'px');
    // The scenario list grows with the window but leaves room for the controls and results.
    demoPanel.style.setProperty('--list-h', Math.max(110, Math.round(h * 0.4)) + 'px');
  }
  function saveDemoSize(size) {
    try { if (size) localStorage.setItem(DEMO_SIZE_KEY, JSON.stringify(size)); else localStorage.removeItem(DEMO_SIZE_KEY); } catch (e) { /* ignore */ }
  }
  const demoSize = () => { const r = demoPanel.getBoundingClientRect(); return { w: r.width, h: r.height }; };
  function wireDemoResize() {
    try { const s = JSON.parse(localStorage.getItem(DEMO_SIZE_KEY) || 'null'); if (s && s.w && s.h) setDemoSize(s); } catch (e) { /* ignore */ }
    $$('.demo-grip', demoPanel).forEach(grip => {
      const mode = grip.dataset.grip;
      grip.addEventListener('pointerdown', e => {
        if (e.button !== 0) return;
        e.preventDefault();
        const start = demoSize();
        const sx = e.clientX, sy = e.clientY;
        grip.setPointerCapture(e.pointerId);
        document.body.classList.add('demo-resizing');
        // Anchored at the bottom left: dragging the top edge up or the right edge out makes it bigger.
        const move = ev => setDemoSize({
          w: mode.includes('r') ? start.w + ev.clientX - sx : start.w,
          h: mode.includes('t') ? start.h - (ev.clientY - sy) : start.h,
        });
        const end = () => {
          grip.removeEventListener('pointermove', move);
          document.body.classList.remove('demo-resizing');
          if (demoPanel.classList.contains('sized')) saveDemoSize(demoSize());
        };
        grip.addEventListener('pointermove', move);
        grip.addEventListener('pointerup', end, { once: true });
        grip.addEventListener('pointercancel', end, { once: true });
      });
      grip.addEventListener('dblclick', () => { setDemoSize(null); saveDemoSize(null); });
    });
    $('.demo-grip.tr', demoPanel).addEventListener('keydown', e => {
      const step = e.shiftKey ? 60 : 20;
      const d = { ArrowRight: [step, 0], ArrowLeft: [-step, 0], ArrowUp: [0, step], ArrowDown: [0, -step] }[e.key];
      if (e.key === 'Enter' || e.key === 'Escape') { e.preventDefault(); setDemoSize(null); saveDemoSize(null); return; }
      if (!d) return;
      e.preventDefault();
      const s = demoSize();
      setDemoSize({ w: s.w + d[0], h: s.h + d[1] });
      saveDemoSize(demoSize());
    });
  }
  // Keep a resized window on screen when the browser shrinks (uses the stored size, so a minimised window is fine).
  window.addEventListener('resize', () => {
    if (!demoPanel || !demoPanel.classList.contains('sized')) return;
    const v = p => parseFloat(demoPanel.style.getPropertyValue(p));
    setDemoSize({ w: v('--demo-w'), h: v('--demo-h') });
  });

  function openDemoPanel() {
    if (!demoPanel) {
      demoPanel = document.createElement('div');
      demoPanel.className = 'demo-panel';
      demoPanel.innerHTML = `<div class="demo-head"><b>▶ Automated demo</b><button type="button" data-demo="min" title="Minimise">–</button><button type="button" data-demo="close" title="Close">✕</button></div>
        <div class="demo-body">
          <div class="demo-pick"><span style="flex:1">${DEMOS.length} scenarios</span><button type="button" data-demo="all">All</button><button type="button" data-demo="none">None</button></div>
          <div class="demo-list">${DEMOS.map(d => `<label><input type="checkbox" value="${d.id}" checked> ${esc(d.title)}</label>`).join('')}</div>
          <div class="demo-controls">
            <select id="demoSpeed" aria-label="Speed"><option value="1.6">Slow</option><option value="1" selected>Normal</option><option value="0.4">Fast</option><option value="0.03">Instant (test run)</option></select>
            <button class="btn btn-red" type="button" data-demo="run">Run</button>
            <button class="btn" type="button" data-demo="pause" disabled>Pause</button>
            <button class="btn" type="button" data-demo="stop" disabled>Stop</button>
          </div>
          <div class="demo-caption" id="demoCaption">Choose scenarios and press Run. Your data is set aside, a fresh sample board is used, and your data is restored afterwards.</div>
          <div class="demo-results" id="demoResults"></div>
        </div>
        <div class="demo-grip t" data-grip="t"></div><div class="demo-grip r" data-grip="r"></div>
        <div class="demo-grip tr" data-grip="tr" tabindex="0" role="separator" aria-label="Resize the demo window. Arrow keys change the size; Enter resets it." title="Drag to resize · double-click to reset"></div>`;
      document.body.appendChild(demoPanel);
      wireDemoResize();
      demoPointer = document.createElement('div');
      demoPointer.className = 'demo-pointer';
      demoPointer.innerHTML = '<svg viewBox="0 0 24 24" width="24" height="24"><path d="M3 2l7 19 2.6-7.4L20 11z" fill="#fff" stroke="#16181d" stroke-width="1.6" stroke-linejoin="round"/></svg><div class="demo-bubble"></div>';
      demoPanel.addEventListener('click', e => {
        const b = e.target.closest('[data-demo]');
        if (!b) { if (e.target.closest('.demo-head')) demoPanel.classList.toggle('min'); return; }
        const a = b.dataset.demo;
        if (a === 'run') runDemos();
        if (a === 'pause') { demo.paused = !demo.paused; b.textContent = demo.paused ? 'Resume' : 'Pause'; }
        if (a === 'stop') { demo.stop = true; demo.paused = false; }
        if (a === 'min') demoPanel.classList.toggle('min');
        if ((a === 'all' || a === 'none') && !demo.running) $$('.demo-list input', demoPanel).forEach(i => { i.checked = a === 'all'; });
        if (a === 'close' && !demo.running) { demoPanel.remove(); demoPanel = null; }
      });
      $('#demoSpeed', demoPanel).addEventListener('change', e => { demo.speed = +e.target.value; });
    }
    demoPanel.classList.remove('min');
  }

  function demoSetData() {
    if (dlg.open) dlg.close();
    $$('.toast').forEach(t => t.remove());
    S = defaultState(null, DEMO_WORKSPACE);
    cfgDraft = null; cfgRemap = emptyRemap(); cfgErrors = [];
    editingId = null; lastCustomSig = null;
    resetFilters();
    resetForm();
    commit();
  }
  // Nothing the person saved was touched during the run: put the in-memory state back and drop the demo's scratch copy.
  function demoRestore() {
    if (dlg.open) dlg.close();
    S = demo.saved;
    panelClosed = demo.savedPanel;
    colWidths = demo.savedCols || {};
    try { localStorage.removeItem(DEMO_SCRATCH_KEY); } catch (e) { /* ignore */ }
    // Its pop-ups and messages are about sample work that no longer exists.
    $('#toasts').replaceChildren();
    applyCols();
    demoNotes = null;
    if (noteCentreOpen()) openNoteCentre(false);
    cfgDraft = null; cfgRemap = emptyRemap(); cfgErrors = [];
    editingId = null; lastCustomSig = null;
    applyPanelState();
    resetForm();
    commit();
  }

  async function runDemos() {
    if (demo.running) return;
    const chosen = $$('.demo-list input:checked', demoPanel).map(i => DEMOS.find(d => d.id === i.value));
    if (!chosen.length) { dCaption('Tick at least one scenario.'); return; }
    // The demo replaces the screen's contents: it never starts over work that isn't saved yet.
    if (cfgDirty()) { dCaption('You have unsaved Configuration changes. Save or discard them first; the demo would replace them.'); return; }
    if (typing()) { dCaption('You have an item, note or post that isn’t saved yet. Save or discard it first; the demo would replace it.'); return; }
    // Set the real workspace aside in memory. It stays saved in this browser as it was: the demo saves elsewhere.
    demo.saved = clone(S);
    demo.savedPanel = clone(panelClosed);
    demo.savedCols = clone(colWidths);
    demoNotes = null;
    Object.assign(demo, { running: true, paused: false, stop: false, results: [], speed: +$('#demoSpeed', demoPanel).value });
    demoShield = document.createElement('div');
    demoShield.className = 'demo-shield';
    document.body.appendChild(demoShield);
    document.body.appendChild(demoPointer);
    $$('[data-demo="pause"], [data-demo="stop"]', demoPanel).forEach(b => { b.disabled = false; });
    $('[data-demo="run"]', demoPanel).disabled = true;
    try {
      for (const d of chosen) {
        demo.results.push({ title: d.title, checks: [], error: '' });
        renderDemoResults();
        try {
          demoSetData();
          dCaption(d.title);
          await dWait(400);
          await d.run();
        } catch (e) {
          demo.results[demo.results.length - 1].error = e === DEMO_STOP ? 'Stopped by you' : `Step failed: ${e.message}`;
          if (e === DEMO_STOP) break;
        }
      }
    } finally {
      // Whatever happened, the person gets their own screen back.
      demo.running = false;
      demoRestore();
      demoShield.remove();
    }
    demoPointer.remove();
    demoPointer.style.left = '-100px';
    $('[data-demo="run"]', demoPanel).disabled = false;
    $$('[data-demo="pause"], [data-demo="stop"]', demoPanel).forEach(b => { b.disabled = true; b.textContent = b.dataset.demo === 'pause' ? 'Pause' : 'Stop'; });
    dCaption('Finished. Your own data is back.');
    renderDemoResults();
  }
  document.addEventListener('click', e => { if (e.target.closest('[data-open-demo]')) openDemoPanel(); });
  // While the demo drives the page, the keyboard belongs to the demo window only (the shield already stops clicks), so
  // nothing typed lands in the fields the demo is filling.
  ['keydown', 'keypress', 'keyup', 'beforeinput', 'paste', 'drop'].forEach(type => window.addEventListener(type, e => {
    if (!demo.running || (demoPanel && demoPanel.contains(e.target))) return;
    e.preventDefault();
    e.stopImmediatePropagation();
  }, true));

  // A demo interrupted by closing the tab leaves only its scratch copy, which is dropped. (Versions before the scratch
  // copy wrote the demo over the saved workspace and kept a backup: if one is still here, put the real data back.)
  if (!GUIDE_TAB) try {
    localStorage.removeItem(DEMO_SCRATCH_KEY);
    const b = JSON.parse(localStorage.getItem(DEMO_BACKUP_KEY) || 'null');
    if (b && b.state) {
      localStorage.setItem(STORE_KEY, JSON.stringify(b.state));
      if (b.panel) localStorage.setItem(PANEL_KEY, JSON.stringify(b.panel));
      localStorage.removeItem(DEMO_BACKUP_KEY);
      panelClosed = b.panel || {};
      applyPanelState();
    }
  } catch (e) { /* ignore */ }

  // ---------- boot ----------
  if (GUIDE_TAB) {
    startGuideTab();
  } else {
    S = loadState() || blankState();
    fixViewer();
    resetForm();
    remindDue();
    commit();
    reportUnreadable();
    if (loggedIn()) popPendingForViewer();
    // A day can change while someone stays signed in.
    setInterval(() => { if (!demo.running && remindDue()) { commit(); popPendingForViewer(); } }, 60 * 60 * 1000);
    if (location.hash === '#demo') openDemoPanel();
    initDataFile();
    // A guide link followed from a guide tab that had no app tab to talk to.
    try {
      const go = sessionStorage.getItem(GUIDE_PENDING_KEY);
      if (go) { sessionStorage.removeItem(GUIDE_PENDING_KEY); if (loggedIn()) guideGo(go); }
    } catch (e) { /* ignore */ }
  }
})();
</script>
</body>
</html>
