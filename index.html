    const g = cfg().general;
    $('#loginBrand').textContent = g.appName;
    // No accounts means no workspace yet: offer the default workspace instead of a sign-in nobody can use.
    const empty = !cfg().people.length;
    $('#loginFields').hidden = empty;
    $('#loginStart').hidden = !empty;
    $('.login-default').hidden = empty;
    $('#loginTag').textContent = empty ? 'Let’s get you started.' : 'Sign in to continue.';
    if (empty) {
      $('#loginStart').innerHTML = `<div class="ls-title">👋 Welcome! No workspace is loaded yet.</div>
        <p>Start with the ready-made <b>default workspace</b>: teams, people, roles and sample work you can try out, then change to suit your team.</p>
        <button class="btn btn-red" type="button" data-load-default>▶ Load default workspace</button>
        ${defaultWorkspace() ? '' : `<p class="form-error">${esc(NO_DEFAULT)}</p>`}
        ${fileApi() ? '<p class="muted">Or open your team’s shared data file below.</p>' : ''}`;
      $('#loginHint').innerHTML = ''; $('#loginHint').hidden = true;
      return;
    }
    $('#loginHint').hidden = false;
    const demo = g.loginHint ? cfg().people.filter(p => p.active && p.passwordHash && hashPassword(p.salt, 'demo') === p.passwordHash) : [];
    const note = 'Accounts are stored in this browser, so sign-in keeps people’s views apart on a shared device but is not real security.';
    $('#loginHint').innerHTML = demo.length
      ? `<b>Demo accounts</b> (password <code>demo</code>):<br>${demo.map(p => `<code>${esc(p.username)}</code> ${esc(p.name)} · ${esc(rolesOf(p.id).filter(r => r.id !== 'r_member').map(r => r.name).join(', ') || 'Team member')}`).join('<br>')}<br><br>${note}`
      : note;
    if (!$('#loginUser').value) setTimeout(() => $('#loginUser').focus(), 0);
  }
  function signIn(username, password) {
    const u = String(username || '').trim().toLowerCase();
    const who = cfg().people.find(p => p.username === u);
    if (!who || !who.active || !who.passwordHash || hashPassword(who.salt, password) !== who.passwordHash) return null;
    S.session = { userId: who.id, time: Date.now() };
    S.viewerId = who.id;
    S.page = 'board';
    resetFilters();
    log(`${who.name} signed in.`, 'SIGN-IN');
    return who;
  }
  function signOut() {
    const name = nameOf(sessionId());
    cfgDraft = null;
    cfgRemap = emptyRemap();
    S.session = null;
    // On a shared computer the next person mustn't see (or open) the previous person's pop-ups and messages.
    $('#toasts').replaceChildren();
    openNoteCentre(false);
    log(`${name} signed out.`, 'SIGN-IN');
    commit();
  }

  function renderStats() {
    const stats = cfg().stats.filter(s => s.visible);
    $('#stats').hidden = !stats.length;
    $('#stats').innerHTML = stats.map(s =>
      `<button class="stat${S.filters.focus && S.filters.focus === s.filterId ? ' active' : ''}" type="button" data-focus="${esc(s.filterId)}">
        <div class="stat-label">${esc(s.label)}</div><div class="stat-value">${filterCount(s.filterId)}</div><div class="stat-sub">${esc(s.sub)}</div>
      </button>`).join('');
  }

  function renderFilters() {
    const f = S.filters;
    $('#lblFilterTeam').textContent = label('team');
    $('#lblFilterPriority').textContent = label('priority');
    const ids = viewableIds();
    $('#fViewer').innerHTML = ids.map(id => opt(id, nameOf(id) + (id === sessionId() ? ' (me)' : ''), id === S.viewerId)).join('');
    $('#fViewer').closest('label').hidden = ids.length < 2;
    const ro = $('#roBanner');
    ro.hidden = S.viewerId === sessionId();
    ro.innerHTML = ro.hidden ? '' : `<span>Viewing as <b>${esc(viewerName())}</b>${readOnly() ? ' — read-only: you can look but not change anything' : ' — actions you take are recorded as them'}.</span><button class="btn-sm b-plain" type="button" data-back-to-me>Back to my view</button>`;
    $('#fTeam').innerHTML = opt('all', 'All teams', f.teamId === 'all') + cfg().teams.map(t => opt(t.id, t.name, t.id === f.teamId)).join('');
    $('#fPriority').innerHTML = opt('all', 'All priorities', f.priorityId === 'all') + cfg().priorities.map(p => opt(p.id, p.name, p.id === f.priorityId)).join('');
    // Focus lists the same board views as the sidebar; a stat card can add a one-off filter.
    const active = activeViewId();
    const extra = f.focus && !active ? opt('f:' + f.focus, (filterById(f.focus) || {}).name, true) : '';
    $('#fFocus').innerHTML = allViews().map(v => opt(v.id, v.label, v.id === active)).join('') + extra;
    if ($('#search') !== document.activeElement) $('#search').value = S.search;
  }

  function cardField(it, fid) {
    const L = cfg().fields.labels;
    switch (fid) {
      case 'owner': return { l: L.owner, v: ownerLabel(it) };
      case 'nextOwner': return { l: L.nextOwner, v: nextLabel(it) };
      case 'team': return { l: L.team, v: teamNameOf(it.teamId) };
      case 'nextTeam': return { l: L.nextTeam, v: teamNameOf(it.nextTeamId) };
      case 'due': return { l: L.due, v: it.due, cls: isOverdue(it) ? 'overdue' : '' };
      case 'status': return { l: L.status, v: statusName(it.statusId) };
      case 'priority': return { l: L.priority, v: (priority(it.priorityId) || {}).name };
      case 'created': return { l: 'Created', v: fmtDate(it.created) };
      case 'updated': return { l: 'Last updated', v: fmtDate(it.updated) };
    }
    if (fid.startsWith('cf:')) {
      const f = cfg().fields.custom.find(x => 'cf:' + x.id === fid);
      return f ? { l: f.label, v: customValueText(f, (it.fields || {})[f.id]) } : null;
    }
    return null;
  }

  const actionVisible = (a, it) => (a.show.statuses.includes('*') || a.show.statuses.includes(it.statusId)) && (!a.show.filterId || filterMatches(a.show.filterId, it));
  function actionsHTML(it) {
    if (readOnly()) return '';
    return cfg().actions.filter(a => actionVisible(a, it)).map(a => {
      const style = a.outline ? '' : ` style="background:${esc(a.color)};border-color:${esc(shade(a.color))};color:#fff"`;
      return `<button class="btn-sm span-${a.width}${a.outline ? ' b-plain' : ''}" type="button" data-action="${esc(a.id)}" data-id="${esc(it.id)}"${style}>${esc(a.label)}</button>`;
    }).join('');
  }

  function linksHTML(it) {
    const links = (it.links || []).map(l => ({ l, o: getItem(l.itemId) })).filter(x => x.o);
    if (!links.length) return '';
    return `<div class="links">Linked:${links.map(({ l, o }) => ` <button class="link-chip" type="button" data-goto-item="${esc(o.id)}" title="${esc(o.title)}">${esc(l.type ? `${l.type} · ` : '')}${esc(o.ref)}</button>`).join('')}</div>`;
  }

  function cardHTML(it) {
    const c = cfg().card;
    const fields = c.fields.map(fid => cardField(it, fid)).filter(Boolean);
    const p = priority(it.priorityId);
    const tags = (c.showPriority && p ? `<span class="tag" style="${prioStyle(it.priorityId)}">${esc(p.name)}</span>` : '') +
      (c.showTeam && it.teamId ? `<span class="tag" style="${teamStyle(team(it.teamId))}">${esc(teamNameOf(it.teamId))}</span>` : '');
    return `<article class="card" draggable="${cfg().general.allowDrag && !readOnly() ? 'true' : 'false'}" data-id="${esc(it.id)}" id="card-${esc(it.id)}">
      ${c.showRef ? `<div class="card-ref">${esc(it.ref)}</div>` : ''}
      <button class="card-title-btn" type="button" data-open-item="${esc(it.id)}" title="Open details, handovers, comments and history"><h4 class="card-title">${esc(it.title)}</h4></button>
      ${tags ? `<div class="tags">${tags}</div>` : ''}
      ${fields.length ? `<div class="fields">${fields.map(f => `<div class="field"><div class="field-l">${esc(f.l)}</div><div class="field-v ${f.cls || ''}">${esc(f.v || '—')}</div></div>`).join('')}</div>` : ''}
      ${c.showDesc && it.desc ? `<p class="desc">${esc(it.desc)}</p>` : ''}
      ${isHoldStatus(it.statusId) && it.blockReason ? `<div class="block-reason"><b>Reason:</b> ${esc(it.blockReason)}</div>` : ''}
      ${it.offer ? `<div class="offer-banner">Awaiting acceptance by <b>${esc(nameOf(it.offer.toId))}</b> · offered by ${esc(nameOf(it.offer.fromId))}</div>` : ''}
      ${it.queueId ? `<div class="queue-banner">In the <b>${esc(queueName(it.queueId))}</b> queue, waiting to be picked up.</div>` : ''}
      ${verifyBannerHTML(it)}
      ${linksHTML(it)}
      ${it.comments.length || it.handovers.length ? `<div class="meta-row">${it.handovers.length ? `<button class="meta-chip" type="button" data-open-item="${esc(it.id)}">⇄ ${plural(it.handovers.length, 'handover')}</button>` : ''}${it.comments.length ? `<button class="meta-chip" type="button" data-open-item="${esc(it.id)}">💬 ${plural(it.comments.length, 'comment')}</button>` : ''}</div>` : ''}
      <div class="actions">${actionsHTML(it)}</div>
    </article>`;
  }

  // The route on a card: ✓ done, ● waiting now, ○ still to come.
  const STAGE_MARK = { approved: '✓', pending: '●', waiting: '○', rejected: '✕', cancelled: '–' };
  const stagesHTML = rec => rec.stages.map(s => `<span class="vstage ${esc(s.state)}" title="${esc(s.state === 'approved' ? `Verified by ${nameOf(s.by)}` : s.state)}">${STAGE_MARK[s.state] || ''} ${esc(groupName(s.roleId))}</span>`).join(`<span class="arrow">${rec.order === 'parallel' ? '+' : '→'}</span>`);
  function verifyBannerHTML(it) {
    const rec = pendingApproval(it);
    if (rec) return `<div class="verify-banner"><div>Waiting for verification · <b>${esc(rec.chainName || 'Verification')}</b></div><div class="vstages">${stagesHTML(rec)}</div></div>`;
    const last = it.approvals[0];
    if (last && last.state === 'rejected' && isOpen(it)) {
      const st = last.stages.find(s => s.state === 'rejected') || {};
      return `<div class="block-reason"><b>Sent back by ${esc(nameOf(st.by))} (${esc(groupName(st.roleId))}):</b> ${esc(st.note || last.response)}</div>`;
    }
    return '';
  }

  function renderBoard() {
    const list = visibleItems();
    const sts = cfg().statuses;
    const known = new Set(sts.map(s => s.id));
    const filtered = S.search || S.filters.teamId !== 'all' || S.filters.priorityId !== 'all' || S.filters.focus;
    $('#board').innerHTML = sts.map((st, idx) => {
      const its = list.filter(i => i.statusId === st.id || (idx === 0 && !known.has(i.statusId)));
      const empty = `<div class="empty-col">${S.items.length === 0 ? 'No items yet — create one or load the sample.' : filtered ? 'No matching items' : cfg().general.allowDrag ? 'Drop items here' : 'No items'}</div>`;
      return `<div class="col" data-status="${esc(st.id)}">
        <div class="col-head"><span class="dot" style="background:${esc(st.color)}"></span><h3>${esc(st.name)}</h3><span class="count">${its.length}</span></div>
        <div class="col-body">${its.map(cardHTML).join('') || empty}</div>
      </div>`;
    }).join('');
    alignCards();
  }

  // Cards at the same position in neighbouring columns share a height so their buttons line up.
  function alignCards() {
    const cols = $$('#board .col-body').map(c => [...c.querySelectorAll(':scope > .card')]);
    cols.flat().forEach(c => { c.style.minHeight = ''; });
    if ($('#view-board').hidden) return;
    const rows = Math.max(0, ...cols.map(c => c.length));
    for (let i = 0; i < rows; i++) {
      const row = cols.map(c => c[i]).filter(Boolean);
      if (row.length < 2) continue;
      const h = Math.max(...row.map(c => c.offsetHeight));
      row.forEach(c => { c.style.minHeight = h + 'px'; });
    }
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => alignCards());
  window.addEventListener('resize', () => { clearTimeout(alignCards.t); alignCards.t = setTimeout(alignCards, 120); });

  function alertText(a) {
    if (a.text) return a.text;
    const it = getItem(a.itemId);
    const ref = it ? it.ref : '(deleted item)';
    const title = it ? ` "${it.title}"` : '';
    const from = nameOf(a.fromId);
    switch (a.kind) {
      case 'next': return `You are the next owner of ${ref}${title} (set by ${from}).`;
      case 'assigned': return `${ref}${title} was assigned to you by ${from}.`;
    }
    return `${ref} needs your attention.`;
  }
  const alertLabel = a => a.label || ({ next: 'NEXT', assigned: 'ASSIGNED' }[a.kind]) || 'ALERT';

  function renderPanel() {
    const unread = unreadFor(S.viewerId);
    const me = sessionId();
    const viewing = S.viewerId !== me;
    renderTeamCard();
    $('#panelUnread').textContent = `${unread.length} unread ${unread.length === 1 ? 'alert' : 'alerts'}`;
    $('#panelUnread').classList.toggle('has', unread.length > 0);
    for (const el of [$('#inboxUnread')]) {
      el.textContent = `${unread.length} unread`;
      el.classList.toggle('has', unread.length > 0);
    }
    $('#inbox').innerHTML = unread.length
      ? unread.map(a => {
        const it = getItem(a.itemId);
        const offerOpen = a.kind === 'offer' && it && it.offer && it.offer.id === a.offerId;
        const ro = readOnly();
        const acc = !ro && offerOpen && offerAction(it, 'acceptOffer');
        const dec = !ro && offerOpen && offerAction(it, 'declineOffer');
        const pick = !ro && a.kind === 'queue' && it && it.queueId && offerAction(it, 'pickUp');
        const verifyOpen = !ro && a.kind === 'approval' && it && (pendingApproval(it) || {}).id === a.approvalId && myStage(it);
        const appr = verifyOpen && offerAction(it, 'approve');
        const rej = verifyOpen && offerAction(it, 'reject');
        const main = acc || pick || appr;
        const solid = (x, text) => `<button class="btn-sm" style="background:${esc(x.color)};border-color:${esc(shade(x.color))}" type="button" data-inbox-action="${esc(x.id)}" data-id="${esc(it.id)}">${esc(text || x.label)}</button>`;
        return `<div class="alert">
          <div class="alert-msg">${esc(alertText(a))}</div>
          <div class="alert-meta">${esc(alertLabel(a))} · from ${esc(nameOf(a.fromId))} · ${fmtTime(a.time)}</div>
          <div class="alert-actions">
            ${acc ? solid(acc, 'Review & accept') : ''}
            ${pick ? solid(pick) : ''}
            ${appr ? solid(appr) : ''}
            ${dec ? `<button class="btn-sm b-plain" type="button" data-inbox-action="${esc(dec.id)}" data-id="${esc(it.id)}">${esc(dec.label)}</button>` : ''}
            ${rej ? `<button class="btn-sm b-plain" type="button" data-inbox-action="${esc(rej.id)}" data-id="${esc(it.id)}">${esc(rej.label)}</button>` : ''}
            <button class="btn-sm ${main ? 'b-plain' : 'b-indigo'}" type="button" data-alert-open="${esc(a.id)}">Open item</button>
            ${main || ro ? '' : `<button class="btn-sm b-plain" type="button" data-alert-read="${esc(a.id)}">Mark read</button>`}
          </div></div>`;
      }).join('')
      : `<div class="empty-box">No unread alerts for the current viewer.</div>`;
    $('#activity').innerHTML = S.activity.length
      ? S.activity.slice(0, 40).map(a => `<div class="act"><div class="act-msg">${esc(a.msg)}</div><div class="act-meta"><span class="type">${esc(a.type)}</span> · ${fmtTime(a.time)}</div></div>`).join('')
      : `<div class="act"><div class="act-meta">No activity yet.</div></div>`;
    const ed = editingId && getItem(editingId);
    $('#formMode').textContent = ed ? `Editing ${ed.ref}` : 'New';
  }

  // For people who can view others: their team (team admins) or everyone (anyone-scope), with workload counts.
  function renderTeamCard() {
    const me = sessionId();
    const scope = permOf(me, 'viewAs');
    const card = $('#teamCard');
    card.hidden = scope === 'none';
    if (card.hidden) return;
    const ids = viewableIds();
    $('#teamCardTitle').textContent = scope === 'team' ? `My team: ${teamNameOf(personTeam(me)) || 'No team'}` : 'People';
    $('#teamCardCount').textContent = ids.length === 1 ? '1 person' : `${ids.length} people`;
    $('#teamMembers').innerHTML = ids.map(id => {
      const owned = S.items.filter(i => i.ownerId === id && isOpen(i)).length;
      const next = S.items.filter(i => i.nextOwnerId === id && isOpen(i)).length;
      const waiting = S.items.filter(i => i.offer && i.offer.toId === id).length;
      const queued = S.items.filter(i => i.queueId && rolesOf(id).some(r => r.queue && r.id === i.queueId)).length;
      return `<div class="member-row"><div class="grow"><b>${esc(nameOf(id))}</b>${id === me ? ' <span class="muted">(me)</span>' : ''}
          <div class="sub">${owned} open · ${next} next · ${waiting} to accept${queued ? ` · ${queued} in queue` : ''}</div></div>
          <button class="btn-sm ${id === S.viewerId ? 'b-indigo' : 'b-plain'}" type="button" data-view-as="${esc(id)}"${id === S.viewerId ? ' disabled' : ''}>${id === S.viewerId ? 'Viewing' : 'View'}</button></div>`;
    }).join('');
  }

  function itemOptions(selected) {
    return opt('', 'No linked item', !selected) + S.items.map(i => opt(i.id, `${i.ref} · ${i.title}`, i.id === selected)).join('');
  }
  const itemRef = id => (getItem(id) || {}).ref || '';

  function renderPosts() {
    $('#postRef').innerHTML = itemOptions($('#postRef').value);
    $('#postText').placeholder = `Share an update as ${viewerName()}…`;
    $('#postsCount').textContent = plural(S.posts.length, 'post');
    const list = [...S.posts].sort((a, b) => b.time - a.time);
    $('#postList').innerHTML = list.length ? list.map(p => `<div class="entry">
        <div class="entry-top"><b>${esc(nameOf(p.authorId))}</b><span class="when">${fmtTime(p.time)}</span>
          ${itemRef(p.itemId) ? `<button class="tag" style="${teamStyle(null)};border:0;cursor:pointer" type="button" data-goto="${esc(p.itemId)}">${esc(itemRef(p.itemId))}</button>` : ''}
          <span class="spacer"></span>
          ${p.authorId === S.viewerId && !readOnly() ? `<button class="btn-sm b-plain" type="button" data-post-del="${esc(p.id)}">Delete</button>` : ''}
        </div><p>${esc(p.text)}</p></div>`).join('')
      : `<div class="none">No posts yet.</div>`;
  }

  function renderFiles() {
    $('#fileRef').innerHTML = itemOptions($('#fileRef').value);
    $('#filesCount').textContent = plural(S.files.length, 'file');
    const list = [...S.files].sort((a, b) => b.time - a.time);
    $('#fileList').innerHTML = list.length ? list.map(f => `<div class="entry file-row">
        <div class="file-ico">${esc((String(f.name || '').split('.').pop() || 'file').slice(0, 4))}</div>
        <div class="file-meta"><div class="file-name" title="${esc(f.name)}">${esc(f.name)}</div>
          <div class="file-sub">${fmtSize(f.size)} · ${esc(nameOf(f.byId))} · ${fmtTime(f.time)}${itemRef(f.itemId) ? ` · ${esc(itemRef(f.itemId))}` : ''}${f.data ? '' : ' · metadata only'}</div></div>
        ${f.data ? `<button class="btn-sm b-indigo" type="button" data-file-dl="${esc(f.id)}">Download</button>` : ''}
        ${readOnly() ? '' : `<button class="btn-sm b-del" type="button" data-file-del="${esc(f.id)}">Remove</button>`}
      </div>`).join('') : `<div class="none">No files yet.</div>`;
  }

  function renderNotes() {
    $('#notesCount').textContent = plural(S.notes.length, 'note');
    const list = [...S.notes].sort((a, b) => b.time - a.time);
    const ro = readOnly();
    $('#notesList').innerHTML = list.length ? list.map(n => `<div class="entry">
        <div class="entry-top"><b>${esc(n.title)}</b><span class="when">${esc(nameOf(n.authorId))} · ${fmtTime(n.time)}</span><span class="spacer"></span>
          ${ro ? '' : `<button class="btn-sm b-plain" type="button" data-note-edit="${esc(n.id)}">Edit</button>
          <button class="btn-sm b-del" type="button" data-note-del="${esc(n.id)}">Delete</button>`}
        </div>${n.body ? `<p>${esc(n.body)}</p>` : ''}</div>`).join('')
      : `<div class="none">No notes yet.</div>`;
  }

  function renderOverview() {
    const sts = cfg().statuses;
    const num = v => `<td class="num">${v}</td>`;
    const rows = cfg().teams.map(t => {
      const its = scopedItems().filter(i => i.teamId === t.id);
      return `<tr data-team="${esc(t.id)}"><td><b>${esc(t.name)}</b></td>${num(its.filter(isOpen).length)}${sts.map(s => num(its.filter(i => i.statusId === s.id).length)).join('')}${num(its.filter(isOverdue).length)}${num(scopedItems().filter(i => isOpen(i) && i.nextTeamId === t.id).length)}</tr>`;
    }).join('');
    $('#overview').innerHTML = `<div style="overflow-x:auto"><table class="table"><thead><tr>
        <th>Team</th><th class="num">Open</th>${sts.map(s => `<th class="num">${esc(s.name)}</th>`).join('')}<th class="num">Overdue</th><th class="num">Incoming</th>
      </tr></thead><tbody>${rows}</tbody></table></div>`;
  }

  // ---------- toasts & dialog ----------
  // n = notification settings; previews pass the unsaved draft instead of the saved configuration.
  const noteCfg = () => cfg().notifications;
  const reducedMotion = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function noteAnim(n) {
    const a = ['slide', 'bounce', 'fade', 'none'].includes(n.animation) ? n.animation : 'slide';
    return a !== 'none' && n.reduceMotion && reducedMotion() ? 'fade' : a;
  }
  const noteMs = n => noteAnim(n) === 'none' ? 0 : Math.max(50, Math.min(2000, +n.animMs || 300));
  function placeToast(el, n) {
    const box = $('#toasts');
    box.className = `toasts pos-${n.position === 'top' ? 'top' : 'bottom'} al-${['left', 'center'].includes(n.align) ? n.align : 'right'} an-${noteAnim(n)}`;
    box.style.setProperty('--nd', noteMs(n) + 'ms');
    NOTE_VARS.forEach(([v, k]) => box.style.setProperty(v, n[k] || BASE_CONFIG.notifications[k]));
    // Newest sits nearest the edge it comes from: top of the stack when dropping down, bottom when rising up.
    if (n.position === 'top') box.prepend(el); else box.appendChild(el);
  }
  function toast(msg, n = noteCfg(), o = {}) {
    const el = document.createElement('div');
    el.className = 'toast msg';
    el.innerHTML = `<div class="t-text">${esc(msg)}</div>
      <div class="t-actions">${o.itemId ? '<button class="btn-sm b-indigo" type="button" data-t-open>Open item</button>' : ''}<button class="btn-sm b-plain" type="button" data-t-close>Dismiss</button></div>`;
    if (o.itemId) $('[data-t-open]', el).onclick = () => { dismiss(el, n); showItem(o.itemId); };
    $('[data-t-close]', el).onclick = () => dismiss(el, n);
    placeToast(el, n);
    if (!o.preview) recordNote({ kind: 'msg', text: msg, itemId: o.itemId || '' });
    if (n.sound && n.soundFor === 'all') chime(n);
    setTimeout(() => dismiss(el, n), Math.max(1, +n.toastSeconds || 4) * 1000);
  }
  function dismiss(el, n = noteCfg()) {
    if (!el.isConnected || el.classList.contains('out')) return;
    el.classList.add('out');
    setTimeout(() => el.remove(), noteMs(n));
  }

  function popCard(title, text, onOpen, n, meta = {}) {
    const el = document.createElement('div');
    el.className = 'toast pop';
    el.innerHTML = `<div class="t-title">🔔 ${esc(title)}</div><div>${esc(text)}</div>
      <div class="t-actions">${onOpen ? '<button class="btn-sm b-indigo" type="button" data-t-open>Open item</button>' : ''}<button class="btn-sm b-plain" type="button" data-t-close>Dismiss</button></div>`;
    if (onOpen) $('[data-t-open]', el).onclick = () => { dismiss(el, n); onOpen(); };
    $('[data-t-close]', el).onclick = () => dismiss(el, n);
    placeToast(el, n);
    setTimeout(() => dismiss(el, n), (+n.popupSeconds || 9) * 1000);
    if (!meta.preview) recordNote({ kind: 'alert', title, text, alertId: meta.alertId || '', itemId: meta.itemId || '' });
  }
  const popAlert = (a, n = noteCfg()) => popCard(`New alert for ${nameOf(a.toId)}`, alertText(a), () => openAlert(a.id), n, { alertId: a.id, itemId: a.itemId });

  // ---------- notification history ----------
  // Every pop-up and message is kept (per person, in this browser), so it can be read again after it has gone.
  const NOTE_LOG_KEY = 'taskhub.notifications';
  const NOTE_LOG_MAX = 50;
  // While the demo runs, notifications are kept in memory instead, so they never reach your real history.
  let demoNotes = null;
  const noteLogAll = () => {
    if (demo.running) return demoNotes || (demoNotes = {});
    try { return JSON.parse(localStorage.getItem(NOTE_LOG_KEY) || '{}') || {}; } catch (e) { return {}; }
  };
  const noteLog = () => (loggedIn() ? noteLogAll()[sessionId()] || [] : []);
  function saveNoteLog(list) {
    const all = noteLogAll();
    if (demo.running) { all[sessionId()] = list.slice(0, NOTE_LOG_MAX); return; }
    all[sessionId()] = list.slice(0, NOTE_LOG_MAX);
    try { localStorage.setItem(NOTE_LOG_KEY, JSON.stringify(all)); } catch (e) { /* storage full or unavailable */ }
  }
  const noteCentreOpen = () => !$('#noteCentre').hidden;
  function recordNote(entry) {
    if (!loggedIn()) return;
    saveNoteLog([Object.assign({ id: uid('nt'), time: Date.now(), seen: noteCentreOpen() }, entry), ...noteLog()]);
    renderNoteBell();
    if (noteCentreOpen()) renderNoteCentre();
  }
  function renderNoteBell() {
    const b = $('#btnBell');
    b.hidden = !loggedIn();
    const n = noteLog().filter(x => !x.seen).length;
    $('#bellCount').textContent = n > 99 ? '99+' : String(n);
    $('#bellCount').hidden = n === 0;
    b.setAttribute('aria-label', n ? `Notifications, ${n} new` : 'Notifications');
  }
  function renderNoteCentre() {
    $('#noteCentre').style.cssText = noteSampleVars(noteCfg());
    const list = noteLog();
    $('#noteList').innerHTML = list.length ? list.map(x => `<div class="nc-item ${x.kind === 'alert' ? 'is-alert' : 'is-msg'}${x.seen ? '' : ' new'}">
        <span class="nc-ico" aria-hidden="true">${x.kind === 'alert' ? '🔔' : '✓'}</span>
        <div class="nc-main">
          ${x.title ? `<div class="nc-title">${esc(x.title)}</div>` : ''}
          <div class="nc-text">${esc(x.text)}</div>
          <div class="nc-meta">${x.kind === 'alert' ? 'Alert' : 'Message'} · ${fmtTime(x.time)}</div>
        </div>
        ${x.itemId ? `<button class="btn-sm b-indigo" type="button" data-nc-open="${esc(x.id)}">Open item</button>` : ''}
      </div>`).join('') : '<div class="empty-box">No notifications yet. Pop-ups and messages you see appear here, so you can read them again.</div>';
    $('#noteClear').disabled = !list.length;
  }
  function openNoteCentre(open) {
    $('#noteCentre').hidden = !open;
    $('#btnBell').setAttribute('aria-expanded', String(open));
    if (open) {
      renderNoteCentre();
      // Opening the list counts as seeing everything in it.
      if (noteLog().some(x => !x.seen)) saveNoteLog(noteLog().map(x => Object.assign(x, { seen: true })));
      renderNoteBell();
    }
  }
  $('#btnBell').addEventListener('click', e => { e.stopPropagation(); openNoteCentre(!noteCentreOpen()); });
  $('#noteClear').addEventListener('click', () => { saveNoteLog([]); renderNoteCentre(); renderNoteBell(); });
  $('#noteList').addEventListener('click', e => {
    const b = e.target.closest('[data-nc-open]');
    if (!b) return;
    const x = noteLog().find(y => y.id === b.dataset.ncOpen);
    if (!x) return;
    openNoteCentre(false);
    if (x.alertId && S.alerts.some(a => a.id === x.alertId)) openAlert(x.alertId); else showItem(x.itemId);
  });
  document.addEventListener('click', e => { if (noteCentreOpen() && !e.target.closest('#noteCentre')) openNoteCentre(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && noteCentreOpen()) { openNoteCentre(false); $('#btnBell').focus(); } });

  // Sounds are synthesised with Web Audio, so no audio files are needed. Each partial is [frequency ratio, loudness, seconds to fade].
  const TONES = {
    bell:  [{ at: 0, hz: 830, parts: [[1, 1, 1.8], [2, .55, 1.2], [2.76, .4, .9], [5.4, .22, .5], [8.93, .1, .3]] }],
    chime: [{ at: 0, hz: 1318.5, parts: [[1, 1, 1.1], [2, .2, .5]] }, { at: .22, hz: 1046.5, parts: [[1, 1, 1.4], [2, .2, .6]] }],
    ding:  [{ at: 0, hz: 1568, parts: [[1, 1, .7], [3, .12, .25]] }],
  };
  let audioCtx = null;
  function audio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { audioCtx = audioCtx || new AC(); } catch (e) { return null; }
    return audioCtx;
  }
  function playTone(ac, n) {
    const vol = Math.max(0, Math.min(100, +n.volume || 0)) / 100;
    if (!vol) return;
    const notes = TONES[n.tone] || TONES.bell;
    const out = ac.createGain();
    out.gain.value = vol * .3;
    out.connect(ac.destination);
    const t0 = ac.currentTime + .02;
    notes.forEach(note => note.parts.forEach(([ratio, amp, fade]) => {
      const osc = ac.createOscillator(), g = ac.createGain(), s = t0 + note.at;
      osc.type = 'sine';
      osc.frequency.value = note.hz * ratio;
      g.gain.setValueAtTime(.0001, s);
      g.gain.exponentialRampToValueAtTime(amp, s + .006);
      g.gain.exponentialRampToValueAtTime(.0001, s + fade);
      osc.connect(g); g.connect(out);
      osc.start(s); osc.stop(s + fade + .05);
    }));
  }
  // Browsers only allow sound after the person has clicked or typed on the page; before that the bell is skipped rather than queued.
  // Notifications arriving together (an alert plus a "Signed in" message) share one sound; previews always play.
  let lastChime = 0;
  function chime(n = noteCfg(), force = false) {
    const ac = audio();
    if (!ac) return;
    if (!force && Date.now() - lastChime < 500) return;
    lastChime = Date.now();
    if (ac.state === 'running') return playTone(ac, n);
    const active = navigator.userActivation ? navigator.userActivation.hasBeenActive : true;
    if (active) ac.resume().then(() => playTone(ac, n), () => {});
  }
  ['pointerdown', 'keydown'].forEach(ev => document.addEventListener(ev, () => {
    if (noteCfg().sound && audio() && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  }, { capture: true, passive: true }));

  // Due-date reminders. Nothing runs in the background here, so they are raised whenever someone signs in, the page opens,
  // the configuration is saved, and every hour while signed in: the signed-in person's own open work that is overdue or due
  // within the warning period raises one alert a day (a new day's alert retires the day before's). Work waiting for
  // verification is with the verifiers, so it isn't reminded. Returns how many were raised.
  function remindDue() {
    const n = cfg().notifications;
    if (!loggedIn() || !n.dueReminders) return 0;
    const me = sessionId(), today = todayISO();
    const soon = addDays(today, Math.max(0, Math.min(60, Math.round(+n.dueSoonDays || 0))));
    let added = 0;
    S.items.forEach(it => {
      if (it.ownerId !== me || !it.due || !isOpen(it) || pendingApproval(it) || it.due > soon) return;
      const kind = it.due < today ? 'overdue' : 'soon';
      const key = `${it.id}|${kind}|${today}`;
      if (S.alerts.some(a => a.dueKey === key)) return;
      S.alerts.forEach(a => { if (a.kind === 'due' && a.itemId === it.id) a.read = true; });
      const days = Math.round((new Date(it.due) - new Date(today)) / 864e5);
      const when = days < 0 ? `was due on ${it.due} (${plural(-days, 'day')} ago)` : days === 0 ? 'is due today' : days === 1 ? 'is due tomorrow' : `is due in ${days} days (${it.due})`;
      S.alerts.unshift({ id: uid('al'), toId: me, fromId: '', itemId: it.id, kind: 'due', label: kind === 'overdue' ? 'OVERDUE' : 'DUE SOON', text: `${it.ref} "${it.title}" ${when}.`, dueKey: key, time: Date.now(), read: false, popped: false });
      added++;
    });
    return added;
  }
  function popPendingForViewer() {
    const pending = unreadFor(S.viewerId).filter(a => !a.popped);
    if (!pending.length) return;
    if (noteCfg().popups) {
      if (noteCfg().sound) chime();
      pending.slice(0, 3).forEach((a, i) => setTimeout(() => popAlert(a), 120 * i));
      if (pending.length > 3) setTimeout(() => toast(`+${pending.length - 3} more unread alerts in the Action Inbox.`), 400);
    }
    pending.forEach(a => { a.popped = true; });
    save();
  }

  const dlg = $('#dlg');
  function modal({ title, html, ok = 'Confirm', okClass = 'btn-red', onOpen, onOk, wide = false, noCancel = false }) {
    dlg.classList.toggle('wide', wide);
    $('#dlgBody').classList.toggle('scroll', wide);
    $('#dlg button[value="cancel"]').hidden = noCancel;
    $('#dlgTitle').textContent = title;
    $('#dlgBody').innerHTML = html;
    const okBtn = $('#dlgOk');
    okBtn.textContent = ok;
    okBtn.className = 'btn ' + okClass;
    okBtn.onclick = () => { if (onOk($('#dlgBody')) !== false) dlg.close(); };
    dlg.showModal();
    if (onOpen) onOpen($('#dlgBody'));
  }
  dlg.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !['TEXTAREA', 'BUTTON'].includes(e.target.tagName)) { e.preventDefault(); $('#dlgOk').click(); }
  });

  // ---------- events on items ----------
  // The workspace feed keeps the latest 300 events; each item keeps its own history as well.
  function log(msg, type, it) {
    const time = Date.now();
    // Work done on someone's behalf is recorded under them and under who really did it.
    const byId = S.session && S.viewerId !== sessionId() ? sessionId() : '';
    if (byId) msg = `${msg} (done by ${nameOf(byId)}, acting as ${viewerName()})`;
    S.activity.unshift(Object.assign({ id: uid('ac'), msg, type, time, itemId: it ? it.id : '' }, byId ? { actorId: S.viewerId, byId } : {}));
    if (S.activity.length > 300) S.activity.length = 300;
    if (it) {
      it.history = it.history || [];
      it.history.unshift(Object.assign({ time, type, text: msg, actorId: S.viewerId }, byId ? { byId } : {}));
      if (it.history.length > 200) it.history.length = 200;
    }
  }
  // Alerts never go to the person acting.
  function sendAlert(toId, it, fields) {
    if (!toId || toId === S.viewerId || !person(toId)) return false;
    S.alerts.unshift(Object.assign({ id: uid('al'), toId, fromId: S.viewerId, itemId: it.id, time: Date.now(), read: false, popped: false }, fields));
    return true;
  }
  const notifyKind = (kind, toId, it) => { if (cfg().notifications[kind]) sendAlert(toId, it, { kind }); };

  // Rendering is synchronous, so the card is normally on the page already; otherwise try again on the next frame.
  function flashCard(id, retry = true) {
    const el = document.getElementById('card-' + id);
    if (!el) { if (retry) requestAnimationFrame(() => flashCard(id, false)); return; }
    el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  }

  // o.enc escapes each value (for URLs or JSON); o.raw keeps line breaks (for email bodies).
  function fillTemplate(tpl, it, ctx = {}, snap = it, o = {}) {
    const map = {
      ref: it.ref, title: it.title, actor: viewerName(), owner: ownerLabel(it) || '—', nextOwner: nextLabel(it) || '—',
      prevOwner: nameOf(snap.ownerId) || '—', team: teamNameOf(it.teamId) || '—', nextTeam: teamNameOf(it.nextTeamId) || '—',
      status: statusName(it.statusId), priority: (priority(it.priorityId) || {}).name || '', due: it.due || 'no date', reason: ctx.reason || '',
      created: ctx.created || '', offerTo: nameOf((it.offer || {}).toId) || '—',
      note: (ctx.note || []).filter(n => n.text).map(n => `${n.label}: ${n.text}`).join(' · '),
    };
    const out = String(tpl || '').replace(/\{(\w+)\}/g, (m, k) => (has(map, k) ? (o.enc ? o.enc(String(map[k])) : map[k]) : m));
    return o.raw ? out : out.replace(/\s+/g, ' ').trim();
  }
  const jsonEsc = v => JSON.stringify(v).slice(1, -1);
  function openUrl(url, newTab) {
    const a = document.createElement('a');
    a.href = url;
    if (newTab) { a.target = '_blank'; a.rel = 'noopener'; }
    document.body.appendChild(a); a.click(); a.remove();
  }

  // Reusable steps ("Run another button", custom sequences) are expanded inline before running.
  // `path` holds the buttons and step types being expanded; one that would run itself again is skipped and noted in `loops`.
  function expandSteps(steps, snap, depth = 0, path = [], loops = []) {
    if (depth > 5) return [];
    const out = [];
    for (const s of steps) {
      if (!stepApplies(s, snap)) continue;
      if (s.type === 'runButton') {
        const a = cfg().actions.find(x => x.id === s.actionId);
        if (a && path.includes('a:' + a.id)) { loops.push(a.label || 'a button'); continue; }
        if (a) out.push(...expandSteps(a.steps, snap, depth + 1, [...path, 'a:' + a.id], loops));
        continue;
      }
      if (isCustomStep(s.type)) {
        const x = cfg().extensions.steps.find(y => 'x:' + y.id === s.type);
        if (!x) continue;
        if (x.mode === 'macro') {
          if (path.includes(s.type)) { loops.push(x.name || 'a step type'); continue; }
          out.push(...expandSteps(x.steps, snap, depth + 1, [...path, s.type], loops));
          continue;
        }
      }
      out.push(s);
    }
    return out;
  }

  // "Summary*, Open actions" → [{label:'Summary', required:true}, {label:'Open actions', required:false}]
  const noteSections = s => String(s.sections || 'Summary*').split(',').map(x => x.trim()).filter(Boolean)
    .map(x => ({ label: x.replace(/\*$/, '').trim(), required: x.endsWith('*') }));
  function handoverNoteHTML(note) {
    const filled = (note || []).filter(n => n.text);
    if (!filled.length) return '<div class="muted">No handover note was written.</div>';
    return filled.map(n => `<div class="note-sec"><b>${esc(n.label)}</b>${esc(n.text)}</div>`).join('');
  }
  // Closes the pending offer and records the outcome on the item's handover record.
  function settleOffer(it, state, text) {
    const o = it.offer;
    const rec = it.handovers.find(h => h.id === o.id);
    if (rec) Object.assign(rec, { state, response: text || '', settledBy: S.viewerId, settledAt: Date.now() });
    S.alerts.forEach(a => { if (a.offerId === o.id) a.read = true; });
    it.offer = null;
  }

  function notifyQueue(roleId, it, text) {
    let n = 0;
    cfg().people.filter(p => p.active && p.roleIds.includes(roleId)).forEach(p => { if (sendAlert(p.id, it, { kind: 'queue', label: 'QUEUE', text })) n++; });
    return n;
  }
  // An item that gets an owner is no longer waiting in a role queue: close the queued handover and clear its queue alerts.
  function leaveQueue(it) {
    if (!it.queueId) return;
    const rec = (it.handovers || []).find(h => h.state === 'queued' && h.toQueueId === it.queueId);
    if (rec) Object.assign(rec, { state: 'accepted', toId: it.ownerId, settledBy: S.viewerId, settledAt: Date.now() });
    S.alerts.forEach(x => { if (x.kind === 'queue' && x.itemId === it.id) x.read = true; });
    it.queueId = '';
  }
  // Puts an item into its next role queue; it has no owner until someone with the role picks it up.
  function queueItem(it, ctx, parts) {
    const q = it.nextQueueId;
    it.handovers.unshift({ id: uid('ho'), toQueueId: q, toId: '', toTeamId: it.nextTeamId, fromId: it.ownerId, byId: S.viewerId, time: Date.now(), note: ctx.note || [], state: 'queued' });
    it.ownerId = '';
    it.queueId = q;
    it.teamId = it.nextTeamId || it.teamId;
    it.nextQueueId = '';
    it.nextOwnerId = '';
    it.nextTeamId = '';
    parts.push(`sent to the ${queueName(q)} queue`);
    ctx.sent = (ctx.sent || 0) + notifyQueue(q, it, `${it.ref} "${it.title}" was sent to the ${queueName(q)} queue by ${viewerName()}. Pick it up to take ownership.`);
  }

  // Shared by the "Create a linked item" step and the script API.
  function createLinkedItem(parent, spec, ctx, snap, parts) {
    const findTeam = v => (team(v) ? v : (findByName(cfg().teams, v) || {}).id || '');
    const teamId = spec.team === 'same' ? parent.teamId
      : spec.team === 'next' ? (parent.nextTeamId || (team(parent.teamId) || {}).nextTeamId || parent.teamId)
      : (findTeam(spec.team) || parent.teamId);
    const lead = (team(teamId) || {}).leadId;
    const ownerId = spec.owner === 'nextOwner' ? parent.nextOwnerId
      : spec.owner === 'viewer' ? S.viewerId
      : spec.owner === 'lead' ? (lead && isActive(lead) ? lead : '')
      : spec.owner === 'none' || !spec.owner ? ''
      : (person(spec.owner) ? spec.owner : (findByName(cfg().people, spec.owner) || {}).id || '');
    const st = status(spec.status) || findByName(cfg().statuses, spec.status);
    const statusId = st && !st.closed ? st.id : cfg().general.initialStatusId;
    const pr = priority(spec.priority) || findByName(cfg().priorities, spec.priority);
    const now = Date.now();
    const child = {
      id: uid('i'), ref: nextRef(), title: fillTemplate(spec.title || '{title}', parent, ctx, snap) || 'New item',
      desc: fillTemplate(spec.desc || '', parent, ctx, snap), priorityId: pr ? pr.id : parent.priorityId, statusId,
      prevStatusId: '', blockReason: '', teamId, ownerId, nextTeamId: '', nextOwnerId: '',
      due: spec.dueDays !== '' && spec.dueDays != null && Number.isFinite(+spec.dueDays) ? addDays(todayISO(), +spec.dueDays) : '',
      fields: spec.copyFields ? clone(parent.fields || {}) : {}, links: [{ itemId: parent.id, type: 'From' }], created: now, updated: now,
    };
    itemDefaults(child);
    S.items.push(child);
    parent.links = parent.links || [];
    parent.links.push({ itemId: child.id, type: spec.linkType || 'Linked' });
    ctx.created = child.ref;
    parts.push(`created ${child.ref}`);
    log(`${child.ref} created from ${parent.ref} by ${viewerName()}.`, 'CREATE', child);
    if (spec.notify !== false && sendAlert(ownerId, child, { kind: 'custom', label: 'CREATED', text: `${child.ref} "${child.title}" was created for you by ${viewerName()} (from ${parent.ref}).` })) ctx.sent = (ctx.sent || 0) + 1;
    return child.ref;
  }

  // Lets scripts change an item by field name; returns a description for the activity log.
  function setByName(it, name, value) {
    const n = String(name || '').trim();
    const low = n.toLowerCase();
    const findP = v => person(v) || findByName(cfg().people, v);
    const findT = v => team(v) || findByName(cfg().teams, v);
    switch (low) {
      case 'title': it.title = String(value); return 'title changed';
      case 'desc': case 'description': it.desc = String(value); return 'description changed';
      case 'due': it.due = value ? String(value).slice(0, 10) : ''; return it.due ? `due date set to ${it.due}` : 'due date cleared';
      case 'status': { const st = status(value) || findByName(cfg().statuses, value); if (!st) throw new Error(`Unknown status “${value}”`); const p = moveStatus(it, st.id) ? [`moved to ${st.name}`] : []; gateParts(p, {}); return p.join('; '); }
      case 'priority': { const p = priority(value) || findByName(cfg().priorities, value); if (!p) throw new Error(`Unknown priority “${value}”`); it.priorityId = p.id; return `priority set to ${p.name}`; }
      case 'owner': { const p = value ? findP(value) : null; if (value && !p) throw new Error(`Unknown person “${value}”`); it.ownerId = p ? p.id : ''; if (p) leaveQueue(it); if (p && p.teamId) it.teamId = p.teamId; return p ? `assigned to ${p.name}` : 'unassigned'; }
      case 'nextowner': { const p = value ? findP(value) : null; if (value && !p) throw new Error(`Unknown person “${value}”`); it.nextOwnerId = p ? p.id : ''; it.nextTeamId = p ? (p.teamId || it.nextTeamId) : ''; return p ? `next owner set to ${p.name}` : 'next owner cleared'; }
      case 'team': case 'nextteam': { const t = value ? findT(value) : null; if (value && !t) throw new Error(`Unknown team “${value}”`); it[low === 'team' ? 'teamId' : 'nextTeamId'] = t ? t.id : ''; return `${low === 'team' ? 'team' : 'next team'} set to ${t ? t.name : 'none'}`; }
    }
    const f = cfg().fields.custom.find(x => x.id === n || x.label.toLowerCase() === low);
    if (!f) throw new Error(`Unknown field “${n}”`);
    const r = parseCustom(f, value);
    if (r.error) throw new Error(r.error);
    it.fields = it.fields || {};
    it.fields[f.id] = r.value;
    return `${f.label} set to ${customValueText(f, r.value) || 'empty'}`;
  }

  function runScriptStep(x, s, it, snap, ctx, parts) {
    if (!scriptsOn()) { ctx.scriptsOff = true; return; }
    const api = Object.assign({}, scriptApi, {
      item: itemView(it), before: itemView(snap), params: Object.assign(paramDefaults(x), s.params || {}),
      viewer: viewerView(), today: todayISO(), reason: ctx.reason || '',
      set: (name, value) => { const d = setByName(it, name, value); if (d) parts.push(d); },
      alert: (who, text) => {
        const p = who === 'owner' ? person(it.ownerId) : who === 'nextOwner' ? person(it.nextOwnerId) : (person(who) || findByName(cfg().people, who));
        if (p && sendAlert(p.id, it, { kind: 'custom', label: (x.name || 'SCRIPT').toUpperCase(), text: String(text) })) ctx.sent = (ctx.sent || 0) + 1;
      },
      log: text => parts.push(String(text)),
      createItem: spec => createLinkedItem(it, Object.assign({ team: 'same', owner: 'none', priority: 'same', linkType: 'Linked' }, spec || {}), ctx, snap, parts),
      openUrl: url => openUrl(String(url), true),
      fetch: (url, opts) => fetch(url, opts),
      template: str => fillTemplate(str, it, ctx, snap),
    });
    try {
      compileScript(x.script, ['ctx'], false)(api);
    } catch (e) {
      toast(`Step “${x.name}” failed: ${e.message}`);
      log(`Step “${x.name}” failed on ${it.ref}: ${e.message}`, 'SCRIPT', it);
    }
  }

  function stepApplies(step, snap) {
    if (!step.when) return true;
    const [mode, fid] = step.when.split(':');
    const m = filterMatches(fid, snap);
    return mode === 'if' ? m : !m;
  }
  function personTarget(to, it, forNext) {
    if (to === 'viewer') return S.viewerId;
    if (to === 'none') return '';
    if (to === 'nextOwner') return it.nextOwnerId;
    if (to === 'lead') { const t = team(forNext ? (it.nextTeamId || it.teamId) : it.teamId); return t && t.leadId && isActive(t.leadId) ? t.leadId : ''; }
    return person(to) ? to : '';
  }
  function holdReturnTarget(it) {
    const p = status(it.prevStatusId);
    return p && !p.closed && !p.hold ? p.id : cfg().general.initialStatusId;
  }
  // Status changes keep the hold and verification bookkeeping in one place. Finishing an item that has a
  // verification route (or dropping it in the Verification column) sends it for verification instead;
  // moving it anywhere else while it waits withdraws the request. o.bypass is used by verification itself.
  function moveStatus(it, target, reason = '', o = {}) {
    if (!status(target) || target === it.statusId) return false;
    if (!o.bypass) {
      const rec = pendingApproval(it);
      const hold = ap().holdStatusId;
      const finishing = needsVerification(target) || (!!hold && target === hold);
      if (rec && finishing) { gate = { type: 'waiting', text: `${it.ref} is still waiting for verification by ${openStages(rec).map(s => groupName(s.roleId)).join(' and ')}.` }; return false; }
      if (rec) { settleApproval(rec, 'recalled', `Moved to ${statusName(target)}`); gate = { type: 'recalled', rec }; }
      else if (finishing && !isClosedStatus(it.statusId)) {
        const chain = chainFor(it);
        if (chain) { submitForApproval(it, chain, needsVerification(target) ? target : firstClosingId()); return false; }
      }
    }
    if (isHoldStatus(target) && !isHoldStatus(it.statusId)) it.prevStatusId = it.statusId;
    it.blockReason = isHoldStatus(target) ? reason : '';
    it.statusId = target;
    return true;
  }

  // Runs a configured button: collect any input first, then apply each step in order.
  function runAction(actionId, itemId) {
    const a = cfg().actions.find(x => x.id === actionId);
    const it = getItem(itemId);
    if (!a || !it || !guardWrite()) return;
    // A page that hasn't redrawn yet can still have a button the item no longer shows: it does nothing.
    if (!actionVisible(a, it)) {
      const verifying = a.steps.some(s => s.type === 'approve' || s.type === 'reject');
      toast(verifying && actingForSomeoneElse() && pendingApproval(it)
        ? `Verification can’t be given on someone else’s behalf: only ${viewerName()} can verify as themself. Switch back to yourself first.`
        : `${a.label} doesn’t apply to ${it.ref} any more.`);
      render(); return;
    }
    const snap = clone(it);
    const loops = [];
    const steps = expandSteps(a.steps, snap, 0, ['a:' + a.id], loops);
    if (loops.length) toast(`${a.label}: “${loops[0]}” would run itself again in a loop, so the repeat was skipped. Fix this in Configuration › Workflow & buttons.`);
    if (!steps.length) { toast(`${a.label}: nothing to do for ${it.ref}.`); return; }
    const gather = steps.filter(s => (STEP_TYPES[s.type] || {}).gather);
    if (!gather.length) { applySteps(a, it, snap, steps, {}); return; }
    const parts = [];
    gather.forEach((s, i) => {
      if (s.type === 'confirm') parts.push(`<div>${esc(fillTemplate(s.message, snap))}</div>`);
      if (s.type === 'delete') parts.push(`<div>This permanently removes <b>${esc(it.title)}</b> and its alerts.</div>`);
      if (s.type === 'reason') parts.push(`<label><span>${esc(s.prompt || 'Reason')}${s.required ? ' *' : ''}</span><textarea class="textarea" data-reason="${i}" data-required="${s.required ? 1 : ''}"></textarea></label>`);
      if (s.type === 'handoverNote') {
        parts.push(it.nextOwnerId
          ? `<div class="muted">Handing over to <b>${esc(nameOf(it.nextOwnerId))}</b>${it.nextTeamId ? ` (${esc(teamNameOf(it.nextTeamId))})` : ''}. They will read this before accepting.</div>`
          : `<div class="muted">Sending to the <b>${esc(queueName(it.nextQueueId))}</b> queue. Whoever picks it up will see this note.</div>`);
        noteSections(s).forEach((sec, k) => parts.push(`<label><span>${esc(sec.label)}${sec.required ? ' *' : ''}</span><textarea class="textarea" data-note="${k}" data-label="${esc(sec.label)}" data-required="${sec.required ? 1 : ''}" style="min-height:70px"></textarea></label>`));
      }
      if (s.type === 'acceptOffer' && it.offer) {
        const o = it.offer;
        parts.push(`<div><b>${esc(nameOf(o.fromId))}</b> is handing <b>${esc(it.ref)} “${esc(it.title)}”</b> to you${o.toTeamId ? ` (${esc(teamNameOf(o.toTeamId))})` : ''}. Read the handover note, then accept to take ownership.</div>`);
        parts.push(handoverNoteHTML(o.note));
      }
      if (s.type === 'pickNext') {
        const people = activePeople().filter(p => p.id !== it.ownerId);
        const queues = cfg().roles.filter(r => r.queue);
        parts.push(`<label><span>${esc(label('nextOwner'))}</span><select class="select" id="m_owner">${opt('', '— None —', !it.nextOwnerId && !it.nextQueueId)}${people.map(p => opt(p.id, p.name, p.id === it.nextOwnerId)).join('')}${queues.length ? `<optgroup label="Role queues">${queues.map(r => opt('q:' + r.id, `Queue: ${r.name}`, r.id === it.nextQueueId)).join('')}</optgroup>` : ''}</select></label>
          <label><span>${esc(label('nextTeam'))}</span><select class="select" id="m_team">${opt('', '— None —', !it.nextTeamId)}${cfg().teams.map(t => opt(t.id, t.name, t.id === it.nextTeamId)).join('')}</select></label>`);
      }
    });
    parts.push('<div class="form-error" id="m_err"></div>');
    modal({
      title: `${a.label} · ${it.ref}`,
      html: parts.join(''),
      ok: a.label || 'Confirm',
      onOpen: body => {
        const sel = $('#m_owner', body);
        if (sel) sel.addEventListener('change', () => { if (!sel.value.startsWith('q:')) $('#m_team', body).value = sel.value ? personTeam(sel.value) : ''; });
        const first = $('textarea, select', body);
        if (first) first.focus();
      },
      onOk: body => {
        const reasons = $$('[data-reason]', body);
        const missing = reasons.find(r => r.dataset.required && !r.value.trim());
        if (missing) { $('#m_err', body).textContent = 'Please give a reason.'; missing.focus(); return false; }
        const noteEls = $$('[data-note]', body);
        const noteMissing = noteEls.find(n => n.dataset.required && !n.value.trim());
        if (noteMissing) { $('#m_err', body).textContent = `Please fill in “${noteMissing.dataset.label}”.`; noteMissing.focus(); return false; }
        const ctx = { reason: reasons.map(r => r.value.trim()).filter(Boolean).join(' ') };
        if (noteEls.length) ctx.note = noteEls.map(n => ({ label: n.dataset.label, text: n.value.trim() }));
        if ($('#m_owner', body)) {
          const v = $('#m_owner', body).value;
          const q = v.startsWith('q:') ? v.slice(2) : '';
          ctx.next = { ownerId: q ? '' : v, queueId: q, teamId: $('#m_team', body).value || (q ? '' : personTeam(v)) };
        }
        applySteps(a, it, snap, steps, ctx);
      },
    });
  }

  function applySteps(a, it, snap, steps, ctx) {
    takeGate();
    const parts = [];
    const notes = [];
    let type = 'EDIT';
    let openEditor = false;
    let deleted = false;
    run: for (const s of steps) {
      switch (s.type) {
        case 'setStatus': {
          const target = s.to === '__prev' ? holdReturnTarget(it) : s.to;
          if (moveStatus(it, target, ctx.reason)) { parts.push(`moved to ${statusName(target)}`); type = isHoldStatus(target) ? 'BLOCK' : (type === 'HANDOFF' ? type : 'STATUS'); }
          type = gateParts(parts, ctx) || type;
          break;
        }
        case 'transfer': {
          if (!it.nextOwnerId && it.nextQueueId) { queueItem(it, ctx, parts); type = 'HANDOFF'; break; }
          if (!it.nextOwnerId) break;
          const from = it.ownerId;
          it.ownerId = it.nextOwnerId;
          leaveQueue(it);
          it.teamId = it.nextTeamId || personTeam(it.ownerId) || it.teamId;
          it.nextOwnerId = '';
          it.nextTeamId = '';
          parts.push(`handed off from ${nameOf(from) || '—'} to ${nameOf(it.ownerId)}`);
          type = 'HANDOFF';
          break;
        }
        case 'route': {
          const t = team(it.teamId);
          if (!t || !t.nextTeamId) break;
          it.nextTeamId = t.nextTeamId;
          if (s.useLead) { const nt = team(t.nextTeamId); it.nextOwnerId = nt && nt.leadId && nt.leadId !== it.ownerId && isActive(nt.leadId) ? nt.leadId : ''; }
          parts.push(`routed to ${teamNameOf(it.nextTeamId)}${it.nextOwnerId ? ` (${nameOf(it.nextOwnerId)})` : ''}`);
          break;
        }
        case 'pickNext': {
          if (!ctx.next) break;
          if (ctx.next.ownerId === it.nextOwnerId && ctx.next.queueId === it.nextQueueId && ctx.next.teamId === it.nextTeamId) break;
          it.nextOwnerId = ctx.next.ownerId;
          it.nextQueueId = ctx.next.queueId || '';
          it.nextTeamId = ctx.next.teamId;
          parts.push(it.nextOwnerId || it.nextQueueId ? `next owner set to ${nextLabel(it)}${it.nextTeamId ? ` (${teamNameOf(it.nextTeamId)})` : ''}` : 'next owner cleared');
          break;
        }
        case 'setOwner': {
          const id = personTarget(s.to, it, false);
          if (id === it.ownerId) break;
          it.ownerId = id;
          if (id) leaveQueue(it);
          if (id && personTeam(id)) it.teamId = personTeam(id);
          if (id && id === it.nextOwnerId) { it.nextOwnerId = ''; it.nextTeamId = ''; }
          parts.push(id ? `assigned to ${nameOf(id)}` : 'unassigned');
          type = 'ASSIGN';
          break;
        }
        case 'setNext': {
          const id = personTarget(s.to, it, true);
          if (id === it.nextOwnerId || (id && id === it.ownerId)) break;
          it.nextOwnerId = id;
          it.nextTeamId = id ? (personTeam(id) || it.nextTeamId) : '';
          parts.push(id ? `next owner set to ${nameOf(id)}` : 'next owner cleared');
          break;
        }
        case 'setPriority':
          if (priority(s.to) && s.to !== it.priorityId) { it.priorityId = s.to; parts.push(`priority set to ${priority(s.to).name}`); }
          break;
        case 'setDue': {
          const due = s.clear ? '' : addDays(todayISO(), +s.days || 0);
          if (due !== it.due) { it.due = due; parts.push(due ? `due date set to ${due}` : 'due date cleared'); }
          break;
        }
        case 'setField': {
          const f = cfg().fields.custom.find(x => x.id === s.fieldId);
          if (!f) break;
          const r = parseCustom(f, s.value);
          if (r.error) { toast(`${a.label}: ${r.error}`); break; }
          it.fields = it.fields || {};
          it.fields[f.id] = r.value;
          parts.push(`${f.label} set to ${customValueText(f, r.value) || 'empty'}`);
          break;
        }
        case 'createItem': createLinkedItem(it, s, ctx, snap, parts); break;
        case 'handoverNote': break;
        case 'offer': {
          // Handing to a role queue needs no acceptance: picking the item up is the acceptance.
          if (!it.nextOwnerId && it.nextQueueId && !it.offer) { queueItem(it, ctx, parts); type = 'HANDOFF'; break; }
          if (!it.nextOwnerId || it.offer) break;
          const o = { id: uid('ho'), toId: it.nextOwnerId, toTeamId: it.nextTeamId || personTeam(it.nextOwnerId), fromId: it.ownerId, byId: S.viewerId, time: Date.now(), note: ctx.note || [] };
          it.offer = o;
          it.handovers.unshift(Object.assign({}, o, { state: 'pending' }));
          parts.push(`offered to ${nameOf(o.toId)} for acceptance`);
          type = 'HANDOFF';
          if (sendAlert(o.toId, it, { kind: 'offer', label: 'HANDOFF REQUEST', offerId: o.id, text: `${nameOf(o.fromId)} wants to hand off ${it.ref} "${it.title}" to you. Read the handover note and accept or decline.` })) ctx.sent = (ctx.sent || 0) + 1;
          break;
        }
        case 'acceptOffer': {
          const o = it.offer;
          if (!o) break;
          const from = it.ownerId;
          it.ownerId = o.toId;
          leaveQueue(it);
          it.teamId = o.toTeamId || personTeam(o.toId) || it.teamId;
          it.nextOwnerId = '';
          it.nextTeamId = '';
          moveStatus(it, s.land);
          settleOffer(it, 'accepted', ctx.reason);
          parts.push(`handed off from ${nameOf(from) || '—'} to ${nameOf(it.ownerId)} (accepted)`);
          type = 'HANDOFF';
          break;
        }
        case 'pickUp': {
          if (!it.queueId) break;
          if (!viewerQueueIds().includes(it.queueId)) { toast(`Only people with the ${queueName(it.queueId)} role can pick this up.`); break; }
          const q = it.queueId;
          it.ownerId = S.viewerId;
          it.teamId = personTeam(S.viewerId) || it.teamId;
          it.queueId = '';
          if (s.land) moveStatus(it, s.land);
          const rec = it.handovers.find(h => h.state === 'queued' && h.toQueueId === q);
          if (rec) {
            Object.assign(rec, { state: 'accepted', toId: S.viewerId, settledBy: S.viewerId, settledAt: Date.now() });
            if (rec.fromId && sendAlert(rec.fromId, it, { kind: 'custom', label: 'PICKED UP', text: `${viewerName()} picked up ${it.ref} "${it.title}" from the ${queueName(q)} queue.` })) ctx.sent = (ctx.sent || 0) + 1;
          }
          S.alerts.forEach(x => { if (x.kind === 'queue' && x.itemId === it.id) x.read = true; });
          parts.push(`picked up from the ${queueName(q)} queue`);
          type = 'HANDOFF';
          break;
        }
        case 'approve': case 'reject': {
          const rec = pendingApproval(it);
          if (!rec) break;
          if (actingForSomeoneElse()) { toast(`Verification can’t be given on someone else’s behalf: only ${viewerName()} can verify as themself. Switch back to yourself first.`); break; }
          const st = myStage(it);
          if (!st) { toast(`You can’t verify ${it.ref}: ${openStages(rec).some(s => rolesOf(S.viewerId).some(r => r.id === s.roleId)) ? 'you did this work or already verified another step' : `it is waiting for ${openStages(rec).map(s => groupName(s.roleId)).join(' and ')}`}.`); break; }
          const tell = (label, text) => uniq([rec.submittedBy, it.ownerId]).forEach(pid => { if (sendAlert(pid, it, { kind: 'custom', label, text })) ctx.sent = (ctx.sent || 0) + 1; });
          Object.assign(st, { state: s.type === 'approve' ? 'approved' : 'rejected', by: S.viewerId, at: Date.now(), note: ctx.reason || '' });
          readApprovalAlerts(rec, st.roleId);
          type = 'VERIFY';
          if (s.type === 'reject') {
            settleApproval(rec, 'rejected', ctx.reason);
            const back = returnStatus(rec, it);
            moveStatus(it, back, '', { bypass: true });
            parts.push(`sent back by ${groupName(st.roleId)} (verification rejected)`);
            tell('SENT BACK', `${viewerName()} (${groupName(st.roleId)}) sent ${it.ref} "${it.title}" back: ${ctx.reason}. It is in ${statusName(back)} again.`);
            break;
          }
          parts.push(`verified for ${groupName(st.roleId)}`);
          if (openStages(rec).length) break;
          const next = rec.stages.find(x => x.state === 'waiting');
          if (next) {
            next.state = 'pending';
            ctx.sent = (ctx.sent || 0) + alertStages(it, rec, [next]);
            parts.push(`passed to ${groupName(next.roleId)}`);
            break;
          }
          settleApproval(rec, 'approved', ctx.reason);
          moveStatus(it, rec.targetStatusId, '', { bypass: true });
          parts.push(`passed verification and moved to ${statusName(it.statusId)}`);
          tell('VERIFIED', `${it.ref} "${it.title}" passed verification (${routeText(rec)}) and is now ${statusName(it.statusId)}.`);
          break;
        }
        case 'recallApproval': {
          const rec = pendingApproval(it);
          if (!rec) break;
          settleApproval(rec, 'recalled', ctx.reason);
          moveStatus(it, returnStatus(rec, it), '', { bypass: true });
          parts.push(`verification request withdrawn (back in ${statusName(it.statusId)})`);
          type = 'VERIFY';
          break;
        }
        case 'declineOffer':
          if (!it.offer) break;
          parts.push(`handoff declined by ${viewerName()}`);
          settleOffer(it, 'declined', ctx.reason);
          type = 'HANDOFF';
          break;
        case 'withdrawOffer':
          if (!it.offer) break;
          parts.push(`handoff to ${nameOf(it.offer.toId)} withdrawn`);
          settleOffer(it, 'withdrawn', ctx.reason);
          type = 'HANDOFF';
          break;
        case 'notify': case 'email': case 'webhook': notes.push(s); break;
        case 'edit': openEditor = true; break;
        case 'delete': {
          S.items = S.items.filter(i => i.id !== it.id);
          S.items.forEach(i => { i.links = (i.links || []).filter(l => l.itemId !== it.id); });
          S.alerts = S.alerts.filter(x => x.itemId !== it.id);
          S.posts.forEach(p => { if (p.itemId === it.id) p.itemId = ''; });
          S.files.forEach(f => { if (f.itemId === it.id) f.itemId = ''; });
          if (editingId === it.id) resetForm();
          // Nothing after a delete can change the item, but the alerts, emails and webhooks queued so far still go out.
          deleted = true;
          break run;
        }
        default:
          if (isCustomStep(s.type)) {
            const x = cfg().extensions.steps.find(y => 'x:' + y.id === s.type);
            if (x) runScriptStep(x, s, it, snap, ctx, parts);
          }
      }
    }
    if (ctx.scriptsOff) toast('Scripts are turned off, so script steps were skipped (Configuration › Extensions).');
    // Alerts, emails and webhooks go out after every change so messages describe the final state.
    let sent = ctx.sent || 0;
    const personFor = (who, pid) => (who === 'owner' ? it.ownerId : who === 'nextOwner' ? it.nextOwnerId : who === 'prevOwner' ? snap.ownerId : pid);
    notes.forEach(s => {
      if (s.type === 'notify') {
        const to = personFor(s.who, s.personId);
        if (s.onlyIfChanged && ((s.who === 'owner' && to === snap.ownerId) || (s.who === 'nextOwner' && to === snap.nextOwnerId))) return;
        if (sendAlert(to, it, { kind: 'custom', label: a.label.toUpperCase(), text: fillTemplate(s.message, it, ctx, snap) })) sent++;
      }
      if (s.type === 'email') {
        let addr = '';
        if (s.to === 'address') addr = fillTemplate(s.address, it, ctx, snap);
        else {
          const pid = personFor(s.to, s.personId);
          addr = (person(pid) || {}).email || '';
          if (!addr) { toast(`No email address for ${nameOf(pid) || 'that person'}. Add one in Configuration › People.`); return; }
        }
        openUrl(`mailto:${encodeURIComponent(addr)}?subject=${encodeURIComponent(fillTemplate(s.subject, it, ctx, snap))}&body=${encodeURIComponent(fillTemplate(s.body, it, ctx, snap, { raw: true }))}`);
        parts.push(`email drafted to ${addr}`);
      }
      if (s.type === 'webhook') {
        const url = fillTemplate(s.url, it, ctx, snap, { enc: encodeURIComponent });
        const body = s.method === 'GET' ? undefined : fillTemplate(s.body, it, ctx, snap, { enc: jsonEsc, raw: true });
        const ref = it.ref;
        // The history is read by everyone (and saved to a shared data file); a webhook's path or query often holds its key.
        let site = '';
        try { site = new URL(url).host; } catch (e) { site = 'an invalid address'; }
        parts.push(`webhook ${s.method} sent`);
        fetch(url, { method: s.method, headers: body ? { 'Content-Type': 'application/json' } : undefined, body })
          .then(r => { log(`Webhook for ${ref}: ${s.method} to ${site} → ${r.status}`, 'WEBHOOK', getItem(it.id)); toast(`Webhook for ${ref} returned ${r.status}.`); })
          .catch(err => { log(`Webhook for ${ref} failed: ${err.message}`, 'WEBHOOK', getItem(it.id)); toast(`Webhook for ${ref} failed: ${err.message}`); })
          .finally(() => { save(); renderPanel(); });
      }
    });
    if (deleted) {
      log(`${it.ref} deleted by ${viewerName()}${parts.length ? ` (${parts.join('; ')})` : ''}.`, 'DELETE');
      commit();
      toast(`${it.ref} deleted.${sent ? ` ${plural(sent, 'alert')} sent.` : ''}`);
      return;
    }
    if (parts.length) {
      it.updated = Date.now();
      log(`${it.ref} ${parts.join('; ')} by ${viewerName()}${ctx.reason ? `: ${ctx.reason}` : ''}.`, type, it);
    }
    commit();
    flashCard(it.id);
    if (openEditor) { fillForm(it); focusForm(); return; }
    if (parts.length) toast(`${it.ref} ${parts.join('; ')}.${sent ? ` ${plural(sent, 'alert')} sent.` : ''}`, undefined, { itemId: it.id });
    else if (!sent) toast(`${a.label}: nothing changed on ${it.ref}.`, undefined, { itemId: it.id });
  }

  function openAlert(alertId) {
    const a = S.alerts.find(x => x.id === alertId);
    if (!a) return;
    if (!readOnly()) a.read = true;
    const it = getItem(a.itemId);
    setPage('board', () => { if (it && !visibleItems().some(i => i.id === it.id)) resetFilters(); });
    if (it) flashCard(it.id); else toast('That item no longer exists.');
  }
  // ---------- item details: handovers, comments, history ----------
  const HSTATE = { pending: 'Awaiting acceptance', queued: 'In queue', accepted: 'Accepted', declined: 'Declined', withdrawn: 'Withdrawn' };
  function itemDetailsHTML(it) {
    const f = (l, v, cls = '') => `<div class="field"><div class="field-l">${esc(l)}</div><div class="field-v ${cls}">${esc(v || '—')}</div></div>`;
    const meta = [
      f(label('status'), statusName(it.statusId)), f(label('priority'), (priority(it.priorityId) || {}).name),
      f(label('owner'), nameOf(it.ownerId)), f(label('team'), teamNameOf(it.teamId)),
      f(label('nextOwner'), nameOf(it.nextOwnerId)), f(label('nextTeam'), teamNameOf(it.nextTeamId)),
      f(label('due'), it.due, isOverdue(it) ? 'overdue' : ''),
      ...cfg().fields.custom.map(cf => f(cf.label, customValueText(cf, it.fields[cf.id]))),
    ].join('');
    const responseLabel = h => (h.state === 'accepted' ? `Read-back from ${nameOf(h.settledBy)}` : h.state === 'declined' ? 'Reason for declining' : 'Note');
    const handovers = it.handovers.length ? it.handovers.map(h => `<div class="handover">
        <div class="handover-top"><b>${esc(nameOf(h.fromId) || "—")} → ${esc(h.toQueueId ? `Queue: ${queueName(h.toQueueId)}${h.toId ? ` · ${nameOf(h.toId)}` : ""}` : nameOf(h.toId))}</b><span class="hstate ${esc(h.state)}">${esc(HSTATE[h.state] || h.state)}</span><span class="muted">${fmtTime(h.time)}</span></div>
        ${handoverNoteHTML(h.note)}
        ${h.response ? `<div class="note-sec"><b>${esc(responseLabel(h))}</b>${esc(h.response)}</div>` : ''}
        ${h.settledAt ? `<div class="muted" style="margin-top:6px">${esc(HSTATE[h.state] || h.state)} by ${esc(nameOf(h.settledBy))} · ${fmtTime(h.settledAt)}</div>` : ''}
      </div>`).join('') : '<p class="muted" style="margin:0">No handoffs yet.</p>';
    const VSTATE = { pending: 'Waiting', approved: 'Verified', rejected: 'Sent back', recalled: 'Withdrawn' };
    const route = chainFor(it);
    const verifications = it.approvals.length ? it.approvals.map(r => `<div class="handover">
        <div class="handover-top"><b>${esc(r.chainName || 'Verification')}</b><span class="hstate ${esc(r.state === 'approved' ? 'accepted' : r.state === 'rejected' ? 'declined' : r.state)}">${esc(VSTATE[r.state] || r.state)}</span><span class="muted">sent by ${esc(nameOf(r.submittedBy))} · ${fmtTime(r.time)}</span></div>
        <div class="vstages">${stagesHTML(r)}</div>
        ${r.stages.filter(s => s.by).map(s => `<div class="note-sec"><b>${esc(groupName(s.roleId))}: ${esc(s.state === 'approved' ? 'verified' : 'sent back')} by ${esc(nameOf(s.by))} · ${fmtTime(s.at)}</b>${esc(s.note || '—')}</div>`).join('')}
        ${r.state === 'recalled' ? `<div class="muted" style="margin-top:6px">Withdrawn by ${esc(nameOf(r.settledBy))} · ${fmtTime(r.settledAt)}${r.response ? ` — ${esc(r.response)}` : ''}</div>` : ''}
      </div>`).join('') : `<p class="muted" style="margin:0">${route ? `Not sent yet. When it is finished it goes to <b>${esc(route.name)}</b>: ${esc(route.stages.map(s => groupName(s.roleId)).join(route.order === 'parallel' ? ' + ' : ' → '))}.` : 'This item needs no verification.'}</p>`;
    const comments = it.comments.length
      ? it.comments.map(c => `<div class="comment"><div class="who"><b>${esc(nameOf(c.authorId))}</b> · ${fmtTime(c.time)}</div>${esc(c.text)}</div>`).join('')
      : '<p class="muted" style="margin:0">No comments yet.</p>';
    const hist = it.history.length
      ? it.history.map(h => `<div class="hist"><span class="when">${fmtTime(h.time)} · ${esc(h.type)}</span><br>${esc(h.text)}</div>`).join('')
      : '<p class="muted" style="margin:0">No history yet.</p>';
    return `<div class="detail-meta">${meta}</div>
      ${it.offer ? `<div class="offer-banner">Waiting for <b>${esc(nameOf(it.offer.toId))}</b> to accept, since ${fmtTime(it.offer.time)}.</div>` : ''}
      ${it.desc ? `<p style="margin:0">${esc(it.desc)}</p>` : ''}
      <div class="detail-sec"><h4>Handovers</h4>${handovers}</div>
      ${ap().enabled || it.approvals.length ? `<div class="detail-sec"><h4>Verification</h4>${verifications}</div>` : ''}
      <div class="detail-sec"><h4>Comments (${it.comments.length})</h4>${comments}
        <div style="display:grid;gap:8px;margin-top:10px">
          <textarea class="textarea" id="d_comment" placeholder="Add a comment as ${esc(viewerName())}…" style="min-height:70px" aria-label="Comment"></textarea>
          <div><button type="button" class="btn" id="d_addComment" style="height:40px;font-size:15px">Add comment</button></div>
        </div></div>
      <div class="detail-sec"><h4>History</h4>${hist}</div>`;
  }
  function openItemDetails(id) {
    const it = getItem(id);
    if (!it) return;
    const wire = body => {
      $('#d_addComment', body).addEventListener('click', () => {
        if (!guardWrite()) return;
        const text = $('#d_comment', body).value.trim();
        if (!text) { $('#d_comment', body).focus(); return; }
        it.comments.push({ id: uid('cm'), authorId: S.viewerId, text, time: Date.now() });
        log(`${viewerName()} commented on ${it.ref}.`, 'COMMENT', it);
        if (cfg().notifications.comments) {
          uniq([it.ownerId, it.nextOwnerId, (it.offer || {}).toId].filter(Boolean)).forEach(to =>
            sendAlert(to, it, { kind: 'comment', label: 'COMMENT', text: `${viewerName()} commented on ${it.ref} "${it.title}": ${text.length > 140 ? text.slice(0, 140) + '…' : text}` }));
        }
        commit();
        body.innerHTML = itemDetailsHTML(it);
        wire(body);
        $('#d_comment', body).focus();
      });
