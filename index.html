<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design Hub · Operations Handoff Board</title>
<style>
  :root {
    --bg: #e8eaee;
    --side: #16181d;
    --surface: #f4f5f7;
    --surface-2: #f7f8fa;
    --card: #ffffff;
    --field: #f1f2f4;
    --ink: #15171a;
    --ink-2: #2a2e35;
    --muted: #5d636c;
    --red: #b5141e;
    --red-border: #a2111a;
    --tab-active: #d9d9f4;
    --tab-active-line: #b9bbe6;
    --tab-active-ink: #272a6c;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  .app {
    display: grid;
    grid-template-columns: 236px minmax(0, 1fr) 368px;
    height: 100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    background: var(--side);
    color: #e6e8eb;
    padding: 26px 16px 18px;
    display: flex;
    flex-direction: column;
    overflow: auto;
  }
  .brand-title { font-size: 23px; font-weight: 700; letter-spacing: -.01em; color: #f2f3f5; overflow-wrap: anywhere; }
  .brand-sub { margin-top: 10px; font-size: 14px; line-height: 1.55; color: #9aa0a8; }
  .side-nav { display: flex; flex-direction: column; gap: 6px; margin-top: 40px; }
  .side-nav.admin { margin-top: 18px; padding-top: 14px; border-top: 1px solid #262930; }
  .side-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%; border: 0; background: transparent; cursor: pointer; text-align: left;
    padding: 12px 12px; border-radius: 10px;
    font-size: 16px; font-weight: 700; color: #c3c7cd;
  }
  .side-item:hover { background: #20232a; color: #eef0f2; }
  .side-item.active { background: #272b33; color: #ffffff; }
  .side-item .n { font-size: 13px; font-weight: 600; color: #8b919a; }
  .side-foot { margin-top: auto; padding: 16px 12px 0; font-size: 13px; line-height: 1.5; color: #8b919a; border-top: 1px solid #262930; }
  .side-foot b { color: #d9dce0; }

  /* ---------- Main ---------- */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; border-right: 1px solid #d3d7dc; }
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 18px;
    background: #eceef1;
    border-bottom: 1px solid #d5d9de;
  }
  .search {
    flex: 1; min-width: 160px;
    display: flex; align-items: center; gap: 10px;
    height: 46px; padding: 0 14px;
    background: var(--surface); border: 1px solid #d0d4da; border-radius: 14px;
  }
  .search:focus-within { border-color: #9da3ac; background: #fff; }
  .search-ico { font-size: 17px; }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 18px; color: var(--ink-2); }
  .search input::placeholder { color: #4b5058; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 44px; padding: 0 16px;
    border: 1px solid #cdd1d7; border-radius: 12px;
    background: var(--surface-2); color: var(--ink);
    font-size: 17px; font-weight: 700; cursor: pointer; white-space: nowrap;
    box-shadow: 0 1px 0 rgba(0,0,0,.04);
    transition: background .12s, filter .12s, transform .05s;
  }
  .btn:hover { background: #fff; }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .5; cursor: default; transform: none; }
  .btn:focus-visible, .btn-sm:focus-visible, .tab:focus-visible { outline: 2px solid #5257c9; outline-offset: 2px; }
  .btn-red { background: var(--red); border-color: var(--red-border); color: #fff; }
  .btn-red:hover { background: #c2161f; }
  .btn-red:disabled:hover { background: var(--red); }
  .topbar .btn { height: 46px; }

  .content { flex: 1; overflow: auto; padding: 18px 18px 20px; }

  .hero {
    background: var(--surface); border: 1px solid #d9dce1; border-radius: 18px;
    padding: 22px 22px 18px; margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(15,20,30,.05);
  }
  .hero h1 { margin: 0 0 10px; font-size: 27px; font-weight: 700; letter-spacing: -.01em; }
  .hero p { margin: 0; max-width: 920px; font-size: 15.5px; line-height: 1.6; color: var(--ink-2); }
  .hero-actions { display: flex; gap: 10px; margin: 18px 0 16px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 10px; flex-wrap: wrap; }
  .tab {
    border: 1px solid #cfd3d9; background: #f6f7f9; border-radius: 999px;
    padding: 8px 16px; font-size: 15px; font-weight: 600; cursor: pointer; color: var(--ink-2);
  }
  .tab:hover { background: #fff; }
  .tab.active { background: var(--tab-active); border-color: var(--tab-active-line); color: var(--tab-active-ink); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; margin-bottom: 16px; }
  .stat {
    text-align: left; cursor: pointer;
    background: var(--surface); border: 1px solid #d9dce1; border-radius: 16px;
    padding: 18px 16px 16px; box-shadow: 0 1px 2px rgba(15,20,30,.05);
  }
  .stat:hover { background: #fafbfc; }
  .stat.active { border-color: #9a9ee0; box-shadow: 0 0 0 2px #d5d6f4; }
  .stat-label { font-size: 12.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
  .stat-value { margin: 10px 0 6px; font-size: 35px; font-weight: 700; line-height: 1; }
  .stat-sub { font-size: 14.5px; line-height: 1.35; color: var(--ink-2); }

  .filters {
    display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 16px; align-items: end;
    background: var(--surface); border: 1px solid #d9dce1; border-radius: 16px;
    padding: 14px 14px 12px; margin-bottom: 16px;
    box-shadow: 0 1px 2px rgba(15,20,30,.05);
  }
  .flabel-top { display: block; margin: 0 0 8px 2px; font-size: 12.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); }
  .select, .input, .textarea {
    width: 100%; height: 46px; padding: 0 12px;
    border: 1px solid #c9cdd3; border-radius: 12px; background: #fafafb;
    font-size: 18px; color: var(--ink-2); outline: none;
  }
  .select:focus, .input:focus, .textarea:focus { border-color: #8d93c9; box-shadow: 0 0 0 3px #e0e1f6; background: #fff; }
  .textarea { height: auto; min-height: 96px; padding: 10px 12px; resize: vertical; line-height: 1.45; font-size: 16px; }
  .filters .btn { width: 100%; height: 46px; }
  .view-chip { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: -4px 0 12px 2px; font-size: 14px; color: var(--ink-2); }

  /* ---------- Board ---------- */
  .board {
    display: flex; gap: 18px; align-items: stretch;
    overflow: auto; max-height: 660px; min-height: 360px;
    padding-bottom: 6px;
  }
  .col {
    flex: 0 0 290px;
    display: flex; flex-direction: column;
    background: #eef0f3; border: 1px solid #d8dce1; border-radius: 16px;
    transition: background .12s, border-color .12s;
  }
  .col.drop { background: #e4e6f7; border-color: #a6a9e2; }
  .col-head {
    position: sticky; top: 0; z-index: 2;
    display: flex; align-items: center; gap: 10px;
    padding: 15px 14px; background: #f6f7f9;
    border-bottom: 1px solid #e0e3e7; border-radius: 16px 16px 0 0;
  }
  .dot { width: 13px; height: 13px; border-radius: 50%; flex: none; display: inline-block; }
  .col-head h3 { margin: 0; flex: 1; font-size: 18.5px; font-weight: 700; }
  .count {
    min-width: 27px; height: 27px; padding: 0 6px; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center;
    background: #fff; border: 1px solid #c9ccd2; font-size: 12.5px; font-weight: 700;
  }
  .col-body { padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
  .empty-col {
    border: 1px dashed #c6cad1; border-radius: 12px; padding: 18px 12px;
    text-align: center; color: var(--muted); font-size: 14px; background: rgba(255,255,255,.4);
  }

  .card {
    display: flex; flex-direction: column;
    background: var(--card); border: 1px solid #dfe2e6; border-radius: 14px;
    padding: 14px 14px 16px; box-shadow: 0 1px 3px rgba(20,24,30,.07);
  }
  .card[draggable="true"] { cursor: grab; }
  .card.dragging { opacity: .5; }
  .card.flash, .pcard.flash { animation: flash 1.6s ease-out; }
  @keyframes flash {
    0% { box-shadow: 0 0 0 0 rgba(181,20,30,0); }
    25% { box-shadow: 0 0 0 4px rgba(181,20,30,.45); }
    100% { box-shadow: 0 1px 3px rgba(20,24,30,.07); }
  }
  .card-ref { font-size: 11.5px; font-weight: 700; letter-spacing: .08em; color: var(--muted); }
  .card-title { margin: 3px 0 10px; font-size: 17px; font-weight: 700; line-height: 1.3; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .tag { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; line-height: 1.25; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .field { background: var(--field); border-radius: 10px; padding: 8px 9px 9px; min-width: 0; }
  .field-l { font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #3d4148; line-height: 1.2; }
  .field-v { margin-top: 5px; font-size: 15px; font-weight: 600; line-height: 1.3; color: #1d2025; overflow-wrap: break-word; }
  .field-v.overdue { color: var(--red); }
  .desc { margin: 14px 0 0; font-size: 15px; line-height: 1.6; color: #24282e; overflow-wrap: anywhere; }
  .block-reason { margin: 10px 0 0; padding: 8px 10px; border-radius: 10px; background: #fbe9ea; color: #8e1720; font-size: 13.5px; line-height: 1.45; }
  /* Card buttons sit on a 6-column grid pinned to the bottom; each button's width comes from config. */
  .actions {
    margin-top: auto; padding-top: 14px;
    display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px;
  }
  .actions::before { content: ''; grid-column: 1 / -1; border-top: 1px solid #eceef1; margin: 2px 0 6px; }
  .actions:empty { display: none; }
  .span-sm { grid-column: span 2; }
  .span-md { grid-column: span 3; }
  .span-lg { grid-column: span 4; }
  .span-full { grid-column: 1 / -1; }
  .btn-sm {
    border: 1px solid transparent; border-radius: 9px; padding: 8px 12px;
    font-size: 13.5px; font-weight: 700; cursor: pointer; color: #fff; line-height: 1.2;
    transition: filter .12s;
  }
  .btn-sm:hover { filter: brightness(1.12); }
  .actions .btn-sm { width: 100%; padding: 8px 6px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .b-plain { background: #f7f8fa; border-color: #cfd3d9; color: var(--ink); }
  .b-plain:hover { filter: none; background: #fff; }
  .b-indigo { background: #2e3394; border-color: #272b80; }
  .b-del { background: #9b111b; border-color: #850e17; }

  /* ---------- Posts / Files / Notes / Overview ---------- */
  .sheet {
    background: var(--surface); border: 1px solid #d9dce1; border-radius: 18px;
    padding: 20px 20px 22px; box-shadow: 0 1px 2px rgba(15,20,30,.05);
  }
  .sheet-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .sheet-head h2 { margin: 0; font-size: 21px; }
  .muted { color: var(--muted); font-size: 14px; }
  .composer { display: grid; gap: 10px; margin-bottom: 18px; }
  .composer-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .composer-row .select, .composer-row .input { flex: 1; min-width: 180px; font-size: 16px; height: 44px; }
  .entry { background: var(--card); border: 1px solid #dfe2e6; border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .entry-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
  .entry-top b { font-size: 15.5px; }
  .entry-top .when { color: var(--muted); font-size: 13px; }
  .entry-top .spacer { flex: 1; }
  .entry p { margin: 0; font-size: 15px; line-height: 1.6; white-space: pre-wrap; overflow-wrap: anywhere; }
  .dropzone {
    border: 1.5px dashed #bfc4cc; border-radius: 14px; padding: 22px; text-align: center;
    background: #eef0f3; color: var(--ink-2); font-size: 15px; margin-bottom: 14px; cursor: pointer;
  }
  .dropzone.drop { background: #e4e6f7; border-color: #9da1de; }
  .file-row { display: flex; align-items: center; gap: 12px; }
  .file-ico {
    width: 40px; height: 40px; border-radius: 10px; flex: none;
    display: grid; place-items: center; background: #e4e4f7; color: #343a8a; font-size: 11px; font-weight: 700; text-transform: uppercase;
  }
  .file-meta { flex: 1; min-width: 0; }
  .file-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--card); border: 1px solid #dfe2e6; border-radius: 14px; overflow: hidden; }
  .table th, .table td { padding: 12px 14px; text-align: left; border-bottom: 1px solid #eceef1; font-size: 15px; }
  .table th { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: #3d4148; background: #f6f7f9; }
  .table tr:last-child td { border-bottom: 0; }
  .table td.num, .table th.num { text-align: right; font-variant-numeric: tabular-nums; }
  .table tbody tr { cursor: pointer; }
  .table tbody tr:hover td { background: #f8f9fb; }
  .none { text-align: center; color: var(--muted); padding: 22px; border: 1px dashed #c9cdd3; border-radius: 12px; background: #eff1f4; }

  /* ---------- Configuration screen ---------- */
  .cfg-page { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 16px; align-items: start; }
  .cfg-nav {
    position: sticky; top: 0; display: flex; flex-direction: column; gap: 2px;
    background: var(--surface); border: 1px solid #d9dce1; border-radius: 16px; padding: 8px;
    box-shadow: 0 1px 2px rgba(15,20,30,.05);
  }
  .cfg-nav-title { padding: 10px 12px 8px; font-size: 19px; font-weight: 700; }
  .cfg-nav button {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    width: 100%; border: 0; background: transparent; border-radius: 10px; padding: 10px 12px;
    font-size: 15px; font-weight: 600; color: var(--ink-2); cursor: pointer; text-align: left;
  }
  .cfg-nav button:hover { background: #eceef2; }
  .cfg-nav button.active { background: var(--tab-active); color: var(--tab-active-ink); }
  .cfg-nav button.err { color: var(--red); }
  .cfg-nav .n { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .cfg-main { min-width: 0; }
  /* Negative top offsets the scroller's padding so nothing scrolls visibly above the bar. */
  .cfg-bar {
    position: sticky; top: -18px; z-index: 6;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 12px 10px 16px; margin-bottom: 14px;
    border-radius: 14px; border: 1px solid #e6cf8f; background: #fff7df;
    box-shadow: 0 4px 14px rgba(15,20,30,.08);
  }
  .cfg-bar.clean { background: var(--surface); border-color: #d9dce1; box-shadow: none; }
  .cfg-bar-text { flex: 1; min-width: 200px; font-size: 14.5px; }
  .cfg-bar .btn { height: 40px; font-size: 15px; }
  .cfg-errors { border: 1px solid #e7b4b8; background: #fbecee; border-radius: 14px; padding: 12px 16px; margin-bottom: 14px; color: #7d1219; font-size: 14.5px; }
  .cfg-errors ul { margin: 6px 0 0; padding-left: 18px; line-height: 1.6; }
  .cfg-errors button { border: 0; background: none; color: inherit; text-decoration: underline; cursor: pointer; font: inherit; padding: 0; }
  .cfg-section {
    background: var(--surface); border: 1px solid #d9dce1; border-radius: 16px;
    padding: 18px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(15,20,30,.05);
  }
  .cfg-section h2 { margin: 0 0 4px; font-size: 19px; }
  .cfg-section h3 { margin: 20px 0 6px; font-size: 15.5px; }
  .cfg-help { margin: 0 0 14px; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .cfg-hint { margin: 2px 0 8px; color: var(--muted); font-size: 12.5px; line-height: 1.5; }
  .cfg-hint code { background: #e9ebef; border-radius: 4px; padding: 1px 4px; font-size: 12px; color: var(--ink-2); }
  .crow {
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px;
    background: #fff; border: 1px solid #dfe2e6; border-radius: 12px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .crow .crow { background: #f7f8fa; margin-bottom: 6px; }
  .crow.block { padding: 14px; border-color: #d3d7dd; }
  .cell { display: flex; flex-direction: column; min-width: 0; }
  .cell.grow { flex: 1 1 170px; }
  .cell.w-sm { flex: 0 1 140px; }
  .cell.w-md { flex: 0 1 200px; }
  .cell.w-auto { flex: 0 0 auto; }
  .cell.full { flex: 1 1 100%; }
  .mini-label { display: block; margin: 0 0 5px 2px; font-size: 10.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #3d4148; white-space: nowrap; }
  .crow .input, .crow .select, .gen-grid .input, .gen-grid .select { height: 40px; font-size: 15px; padding: 0 10px; border-radius: 10px; }
  .gen-grid .textarea { font-size: 15px; min-height: 80px; }
  .inline { display: flex; align-items: center; gap: 8px; min-height: 40px; flex-wrap: wrap; }
  input[type=color].swatch { width: 44px; height: 40px; padding: 3px; border: 1px solid #c9cdd3; border-radius: 10px; background: #fafafb; cursor: pointer; flex: none; }
  .chk { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .chk input { width: 16px; height: 16px; margin: 0; accent-color: #2e3394; }
  .row-tools { display: flex; gap: 6px; margin-left: auto; align-items: center; min-height: 40px; }
  .uses { font-size: 12.5px; color: var(--muted); white-space: nowrap; align-self: center; }
  .icon-btn {
    flex: none; width: 34px; height: 34px; display: grid; place-items: center;
    border: 1px solid #cfd3d9; border-radius: 9px; background: #f7f8fa; cursor: pointer; font-size: 14px; font-weight: 700; color: var(--ink);
  }
  .icon-btn:hover:not(:disabled) { background: #fff; }
  .icon-btn:disabled { opacity: .35; cursor: default; }
  .icon-btn.del { color: var(--red); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid #cfd3d9; border-radius: 999px; padding: 5px 11px; font-size: 13px; font-weight: 600; background: #f7f8fa; cursor: pointer; }
  .chip:has(input:checked) { background: var(--tab-active); border-color: var(--tab-active-line); color: var(--tab-active-ink); }
  .chip input { margin: 0; accent-color: #2e3394; }
  .gen-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px 16px; }
  .gen-grid .full { grid-column: 1 / -1; }
  .toggle-list { display: grid; gap: 12px; }
  .toggle-desc { display: block; margin: 3px 0 0 23px; font-size: 13px; color: var(--muted); }
  .add-btn { height: 38px; font-size: 14.5px; margin-top: 2px; }
  .route { display: grid; gap: 8px; margin-bottom: 14px; padding: 12px; background: #eef0f3; border-radius: 12px; }
  .route-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .arrow { color: var(--muted); font-weight: 700; }
  .route-end { font-size: 13px; font-weight: 700; color: #2f7a1e; }
  .cfg-preview { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; padding: 14px; background: #eef0f3; border: 1px dashed #c6cad1; border-radius: 12px; }
  .cfg-preview .card { width: 262px; }
  .data-actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .data-actions .btn { height: 42px; font-size: 15.5px; }
  .match-pill { display: inline-block; padding: 3px 9px; border-radius: 999px; background: #e4e4f7; color: #343a8a; font-size: 12.5px; font-weight: 700; }
  .match-pill.bad { background: #fbe1e3; color: #8e1720; }
  .script-box { font-family: Consolas, "SFMono-Regular", Menlo, monospace !important; font-size: 13.5px !important; line-height: 1.5; min-height: 110px; tab-size: 2; white-space: pre; }
  .ext-warn { border: 1px solid #e6cf8f; background: #fff7df; border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.5; margin-bottom: 12px; }
  details.api { margin-top: 10px; font-size: 13.5px; line-height: 1.55; color: var(--ink-2); }
  details.api summary { cursor: pointer; font-weight: 700; }
  details.api pre { background: #1b1e24; color: #e6e8eb; border-radius: 10px; padding: 12px; overflow: auto; font-size: 12.5px; line-height: 1.5; }

  /* ---------- Right panel ---------- */
  .panel { background: #eef0f3; overflow: auto; padding: 0 14px 18px; }

  .form-grid .input, .form-grid .select { height: 46px; font-size: 17.5px; padding: 0 14px; }

  /* ---------- Toasts / dialog ---------- */
  .toasts { position: fixed; right: 20px; bottom: 20px; z-index: 60; display: flex; flex-direction: column; gap: 10px; align-items: flex-end; pointer-events: none; }

    pointer-events: auto; width: 340px; max-width: calc(100vw - 32px);

  .toast.pop .t-title { font-weight: 700; font-size: 15px; margin-bottom: 4px; }
  .toast.pop .t-actions { display: flex; gap: 8px; margin-top: 10px; }
  .toast.out { opacity: 0; transform: translateY(6px); transition: .25s; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  dialog {
    border: 0; padding: 0; border-radius: 16px; width: min(480px, calc(100vw - 32px));

  /* ---------- Responsive ---------- */

    .hero h1 { font-size: 22px; }
    .panel { padding: 0 16px 18px; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-title" id="brandTitle">Design Hub</div>
      <div class="brand-sub" id="brandSub"></div>
    </div>
    <div class="side-label">Board views</div>
    <nav class="side-nav" id="sideNav" aria-label="Board views"></nav>
    <nav class="side-nav admin" aria-label="Administration">
      <button class="side-item" id="sideConfig" type="button"><span>Configuration</span><span class="n" aria-hidden="true">⚙</span></button>
    </nav>
    <div class="side-foot" id="sideFoot"></div>
  </aside>

  <!-- Main -->
  <main class="main">
    <header class="topbar">
      <label class="search">
        <span class="search-ico" aria-hidden="true">🔎</span>
        <input id="search" type="search" placeholder="Search task, ref, team or owner" autocomplete="off" aria-label="Search">
      </label>
      <button class="btn" id="btnSample" type="button">Load sample</button>
      <button class="btn" id="btnClear" type="button">Clear</button>
      <button class="btn btn-red" id="btnNew" type="button">New handoff</button>
    </header>

    <div class="content" id="content">
      <section class="hero" id="hero">
        <h1 id="boardTitle">Operations Handoff Board</h1>
        <p id="boardIntro"></p>
        <div class="hero-actions">
          <button class="btn" id="btnMarkRead" type="button">Mark alerts read</button>
          <button class="btn btn-red" id="btnCreate" type="button">Create item</button>
        </div>
        <div class="tabs" id="tabs" role="tablist"></div>
      </section>

      <!-- Board -->
      <section id="view-board">
        <div class="stats" id="stats"></div>
        <div class="filters">
          <label><span class="flabel-top">View as</span><select class="select" id="fViewer"></select></label>
          <label><span class="flabel-top" id="lblFilterTeam">Current team</span><select class="select" id="fTeam"></select></label>
          <label><span class="flabel-top" id="lblFilterPriority">Priority</span><select class="select" id="fPriority"></select></label>
          <label><span class="flabel-top">Focus</span><select class="select" id="fFocus"></select></label>
          <button class="btn" id="btnReset" type="button">Reset filters</button>
        </div>
        <div class="view-chip" id="viewChip" hidden></div>
        <div class="board" id="board"></div>
      </section>

      <!-- Posts -->
      <section id="view-posts" hidden>
        <div class="sheet">
          <div class="sheet-head"><span class="muted" id="postsCount"></span></div>
          <form class="composer" id="postForm">
            <textarea class="textarea" id="postText" placeholder="Share an update with the team…" required aria-label="Post text"></textarea>
            <div class="composer-row">
              <select class="select" id="postRef" aria-label="Linked item"></select>
              <button class="btn btn-red" type="submit">Post update</button>
            </div>
          </form>
          <div id="postList"></div>
        </div>
      </section>

      <!-- Files -->
      <section id="view-files" hidden>
        <div class="sheet">
          <div class="sheet-head"><span class="muted" id="filesCount"></span></div>
          <div class="composer-row" style="margin-bottom:12px">
            <select class="select" id="fileRef" aria-label="Link files to item"></select>
          </div>
          <button class="dropzone" id="dropzone" type="button" style="width:100%">
            <b>Drop files here</b> or click to choose · files up to 750 KB are stored for download
          </button>
          <input type="file" id="fileInput" multiple hidden aria-label="Choose files">
          <div id="fileList"></div>
        </div>
      </section>

      <!-- Notes -->
      <section id="view-notes" hidden>
        <div class="sheet">
          <div class="sheet-head"><span class="muted" id="notesCount"></span></div>
          <form class="composer" id="noteForm">
            <input class="input" id="noteTitle" placeholder="Note title" required style="font-size:16px" aria-label="Note title">
            <textarea class="textarea" id="noteBody" placeholder="Write a note…" aria-label="Note body"></textarea>
            <div class="composer-row"><span class="muted" id="noteMode" style="flex:1">New note</span>
              <button class="btn" type="button" id="noteCancel" hidden>Cancel</button>
              <button class="btn btn-red" type="submit" id="noteSave">Save note</button>
            </div>
          </form>
          <div id="noteList"></div>
        </div>
      </section>

      <!-- Team overview -->
      <section id="view-overview" hidden>
        <div class="sheet">
          <div class="sheet-head"><span class="muted">Click a team to see its items on the board.</span></div>
          <div id="overview"></div>
        </div>
      </section>

      <!-- Configuration -->
      <section id="view-config" hidden></section>
    </div>
  </main>

  <!-- Right panel -->
  <aside class="panel">
    <div class="panel-head"><h2 id="panelTitle">Operations Panel</h2><span class="unread-pill" id="panelUnread">0 unread</span></div>

    <div class="pcard viewer-card">
      <div class="viewer-name" id="viewerName"></div>
      <p>Switch “View as” to simulate what each team member sees.</p>
    </div>

    <div class="pcard">
      <div class="pcard-head"><h3>Action Inbox</h3><span class="unread-pill" id="inboxUnread">0 unread</span></div>
      <div class="inbox" id="inbox"></div>
    </div>

    <div class="pcard" id="formCard">
      <div class="pcard-head"><h3>Create or Edit Handoff</h3><span id="formMode">New</span></div>
      <form class="form-scroll" id="form" novalidate>
        <div class="form-grid">
          <label class="full"><span id="lbl_title">Task title</span><input class="input" id="f_title" placeholder="Custody model data ownership review"></label>
          <label><span id="lbl_ref">Reference</span><input class="input" id="f_ref" placeholder="OMD-001"></label>
          <label><span id="lbl_priority">Priority</span><select class="select" id="f_priority"></select></label>
          <label><span id="lbl_team">Current team</span><input class="input" id="f_team" list="dlTeams" placeholder="Team"></label>
          <label><span id="lbl_owner">Current owner</span><input class="input" id="f_owner" list="dlPeople" placeholder="Owner"></label>
          <label><span id="lbl_nextTeam">Next team</span><input class="input" id="f_nextTeam" list="dlTeams" placeholder="—"></label>
          <label><span id="lbl_nextOwner">Next owner</span><input class="input" id="f_nextOwner" list="dlPeople" placeholder="—"></label>
          <label><span id="lbl_due">Due date</span><input class="input" id="f_due" type="date"></label>
          <label><span id="lbl_status">Status</span><select class="select" id="f_status"></select></label>
          <div class="cf-wrap" id="customFields"></div>
          <label class="full"><span id="lbl_desc">Description</span><textarea class="textarea" id="f_desc" placeholder="What needs to happen before this is passed on?"></textarea></label>
          <div class="full form-error" id="formError"></div>
          <div class="full form-actions">
            <button class="btn" type="button" id="formCancel">Reset</button>
            <button class="btn btn-red" type="submit" id="formSave">Save handoff</button>
          </div>
        </div>
      </form>
      <datalist id="dlTeams"></datalist>
      <datalist id="dlPeople"></datalist>
    </div>

    <div class="pcard">
      <div class="pcard-head"><h3>Recent Activity</h3><span>Latest events</span></div>
      <div class="activity" id="activity"></div>
    </div>
  </aside>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<input type="file" id="importInput" accept="application/json,.json" hidden aria-label="Import file">

<dialog id="dlg" aria-labelledby="dlgTitle">
  <form method="dialog">
    <div class="dlg-head" id="dlgTitle"></div>
    <div class="dlg-body" id="dlgBody"></div>
    <div class="dlg-foot">
      <button class="btn" value="cancel">Cancel</button>
      <button class="btn btn-red" type="button" id="dlgOk">OK</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  'use strict';

  const STORE_KEY = 'designhub.v2';
  const LEGACY_KEY = 'designhub.handoff.v1';
  const MAX_FILE_BYTES = 750 * 1024;
  const CONFIG_VERSION = 4;

  // =====================================================================
  // Engine vocabulary. These are the building blocks; everything users see
  // (filters, buttons, fields, statuses) is assembled from them in config.
  // =====================================================================
  const WIDTHS = [{ v: 'sm', l: 'Narrow (⅓)' }, { v: 'md', l: 'Half' }, { v: 'lg', l: 'Wide (⅔)' }, { v: 'full', l: 'Full row' }];
  const BUILTIN_FIELDS = ['title', 'ref', 'priority', 'team', 'owner', 'nextTeam', 'nextOwner', 'due', 'status', 'desc'];
  const FIELD_TYPES = [
    { v: 'text', l: 'Text' }, { v: 'longtext', l: 'Long text' }, { v: 'number', l: 'Number' }, { v: 'date', l: 'Date' },
    { v: 'select', l: 'Dropdown' }, { v: 'multiselect', l: 'Multi-select' }, { v: 'person', l: 'Person' }, { v: 'team', l: 'Team' },
    { v: 'bool', l: 'Yes / No' }, { v: 'url', l: 'Web address' }, { v: 'email', l: 'Email' },
  ];
  const TEMPLATE_KEYS = ['ref', 'title', 'actor', 'owner', 'nextOwner', 'prevOwner', 'team', 'nextTeam', 'status', 'priority', 'due', 'reason', 'created', 'offerTo', 'note'];
  const PARAM_TYPES = [
    { v: 'text', l: 'Text' }, { v: 'number', l: 'Number' }, { v: 'bool', l: 'Yes / No' }, { v: 'person', l: 'Person' },
    { v: 'team', l: 'Team' }, { v: 'status', l: 'Status' }, { v: 'priority', l: 'Priority' },
  ];

  // Steps a button can run. `gather` steps collect input in one dialog before anything changes.
  const STEP_TYPES = {
    confirm:     { name: 'Ask for confirmation',         gather: true, defaults: () => ({ message: 'Are you sure?' }) },
    reason:      { name: 'Ask for a reason',             gather: true, defaults: () => ({ prompt: 'Reason (optional)', required: false }) },
    pickNext:    { name: 'Choose the next owner',        gather: true, defaults: () => ({}) },
    handoverNote: { name: 'Ask for a handover note',     gather: true, defaults: () => ({ sections: 'Summary*, Open actions, Risks and watch-outs' }) },
    offer:       { name: 'Offer the item to the next owner (they accept or decline)', defaults: () => ({}) },
    acceptOffer: { name: 'Accept the offered handoff',   gather: true, defaults: () => ({ land: 'assigned' }) },
    declineOffer: { name: 'Decline the offered handoff', defaults: () => ({}) },
    withdrawOffer: { name: 'Withdraw the offered handoff', defaults: () => ({}) },
    setStatus:   { name: 'Move to status',               defaults: () => ({ to: '' }) },
    transfer:    { name: 'Hand over to the next owner',  defaults: () => ({}) },
    route:       { name: 'Route to the next team',       defaults: () => ({ useLead: true }) },
    setOwner:    { name: 'Set the owner',                defaults: () => ({ to: 'viewer' }) },
    setNext:     { name: 'Set the next owner',           defaults: () => ({ to: 'none' }) },
    setPriority: { name: 'Set the priority',             defaults: () => ({ to: '' }) },
    setDue:      { name: 'Set the due date',             defaults: () => ({ days: 3, clear: false }) },
    setField:    { name: 'Set a custom field',           defaults: () => ({ fieldId: '', value: '' }) },
    notify:      { name: 'Send an alert',                defaults: () => ({ who: 'owner', personId: '', message: '{ref} "{title}" needs your attention ({actor}).', onlyIfChanged: false }) },
    createItem:  { name: 'Create a linked item',         defaults: () => ({ title: 'Follow-up: {title}', desc: '', team: 'next', owner: 'nextOwner', status: '', priority: 'same', dueDays: '', copyFields: false, linkType: 'Follow-up', notify: true }) },
    email:       { name: 'Send an email (opens a draft)', defaults: () => ({ to: 'owner', personId: '', address: '', subject: '{ref}: {title}', body: '{actor} updated {ref} "{title}". Status: {status}.' }) },
    webhook:     { name: 'Call a webhook',               defaults: () => ({ method: 'POST', url: 'https://', body: '{"ref":"{ref}","title":"{title}","status":"{status}","owner":"{owner}","actor":"{actor}"}' }) },
    runButton:   { name: 'Run another button’s steps',   defaults: () => ({ actionId: '' }) },
    edit:        { name: 'Open in the editor',           defaults: () => ({}) },
    delete:      { name: 'Delete the item (asks first)', gather: true, defaults: () => ({}) },
  };
  // Built-in steps plus the step types defined under Configuration › Extensions.
  const stepOptions = (c, excludeId) => [
    ...Object.entries(STEP_TYPES).map(([v, s]) => ({ v, l: s.name })),
    ...c.extensions.steps.filter(x => x.id !== excludeId).map(x => ({ v: 'x:' + x.id, l: `${x.name || '(unnamed)'} (custom)` })),
  ];
  const isCustomStep = type => String(type).startsWith('x:');
  const PERSON_TARGETS = ['viewer', 'nextOwner', 'lead', 'none'];

  // Conditions filters can test. Op tuples: [key, label, valueKind?]
  const PERSON_OPS = [['isViewer', 'is the current viewer'], ['notViewer', 'is not the current viewer'], ['is', 'is', 'person'], ['isNot', 'is not', 'person'], ['empty', 'is empty'], ['set', 'is set']];
  const TEAM_OPS = [['viewerTeam', 'is the viewer’s team'], ['is', 'is', 'team'], ['isNot', 'is not', 'team'], ['empty', 'is empty'], ['set', 'is set']];

  function mix(hex, toWhite, amt) {
    const m = /^#?([0-9a-f]{6})$/i.exec(hex || '');
    if (!m) return hex || '#888888';
    const n = parseInt(m[1], 16), t = toWhite ? 255 : 0;
    return '#' + [16, 8, 0].map(s => { const c = (n >> s) & 255; return Math.round(c + (t - c) * amt).toString(16).padStart(2, '0'); }).join('');
  }

    items.forEach(i => { const m = re.exec(i.ref || ''); if (m) max = Math.max(max, +m[1]); });

  // Scripts are user-authored JavaScript stored in config. They only run when Extensions › Scripts is on.
  const scriptCache = new Map();
  const scriptErrors = {};
  function compileScript(code, args, autoReturn) {
    const key = `${args.join(',')}|${autoReturn ? 1 : 0}|${code}`;
    if (!scriptCache.has(key)) {
      let body = String(code || '');
      if (autoReturn && !/\breturn\b/.test(body)) body = `return (${body.trim() || 'false'});`;
      scriptCache.set(key, new Function(...args, '"use strict";\n' + body));
    }
    return scriptCache.get(key);
  }
  const scriptsOn = () => !!cfg().extensions.scriptsEnabled;
  const scriptApi = {
    daysUntil: d => (d ? Math.round((new Date(d + 'T00:00') - new Date(todayISO() + 'T00:00')) / 864e5) : null),
    daysSince: t => (t ? Math.floor((Date.now() - (typeof t === 'number' ? t : new Date(t).getTime())) / 864e5) : null),
    addDays: (iso, n) => addDays(iso, n),
    person: ref => { const p = person(ref) || findByName(cfg().people, ref); return p ? { id: p.id, name: p.name, email: p.email, teamId: p.teamId, team: teamNameOf(p.teamId), active: p.active } : null; },
    team: ref => { const t = team(ref) || findByName(cfg().teams, ref); return t ? { id: t.id, name: t.name, leadId: t.leadId, nextTeamId: t.nextTeamId } : null; },
  };
  const viewerView = () => ({ id: S.viewerId, name: viewerName(), teamId: viewerTeamId(), team: teamNameOf(viewerTeamId()) });
  function itemView(it) {
    const fields = {};
    cfg().fields.custom.forEach(f => { const v = (it.fields || {})[f.id]; fields[f.id] = v; if (f.label) fields[f.label] = v; });
    const st = status(it.statusId) || {};
    return Object.freeze({
      id: it.id, ref: it.ref, title: it.title, desc: it.desc, due: it.due, created: it.created, updated: it.updated,
      statusId: it.statusId, status: st.name || '', closed: !!st.closed, hold: !!st.hold,
      flags: (st.flags || []).map(id => (cfg().extensions.flags.find(f => f.id === id) || {}).name).filter(Boolean),
      priorityId: it.priorityId, priority: (priority(it.priorityId) || {}).name || '',
      ownerId: it.ownerId, owner: nameOf(it.ownerId), nextOwnerId: it.nextOwnerId, nextOwner: nameOf(it.nextOwnerId),
      teamId: it.teamId, team: teamNameOf(it.teamId), nextTeamId: it.nextTeamId, nextTeam: teamNameOf(it.nextTeamId),
      fields: Object.freeze(fields),
      links: (it.links || []).map(l => { const o = getItem(l.itemId); return { ref: o ? o.ref : '', type: l.type, closed: o ? !isOpen(o) : true }; }),
    });
  }
  const paramDefaults = def => Object.fromEntries((def.params || []).map(p => [p.key, p.type === 'number' ? 0 : p.type === 'bool' ? false : '']));
  function runCustomCondition(x, cd, it) {
    if (!scriptsOn()) return false;
    try {
      const r = !!compileScript(x.script, ['item', 'params', 'viewer', 'today', 'api'], true)(itemView(it), Object.assign(paramDefaults(x), cd.params || {}), viewerView(), todayISO(), scriptApi);
      delete scriptErrors[x.id];
      return r;
    } catch (e) { scriptErrors[x.id] = e.message; return false; }
  }

  // ---------- rules engine ----------
  let evalDepth = 0;
  function evalCond(cd, it) {
    const def = subjectDef(cd.subject, cfg());
    if (!def) return true;
    if (def.custom) { const r = runCustomCondition(def.custom, cd, it); return cd.op === 'false' ? !r : r; }
    const v = cd.value;
    const arr = Array.isArray(v) ? v : [];
    const today = todayISO();
    const st = status(it.statusId) || {};
    const personTest = id => {
      switch (cd.op) {
        case 'isViewer': return id === S.viewerId;
        case 'notViewer': return id !== S.viewerId;
        case 'is': return !!v && id === v;
        case 'isNot': return id !== v;
        case 'empty': return !id;
        case 'set': return !!id;
      }
      return true;
    };
    const teamTest = id => {
      switch (cd.op) {
        case 'viewerTeam': return !!id && id === viewerTeamId();
        case 'is': return !!v && id === v;
        case 'isNot': return id !== v;
        case 'empty': return !id;
        case 'set': return !!id;
      }
      return true;
    };
    const ageTest = ts => { const days = (Date.now() - (ts || 0)) / 864e5; return cd.op === 'withinDays' ? days <= +v : days > +v; };
    if (def.field) {
      const f = def.field;
      const fv = (it.fields || {})[f.id];
      const empty = fv === '' || fv == null || (Array.isArray(fv) && !fv.length);
      if (cd.op === 'empty') return empty;
      if (cd.op === 'set') return !empty;
      switch (fieldBase(f, cfg())) {
        case 'number': return !empty && (cd.op === 'equals' ? +fv === +v : cd.op === 'gt' ? +fv > +v : +fv < +v);
        case 'date': return !empty && (cd.op === 'before' ? fv < v : cd.op === 'after' ? fv > v : fv >= today && fv <= addDays(today, +v || 0));
        case 'select': return cd.op === 'is' ? fv === v : fv !== v;
        case 'multiselect': { const a = Array.isArray(fv) ? fv : []; return cd.op === 'includes' ? a.includes(v) : !a.includes(v); }
        case 'person': return personTest(fv || '');
        case 'team': return teamTest(fv || '');
        case 'bool': return cd.op === 'isTrue' ? fv === true : fv === false;
      }
      const s = String(fv ?? '').toLowerCase(), t = String(v ?? '').toLowerCase();
      return cd.op === 'equals' ? s === t : s.includes(t);
    }
    switch (cd.subject) {
      case 'state': return cd.op === 'open' ? !st.closed : cd.op === 'closed' ? !!st.closed : cd.op === 'hold' ? !!st.hold : !st.hold;
      case 'status': return cd.op === 'notIn' ? !arr.includes(it.statusId) : arr.includes(it.statusId);
      case 'owner': return personTest(it.ownerId);
      case 'nextOwner': return personTest(it.nextOwnerId);
      case 'team': return teamTest(it.teamId);
      case 'nextTeam': return teamTest(it.nextTeamId);
      case 'anyTeam': {
        const t = cd.op === 'viewerTeam' ? viewerTeamId() : v;
        return !!t && (it.teamId === t || it.nextTeamId === t);
      }
      case 'priority': return cd.op === 'notIn' ? !arr.includes(it.priorityId) : arr.includes(it.priorityId);
      case 'due':
        switch (cd.op) {
          case 'overdue': return !st.closed && !!it.due && it.due < today;
          case 'withinDays': return !st.closed && !!it.due && it.due >= today && it.due <= addDays(today, +v || 0);
          case 'before': return !!it.due && !!v && it.due < v;
          case 'after': return !!it.due && !!v && it.due > v;
          case 'empty': return !it.due;
          case 'set': return !!it.due;
        }
        return true;
      case 'created': return ageTest(it.created);
      case 'updated': return ageTest(it.updated);
      case 'alerts': { const h = S.alerts.some(a => a.toId === S.viewerId && !a.read && a.itemId === it.id); return cd.op === 'hasUnread' ? h : !h; }
      case 'text': { const q = String(v || '').toLowerCase(); return !q || `${it.title} ${it.desc}`.toLowerCase().includes(q); }
      case 'flag': { const h = (st.flags || []).includes(v); return cd.op === 'has' ? h : !h; }
      case 'offer': {
        const o = it.offer;
        if (cd.op === 'pending') return !!o;
        if (cd.op === 'none') return !o;
        if (cd.op === 'toViewer') return !!o && o.toId === S.viewerId;
        return !!o && (o.fromId === S.viewerId || o.byId === S.viewerId);
      }
      case 'links': {
        const linked = (it.links || []).map(l => getItem(l.itemId)).filter(Boolean);
        if (cd.op === 'any') return linked.length > 0;
        if (cd.op === 'none') return !linked.length;
        if (cd.op === 'openLinks') return linked.some(isOpen);
        return linked.length > 0 && !linked.some(isOpen);
      }
      case 'matches': {
        // Filters can reference filters; the depth guard stops accidental cycles.
        const f = filterById(v);
        if (!f || evalDepth > 4) return cd.op === 'isNot';
        evalDepth++;
        try { const m = filterTest(f, it); return cd.op === 'is' ? m : !m; } finally { evalDepth--; }
      }
    }
    return true;
  }
  const filterTest = (f, it) => !f.conds.length || (f.match === 'any' ? f.conds.some(c => evalCond(c, it)) : f.conds.every(c => evalCond(c, it)));
  const filterMatches = (fid, it) => { const f = filterById(fid); return f ? filterTest(f, it) : true; };
  function filterCount(fid, items = S.items) {
    const f = filterById(fid);
    if (!f) return items.length;
    const matched = items.filter(it => filterTest(f, it));
    if (f.count !== 'alerts') return matched.length;
    const ids = new Set(matched.map(i => i.id));
    return unreadFor(S.viewerId).filter(a => ids.has(a.itemId)).length;
  }

  // ---------- normalisation / migration ----------
  function cardFieldOptions(c) {
    const L = c.fields.labels;
    return [
      { v: 'owner', l: L.owner }, { v: 'nextOwner', l: L.nextOwner }, { v: 'team', l: L.team }, { v: 'nextTeam', l: L.nextTeam },
      { v: 'due', l: L.due }, { v: 'status', l: L.status }, { v: 'priority', l: L.priority },
      { v: 'created', l: 'Created' }, { v: 'updated', l: 'Last updated' },
      ...c.fields.custom.map(f => ({ v: 'cf:' + f.id, l: f.label || '(unnamed field)' })),
    ];
  }

  // Repairs references inside a config so every id points at something that exists.
  function fixRefs(c) {
    const tid = new Set(c.teams.map(t => t.id)), pid = new Set(c.people.map(p => p.id));
    const sid = new Set(c.statuses.map(s => s.id)), prid = new Set(c.priorities.map(p => p.id));
    const fid = new Set(c.filters.map(f => f.id));
    const cfIds = new Set(c.fields.custom.map(f => f.id));
    const open = c.statuses.filter(s => !s.closed);
    if (open.length && !open.some(s => s.id === c.general.initialStatusId)) c.general.initialStatusId = open[0].id;
    c.teams.forEach(t => { if (!pid.has(t.leadId)) t.leadId = ''; if (!tid.has(t.nextTeamId) || t.nextTeamId === t.id) t.nextTeamId = ''; });
    c.people.forEach(p => { if (!tid.has(p.teamId)) p.teamId = ''; });
    const flagIds = new Set(c.extensions.flags.map(f => f.id));
    c.statuses.forEach(s => { s.flags = (s.flags || []).filter(x => flagIds.has(x)); });
    const ftIds = new Set(c.extensions.fieldTypes.map(t => t.id));
    c.fields.custom.forEach(f => { if (String(f.type).startsWith('x:') && !ftIds.has(f.type.slice(2))) f.type = 'text'; });
    c.filters.forEach(f => f.conds.forEach(cd => {
      const def = subjectDef(cd.subject, c);
      if (!def) { cd.subject = 'state'; cd.op = 'open'; cd.value = ''; return; }
      if (!def.ops.some(o => o[0] === cd.op)) cd.op = def.ops[0][0];
      const k = opKind(def, cd.op);
      if (k === 'statuses') cd.value = (Array.isArray(cd.value) ? cd.value : []).filter(x => sid.has(x));
      else if (k === 'priorities') cd.value = (Array.isArray(cd.value) ? cd.value : []).filter(x => prid.has(x));
      else if (k === 'person') { if (!pid.has(cd.value)) cd.value = ''; }
      else if (k === 'team') { if (!tid.has(cd.value)) cd.value = ''; }
      else if (k === 'option') { if (!fieldOptions(def.field, c).includes(cd.value)) cd.value = ''; }
      else if (k === 'flag') { if (!flagIds.has(cd.value)) cd.value = ''; }
      else if (k === 'filter') { if (!fid.has(cd.value) || cd.value === f.id) cd.value = ''; }
      else if (!k) cd.value = '';
      else if (Array.isArray(cd.value)) cd.value = kindDefault(k);
      if (def.custom) cd.params = Object.assign(paramDefaults(def.custom), cd.params || {});
    }));
    const xsIds = new Set(c.extensions.steps.map(x => x.id));
    const aIds = new Set(c.actions.map(a => a.id));
    const fixSteps = steps => steps.filter(s => !isCustomStep(s.type) || xsIds.has(s.type.slice(2))).map(s => {
      if (s.when && !fid.has(s.when.split(':')[1])) s.when = '';
      if (s.type === 'setStatus' && s.to !== '__prev' && !sid.has(s.to)) s.to = (open[0] || c.statuses[0] || {}).id || '';
      if ((s.type === 'setOwner' || s.type === 'setNext') && !PERSON_TARGETS.includes(s.to) && !pid.has(s.to)) s.to = 'none';
      if (s.type === 'setPriority' && !prid.has(s.to)) s.to = (c.priorities[0] || {}).id || '';
      if (s.type === 'setField' && !cfIds.has(s.fieldId)) s.fieldId = (c.fields.custom[0] || {}).id || '';
      if ((s.type === 'notify' || s.type === 'email') && (s.who === 'person' || s.to === 'person') && !pid.has(s.personId)) s.personId = '';
      if (s.type === 'runButton' && !aIds.has(s.actionId)) s.actionId = '';
      if (s.type === 'acceptOffer' && !open.some(x => x.id === s.land)) s.land = (open[0] || {}).id || '';
      if (s.type === 'createItem') {
        if (!['same', 'next'].includes(s.team) && !tid.has(s.team)) s.team = 'same';
        if (!['nextOwner', 'viewer', 'lead', 'none'].includes(s.owner) && !pid.has(s.owner)) s.owner = 'none';
        if (s.status && !open.some(x => x.id === s.status)) s.status = '';
        if (s.priority !== 'same' && !prid.has(s.priority)) s.priority = 'same';
      }
      if (isCustomStep(s.type)) { const x = c.extensions.steps.find(y => y.id === s.type.slice(2)); s.params = Object.assign(paramDefaults(x), s.params || {}); }

    });
    c.actions.forEach(a => {
      a.show.statuses = a.show.statuses.filter(x => x === '*' || sid.has(x));
      if (a.show.filterId && !fid.has(a.show.filterId)) a.show.filterId = '';

    c.extensions.steps.forEach(x => { x.steps = fixSteps(x.steps.filter(s => s.type !== 'x:' + x.id)); });

    c.views.forEach(v => {
      if (v.filterId && !fid.has(v.filterId)) v.filterId = '';
      if (!['none', 'match'].includes(v.count) && !fid.has(v.count)) v.count = 'match';
    });

  }

  // Version 2 used fixed action kinds, status categories and metric keys; convert them to rules and steps.
  function upgradeV2(c) {
    const out = clone(c);
    const g = c.general || {};
    const wf = c.workflow || {};
    const n = c.notifications || {};
    const catOf = s => s.category;
    out.statuses = (c.statuses || []).map(s => (has(s, 'category') ? { id: s.id, name: s.name, color: s.color, closed: catOf(s) === 'done', hold: catOf(s) === 'blocked' } : s));
    out.filters = Array.isArray(c.filters) ? c.filters : clone(DEFAULT_CONFIG.filters);
    if (Number.isFinite(+g.dueSoonDays)) { const ds = out.filters.find(f => f.id === 'f_dueSoon'); if (ds) ds.conds[0].value = +g.dueSoonDays; }
    const metricMap = { all: 'f_all', open: 'f_open', mine: 'f_mine', next: 'f_next', myTeam: 'f_myTeam', overdue: 'f_overdue', dueSoon: 'f_dueSoon', blocked: 'f_blocked', done: 'f_closed', unrouted: 'f_unrouted', alerts: 'f_alerts' };
    const metricFilter = key => {
      if (metricMap[key]) return metricMap[key];
      if (key === 'active') {
        if (!out.filters.some(f => f.id === 'f_active')) out.filters.push({ id: 'f_active', name: 'In progress', match: 'all', count: 'items', conds: [{ subject: 'status', op: 'in', value: (c.statuses || []).filter(s => s.category === 'active').map(s => s.id) }] });
        return 'f_active';
      }
      return 'f_all';
    };
    out.general = Object.assign({}, g, { initialStatusId: g.initialStatusId || wf.initialStatusId || 'assigned', allowDrag: g.allowDrag !== false });
    delete out.general.dueSoonDays;
    if (Array.isArray(c.stats)) out.stats = c.stats.map(s => (s.filterId ? s : { id: s.id, filterId: metricFilter(s.metric), label: s.label, sub: s.sub, visible: s.visible !== false }));
    if (Array.isArray(c.focus)) {
      const all = c.focus.find(f => f.metric === 'all');
      out.focus = { allLabel: all ? all.label : 'All items', options: c.focus.filter(f => f.metric !== 'all').map(f => ({ id: f.id || uid('fo'), filterId: metricFilter(f.metric || f.key), label: f.label, visible: f.visible !== false && f.enabled !== false })) };
    }
    if (Array.isArray(c.views)) {
      out.views = c.views.map(v => {
        if (has(v, 'filterId') || !v.filter) return v;
        const countOf = k => (k === 'none' ? 'none' : k === 'all' || !k ? 'match' : metricFilter(k));
        if (v.kind === 'page') return { id: v.id, label: v.label, kind: 'page', page: v.page, filterId: '', count: v.count === 'none' ? 'none' : 'match' };
        const f = v.filter || {};
        const conds = [];
        if (f.involvesTeamId) conds.push({ subject: 'anyTeam', op: 'is', value: f.involvesTeamId });
        if (f.teamId) conds.push({ subject: 'team', op: 'is', value: f.teamId });
        if (f.ownerId) conds.push({ subject: 'owner', op: 'is', value: f.ownerId });
        if (f.priorityId) conds.push({ subject: 'priority', op: 'in', value: [f.priorityId] });
        if (f.statusId) conds.push({ subject: 'status', op: 'in', value: [f.statusId] });
        if (f.search) conds.push({ subject: 'text', op: 'contains', value: f.search });
        let filterId = '';
        if (f.metric && f.metric !== 'all' && !conds.length) filterId = metricFilter(f.metric);
        else if (conds.length) {
          if (f.metric && f.metric !== 'all') { const base = out.filters.find(x => x.id === metricFilter(f.metric)); if (base) conds.unshift(...clone(base.conds)); }
          const same = out.filters.find(x => JSON.stringify(x.conds) === JSON.stringify(conds));
          if (same) filterId = same.id;
          else { const nf = { id: uid('f'), name: `${v.label} view`, match: 'all', count: 'items', conds }; out.filters.push(nf); filterId = nf.id; }
        }
        return { id: v.id, label: v.label, kind: 'board', page: 'posts', filterId, count: countOf(v.count) };
      });
    }
    if (Array.isArray(c.actions)) {
      out.actions = c.actions.map(a => {
        if (Array.isArray(a.steps)) return a;
        const base = { id: a.id, label: a.label, color: a.color, outline: a.outline, width: a.width, show: { statuses: a.from || ['*'], filterId: '' } };
        const target = (c.statuses || []).find(s => s.id === a.to);
        switch (a.kind) {
          case 'move': {
            const steps = [];
            if (a.askReason) steps.push({ type: 'reason', when: '', prompt: 'Reason (optional)', required: false });
            steps.push({ type: 'setStatus', when: '', to: a.to });
            if (target && target.category === 'blocked' && n.blocked !== false) steps.push(blockNotify());
            return Object.assign(base, { steps });
          }
          case 'handoff':
            return Object.assign(base, { steps: handoffSteps({ closeTo: wf.completeStatusId, landTo: wf.handoffStatusId, route: wf.autoRoute !== false, useLead: wf.autoLead !== false, confirm: wf.confirmComplete !== false, notifyHandoff: n.handoff !== false, notifyNext: n.next !== false, notifyClosed: n.completed !== false }) });
          case 'setnext': return Object.assign(base, { steps: [{ type: 'pickNext', when: '' }, ...(n.next !== false ? [nextNotify()] : [])] });
          case 'edit': return Object.assign(base, { steps: [{ type: 'edit', when: '' }] });
          case 'delete': return Object.assign(base, { steps: [{ type: 'delete', when: '' }] });
        }
        return Object.assign(base, { steps: [] });
      });
    }
    out.notifications = { assigned: n.assigned !== false, next: n.next !== false, popups: n.popups !== false, popupSeconds: n.popupSeconds || 9 };
    delete out.workflow;
    out.version = 3;
    return out;
  }

  // Version 3 had page links mixed into sidebar views plus a separate Focus list, and instant handoffs.
  // Version 4 has one list of board views and handoffs the receiver accepts.
  function upgradeV3(c) {
    const out = clone(c);
    const views = Array.isArray(c.views) ? c.views : [];
    const oldDefault = views.length === 5 && ['v1', 'v2', 'v3', 'v4', 'v5'].every((id, i) => views[i] && views[i].id === id) && views[0].label === 'Posts' && views[3].label === 'Team Overview';
    let next;
    if (oldDefault) next = clone(DEFAULT_CONFIG.views);
    else {
      next = views.filter(v => v && v.kind !== 'page').map(v => ({ id: v.id, label: v.label, filterId: v.filterId || '', count: v.count || 'match', sidebar: true }));
      const fo = c.focus && Array.isArray(c.focus.options) ? c.focus.options : [];
      fo.forEach(o => { if (o.filterId && !next.some(v => v.filterId === o.filterId)) next.push({ id: o.id || uid('v'), label: o.label, filterId: o.filterId, count: 'match', sidebar: false }); });
      if (!next.some(v => !v.filterId)) next.unshift({ id: uid('v'), label: (c.focus && c.focus.allLabel) || 'All work', filterId: '', count: 'f_open', sidebar: true });
    }
    out.views = next;
    delete out.focus;
    out.filters = Array.isArray(c.filters) ? c.filters : [];
    OFFER_FILTERS().forEach(f => { if (!out.filters.some(x => x.id === f.id)) out.filters.push(f); });
    out.actions = Array.isArray(c.actions) ? c.actions : [];
    // Switch to accept/decline only where the old default handoff is still in place.
    const ho = out.actions.find(a => a.id === 'a_handoff');
    if (ho && JSON.stringify(ho.steps) === JSON.stringify(handoffSteps())) {
      ho.steps = offerHandoffSteps();
      ho.show = Object.assign({}, ho.show, { filterId: ho.show && ho.show.filterId ? ho.show.filterId : 'f_noOffer' });
      ['a_start', 'a_pause', 'a_setnext'].forEach(id => { const a = out.actions.find(x => x.id === id); if (a && a.show && !a.show.filterId) a.show.filterId = 'f_noOffer'; });
    }
    OFFER_ACTIONS().reverse().forEach(a => { if (!out.actions.some(x => x.id === a.id)) out.actions.unshift(a); });
    out.general = Object.assign({}, c.general);
    out.general.modules = Object.assign({ overview: true }, (c.general && c.general.modules) || {});
    if (oldDefault) {
      // Old default views carried team shortcuts; keep them reachable as non-sidebar views.
      ['f_gov', 'f_impl'].forEach(fid => { const v = views.find(x => x.filterId === fid); if (v) out.views.push({ id: v.id, label: v.label, filterId: fid, count: 'match', sidebar: false }); });
    }
    out.version = CONFIG_VERSION;
    return out;
  }

  function normalizeConfig(input) {
    let c = input && typeof input === 'object' ? clone(input) : {};

  // Every item carries its own handover records, comments and history.

  function normalizeState(data) {

  // Converts the original name-based format into the id-based model.

  function loadState() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (raw) return normalizeState(JSON.parse(raw));
      const legacy = localStorage.getItem(LEGACY_KEY);
      if (legacy) return migrateV1(JSON.parse(legacy));
    } catch (e) { /* storage unavailable or unreadable */ }
    return null;
  }
  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify(S));
    } catch (e) {
      if (S.files.some(f => f.data)) {
        S.files.forEach(f => { delete f.data; });
        try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); toast('Storage is full — file contents were dropped, metadata kept.'); } catch (e2) { /* ignore */ }
      }
    }
  }
  function commit() { save(); render(); }

  function fixViewer() {

    if (f.focus && !filterById(f.focus)) f.focus = '';

  // ---------- board filtering ----------
  function customValueText(f, v) {
    if (v === '' || v == null) return '';
    const base = fieldBase(f, cfg());
    const t = fieldTypeDef(f, cfg());
    if (base === 'person') return nameOf(v);
    if (base === 'team') return teamNameOf(v);
    if (base === 'bool') return v === true ? 'Yes' : v === false ? 'No' : '';
    if (Array.isArray(v)) return v.join(', ');
    let s = String(v);
    if (t && base === 'number' && t.decimals !== '' && Number.isFinite(+v)) s = (+v).toFixed(Math.max(0, Math.min(6, +t.decimals)));
    return t ? `${t.prefix}${s}${t.suffix}` : s;
  }
  function haystack(it) {
    const parts = [it.ref, it.title, it.desc, teamNameOf(it.teamId), teamNameOf(it.nextTeamId), nameOf(it.ownerId), nameOf(it.nextOwnerId),
      (priority(it.priorityId) || {}).name, statusName(it.statusId)];
    cfg().fields.custom.forEach(f => parts.push(customValueText(f, (it.fields || {})[f.id])));
    return parts.join(' ').toLowerCase();
  }
  function visibleItems() {
    const f = S.filters;
    const q = S.search.trim().toLowerCase();
    return S.items.filter(it => {
      if (f.teamId !== 'all' && it.teamId !== f.teamId) return false;
      if (f.priorityId !== 'all' && it.priorityId !== f.priorityId) return false;
      if (f.focus && !filterMatches(f.focus, it)) return false;
      if (q && !haystack(it).includes(q)) return false;
      return true;
    }).sort((a, b) => (prioRank(a.priorityId) - prioRank(b.priorityId)) || String(a.due || '9').localeCompare(String(b.due || '9')) || String(a.ref).localeCompare(String(b.ref)));

  // Each page has its own heading so pages are distinguishable at a glance.
  const PAGE_INFO = {

  function renderChrome() {

  function renderSidebar() {

  function cardField(it, fid) {
    const L = cfg().fields.labels;
    switch (fid) {
      case 'owner': return { l: L.owner, v: nameOf(it.ownerId) };
      case 'nextOwner': return { l: L.nextOwner, v: nameOf(it.nextOwnerId) };
      case 'team': return { l: L.team, v: teamNameOf(it.teamId) };
      case 'nextTeam': return { l: L.nextTeam, v: teamNameOf(it.nextTeamId) };
      case 'due': return { l: L.due, v: it.due, cls: isOverdue(it) ? 'overdue' : '' };
      case 'status': return { l: L.status, v: statusName(it.statusId) };
      case 'priority': return { l: L.priority, v: (priority(it.priorityId) || {}).name };
      case 'created': return { l: 'Created', v: fmtDate(it.created) };
      case 'updated': return { l: 'Last updated', v: fmtDate(it.updated) };
    }
    if (fid.startsWith('cf:')) {
      const f = cfg().fields.custom.find(x => 'cf:' + x.id === fid);
      return f ? { l: f.label, v: customValueText(f, (it.fields || {})[f.id]) } : null;
    }
    return null;
  }

  const actionVisible = (a, it) => (a.show.statuses.includes('*') || a.show.statuses.includes(it.statusId)) && (!a.show.filterId || filterMatches(a.show.filterId, it));
  function actionsHTML(it) {
    return cfg().actions.filter(a => actionVisible(a, it)).map(a => {
      const style = a.outline ? '' : ` style="background:${esc(a.color)};border-color:${esc(shade(a.color))};color:#fff"`;
      return `<button class="btn-sm span-${a.width}${a.outline ? ' b-plain' : ''}" type="button" data-action="${esc(a.id)}" data-id="${esc(it.id)}"${style}>${esc(a.label)}</button>`;
    }).join('');
  }

  function linksHTML(it) {
    const links = (it.links || []).map(l => ({ l, o: getItem(l.itemId) })).filter(x => x.o);
    if (!links.length) return '';
    return `<div class="links">Linked:${links.map(({ l, o }) => ` <button class="link-chip" type="button" data-goto-item="${esc(o.id)}" title="${esc(o.title)}">${esc(l.type ? `${l.type} · ` : '')}${esc(o.ref)}</button>`).join('')}</div>`;
  }

  function cardHTML(it) {
    const c = cfg().card;
    const fields = c.fields.map(fid => cardField(it, fid)).filter(Boolean);
    const p = priority(it.priorityId);
    const tags = (c.showPriority && p ? `<span class="tag" style="${prioStyle(it.priorityId)}">${esc(p.name)}</span>` : '') +
      (c.showTeam && it.teamId ? `<span class="tag" style="${teamStyle(team(it.teamId))}">${esc(teamNameOf(it.teamId))}</span>` : '');

      ${tags ? `<div class="tags">${tags}</div>` : ''}
      ${fields.length ? `<div class="fields">${fields.map(f => `<div class="field"><div class="field-l">${esc(f.l)}</div><div class="field-v ${f.cls || ''}">${esc(f.v || '—')}</div></div>`).join('')}</div>` : ''}
      ${c.showDesc && it.desc ? `<p class="desc">${esc(it.desc)}</p>` : ''}

      ${it.offer ? `<div class="offer-banner">Awaiting acceptance by <b>${esc(nameOf(it.offer.toId))}</b> · offered by ${esc(nameOf(it.offer.fromId))}</div>` : ''}

  function renderBoard() {
    const list = visibleItems();

    $('#board').innerHTML = sts.map((st, idx) => {

  // Cards at the same position in neighbouring columns share a height so their buttons line up.
  function alignCards() {
    const cols = $$('#board .col-body').map(c => [...c.querySelectorAll(':scope > .card')]);
    cols.flat().forEach(c => { c.style.minHeight = ''; });
    if ($('#view-board').hidden) return;
    const rows = Math.max(0, ...cols.map(c => c.length));
    for (let i = 0; i < rows; i++) {
      const row = cols.map(c => c[i]).filter(Boolean);
      if (row.length < 2) continue;
      const h = Math.max(...row.map(c => c.offsetHeight));
      row.forEach(c => { c.style.minHeight = h + 'px'; });
    }
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => alignCards());
  window.addEventListener('resize', () => { clearTimeout(alignCards.t); alignCards.t = setTimeout(alignCards, 120); });

  function alertText(a) {
    if (a.text) return a.text;
    const it = getItem(a.itemId);
    const ref = it ? it.ref : '(deleted item)';
    const title = it ? ` "${it.title}"` : '';
    const from = nameOf(a.fromId);
    switch (a.kind) {
      case 'next': return `You are the next owner of ${ref}${title} (set by ${from}).`;
      case 'assigned': return `${ref}${title} was assigned to you by ${from}.`;
    }
    return `${ref} needs your attention.`;
  }
  const alertLabel = a => a.label || ({ next: 'NEXT', assigned: 'ASSIGNED' }[a.kind]) || 'ALERT';

  function renderPanel() {

            ${dec ? `<button class="btn-sm b-plain" type="button" data-inbox-action="${esc(dec.id)}" data-id="${esc(it.id)}">${esc(dec.label)}</button>` : ''}
            <button class="btn-sm ${acc ? 'b-plain' : 'b-indigo'}" type="button" data-alert-open="${a.id}">Open item</button>

    $('#activity').innerHTML = S.activity.length

      return `<tr data-team="${esc(t.id)}"><td><b>${esc(t.name)}</b></td>${num(its.filter(isOpen).length)}${sts.map(s => num(its.filter(i => i.statusId === s.id).length)).join('')}${num(its.filter(isOverdue).length)}${num(S.items.filter(i => isOpen(i) && i.nextTeamId === t.id).length)}</tr>`;

    $('#overview').innerHTML = `<div style="overflow-x:auto"><table class="table"><thead><tr>
        <th>Team</th><th class="num">Open</th>${sts.map(s => `<th class="num">${esc(s.name)}</th>`).join('')}<th class="num">Overdue</th><th class="num">Incoming</th>
      </tr></thead><tbody>${rows}</tbody></table></div>`;
