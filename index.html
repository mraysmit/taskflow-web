  function renderConfig() {
    if (!cfgDraft) cfgDraft = clone(S.config);
    fixRefs(cfgDraft);
    const d = cfgDraft;
    const dirty = cfgDirty();
    const errSections = new Set(cfgErrors.map(e => e.section));
    const focusKey = focusKeyOf(document.activeElement);
    $('#view-config').innerHTML = `<div class="cfg-page">
        <nav class="cfg-nav" aria-label="Configuration sections">
          <div class="cfg-nav-title">Configuration</div>
          ${CFG_NAV.map(n => `<button type="button" data-cfg-nav="${n.id}" class="${n.id === cfgSection ? 'active' : ''}${errSections.has(n.id) ? ' err' : ''}"><span>${n.label}</span>${n.count ? `<span class="n">${n.count(d)}</span>` : ''}</button>`).join('')}
        </nav>
        <div class="cfg-main">
          <div class="cfg-bar${dirty ? '' : ' clean'}" id="cfgBar">
            <div class="cfg-bar-text" id="cfgBarText">${dirty ? '<b>Unsaved changes.</b> They apply to the whole workspace when you save.' : 'All changes saved.'}</div>
            <button class="btn" type="button" data-cfg-cmd="discard"${dirty ? '' : ' disabled'}>Discard</button>
            <button class="btn btn-red" type="button" data-cfg-cmd="save"${dirty ? '' : ' disabled'}>Save configuration</button>
          </div>
          ${cfgErrors.length ? `<div class="cfg-errors"><b>Please fix these before saving:</b><ul>${cfgErrors.map(e => `<li><button type="button" data-cfg-nav="${e.section}">${esc(CFG_NAV.find(n => n.id === e.section).label)}</button>: ${esc(e.msg)}</li>`).join('')}</ul></div>` : ''}
          ${SECTIONS[cfgSection](d)}
        </div>
      </div>`;
    if (focusKey) { const el = findByFocusKey(focusKey); if (el) el.focus({ preventScroll: true }); }
  }
  function updateCfgBar() {
    const dirty = cfgDirty();
    const bar = $('#cfgBar');
    if (!bar) return;
    bar.classList.toggle('clean', !dirty);
    $('#cfgBarText').innerHTML = dirty ? '<b>Unsaved changes.</b> They apply to the whole workspace when you save.' : 'All changes saved.';
    $$('[data-cfg-cmd="discard"], [data-cfg-cmd="save"]', bar).forEach(b => { b.disabled = !dirty; });
  }
  const focusKeyOf = el => {
    if (!el || !el.closest || !el.closest('#view-config')) return '';
    if (el.dataset.bind) return 'b:' + el.dataset.bind;
    if (el.dataset.toggle) return `t:${el.dataset.toggle}:${el.value}`;
    if (el.dataset.op) return `o:${el.dataset.op}:${el.dataset.list}:${el.dataset.i || ''}`;
    if (el.dataset.cfgNav) return 'n:' + el.dataset.cfgNav;
    return '';
  };
  const findByFocusKey = key => {
    const [t, ...rest] = key.split(':');
    const v = rest.join(':');
    if (t === 'b') return $(`#view-config [data-bind="${CSS.escape(v)}"]`);
    if (t === 'n') return $(`#view-config [data-cfg-nav="${CSS.escape(v)}"]`);
    if (t === 't') { const i = v.lastIndexOf(':'); return $(`#view-config [data-toggle="${CSS.escape(v.slice(0, i))}"][value="${CSS.escape(v.slice(i + 1))}"]`); }
    if (t === 'o') { const [op, list, i] = v.split(':'); return $(`#view-config [data-op="${op}"][data-list="${CSS.escape(list)}"]${i ? `[data-i="${i}"]` : ''}`); }
    return null;
  };
  const deferRender = () => setTimeout(() => { if (S.page === 'config') renderConfig(); }, 0);

  function readControl(el) {
    if (el.type === 'checkbox') return el.checked;
    if (el.dataset.num) return el.value === '' ? 0 : Number(el.value);
    if (el.dataset.csv) return el.value.split(/[,\n]/).map(s => s.trim()).filter(Boolean);
    return el.value;
  }
  // Side effects of editing particular paths (derived colours, resetting dependent values).
  function afterSet(path, value) {
    let m;
    if ((m = /^teams\.(\d+)\.color$/.exec(path))) cfgDraft.teams[+m[1]].bg = tint(value, 0.86);
    if ((m = /^priorities\.(\d+)\.fg$/.exec(path))) cfgDraft.priorities[+m[1]].bg = tint(value);
    if ((m = /^statuses\.(\d+)\.closed$/.exec(path)) && value) cfgDraft.statuses[+m[1]].hold = false;
    if ((m = /^filters\.(\d+)\.conds\.(\d+)\.(subject|op)$/.exec(path))) {
      const cd = cfgDraft.filters[+m[1]].conds[+m[2]];
      const def = subjectDef(cd.subject, cfgDraft);
      if (!def) return;
      if (m[3] === 'subject') cd.op = def.ops[0][0];
      cd.value = kindDefault(opKind(def, cd.op));
      if (def.custom) cd.params = paramDefaults(def.custom); else delete cd.params;
    }
    if ((m = /^(.+\.steps)\.(\d+)\.type$/.exec(path))) {
      const steps = getPath(cfgDraft, m[1]);
      const old = steps[+m[2]];
      if (isCustomStep(value)) {
        const x = cfgDraft.extensions.steps.find(y => 'x:' + y.id === value);
        steps[+m[2]] = { type: value, when: old.when || '', params: x ? paramDefaults(x) : {} };
      } else {
        steps[+m[2]] = Object.assign({ type: value, when: old.when || '' }, STEP_TYPES[value].defaults(), stepContextDefaults(value));
      }
    }
  }
  function stepContextDefaults(type) {
    const d = cfgDraft;
    if (type === 'setStatus') return { to: (d.statuses.find(s => !s.closed) || d.statuses[0] || {}).id || '' };
    if (type === 'setPriority') return { to: (d.priorities[0] || {}).id || '' };
    if (type === 'setField') return { fieldId: (d.fields.custom[0] || {}).id || '' };
    return {};
  }

  const rowKey = list => list.replace(/\.\d+\./g, '.*.');
  const NEW_ROW = {
    teams: () => ({ id: uid('t'), name: '', color: '#343a8a', bg: '#e4e4f7', leadId: '', nextTeamId: '' }),
    people: () => ({ id: uid('p'), name: '', teamId: (cfgDraft.teams[0] || {}).id || '', role: '', active: true }),
    priorities: () => ({ id: uid('pr'), name: '', fg: '#4a4f57', bg: tint('#4a4f57'), dueDays: 3 }),
    statuses: () => ({ id: uid('s'), name: '', color: '#6b7280', closed: false, hold: false }),
    filters: () => ({ id: uid('f'), name: '', match: 'all', count: 'items', conds: [{ subject: 'state', op: 'open', value: '' }] }),
    'filters.*.conds': () => ({ subject: 'state', op: 'open', value: '' }),
    actions: () => ({ id: uid('a'), label: '', color: '#2e3394', outline: false, width: 'md', show: { statuses: ['*'], filterId: '' }, steps: [Object.assign({ type: 'setStatus', when: '' }, stepContextDefaults('setStatus'))] }),
    'actions.*.steps': () => Object.assign({ type: 'notify', when: '' }, STEP_TYPES.notify.defaults()),
    'fields.custom': () => ({ id: uid('cf'), label: '', type: 'text', options: [], required: false, help: '', min: '', max: '' }),
    'card.fields': () => { const used = new Set(cfgDraft.card.fields); return (cardFieldOptions(cfgDraft).find(o => !used.has(o.v)) || cardFieldOptions(cfgDraft)[0]).v; },
    stats: () => ({ id: uid('st'), filterId: (cfgDraft.filters.find(f => f.id === 'f_dueSoon') || cfgDraft.filters[0] || {}).id || '', label: 'Due soon', sub: '', visible: true }),
    views: () => ({ id: uid('v'), label: '', filterId: '', count: 'match', sidebar: true }),
    'extensions.flags': () => ({ id: uid('fl'), name: '', help: '' }),
    'extensions.fieldTypes': () => ({ id: uid('ft'), name: '', base: 'text', pattern: '', patternMsg: '', min: '', max: '', decimals: '', prefix: '', suffix: '', options: [], script: '' }),
    'extensions.conditions': () => ({ id: uid('xc'), name: '', params: [], script: '!item.closed' }),
    'extensions.conditions.*.params': () => ({ key: '', label: '', type: 'text' }),
    'extensions.steps': () => ({ id: uid('xs'), name: '', mode: 'macro', params: [], script: '', steps: [] }),
    'extensions.steps.*.params': () => ({ key: '', label: '', type: 'text' }),
    'extensions.steps.*.steps': () => Object.assign({ type: 'notify', when: '' }, STEP_TYPES.notify.defaults()),
  };

  function cfgOp(op, list, i) {
    const arr = getPath(cfgDraft, list);
    if (op === 'up' || op === 'down') {
      const j = op === 'up' ? i - 1 : i + 1;
      if (j < 0 || j >= arr.length) return;
      [arr[i], arr[j]] = [arr[j], arr[i]];
      renderConfig();
      const btn = $(`#view-config [data-op="${op}"][data-list="${CSS.escape(list)}"][data-i="${j}"]`);
      if (btn && !btn.disabled) btn.focus();
      return;
    }
    if (op === 'add') {
      const make = NEW_ROW[rowKey(list)];
      if (!make) return;
      arr.push(make());
      renderConfig();
      const rows = $$(`#view-config [data-op="up"][data-list="${CSS.escape(list)}"]`);
      const last = rows.length ? rows[rows.length - 1].closest('.crow') : null;
      const first = last && last.querySelector('input.input, select');
      if (first) { first.focus(); first.scrollIntoView({ block: 'center' }); }
      return;
    }
    if (op === 'del') deleteCfgRow(list, i);
  }

  // Rewrites references inside the draft when an entity is removed or replaced.
  function remapDraftRefs(d, list, from, to) {
    const m = v => (v === from ? to : v);
    if (list === 'people') {
      d.teams.forEach(t => { t.leadId = m(t.leadId); });
      d.actions.forEach(a => a.steps.forEach(s => {
        if ((s.type === 'setOwner' || s.type === 'setNext') && s.to === from) s.to = to || 'none';
        if (s.type === 'notify' && s.personId === from) s.personId = to;
      }));
    }
    if (list === 'teams') {
      d.teams.forEach(t => { t.nextTeamId = m(t.nextTeamId); });
      d.people.forEach(p => { p.teamId = m(p.teamId); });
    }
    if (list === 'statuses') {
      d.general.initialStatusId = m(d.general.initialStatusId);
      d.actions.forEach(a => {
        a.show.statuses = uniq(a.show.statuses.map(m).filter(Boolean));
        a.steps.forEach(s => { if (s.type === 'setStatus') s.to = m(s.to); if (s.type === 'acceptOffer') s.land = m(s.land); });
      });
    }
    if (list === 'priorities') d.actions.forEach(a => a.steps.forEach(s => { if (s.type === 'setPriority') s.to = m(s.to); }));
    d.filters.forEach(f => f.conds.forEach(cd => {
      const def = subjectDef(cd.subject, d);
      if (!def) return;
      const k = opKind(def, cd.op);
      if ((k === 'person' && list === 'people') || (k === 'team' && list === 'teams')) cd.value = m(cd.value);
      if ((k === 'statuses' && list === 'statuses') || (k === 'priorities' && list === 'priorities')) cd.value = uniq((cd.value || []).map(m).filter(Boolean));
    }));
  }

  function deleteCfgRow(list, i) {
    const arr = getPath(cfgDraft, list);
    const row = arr[i];
    if (list === 'filters') { deleteFilter(i); return; }
    if (/^extensions\.(flags|fieldTypes|conditions|steps)$/.test(list)) {
      const uses = extUses(cfgDraft, list, row.id);
      if (uses.length) {
        modal({ title: `“${row.name || 'This block'}” is in use`, html: `<div>It is used by ${esc(uses.join(', '))}. Change those first.</div>`, ok: 'OK', okClass: 'btn', onOk: () => {} });
        return;
      }
      if (list === 'extensions.flags') cfgDraft.statuses.forEach(s => { s.flags = (s.flags || []).filter(x => x !== row.id); });
    }
    if (!REMAPPABLE.includes(list)) { arr.splice(i, 1); renderConfig(); return; }
    const saved = S.config[list].some(x => x.id === row.id);
    const usage = saved ? USAGE[list](row.id) : 0;
    const remove = replacement => {
      arr.splice(i, 1);
      remapDraftRefs(cfgDraft, list, row.id, replacement === '__keep' ? '' : replacement);
      if (saved) {
        const map = cfgRemap[list];
        Object.keys(map).forEach(k => { if (map[k] === row.id) map[k] = replacement; });
        if (replacement !== '__keep') map[row.id] = replacement;
      }
      renderConfig();
    };
    if (!usage) { remove(list === 'people' ? '__keep' : ''); return; }
    const others = arr.filter(x => x.id !== row.id);
    const name = row.name || '(unnamed)';
    let options;
    if (list === 'people') options = [...others.map(p => ({ v: p.id, l: `Reassign to ${p.name || '(unnamed)'}` })), { v: '__keep', l: 'Keep on items as a former member' }, { v: '', l: 'Leave unassigned' }];
    else if (list === 'teams') options = [...others.map(t => ({ v: t.id, l: `Move to ${t.name || '(unnamed)'}` })), { v: '', l: 'Clear the team' }];
    else options = others.map(x => ({ v: x.id, l: `Move to ${x.name || '(unnamed)'}` }));
    if (!options.length) { toast(`Add another one before removing “${name}”.`); return; }
    modal({
      title: `Remove “${name}”?`,
      html: `<div>${plural(usage, 'item')} currently use${usage === 1 ? 's' : ''} “${esc(name)}”. When you save, they will be updated as chosen below.</div>
        <label><span>What happens to those items</span><select class="select" id="m_repl">${options.map(o => opt(o.v, o.l, false)).join('')}</select></label>`,
      ok: 'Remove',
      onOk: body => remove($('#m_repl', body).value),
    });
  }

  // A filter used by a button can't be removed (it would change what the button does); other uses are cleared.
  function deleteFilter(i) {
    const f = cfgDraft.filters[i];
    const uses = filterUses(cfgDraft, f.id);
    const blocking = uses.filter(u => u.kind === 'action' || u.kind === 'filter');
    if (blocking.length) {
      modal({ title: `“${f.name || 'Filter'}” is in use`, html: `<div>It is used by ${esc(blocking.map(u => u.text).join(', '))}. Change those first so their behaviour stays predictable.</div>`, ok: 'OK', okClass: 'btn', onOk: () => {} });
      return;
    }
    const go = () => {
      cfgDraft.filters.splice(i, 1);
      cfgDraft.stats = cfgDraft.stats.filter(s => s.filterId !== f.id);
      cfgDraft.views.forEach(v => { if (v.filterId === f.id) v.filterId = ''; if (v.count === f.id) v.count = 'match'; });
      renderConfig();
    };
    if (!uses.length) { go(); return; }
    modal({ title: `Remove “${f.name || 'Filter'}”?`, html: `<div>It is used by ${esc(uses.map(u => u.text).join(', '))}. Those stat cards will be removed, and those board views will show all items.</div>`, ok: 'Remove', onOk: go });
  }

  function validateDraft(d) {
    const e = [];
    const add = (sectionId, msg) => e.push({ section: sectionId, msg });
    const g = d.general;
    if (!String(g.appName || '').trim()) add('general', 'Workspace name is required.');
    if (!(Number.isInteger(+g.refDigits) && +g.refDigits >= 1 && +g.refDigits <= 8)) add('general', 'Reference digits must be a whole number from 1 to 8.');
    const uniqNames = (items, key, sectionId, noun) => {
      const seen = new Set();
      items.forEach((x, i) => {
        const v = String(x[key] || '').trim();
        x[key] = v;
        if (!v) add(sectionId, `${noun} #${i + 1} needs a name.`);
        else if (seen.has(v.toLowerCase())) add(sectionId, `${noun} “${v}” is listed twice.`);
        seen.add(v.toLowerCase());
      });
    };
    uniqNames(d.teams, 'name', 'teams', 'Team');
    uniqNames(d.people, 'name', 'people', 'Person');
    uniqNames(d.priorities, 'name', 'priorities', 'Priority');
    uniqNames(d.statuses, 'name', 'statuses', 'Status');
    uniqNames(d.filters, 'name', 'filters', 'Filter');
    uniqNames(d.fields.custom, 'label', 'fields', 'Custom field');
    if (!d.teams.length) add('teams', 'Add at least one team.');
    if (!d.people.some(p => p.active)) add('people', 'At least one person must be active.');
    if (!d.priorities.length) add('priorities', 'Add at least one priority.');
    if (!d.statuses.some(s => !s.closed)) add('statuses', 'Add at least one status that doesn’t close the item.');
    if (!d.statuses.some(s => s.closed)) add('statuses', 'Add at least one status that closes the item.');
    if (!d.statuses.some(s => s.id === g.initialStatusId && !s.closed)) add('workflow', 'Choose the status new items start in.');
    d.filters.forEach(f => f.conds.forEach((cd, j) => {
      const def = subjectDef(cd.subject, d);
      const k = def ? opKind(def, cd.op) : '';
      const v = cd.value;
      const missing = k && (Array.isArray(v) ? !v.length : (v === '' || v == null));
      if (missing) add('filters', `Filter “${f.name || '(unnamed)'}”, condition ${j + 1}, needs a value.`);
    }));
    d.actions.forEach((a, i) => {
      a.label = String(a.label || '').trim();
      const nm = a.label || `#${i + 1}`;
      if (!a.label) add('workflow', `Button #${i + 1} needs a label.`);
      if (!a.show.statuses.length) add('workflow', `Button “${nm}” isn’t shown for any status.`);
      if (!a.steps.length) add('workflow', `Button “${nm}” has no steps.`);
      validateSteps(d, a.steps, `Button “${nm}”`, 'workflow', add);
    });
    BUILTIN_FIELDS.forEach(k => { d.fields.labels[k] = String(d.fields.labels[k] || '').trim(); if (!d.fields.labels[k]) add('fields', `The built-in “${DEFAULT_CONFIG.fields.labels[k]}” field needs a label.`); });
    d.fields.custom.forEach(f => {
      const base = fieldBase(f, d);
      if ((base === 'select' || base === 'multiselect') && !fieldOptions(f, d).length) add('fields', `Field “${f.label || '(unnamed)'}” needs at least one option.`);
      if (base === 'number' && f.min !== '' && f.max !== '' && +f.min > +f.max) add('fields', `Field “${f.label}”: minimum is greater than maximum.`);
    });
    // Extensions
    const x = d.extensions;
    uniqNames(x.flags, 'name', 'extensions', 'Status flag');
    uniqNames(x.fieldTypes, 'name', 'extensions', 'Field type');
    uniqNames(x.conditions, 'name', 'extensions', 'Condition type');
    uniqNames(x.steps, 'name', 'extensions', 'Step type');
    const checkScript = (code, args, auto, what) => {
      if (!String(code || '').trim()) { add('extensions', `${what} needs a script.`); return; }
      try { new Function(...args, (auto && !/\breturn\b/.test(code) ? `return (${code});` : code)); } catch (err) { add('extensions', `${what}: ${err.message}`); }
    };
    const checkParams = (params, what) => {
      const seen = new Set();
      params.forEach(p => {
        p.key = String(p.key || '').trim();
        if (!/^[A-Za-z_$][\w$]*$/.test(p.key)) add('extensions', `${what}: parameter key “${p.key}” must be a simple name like “amount”.`);
        else if (seen.has(p.key)) add('extensions', `${what}: parameter “${p.key}” is listed twice.`);
        seen.add(p.key);
      });
    };
    x.fieldTypes.forEach(t => {
      if (t.pattern) { try { new RegExp(t.pattern); } catch (err) { add('extensions', `Field type “${t.name}”: pattern is not a valid regular expression.`); } }
      if (t.script.trim()) checkScript(t.script, ['value', 'field', 'api'], true, `Field type “${t.name}” validator`);
      if ((t.base === 'select' || t.base === 'multiselect') && !t.options.length && d.fields.custom.some(f => f.type === 'x:' + t.id && !f.options.length)) add('extensions', `Field type “${t.name}” needs shared options (or give each field its own).`);
    });
    x.conditions.forEach(c => { checkParams(c.params, `Condition “${c.name}”`); checkScript(c.script, ['item', 'params', 'viewer', 'today', 'api'], true, `Condition “${c.name}”`); });
    x.steps.forEach(s => {
      if (s.mode === 'script') { checkParams(s.params, `Step type “${s.name}”`); checkScript(s.script, ['ctx'], false, `Step type “${s.name}”`); }
      else if (!s.steps.length) add('extensions', `Step type “${s.name}” has no steps.`);
      else validateSteps(d, s.steps, `Step type “${s.name}”`, 'extensions', add);
    });
    d.stats.forEach((s, i) => { if (!String(s.label || '').trim()) add('dashboard', `Stat card #${i + 1} needs a label.`); if (!d.filters.some(f => f.id === s.filterId)) add('dashboard', `Stat card #${i + 1} needs a filter.`); });
    d.views.forEach((v, i) => { if (!String(v.label || '').trim()) add('views', `Board view #${i + 1} needs a label.`); });
    if (!d.views.length) add('views', 'Add at least one board view.');
    if (!(+d.notifications.popupSeconds >= 2 && +d.notifications.popupSeconds <= 120)) add('notifications', 'Pop-up duration must be between 2 and 120 seconds.');
    return e;
  }

  function validateSteps(d, steps, owner, sectionId, add) {
    const has2 = (s, k) => String(s[k] || '').trim();
    steps.forEach((s, j) => {
      const at = `${owner}, step ${j + 1}`;
      if (s.type === 'setStatus' && s.to !== '__prev' && !d.statuses.some(x => x.id === s.to)) add(sectionId, `${at}: choose a status.`);
      if (s.type === 'setField' && !d.fields.custom.some(f => f.id === s.fieldId)) add(sectionId, `${at}: choose a custom field.`);
      if (s.type === 'notify' && !has2(s, 'message')) add(sectionId, `${at}: the alert needs a message.`);
      if (s.type === 'notify' && s.who === 'person' && !s.personId) add(sectionId, `${at}: choose who receives the alert.`);
      if (s.type === 'confirm' && !has2(s, 'message')) add(sectionId, `${at}: the confirmation needs a message.`);
      if (s.type === 'createItem' && !has2(s, 'title')) add(sectionId, `${at}: the new item needs a title.`);
      if (s.type === 'email' && s.to === 'person' && !s.personId) add(sectionId, `${at}: choose who receives the email.`);
      if (s.type === 'email' && s.to === 'address' && !has2(s, 'address')) add(sectionId, `${at}: enter an email address.`);
      if (s.type === 'webhook' && !/^https?:\/\/\S+/i.test(s.url || '')) add(sectionId, `${at}: the webhook needs a URL starting with http:// or https://.`);
      if (s.type === 'runButton' && !d.actions.some(a => a.id === s.actionId)) add(sectionId, `${at}: choose a button to run.`);
      if (s.type === 'handoverNote' && !noteSections(s).length) add(sectionId, `${at}: list at least one note section.`);
      if (s.type === 'acceptOffer' && !d.statuses.some(x => x.id === s.land && !x.closed)) add(sectionId, `${at}: choose the status after accepting.`);
      if (isCustomStep(s.type) && !d.extensions.steps.some(x => 'x:' + x.id === s.type)) add(sectionId, `${at}: that step type no longer exists.`);
    });
  }

  const configHasScripts = c => c.extensions.conditions.some(x => x.script.trim()) || c.extensions.steps.some(x => x.mode === 'script' && x.script.trim()) || c.extensions.fieldTypes.some(x => x.script.trim());

  function resolveChains(map) {
    const out = {};
    Object.keys(map).forEach(k => {
      let v = map[k];
      const seen = new Set([k]);
      while (v && has(map, v) && !seen.has(v)) { seen.add(v); v = map[v]; }
      out[k] = v;
    });
    return out;
  }

  function saveDraft() {
    const errs = validateDraft(cfgDraft);
    if (errs.length) {
      cfgErrors = errs;
      cfgSection = errs[0].section;
      renderConfig();
      $('#content').scrollTop = 0;
      toast('Fix the listed problems before saving.');
      return;
    }
    const d = normalizeConfig(cfgDraft);
    const R = {};
    Object.keys(cfgRemap).forEach(k => { R[k] = resolveChains(cfgRemap[k]); });
    const mp = (map, v) => (v && has(map, v) ? map[v] : v);
    const pIds = new Set(d.people.map(p => p.id));
    const tIds = new Set(d.teams.map(t => t.id));
    S.config.people.forEach(p => { if (!pIds.has(p.id)) S.removed.people[p.id] = p.name; });
    S.config.teams.forEach(t => { if (!tIds.has(t.id)) S.removed.teams[t.id] = t.name; });
    const personFields = d.fields.custom.filter(f => f.type === 'person');
    const teamFields = d.fields.custom.filter(f => f.type === 'team');
    S.items.forEach(it => {
      it.ownerId = mp(R.people, it.ownerId);
      it.nextOwnerId = mp(R.people, it.nextOwnerId);
      it.teamId = mp(R.teams, it.teamId);
      it.nextTeamId = mp(R.teams, it.nextTeamId);
      it.priorityId = mp(R.priorities, it.priorityId);
      it.statusId = mp(R.statuses, it.statusId);
      it.prevStatusId = mp(R.statuses, it.prevStatusId);
      it.fields = it.fields || {};
      personFields.forEach(f => { it.fields[f.id] = mp(R.people, it.fields[f.id]); });
      teamFields.forEach(f => { it.fields[f.id] = mp(R.teams, it.fields[f.id]); });
    });
    S.alerts.forEach(a => { a.toId = mp(R.people, a.toId); a.fromId = mp(R.people, a.fromId); });
    S.alerts = S.alerts.filter(a => a.toId);
    S.posts.forEach(p => { p.authorId = mp(R.people, p.authorId); });
    S.notes.forEach(n => { n.authorId = mp(R.people, n.authorId); });
    S.files.forEach(f => { f.byId = mp(R.people, f.byId); });
    S.viewerId = mp(R.people, S.viewerId);
    S.config = d;
    // Anything still pointing at a removed status or priority falls back to a sensible default.
    const sid = new Set(d.statuses.map(s => s.id));
    const prid = new Set(d.priorities.map(p => p.id));
    S.items.forEach(it => {
      if (!sid.has(it.statusId)) it.statusId = d.general.initialStatusId;
      if (it.prevStatusId && !sid.has(it.prevStatusId)) it.prevStatusId = '';
      if (!prid.has(it.priorityId)) it.priorityId = defaultPriorityId();
    });
    cleanFilters();
    fixViewer();
    cfgDraft = clone(S.config);
    cfgRemap = emptyRemap();
    cfgErrors = [];
    lastCustomSig = null;
    const ed = editingId && getItem(editingId);
    if (ed) fillForm(ed); else if (!F('title').value.trim()) resetForm();
    log(`Configuration saved by ${viewerName()}.`, 'CONFIG');
    commit();
    toast('Configuration saved.');
  }

  function download(name, data) {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  let importMode = 'config';
  function cfgCommand(cmd) {
    switch (cmd) {
      case 'save': saveDraft(); break;
      case 'discard':
        cfgDraft = clone(S.config); cfgRemap = emptyRemap(); cfgErrors = [];
        renderConfig(); toast('Changes discarded.'); break;
      case 'export-config':
        download('design-hub-config.json', { app: 'design-hub', kind: 'config', version: CONFIG_VERSION, config: S.config });
        toast(cfgDirty() ? 'Exported the saved configuration (unsaved changes not included).' : 'Configuration exported.'); break;
      case 'import-config': importMode = 'config'; $('#importInput').click(); break;
      case 'defaults':
        cfgDraft = normalizeConfig(DEFAULT_CONFIG); cfgErrors = [];
        renderConfig(); toast('Default configuration loaded. Review it, then Save.'); break;
      case 'export-all': {
        const data = clone(S);
        delete data.page;
        download('design-hub-backup.json', Object.assign({ app: 'design-hub', kind: 'backup' }, data));
        toast('Backup downloaded.'); break;
      }
      case 'import-all': importMode = 'all'; $('#importInput').click(); break;
    }
  }
  $('#importInput').addEventListener('change', e => {
    const file = e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      let data;
      try { data = JSON.parse(r.result); if (!data || typeof data !== 'object') throw new Error('bad'); } catch (err) { toast('That file is not valid JSON.'); return; }
      if (importMode === 'config') {
        cfgDraft = normalizeConfig(data.config || data);
        cfgErrors = [];
        // Imported scripts never run until someone has looked at them.
        const scripted = configHasScripts(cfgDraft);
        cfgDraft.extensions.scriptsEnabled = false;
        renderConfig();
        toast(`Loaded ${file.name}. Review it, then Save.${scripted ? ' It contains scripts, which are switched off — check them under Extensions before turning them on.' : ''}`);
        return;
      }
      if (!Array.isArray(data.items)) { toast('That file is not a workspace backup.'); return; }
      modal({
        title: 'Restore from backup?',
        html: `<div>This replaces <b>everything</b> in this workspace with <b>${esc(file.name)}</b>: ${plural(data.items.length, 'item')}, its configuration, alerts, activity, posts, files and notes.</div>`,
        ok: 'Restore',
        onOk: () => {
          S = normalizeState(data);
          if (configHasScripts(S.config) && S.config.extensions.scriptsEnabled) {
            S.config.extensions.scriptsEnabled = false;
            toast('The backup contains scripts; they are switched off until you turn them on under Extensions.');
          }
          S.page = 'config';
          cfgDraft = clone(S.config); cfgRemap = emptyRemap(); cfgErrors = [];
          lastCustomSig = null;
          resetForm();
          commit();
          toast('Workspace restored from backup.');
        },
      });
    };
    r.readAsText(file);
  });

  const cv = $('#view-config');
  // Bound controls write on both input and change so every control type is covered.
  function onBound(el) {
    if (!el.dataset.bind || !cfgDraft) return;
    const value = readControl(el);
    setPath(cfgDraft, el.dataset.bind, value);
    afterSet(el.dataset.bind, value);
    const row = el.closest('[data-row]');
    if (row) {
      const [list, i] = row.dataset.row.split(':');
      const prev = row.querySelector('[data-prev]');
      if (prev && PREVIEW[list]) prev.innerHTML = PREVIEW[list](getPath(cfgDraft, list)[+i]);
    }
    const live = $('[data-live="refPreview"]', cv);
    if (live) live.textContent = nextRef(cfgDraft);
    updateCfgBar();
  }
  cv.addEventListener('input', e => { if (e.target.type !== 'checkbox' && e.target.tagName !== 'SELECT') onBound(e.target); });
  cv.addEventListener('change', e => {
    const el = e.target;
    onBound(el);
    if (el.dataset.toggle) {
      const cur = getPath(cfgDraft, el.dataset.toggle);
      const arr = Array.isArray(cur) ? cur : [];
      let next;
      if (el.value === '*') next = el.checked ? ['*'] : cfgDraft.statuses.map(s => s.id);
      else next = el.checked ? [...arr.filter(x => x !== el.value), el.value] : arr.filter(x => x !== el.value);
      setPath(cfgDraft, el.dataset.toggle, next);
      updateCfgBar();
      deferRender();
      return;
    }
    if (el.dataset.previewStatus) { cfgPreviewStatus = el.value; deferRender(); return; }
    if (el.dataset.rerender) deferRender();
  });
  cv.addEventListener('click', e => {
    const nav = e.target.closest('[data-cfg-nav]');
    if (nav) { cfgSection = nav.dataset.cfgNav; renderConfig(); $('#content').scrollTop = 0; return; }
    const op = e.target.closest('[data-op]');
    if (op && !op.disabled) { cfgOp(op.dataset.op, op.dataset.list, +op.dataset.i); return; }
    const cmd = e.target.closest('[data-cfg-cmd]');
    if (cmd && !cmd.disabled) cfgCommand(cmd.dataset.cfgCmd);
  });
  window.addEventListener('beforeunload', e => { if (S.page === 'config' && cfgDirty()) { e.preventDefault(); e.returnValue = ''; } });

  // ---------- board events ----------
  $('#board').addEventListener('click', e => {
    const btn = e.target.closest('[data-action]');
    if (btn) runAction(btn.dataset.action, btn.dataset.id);
    const det = e.target.closest('[data-open-item]');
    if (det) openItemDetails(det.dataset.openItem);
    const link = e.target.closest('[data-goto-item]');
    if (link) {
      const id = link.dataset.gotoItem;
      if (!visibleItems().some(i => i.id === id)) { resetFilters(); commit(); }
      flashCard(id);
    }
  });

  let dragId = null;
  $('#board').addEventListener('dragstart', e => {
    const card = e.target.closest('.card');
    if (!card || !cfg().general.allowDrag) return;
    dragId = card.dataset.id;
    card.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', dragId); } catch (_) { /* some browsers refuse */ }
  });
  $('#board').addEventListener('dragend', e => {
    const card = e.target.closest('.card');
    if (card) card.classList.remove('dragging');
    $$('.col.drop').forEach(c => c.classList.remove('drop'));
    dragId = null;
  });
  $('#board').addEventListener('dragover', e => {
    const col = e.target.closest('.col');
    if (!col || !dragId) return;
    e.preventDefault();
    $$('.col.drop').forEach(c => { if (c !== col) c.classList.remove('drop'); });
    col.classList.add('drop');
  });
  $('#board').addEventListener('drop', e => {
    const col = e.target.closest('.col');
    if (!col || !dragId) return;
    e.preventDefault();
    col.classList.remove('drop');
    const it = getItem(dragId);
    dragId = null;
    if (!it || !moveStatus(it, col.dataset.status)) return;
    it.updated = Date.now();
    log(`${it.ref} moved to ${statusName(it.statusId)} by ${viewerName()}.`, 'STATUS', it);
    commit();
    flashCard(it.id);
  });

  $('#stats').addEventListener('click', e => {
    const b = e.target.closest('[data-focus]');
    if (!b) return;
    S.filters.focus = S.filters.focus === b.dataset.focus ? '' : b.dataset.focus;
    const v = viewForFocus(S.filters.focus);
    S.viewId = v ? v.id : '';
    commit();
  });
  $('#fViewer').addEventListener('change', e => {
    S.viewerId = e.target.value;
    if (!editingId && !F('title').value.trim()) resetForm();
    commit();
    toast(`Now viewing as ${viewerName()}.`);
    popPendingForViewer();
  });
  $('#fTeam').addEventListener('change', e => { S.filters.teamId = e.target.value; commit(); });
  $('#fPriority').addEventListener('change', e => { S.filters.priorityId = e.target.value; commit(); });
  $('#fFocus').addEventListener('change', e => {
    const v = cfg().views.find(x => x.id === e.target.value);
    if (!v) return;
    S.viewId = v.id;
    S.filters.focus = v.filterId || '';
    commit();
  });
  $('#btnReset').addEventListener('click', () => { resetFilters(); $('#search').value = ''; commit(); });

  $('#search').addEventListener('input', e => {
    const q = e.target.value;
    if (S.page !== 'board') { setPage('board', () => { S.search = q; }); return; }
    S.search = q;
    save(); renderSidebar(); renderBoard();
  });
  document.addEventListener('keydown', e => {
    if (e.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) && !dlg.open) { e.preventDefault(); $('#search').focus(); }
  });

  $('#tabs').addEventListener('click', e => {
    const b = e.target.closest('[data-tab]');
    if (b) setPage(b.dataset.tab);
  });
  $('#sideNav').addEventListener('click', e => {
    const b = e.target.closest('[data-view]');
    if (!b) return;
    const v = cfg().views.find(x => x.id === b.dataset.view);
    if (v) applyView(v);
  });
  $('#sideConfig').addEventListener('click', () => openConfig());
  $('#overview').addEventListener('click', e => {
    const row = e.target.closest('[data-team]');
    if (row) setPage('board', () => { resetFilters(); S.filters.teamId = row.dataset.team; });
  });

  $('#btnNew').addEventListener('click', () => { resetForm(); focusForm(); });
  $('#btnCreate').addEventListener('click', () => { resetForm(); focusForm(); });
  $('#btnMarkRead').addEventListener('click', () => {
    const list = unreadFor(S.viewerId);
    if (!list.length) { toast(`No unread alerts for ${viewerName()}.`); return; }
    list.forEach(a => { a.read = true; a.popped = true; });
    log(`${viewerName()} marked ${plural(list.length, 'alert')} read.`, 'ALERT');
    commit();
    toast(`Marked ${plural(list.length, 'alert')} read.`);
  });
  $('#inbox').addEventListener('click', e => {
    const ia = e.target.closest('[data-inbox-action]');
    if (ia) { runAction(ia.dataset.inboxAction, ia.dataset.id); return; }
    const o = e.target.closest('[data-alert-open]');
    const r = e.target.closest('[data-alert-read]');
    if (o) openAlert(o.dataset.alertOpen);
    if (r) { const a = S.alerts.find(x => x.id === r.dataset.alertRead); if (a) { a.read = true; commit(); } }
  });

  $('#btnSample').addEventListener('click', () => {
    const go = () => {
      S = sampleState(S);
      cfgDraft = null;
      cfgRemap = emptyRemap();
      lastCustomSig = null;
      resetForm();
      setPage('board');
      toast('Sample board loaded.');
      popPendingForViewer();
    };
    if (!S.items.length && !S.posts.length && !S.files.length && !S.notes.length) { go(); return; }
    modal({
      title: 'Load sample data?',
      html: '<div>This replaces the current items, alerts, activity, posts, files and notes with the sample workspace. Your configuration is kept; any sample teams, people, priorities, statuses or filters that are missing are added back.</div>',
      ok: 'Load sample', onOk: go,
    });
  });
  $('#btnClear').addEventListener('click', () => {
    modal({
      title: 'Clear the board?',
      html: '<div>This removes all items, alerts and activity. Configuration, posts, files and notes are kept.</div>',
      ok: 'Clear board',
      onOk: () => {
        S.items = []; S.alerts = []; S.activity = [];
        resetFilters();
        resetForm();
        log(`Board cleared by ${viewerName()}.`, 'CLEAR');
        commit();
        toast('Board cleared.');
      },
    });
  });

  // ---------- posts / files / notes ----------
  $('#postForm').addEventListener('submit', e => {
    e.preventDefault();
    const text = $('#postText').value.trim();
    if (!text) return;
    const itemId = $('#postRef').value;
    S.posts.push({ id: uid('po'), authorId: S.viewerId, text, itemId, time: Date.now() });
    log(`${viewerName()} posted an update${itemId ? ` on ${itemRef(itemId)}` : ''}.`, 'POST');
    $('#postText').value = '';
    commit();
  });
  $('#postList').addEventListener('click', e => {
    const d = e.target.closest('[data-post-del]');
    const g = e.target.closest('[data-goto]');
    if (d) { S.posts = S.posts.filter(p => p.id !== d.dataset.postDel); commit(); }
    if (g) gotoItem(g.dataset.goto);
  });

  const dz = $('#dropzone');
  dz.addEventListener('click', () => $('#fileInput').click());
  dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drop'); });
  dz.addEventListener('dragleave', () => dz.classList.remove('drop'));
  dz.addEventListener('drop', e => { e.preventDefault(); dz.classList.remove('drop'); addFiles(e.dataTransfer.files); });
  $('#fileInput').addEventListener('change', e => { addFiles(e.target.files); e.target.value = ''; });
  function addFiles(fileList) {
    const files = [...(fileList || [])];
    if (!files.length) return;
    const itemId = $('#fileRef').value;
    let pending = files.length;
    const done = () => {
      if (--pending) return;
      log(`${viewerName()} added ${plural(files.length, 'file')}${itemId ? ` to ${itemRef(itemId)}` : ''}.`, 'FILE');
      commit();
      toast(`${plural(files.length, 'file')} added.`);
    };
    files.forEach(f => {
      const rec = { id: uid('fi'), name: f.name, size: f.size, type: f.type, byId: S.viewerId, itemId, time: Date.now() };
      S.files.push(rec);
      if (f.size > MAX_FILE_BYTES) { done(); return; }
      const r = new FileReader();
      r.onload = () => { rec.data = r.result; done(); };
      r.onerror = done;
      r.readAsDataURL(f);
    });
  }
  $('#fileList').addEventListener('click', e => {
    const dl = e.target.closest('[data-file-dl]');
    const del = e.target.closest('[data-file-del]');
    if (dl) {
      const f = S.files.find(x => x.id === dl.dataset.fileDl);
      if (f && f.data) { const a = document.createElement('a'); a.href = f.data; a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); }
    }
    if (del) {
      const f = S.files.find(x => x.id === del.dataset.fileDel);
      S.files = S.files.filter(x => x.id !== del.dataset.fileDel);
      if (f) log(`${viewerName()} removed file ${f.name}.`, 'FILE');
      commit();
    }
  });

  function resetNoteForm() {
    editingNoteId = null;
    $('#noteTitle').value = ''; $('#noteBody').value = '';
    $('#noteMode').textContent = 'New note';
    $('#noteCancel').hidden = true;
    $('#noteSave').textContent = 'Save note';
  }
  $('#noteForm').addEventListener('submit', e => {
    e.preventDefault();
    const title = $('#noteTitle').value.trim();
    const body = $('#noteBody').value.trim();
    if (!title) return;
    const n = editingNoteId && S.notes.find(x => x.id === editingNoteId);
    if (n) Object.assign(n, { title, body, time: Date.now() });
    else S.notes.push({ id: uid('no'), authorId: S.viewerId, title, body, time: Date.now() });
    resetNoteForm();
    commit();
  });
  $('#noteCancel').addEventListener('click', resetNoteForm);
  $('#noteList').addEventListener('click', e => {
    const ed = e.target.closest('[data-note-edit]');
    const del = e.target.closest('[data-note-del]');
    if (ed) {
      const n = S.notes.find(x => x.id === ed.dataset.noteEdit);
      if (!n) return;
      editingNoteId = n.id;
      $('#noteTitle').value = n.title; $('#noteBody').value = n.body || '';
      $('#noteMode').textContent = `Editing “${n.title}”`;
      $('#noteCancel').hidden = false;
      $('#noteSave').textContent = 'Update note';
      $('#noteTitle').focus();
    }
    if (del) {
      S.notes = S.notes.filter(x => x.id !== del.dataset.noteDel);
      if (editingNoteId === del.dataset.noteDel) resetNoteForm();
      commit();
    }
  });

  // ---------- boot ----------
  S = loadState() || sampleState();
  fixViewer();
  resetForm();
  commit();
  popPendingForViewer();
})();
</script>
</body>
</html>
