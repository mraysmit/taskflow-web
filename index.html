  // ---------- toasts & dialog ----------
  function toast(msg) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = msg;
    $('#toasts').appendChild(el);
    setTimeout(() => dismiss(el), 3800);
  }
  function dismiss(el) { if (!el.isConnected) return; el.classList.add('out'); setTimeout(() => el.remove(), 260); }

  function popAlert(a) {
    const el = document.createElement('div');
    el.className = 'toast pop';
    el.innerHTML = `<div class="t-title">🔔 New alert for ${esc(nameOf(a.toId))}</div><div>${esc(alertText(a))}</div>
      <div class="t-actions"><button class="btn-sm b-indigo" type="button">Open item</button><button class="btn-sm b-plain" type="button">Dismiss</button></div>`;
    const [openBtn, closeBtn] = el.querySelectorAll('button');
    openBtn.onclick = () => { dismiss(el); openAlert(a.id); };
    closeBtn.onclick = () => dismiss(el);
    $('#toasts').appendChild(el);
    setTimeout(() => dismiss(el), (+cfg().notifications.popupSeconds || 9) * 1000);
  }
  function popPendingForViewer() {
    const pending = unreadFor(S.viewerId).filter(a => !a.popped);
    if (!pending.length) return;
    if (cfg().notifications.popups) {
      pending.slice(0, 3).forEach((a, i) => setTimeout(() => popAlert(a), 120 * i));
      if (pending.length > 3) setTimeout(() => toast(`+${pending.length - 3} more unread alerts in the Action Inbox.`), 400);
    }
    pending.forEach(a => { a.popped = true; });
    save();
  }

  const dlg = $('#dlg');
  function modal({ title, html, ok = 'Confirm', okClass = 'btn-red', onOpen, onOk, wide = false, noCancel = false }) {
    dlg.classList.toggle('wide', wide);
    $('#dlgBody').classList.toggle('scroll', wide);
    $('#dlg button[value="cancel"]').hidden = noCancel;
    $('#dlgTitle').textContent = title;
    $('#dlgBody').innerHTML = html;
    const okBtn = $('#dlgOk');
    okBtn.textContent = ok;
    okBtn.className = 'btn ' + okClass;
    okBtn.onclick = () => { if (onOk($('#dlgBody')) !== false) dlg.close(); };
    dlg.showModal();
    if (onOpen) onOpen($('#dlgBody'));
  }
  dlg.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !['TEXTAREA', 'BUTTON'].includes(e.target.tagName)) { e.preventDefault(); $('#dlgOk').click(); }
  });

  // ---------- events on items ----------
  // The workspace feed keeps the latest 300 events; each item keeps its own history as well.
  function log(msg, type, it) {
    const time = Date.now();
    S.activity.unshift({ id: uid('ac'), msg, type, time, itemId: it ? it.id : '' });
    if (S.activity.length > 300) S.activity.length = 300;
    if (it) {
      it.history = it.history || [];
      it.history.unshift({ time, type, text: msg, actorId: S.viewerId });
      if (it.history.length > 200) it.history.length = 200;
    }
  }
  // Alerts never go to the person acting.
  function sendAlert(toId, it, fields) {
    if (!toId || toId === S.viewerId || !person(toId)) return false;
    S.alerts.unshift(Object.assign({ id: uid('al'), toId, fromId: S.viewerId, itemId: it.id, time: Date.now(), read: false, popped: false }, fields));
    return true;
  }
  const notifyKind = (kind, toId, it) => { if (cfg().notifications[kind]) sendAlert(toId, it, { kind }); };

  function flashCard(id) {
    requestAnimationFrame(() => {
      const el = document.getElementById('card-' + id);
      if (!el) return;
      el.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    });
  }

  // o.enc escapes each value (for URLs or JSON); o.raw keeps line breaks (for email bodies).
  function fillTemplate(tpl, it, ctx = {}, snap = it, o = {}) {
    const map = {
      ref: it.ref, title: it.title, actor: viewerName(), owner: nameOf(it.ownerId) || '—', nextOwner: nameOf(it.nextOwnerId) || '—',
      prevOwner: nameOf(snap.ownerId) || '—', team: teamNameOf(it.teamId) || '—', nextTeam: teamNameOf(it.nextTeamId) || '—',
      status: statusName(it.statusId), priority: (priority(it.priorityId) || {}).name || '', due: it.due || 'no date', reason: ctx.reason || '',
      created: ctx.created || '', offerTo: nameOf((it.offer || {}).toId) || '—',
      note: (ctx.note || []).filter(n => n.text).map(n => `${n.label}: ${n.text}`).join(' · '),
    };
    const out = String(tpl || '').replace(/\{(\w+)\}/g, (m, k) => (has(map, k) ? (o.enc ? o.enc(String(map[k])) : map[k]) : m));
    return o.raw ? out : out.replace(/\s+/g, ' ').trim();
  }
  const jsonEsc = v => JSON.stringify(v).slice(1, -1);
  function openUrl(url, newTab) {
    const a = document.createElement('a');
    a.href = url;
    if (newTab) { a.target = '_blank'; a.rel = 'noopener'; }
    document.body.appendChild(a); a.click(); a.remove();
  }

  // Reusable steps ("Run another button", custom sequences) are expanded inline before running.
  function expandSteps(steps, snap, depth = 0) {
    if (depth > 5) return [];
    const out = [];
    for (const s of steps) {
      if (!stepApplies(s, snap)) continue;
      if (s.type === 'runButton') {
        const a = cfg().actions.find(x => x.id === s.actionId);
        if (a) out.push(...expandSteps(a.steps, snap, depth + 1));
        continue;
      }
      if (isCustomStep(s.type)) {
        const x = cfg().extensions.steps.find(y => 'x:' + y.id === s.type);
        if (!x) continue;
        if (x.mode === 'macro') { out.push(...expandSteps(x.steps, snap, depth + 1)); continue; }
      }
      out.push(s);
    }
    return out;
  }

  // "Summary*, Open actions" → [{label:'Summary', required:true}, {label:'Open actions', required:false}]
  const noteSections = s => String(s.sections || 'Summary*').split(',').map(x => x.trim()).filter(Boolean)
    .map(x => ({ label: x.replace(/\*$/, '').trim(), required: x.endsWith('*') }));
  function handoverNoteHTML(note) {
    const filled = (note || []).filter(n => n.text);
    if (!filled.length) return '<div class="muted">No handover note was written.</div>';
    return filled.map(n => `<div class="note-sec"><b>${esc(n.label)}</b>${esc(n.text)}</div>`).join('');
  }
  // Closes the pending offer and records the outcome on the item's handover record.
  function settleOffer(it, state, text) {
    const o = it.offer;
    const rec = it.handovers.find(h => h.id === o.id);
    if (rec) Object.assign(rec, { state, response: text || '', settledBy: S.viewerId, settledAt: Date.now() });
    S.alerts.forEach(a => { if (a.offerId === o.id) a.read = true; });
    it.offer = null;
  }

  // Shared by the "Create a linked item" step and the script API.
  function createLinkedItem(parent, spec, ctx, snap, parts) {
    const findTeam = v => (team(v) ? v : (findByName(cfg().teams, v) || {}).id || '');
    const teamId = spec.team === 'same' ? parent.teamId
      : spec.team === 'next' ? (parent.nextTeamId || (team(parent.teamId) || {}).nextTeamId || parent.teamId)
      : (findTeam(spec.team) || parent.teamId);
    const lead = (team(teamId) || {}).leadId;
    const ownerId = spec.owner === 'nextOwner' ? parent.nextOwnerId
      : spec.owner === 'viewer' ? S.viewerId
      : spec.owner === 'lead' ? (lead && isActive(lead) ? lead : '')
      : spec.owner === 'none' || !spec.owner ? ''
      : (person(spec.owner) ? spec.owner : (findByName(cfg().people, spec.owner) || {}).id || '');
    const st = status(spec.status) || findByName(cfg().statuses, spec.status);
    const statusId = st && !st.closed ? st.id : cfg().general.initialStatusId;
    const pr = priority(spec.priority) || findByName(cfg().priorities, spec.priority);
    const now = Date.now();
    const child = {
      id: uid('i'), ref: nextRef(), title: fillTemplate(spec.title || '{title}', parent, ctx, snap) || 'New item',
      desc: fillTemplate(spec.desc || '', parent, ctx, snap), priorityId: pr ? pr.id : parent.priorityId, statusId,
      prevStatusId: '', blockReason: '', teamId, ownerId, nextTeamId: '', nextOwnerId: '',
      due: spec.dueDays !== '' && spec.dueDays != null && Number.isFinite(+spec.dueDays) ? addDays(todayISO(), +spec.dueDays) : '',
      fields: spec.copyFields ? clone(parent.fields || {}) : {}, links: [{ itemId: parent.id, type: 'From' }], created: now, updated: now,
    };
    itemDefaults(child);
    S.items.push(child);
    parent.links = parent.links || [];
    parent.links.push({ itemId: child.id, type: spec.linkType || 'Linked' });
    ctx.created = child.ref;
    parts.push(`created ${child.ref}`);
    log(`${child.ref} created from ${parent.ref} by ${viewerName()}.`, 'CREATE', child);
    if (spec.notify !== false && sendAlert(ownerId, child, { kind: 'custom', label: 'CREATED', text: `${child.ref} "${child.title}" was created for you by ${viewerName()} (from ${parent.ref}).` })) ctx.sent = (ctx.sent || 0) + 1;
    return child.ref;
  }

  // Lets scripts change an item by field name; returns a description for the activity log.
  function setByName(it, name, value) {
    const n = String(name || '').trim();
    const low = n.toLowerCase();
    const findP = v => person(v) || findByName(cfg().people, v);
    const findT = v => team(v) || findByName(cfg().teams, v);
    switch (low) {
      case 'title': it.title = String(value); return 'title changed';
      case 'desc': case 'description': it.desc = String(value); return 'description changed';
      case 'due': it.due = value ? String(value).slice(0, 10) : ''; return it.due ? `due date set to ${it.due}` : 'due date cleared';
      case 'status': { const st = status(value) || findByName(cfg().statuses, value); if (!st) throw new Error(`Unknown status “${value}”`); return moveStatus(it, st.id) ? `moved to ${st.name}` : ''; }
      case 'priority': { const p = priority(value) || findByName(cfg().priorities, value); if (!p) throw new Error(`Unknown priority “${value}”`); it.priorityId = p.id; return `priority set to ${p.name}`; }
      case 'owner': { const p = value ? findP(value) : null; if (value && !p) throw new Error(`Unknown person “${value}”`); it.ownerId = p ? p.id : ''; if (p && p.teamId) it.teamId = p.teamId; return p ? `assigned to ${p.name}` : 'unassigned'; }
      case 'nextowner': { const p = value ? findP(value) : null; if (value && !p) throw new Error(`Unknown person “${value}”`); it.nextOwnerId = p ? p.id : ''; it.nextTeamId = p ? (p.teamId || it.nextTeamId) : ''; return p ? `next owner set to ${p.name}` : 'next owner cleared'; }
      case 'team': case 'nextteam': { const t = value ? findT(value) : null; if (value && !t) throw new Error(`Unknown team “${value}”`); it[low === 'team' ? 'teamId' : 'nextTeamId'] = t ? t.id : ''; return `${low === 'team' ? 'team' : 'next team'} set to ${t ? t.name : 'none'}`; }
    }
    const f = cfg().fields.custom.find(x => x.id === n || x.label.toLowerCase() === low);
    if (!f) throw new Error(`Unknown field “${n}”`);
    const r = parseCustom(f, value);
    if (r.error) throw new Error(r.error);
    it.fields = it.fields || {};
    it.fields[f.id] = r.value;
    return `${f.label} set to ${customValueText(f, r.value) || 'empty'}`;
  }

  function runScriptStep(x, s, it, snap, ctx, parts) {
    if (!scriptsOn()) { ctx.scriptsOff = true; return; }
    const api = Object.assign({}, scriptApi, {
      item: itemView(it), before: itemView(snap), params: Object.assign(paramDefaults(x), s.params || {}),
      viewer: viewerView(), today: todayISO(), reason: ctx.reason || '',
      set: (name, value) => { const d = setByName(it, name, value); if (d) parts.push(d); },
      alert: (who, text) => {
        const p = who === 'owner' ? person(it.ownerId) : who === 'nextOwner' ? person(it.nextOwnerId) : (person(who) || findByName(cfg().people, who));
        if (p && sendAlert(p.id, it, { kind: 'custom', label: (x.name || 'SCRIPT').toUpperCase(), text: String(text) })) ctx.sent = (ctx.sent || 0) + 1;
      },
      log: text => parts.push(String(text)),
      createItem: spec => createLinkedItem(it, Object.assign({ team: 'same', owner: 'none', priority: 'same', linkType: 'Linked' }, spec || {}), ctx, snap, parts),
      openUrl: url => openUrl(String(url), true),
      fetch: (url, opts) => fetch(url, opts),
      template: str => fillTemplate(str, it, ctx, snap),
    });
    try {
      compileScript(x.script, ['ctx'], false)(api);
    } catch (e) {
      toast(`Step “${x.name}” failed: ${e.message}`);
      log(`Step “${x.name}” failed on ${it.ref}: ${e.message}`, 'SCRIPT', it);
    }
  }

  function stepApplies(step, snap) {
    if (!step.when) return true;
    const [mode, fid] = step.when.split(':');
    const m = filterMatches(fid, snap);
    return mode === 'if' ? m : !m;
  }
  function personTarget(to, it, forNext) {
    if (to === 'viewer') return S.viewerId;
    if (to === 'none') return '';
    if (to === 'nextOwner') return it.nextOwnerId;
    if (to === 'lead') { const t = team(forNext ? (it.nextTeamId || it.teamId) : it.teamId); return t && t.leadId && isActive(t.leadId) ? t.leadId : ''; }
    return person(to) ? to : '';
  }
  function holdReturnTarget(it) {
    const p = status(it.prevStatusId);
    return p && !p.closed && !p.hold ? p.id : cfg().general.initialStatusId;
  }
  // Status changes keep the hold bookkeeping in one place.
  function moveStatus(it, target, reason = '') {
    if (!status(target) || target === it.statusId) return false;
    if (isHoldStatus(target) && !isHoldStatus(it.statusId)) it.prevStatusId = it.statusId;
    it.blockReason = isHoldStatus(target) ? reason : '';
    it.statusId = target;
    return true;
  }

  // Runs a configured button: collect any input first, then apply each step in order.
  function runAction(actionId, itemId) {
    const a = cfg().actions.find(x => x.id === actionId);
    const it = getItem(itemId);
    if (!a || !it) return;
    const snap = clone(it);
    const steps = expandSteps(a.steps, snap);
    if (!steps.length) { toast(`${a.label}: nothing to do for ${it.ref}.`); return; }
    const gather = steps.filter(s => (STEP_TYPES[s.type] || {}).gather);
    if (!gather.length) { applySteps(a, it, snap, steps, {}); return; }
    const parts = [];
    gather.forEach((s, i) => {
      if (s.type === 'confirm') parts.push(`<div>${esc(fillTemplate(s.message, snap))}</div>`);
      if (s.type === 'delete') parts.push(`<div>This permanently removes <b>${esc(it.title)}</b> and its alerts.</div>`);
      if (s.type === 'reason') parts.push(`<label><span>${esc(s.prompt || 'Reason')}${s.required ? ' *' : ''}</span><textarea class="textarea" data-reason="${i}" data-required="${s.required ? 1 : ''}"></textarea></label>`);
      if (s.type === 'handoverNote') {
        parts.push(`<div class="muted">Handing over to <b>${esc(nameOf(it.nextOwnerId))}</b>${it.nextTeamId ? ` (${esc(teamNameOf(it.nextTeamId))})` : ''}. They will read this before accepting.</div>`);
        noteSections(s).forEach((sec, k) => parts.push(`<label><span>${esc(sec.label)}${sec.required ? ' *' : ''}</span><textarea class="textarea" data-note="${k}" data-label="${esc(sec.label)}" data-required="${sec.required ? 1 : ''}" style="min-height:70px"></textarea></label>`));
      }
      if (s.type === 'acceptOffer' && it.offer) {
        const o = it.offer;
        parts.push(`<div><b>${esc(nameOf(o.fromId))}</b> is handing <b>${esc(it.ref)} “${esc(it.title)}”</b> to you${o.toTeamId ? ` (${esc(teamNameOf(o.toTeamId))})` : ''}. Read the handover note, then accept to take ownership.</div>`);
        parts.push(handoverNoteHTML(o.note));
      }
      if (s.type === 'pickNext') {
        const people = activePeople().filter(p => p.id !== it.ownerId);
        parts.push(`<label><span>${esc(label('nextOwner'))}</span><select class="select" id="m_owner">${opt('', '— None —', !it.nextOwnerId)}${people.map(p => opt(p.id, p.name, p.id === it.nextOwnerId)).join('')}</select></label>
          <label><span>${esc(label('nextTeam'))}</span><select class="select" id="m_team">${opt('', '— None —', !it.nextTeamId)}${cfg().teams.map(t => opt(t.id, t.name, t.id === it.nextTeamId)).join('')}</select></label>`);
      }
    });
    parts.push('<div class="form-error" id="m_err"></div>');
    modal({
      title: `${a.label} · ${it.ref}`,
      html: parts.join(''),
      ok: a.label || 'Confirm',
      onOpen: body => {
        const sel = $('#m_owner', body);
        if (sel) sel.addEventListener('change', () => { $('#m_team', body).value = sel.value ? personTeam(sel.value) : ''; });
        const first = $('textarea, select', body);
        if (first) first.focus();
      },
      onOk: body => {
        const reasons = $$('[data-reason]', body);
        const missing = reasons.find(r => r.dataset.required && !r.value.trim());
        if (missing) { $('#m_err', body).textContent = 'Please give a reason.'; missing.focus(); return false; }
        const noteEls = $$('[data-note]', body);
        const noteMissing = noteEls.find(n => n.dataset.required && !n.value.trim());
        if (noteMissing) { $('#m_err', body).textContent = `Please fill in “${noteMissing.dataset.label}”.`; noteMissing.focus(); return false; }
        const ctx = { reason: reasons.map(r => r.value.trim()).filter(Boolean).join(' ') };
        if (noteEls.length) ctx.note = noteEls.map(n => ({ label: n.dataset.label, text: n.value.trim() }));
        if ($('#m_owner', body)) ctx.next = { ownerId: $('#m_owner', body).value, teamId: $('#m_team', body).value || personTeam($('#m_owner', body).value) };
        applySteps(a, it, snap, steps, ctx);
      },
    });
  }

  function applySteps(a, it, snap, steps, ctx) {
    const parts = [];
    const notes = [];
    let type = 'EDIT';
    let openEditor = false;
    for (const s of steps) {
      switch (s.type) {
        case 'setStatus': {
          const target = s.to === '__prev' ? holdReturnTarget(it) : s.to;
          if (moveStatus(it, target, ctx.reason)) { parts.push(`moved to ${statusName(target)}`); type = isHoldStatus(target) ? 'BLOCK' : (type === 'HANDOFF' ? type : 'STATUS'); }
          break;
        }
        case 'transfer': {
          if (!it.nextOwnerId) break;
          const from = it.ownerId;
          it.ownerId = it.nextOwnerId;
          it.teamId = it.nextTeamId || personTeam(it.ownerId) || it.teamId;
          it.nextOwnerId = '';
          it.nextTeamId = '';
          parts.push(`handed off from ${nameOf(from) || '—'} to ${nameOf(it.ownerId)}`);
          type = 'HANDOFF';
          break;
        }
        case 'route': {
          const t = team(it.teamId);
          if (!t || !t.nextTeamId) break;
          it.nextTeamId = t.nextTeamId;
          if (s.useLead) { const nt = team(t.nextTeamId); it.nextOwnerId = nt && nt.leadId && nt.leadId !== it.ownerId && isActive(nt.leadId) ? nt.leadId : ''; }
          parts.push(`routed to ${teamNameOf(it.nextTeamId)}${it.nextOwnerId ? ` (${nameOf(it.nextOwnerId)})` : ''}`);
          break;
        }
        case 'pickNext': {
          if (!ctx.next) break;
          if (ctx.next.ownerId === it.nextOwnerId && ctx.next.teamId === it.nextTeamId) break;
          it.nextOwnerId = ctx.next.ownerId;
          it.nextTeamId = ctx.next.teamId;
          parts.push(it.nextOwnerId ? `next owner set to ${nameOf(it.nextOwnerId)}${it.nextTeamId ? ` (${teamNameOf(it.nextTeamId)})` : ''}` : 'next owner cleared');
          break;
        }
        case 'setOwner': {
          const id = personTarget(s.to, it, false);
          if (id === it.ownerId) break;
          it.ownerId = id;
          if (id && personTeam(id)) it.teamId = personTeam(id);
          if (id && id === it.nextOwnerId) { it.nextOwnerId = ''; it.nextTeamId = ''; }
          parts.push(id ? `assigned to ${nameOf(id)}` : 'unassigned');
          type = 'ASSIGN';
          break;
        }
        case 'setNext': {
          const id = personTarget(s.to, it, true);
          if (id === it.nextOwnerId || (id && id === it.ownerId)) break;
          it.nextOwnerId = id;
          it.nextTeamId = id ? (personTeam(id) || it.nextTeamId) : '';
          parts.push(id ? `next owner set to ${nameOf(id)}` : 'next owner cleared');
          break;
        }
        case 'setPriority':
          if (priority(s.to) && s.to !== it.priorityId) { it.priorityId = s.to; parts.push(`priority set to ${priority(s.to).name}`); }
          break;
        case 'setDue': {
          const due = s.clear ? '' : addDays(todayISO(), +s.days || 0);
          if (due !== it.due) { it.due = due; parts.push(due ? `due date set to ${due}` : 'due date cleared'); }
          break;
        }
        case 'setField': {
          const f = cfg().fields.custom.find(x => x.id === s.fieldId);
          if (!f) break;
          const r = parseCustom(f, s.value);
          if (r.error) { toast(`${a.label}: ${r.error}`); break; }
          it.fields = it.fields || {};
          it.fields[f.id] = r.value;
          parts.push(`${f.label} set to ${customValueText(f, r.value) || 'empty'}`);
          break;
        }
        case 'createItem': createLinkedItem(it, s, ctx, snap, parts); break;
        case 'handoverNote': break;
        case 'offer': {
          if (!it.nextOwnerId || it.offer) break;
          const o = { id: uid('ho'), toId: it.nextOwnerId, toTeamId: it.nextTeamId || personTeam(it.nextOwnerId), fromId: it.ownerId, byId: S.viewerId, time: Date.now(), note: ctx.note || [] };
          it.offer = o;
          it.handovers.unshift(Object.assign({}, o, { state: 'pending' }));
          parts.push(`offered to ${nameOf(o.toId)} for acceptance`);
          type = 'HANDOFF';
          if (sendAlert(o.toId, it, { kind: 'offer', label: 'HANDOFF REQUEST', offerId: o.id, text: `${nameOf(o.fromId)} wants to hand off ${it.ref} "${it.title}" to you. Read the handover note and accept or decline.` })) ctx.sent = (ctx.sent || 0) + 1;
          break;
        }
        case 'acceptOffer': {
          const o = it.offer;
          if (!o) break;
          const from = it.ownerId;
          it.ownerId = o.toId;
          it.teamId = o.toTeamId || personTeam(o.toId) || it.teamId;
          it.nextOwnerId = '';
          it.nextTeamId = '';
          moveStatus(it, s.land);
          settleOffer(it, 'accepted', ctx.reason);
          parts.push(`handed off from ${nameOf(from) || '—'} to ${nameOf(it.ownerId)} (accepted)`);
          type = 'HANDOFF';
          break;
        }
        case 'declineOffer':
          if (!it.offer) break;
          parts.push(`handoff declined by ${viewerName()}`);
          settleOffer(it, 'declined', ctx.reason);
          type = 'HANDOFF';
          break;
        case 'withdrawOffer':
          if (!it.offer) break;
          parts.push(`handoff to ${nameOf(it.offer.toId)} withdrawn`);
          settleOffer(it, 'withdrawn', ctx.reason);
          type = 'HANDOFF';
          break;
        case 'notify': case 'email': case 'webhook': notes.push(s); break;
        case 'edit': openEditor = true; break;
        case 'delete': {
          S.items = S.items.filter(i => i.id !== it.id);
          S.items.forEach(i => { i.links = (i.links || []).filter(l => l.itemId !== it.id); });
          S.alerts = S.alerts.filter(x => x.itemId !== it.id);
          S.posts.forEach(p => { if (p.itemId === it.id) p.itemId = ''; });
          S.files.forEach(f => { if (f.itemId === it.id) f.itemId = ''; });
          if (editingId === it.id) resetForm();
          log(`${it.ref} deleted by ${viewerName()}.`, 'DELETE');
          commit();
          toast(`${it.ref} deleted.`);
          return;
        }
        default:
          if (isCustomStep(s.type)) {
            const x = cfg().extensions.steps.find(y => 'x:' + y.id === s.type);
            if (x) runScriptStep(x, s, it, snap, ctx, parts);
          }
      }
    }
    if (ctx.scriptsOff) toast('Scripts are turned off, so script steps were skipped (Configuration › Extensions).');
    // Alerts, emails and webhooks go out after every change so messages describe the final state.
    let sent = ctx.sent || 0;
    const personFor = (who, pid) => (who === 'owner' ? it.ownerId : who === 'nextOwner' ? it.nextOwnerId : who === 'prevOwner' ? snap.ownerId : pid);
    notes.forEach(s => {
      if (s.type === 'notify') {
        const to = personFor(s.who, s.personId);
        if (s.onlyIfChanged && ((s.who === 'owner' && to === snap.ownerId) || (s.who === 'nextOwner' && to === snap.nextOwnerId))) return;
        if (sendAlert(to, it, { kind: 'custom', label: a.label.toUpperCase(), text: fillTemplate(s.message, it, ctx, snap) })) sent++;
      }
      if (s.type === 'email') {
        let addr = '';
        if (s.to === 'address') addr = fillTemplate(s.address, it, ctx, snap);
        else {
          const pid = personFor(s.to, s.personId);
          addr = (person(pid) || {}).email || '';
          if (!addr) { toast(`No email address for ${nameOf(pid) || 'that person'}. Add one in Configuration › People.`); return; }
        }
        openUrl(`mailto:${encodeURIComponent(addr)}?subject=${encodeURIComponent(fillTemplate(s.subject, it, ctx, snap))}&body=${encodeURIComponent(fillTemplate(s.body, it, ctx, snap, { raw: true }))}`);
        parts.push(`email drafted to ${addr}`);
      }
      if (s.type === 'webhook') {
        const url = fillTemplate(s.url, it, ctx, snap, { enc: encodeURIComponent });
        const body = s.method === 'GET' ? undefined : fillTemplate(s.body, it, ctx, snap, { enc: jsonEsc, raw: true });
        const ref = it.ref;
        parts.push(`webhook ${s.method} sent`);
        fetch(url, { method: s.method, headers: body ? { 'Content-Type': 'application/json' } : undefined, body })
          .then(r => { log(`Webhook for ${ref}: ${s.method} ${url} → ${r.status}`, 'WEBHOOK', getItem(it.id)); toast(`Webhook for ${ref} returned ${r.status}.`); })
          .catch(err => { log(`Webhook for ${ref} failed: ${err.message}`, 'WEBHOOK', getItem(it.id)); toast(`Webhook for ${ref} failed: ${err.message}`); })
          .finally(() => { save(); renderPanel(); });
      }
    });
    if (parts.length) {
      it.updated = Date.now();
      log(`${it.ref} ${parts.join('; ')} by ${viewerName()}${ctx.reason ? `: ${ctx.reason}` : ''}.`, type, it);
    }
    commit();
    flashCard(it.id);
    if (openEditor) { fillForm(it); focusForm(); return; }
    if (parts.length) toast(`${it.ref} ${parts.join('; ')}.${sent ? ` ${plural(sent, 'alert')} sent.` : ''}`);
    else if (!sent) toast(`${a.label}: nothing changed on ${it.ref}.`);
  }

  function openAlert(alertId) {
    const a = S.alerts.find(x => x.id === alertId);
    if (!a) return;
    a.read = true;
    const it = getItem(a.itemId);
    setPage('board', () => { if (it && !visibleItems().some(i => i.id === it.id)) resetFilters(); });
    if (it) flashCard(it.id); else toast('That item no longer exists.');
  }
  // ---------- item details: handovers, comments, history ----------
  const HSTATE = { pending: 'Awaiting acceptance', accepted: 'Accepted', declined: 'Declined', withdrawn: 'Withdrawn' };
  function itemDetailsHTML(it) {
    const f = (l, v, cls = '') => `<div class="field"><div class="field-l">${esc(l)}</div><div class="field-v ${cls}">${esc(v || '—')}</div></div>`;
    const meta = [
      f(label('status'), statusName(it.statusId)), f(label('priority'), (priority(it.priorityId) || {}).name),
      f(label('owner'), nameOf(it.ownerId)), f(label('team'), teamNameOf(it.teamId)),
      f(label('nextOwner'), nameOf(it.nextOwnerId)), f(label('nextTeam'), teamNameOf(it.nextTeamId)),
      f(label('due'), it.due, isOverdue(it) ? 'overdue' : ''),
      ...cfg().fields.custom.map(cf => f(cf.label, customValueText(cf, it.fields[cf.id]))),
    ].join('');
    const responseLabel = h => (h.state === 'accepted' ? `Read-back from ${nameOf(h.settledBy)}` : h.state === 'declined' ? 'Reason for declining' : 'Note');
    const handovers = it.handovers.length ? it.handovers.map(h => `<div class="handover">
        <div class="handover-top"><b>${esc(nameOf(h.fromId))} → ${esc(nameOf(h.toId))}</b><span class="hstate ${esc(h.state)}">${esc(HSTATE[h.state] || h.state)}</span><span class="muted">${fmtTime(h.time)}</span></div>
        ${handoverNoteHTML(h.note)}
        ${h.response ? `<div class="note-sec"><b>${esc(responseLabel(h))}</b>${esc(h.response)}</div>` : ''}
        ${h.settledAt ? `<div class="muted" style="margin-top:6px">${esc(HSTATE[h.state] || h.state)} by ${esc(nameOf(h.settledBy))} · ${fmtTime(h.settledAt)}</div>` : ''}
      </div>`).join('') : '<p class="muted" style="margin:0">No handoffs yet.</p>';
    const comments = it.comments.length
      ? it.comments.map(c => `<div class="comment"><div class="who"><b>${esc(nameOf(c.authorId))}</b> · ${fmtTime(c.time)}</div>${esc(c.text)}</div>`).join('')
      : '<p class="muted" style="margin:0">No comments yet.</p>';
    const hist = it.history.length
      ? it.history.map(h => `<div class="hist"><span class="when">${fmtTime(h.time)} · ${esc(h.type)}</span><br>${esc(h.text)}</div>`).join('')
      : '<p class="muted" style="margin:0">No history yet.</p>';
    return `<div class="detail-meta">${meta}</div>
      ${it.offer ? `<div class="offer-banner">Waiting for <b>${esc(nameOf(it.offer.toId))}</b> to accept, since ${fmtTime(it.offer.time)}.</div>` : ''}
      ${it.desc ? `<p style="margin:0">${esc(it.desc)}</p>` : ''}
      <div class="detail-sec"><h4>Handovers</h4>${handovers}</div>
      <div class="detail-sec"><h4>Comments (${it.comments.length})</h4>${comments}
        <div style="display:grid;gap:8px;margin-top:10px">
          <textarea class="textarea" id="d_comment" placeholder="Add a comment as ${esc(viewerName())}…" style="min-height:70px" aria-label="Comment"></textarea>
          <div><button type="button" class="btn" id="d_addComment" style="height:40px;font-size:15px">Add comment</button></div>
        </div></div>
      <div class="detail-sec"><h4>History</h4>${hist}</div>`;
  }
  function openItemDetails(id) {
    const it = getItem(id);
    if (!it) return;
    const wire = body => {
      $('#d_addComment', body).addEventListener('click', () => {
        const text = $('#d_comment', body).value.trim();
        if (!text) { $('#d_comment', body).focus(); return; }
        it.comments.push({ id: uid('cm'), authorId: S.viewerId, text, time: Date.now() });
        log(`${viewerName()} commented on ${it.ref}.`, 'COMMENT', it);
        if (cfg().notifications.comments) {
          uniq([it.ownerId, it.nextOwnerId, (it.offer || {}).toId].filter(Boolean)).forEach(to =>
            sendAlert(to, it, { kind: 'comment', label: 'COMMENT', text: `${viewerName()} commented on ${it.ref} "${it.title}": ${text.length > 140 ? text.slice(0, 140) + '…' : text}` }));
        }
        commit();
        body.innerHTML = itemDetailsHTML(it);
        wire(body);
        $('#d_comment', body).focus();
      });
    };

  // Accept/Decline straight from the Action Inbox run the same configured buttons as on the card.

  // ---------- form ----------
  const F = id => $('#f_' + id);

  function renderFormOptions(want = {}) {
    const fill = (sel, list, wanted, fallback) => {
      const cur = wanted || sel.value || fallback;
      sel.innerHTML = list.map(x => opt(x.v, x.l, x.v === cur)).join('') + (cur && !list.some(x => x.v === cur) ? opt(cur, '(removed)', true) : '');

    fill(F('status'), cfg().statuses.map(s => ({ v: s.id, l: s.name })), want.statusId, cfg().general.initialStatusId);
  }

  const cfDomId = f => 'cf_' + f.id;
  function customFieldHTML(f, v) {
    const id = cfDomId(f);
    const ph = esc(f.help || '');
    const lbl = `${esc(f.label)}${f.required ? ' *' : ''}`;
    f = Object.assign({}, f, { options: fieldOptions(f, cfg()) });
    switch (fieldBase(f, cfg())) {
      case 'longtext': return `<label class="full"><span>${lbl}</span><textarea class="textarea" id="${id}" placeholder="${ph}">${esc(v || '')}</textarea></label>`;
      case 'multiselect': {
        const vals = Array.isArray(v) ? v : [];
        return `<div class="full cf-item"><span>${lbl}</span><div class="chips" id="${id}" data-multi="1">${f.options.map(o => `<label class="chip"><input type="checkbox" value="${esc(o)}"${vals.includes(o) ? ' checked' : ''}> ${esc(o)}</label>`).join('') || '<span class="muted">No options configured.</span>'}</div></div>`;
      }
      case 'select': return `<label><span>${lbl}</span><select class="select" id="${id}">${opt('', '—', v === '' || v == null)}${f.options.map(o => opt(o, o, o === v)).join('')}${v && !f.options.includes(v) ? opt(v, v, true) : ''}</select></label>`;
      case 'bool': return `<label><span>${lbl}</span><select class="select" id="${id}">${opt('', '—', v !== true && v !== false)}${opt('yes', 'Yes', v === true)}${opt('no', 'No', v === false)}</select></label>`;
      case 'date': return `<label><span>${lbl}</span><input class="input" type="date" id="${id}" value="${esc(v || '')}"></label>`;
      case 'number': return `<label><span>${lbl}</span><input class="input" type="number" id="${id}" value="${esc(v ?? '')}" placeholder="${ph}"${f.min !== '' ? ` min="${esc(f.min)}"` : ''}${f.max !== '' ? ` max="${esc(f.max)}"` : ''}></label>`;
      case 'person': return `<label><span>${lbl}</span><input class="input" id="${id}" list="dlPeople" value="${esc(v ? nameOf(v) : '')}" placeholder="${ph}"></label>`;
      case 'team': return `<label><span>${lbl}</span><input class="input" id="${id}" list="dlTeams" value="${esc(v ? teamNameOf(v) : '')}" placeholder="${ph}"></label>`;
      case 'url': return `<label><span>${lbl}</span><input class="input" type="url" id="${id}" value="${esc(v || '')}" placeholder="${ph || 'https://'}"></label>`;
      case 'email': return `<label><span>${lbl}</span><input class="input" type="email" id="${id}" value="${esc(v || '')}" placeholder="${ph}"></label>`;
    }
    return `<label><span>${lbl}</span><input class="input" id="${id}" value="${esc(v ?? '')}" placeholder="${ph}"></label>`;
  }
  function readCustomRaw() {
    const out = {};
    cfg().fields.custom.forEach(f => {
      const el = document.getElementById(cfDomId(f));
      if (!el) return;
      out[f.id] = el.dataset.multi ? $$('input:checked', el).map(i => i.value) : el.value;

  // Rebuilds custom inputs only when their definitions change, so typing isn't interrupted.
  function renderCustomFields(values, force) {
    const sig = JSON.stringify(cfg().fields.custom);
    if (!force && sig === lastCustomSig) return;
    let vals = values;
    if (!vals) {
      const raw = readCustomRaw();
      vals = {};
      cfg().fields.custom.forEach(f => { if (has(raw, f.id)) vals[f.id] = parseCustom(f, raw[f.id]).value; });
    }
    lastCustomSig = sig;
    $('#customFields').innerHTML = cfg().fields.custom.map(f => customFieldHTML(f, vals[f.id])).join('');
  }
  // Parses a raw form/step value using the field's basic type, then any custom field type rules.
  function parseCustom(f, raw) {
    const c = cfg();
    const base = fieldBase(f, c);
    const t = fieldTypeDef(f, c);
    const opts = fieldOptions(f, c);
    const r = parseBase(f, base, opts, t, raw);
    if (r.error || !t || isEmptyValue(r.value)) return r;
    if (t.pattern && typeof r.value === 'string') {
      let re;
      try { re = new RegExp(t.pattern); } catch (e) { re = null; }
      if (re && !re.test(r.value)) return { error: t.patternMsg || `${f.label} doesn’t match the expected format.` };
    }
    if (base === 'number' && t.decimals !== '' && Number.isFinite(+t.decimals)) r.value = +(+r.value).toFixed(Math.max(0, Math.min(6, +t.decimals)));
    if (t.script && c.extensions.scriptsEnabled) {
      try {
        const res = compileScript(t.script, ['value', 'field', 'api'], true)(r.value, { label: f.label, type: t.name }, scriptApi);
        if (res === false) return { error: t.patternMsg || `${f.label} is not valid.` };
        if (typeof res === 'string' && res) return { error: res };
      } catch (e) { return { error: `${f.label}: validation script failed (${e.message}).` }; }
    }
    return r;
  }
  function parseBase(f, base, opts, t, raw) {
    if (base === 'multiselect') {
      const a = Array.isArray(raw) ? raw : String(raw ?? '').split(',').map(x => x.trim()).filter(Boolean);
      return { value: a.filter(x => opts.includes(x)) };
    }
    const v = String(raw ?? '').trim();
    if (v === '') return { value: '' };
    const min = f.min !== '' ? f.min : (t ? t.min : '');
    const max = f.max !== '' ? f.max : (t ? t.max : '');
    switch (base) {
      case 'number': {
        if (!Number.isFinite(+v)) return { error: `${f.label} must be a number.` };
        if (min !== '' && Number.isFinite(+min) && +v < +min) return { error: `${f.label} must be at least ${min}.` };
        if (max !== '' && Number.isFinite(+max) && +v > +max) return { error: `${f.label} must be at most ${max}.` };
        return { value: +v };
      }
      case 'bool': return { value: v === 'yes' || v === 'true' };
      case 'url': return /^https?:\/\/\S+$/i.test(v) ? { value: v } : { error: `${f.label} must be a web address starting with http:// or https://.` };
      case 'email': return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) ? { value: v } : { error: `${f.label} must be an email address.` };
      case 'select': return opts.includes(v) ? { value: v } : { error: `${f.label}: “${v}” is not one of the options.` };
      case 'person': { const p = person(v) || findByName(cfg().people, v); return p ? { value: p.id } : { error: `${f.label}: “${v}” is not in People.` }; }
      case 'team': { const tm = team(v) || findByName(cfg().teams, v); return tm ? { value: tm.id } : { error: `${f.label}: “${v}” is not in Teams.` }; }
    }
    return { value: v };
  }
  const isEmptyValue = v => v === '' || v == null || (Array.isArray(v) && !v.length);

  function focusForm() {

  F('owner').addEventListener('change', () => { const p = findByName(cfg().people, F('owner').value); if (p && p.teamId) F('team').value = teamNameOf(p.teamId); });
  F('nextOwner').addEventListener('change', () => { const p = findByName(cfg().people, F('nextOwner').value); if (p && p.teamId) F('nextTeam').value = teamNameOf(p.teamId); });
  F('priority').addEventListener('change', () => {

  $('#formCancel').addEventListener('click', () => resetForm());

  $('#form').addEventListener('submit', e => {
    e.preventDefault();
    const err = (msg, el) => { $('#formError').textContent = msg; if (el) el.focus(); };
    const title = F('title').value.trim();
    const ownerName = F('owner').value.trim();
    const nextOwnerName = F('nextOwner').value.trim();
    if (!title) return err(`${label('title')} is required.`, F('title'));
    if (!ownerName) return err(`${label('owner')} is required.`, F('owner'));
    if (nextOwnerName && nextOwnerName.toLowerCase() === ownerName.toLowerCase()) return err(`${label('nextOwner')} must be different from ${label('owner').toLowerCase()}.`, F('nextOwner'));
    for (const n of [ownerName, nextOwnerName]) {
      const p = findByName(cfg().people, n);
      if (p && !p.active) return err(`${p.name} is inactive. Reactivate them in Configuration › People.`);
    }
    const ref = F('ref').value.trim() || nextRef();
    if (S.items.some(i => i.ref.toLowerCase() === ref.toLowerCase() && i.id !== editingId)) return err(`Reference ${ref} is already in use.`, F('ref'));
    const custom = {};
    const raw = readCustomRaw();
    for (const f of cfg().fields.custom) {
      const r = parseCustom(f, raw[f.id]);
      const el = document.getElementById(cfDomId(f));
      if (r.error) return err(r.error, el);
      if (f.required && isEmptyValue(r.value)) return err(`${f.label} is required.`, el && el.dataset.multi ? null : el);
      custom[f.id] = r.value;
    }

    // Names typed that aren't configured yet are added to the configuration (and any open draft).
    const added = [];
    const teamFor = name => {
      if (!name) return '';
      let t = findByName(cfg().teams, name);
      if (!t) {
        t = { id: uid('t'), name, color: '#343a8a', bg: '#e4e4f7', leadId: '', nextTeamId: '' };
        cfg().teams.push(t);
        if (cfgDraft) cfgDraft.teams.push(clone(t));
        added.push(`team “${name}”`);
      }
      return t.id;
    };
    const personFor = (name, teamId) => {
      if (!name) return '';
      let p = findByName(cfg().people, name);
      if (!p) {
        p = { id: uid('p'), name, teamId, role: '', active: true };
        cfg().people.push(p);
        if (cfgDraft) cfgDraft.people.push(clone(p));
        added.push(`“${name}”`);
      }
      return p.id;
    };
    let teamId = teamFor(F('team').value.trim());
    const ownerId = personFor(ownerName, teamId);
    let nextTeamId = teamFor(F('nextTeam').value.trim());
    const nextOwnerId = personFor(nextOwnerName, nextTeamId);
    if (!teamId) teamId = personTeam(ownerId);
    if (nextOwnerId && !nextTeamId) nextTeamId = personTeam(nextOwnerId);
    const d = { title, ref, priorityId: F('priority').value, teamId, ownerId, nextTeamId, nextOwnerId, due: F('due').value, desc: F('desc').value.trim() };
    const newStatus = F('status').value;

    let id;
    if (editingId && getItem(editingId)) {
      const it = getItem(editingId);
      const before = clone(it);
      Object.assign(it, d, { fields: Object.assign({}, it.fields, custom), updated: Date.now() });
      moveStatus(it, newStatus, it.blockReason);
      id = it.id;
      log(`${it.ref} updated by ${viewerName()}.`, 'EDIT', it);
      if (before.statusId !== it.statusId) log(`${it.ref} moved to ${statusName(it.statusId)} by ${viewerName()}.`, 'STATUS', it);
      if (it.ownerId !== before.ownerId) notifyKind('assigned', it.ownerId, it);
      if (it.nextOwnerId && it.nextOwnerId !== before.nextOwnerId) notifyKind('next', it.nextOwnerId, it);
      toast(`${it.ref} updated.`);
    } else {
      const now = Date.now();
      const it = itemDefaults(Object.assign({ id: uid('i'), created: now, updated: now, statusId: cfg().general.initialStatusId, prevStatusId: '', blockReason: '' }, d, { fields: custom }));
      moveStatus(it, newStatus);
      S.items.push(it);
      id = it.id;
      log(`${it.ref} created by ${viewerName()}.`, 'CREATE', it);
      notifyKind('assigned', it.ownerId, it);
      if (it.nextOwnerId) notifyKind('next', it.nextOwnerId, it);
      toast(`${it.ref} created.`);

    resetForm();
    if (S.page !== 'config') S.page = 'board';
    commit();
    if (S.page === 'board') {
      if (!visibleItems().some(i => i.id === id)) toast('Saved item is hidden by the current filters.');
      flashCard(id);
    }

  // =====================================================================

  const USAGE = {

  const getPath = (o, path) => path.split('.').reduce((a, k) => (a == null ? a : a[k]), o);

  // Markup helpers. Every control carries a data-bind path into the draft.

  const sel = (path, opts, val, o = {}) => `<select class="select" ${bind(path, o.rerender)} aria-label="${esc(o.aria || path)}">${opts.map(x => opt(x.v, x.l, String(x.v) === String(val ?? ''))).join('')}</select>`;
  const chk = (path, val, text, o = {}) => `<label class="chk"><input type="checkbox" ${bind(path, o.rerender)}${val ? ' checked' : ''}${o.disabled ? ' disabled' : ''}> ${esc(text)}</label>`;
  const swatch = (path, val, aria) => `<input type="color" class="swatch" ${bind(path)} value="${esc(val)}" aria-label="${esc(aria)}" title="${esc(aria)}">`;

  const toggleChips = (path, values, options, o = {}) => `<div class="chips">${o.any ? `<label class="chip"><input type="checkbox" data-toggle="${esc(path)}" value="*"${values.includes('*') ? ' checked' : ''}> ${esc(o.any)}</label>` : ''}${options.map(x => `<label class="chip"><input type="checkbox" data-toggle="${esc(path)}" value="${esc(x.v)}"${values.includes(x.v) || values.includes('*') ? ' checked' : ''}${values.includes('*') ? ' disabled' : ''}> ${esc(x.l)}</label>`).join('')}</div>`;

  // Where an extension block is referenced; used for the "Used by" line and to guard deletion.
  function extUses(d, list, id) {
    const out = [];
    const condRefs = pred => d.filters.forEach(f => { if (f.conds.some(pred)) out.push(`filter “${f.name}”`); });
    if (list === 'extensions.flags') condRefs(cd => cd.subject === 'flag' && cd.value === id);
    if (list === 'extensions.conditions') condRefs(cd => cd.subject === 'x:' + id);
    if (list === 'extensions.fieldTypes') d.fields.custom.forEach(f => { if (f.type === 'x:' + id) out.push(`field “${f.label}”`); });
    if (list === 'extensions.steps') {
      d.actions.forEach(a => { if (a.steps.some(s => s.type === 'x:' + id)) out.push(`button “${a.label}”`); });
      d.extensions.steps.forEach(x => { if (x.id !== id && x.steps.some(s => s.type === 'x:' + id)) out.push(`step type “${x.name}”`); });
    }
    return out;
  }

  // Where a filter is referenced; used for the "Used by" line and to guard deletion.
  function filterUses(d, fid) {
    const uses = [];
    d.filters.forEach(f => { if (f.id !== fid && f.conds.some(cd => cd.subject === 'matches' && cd.value === fid)) uses.push({ kind: 'filter', text: `filter “${f.name}”` }); });
    d.stats.forEach(s => { if (s.filterId === fid) uses.push({ kind: 'stat', text: `stat card “${s.label}”` }); });
    d.views.forEach(v => { if (v.filterId === fid || v.count === fid) uses.push({ kind: 'view', text: `board view “${v.label}”` }); });
    d.actions.forEach(a => {
      if (a.show.filterId === fid) uses.push({ kind: 'action', text: `button “${a.label}” (shown when)` });
      if (a.steps.some(s => s.when && s.when.split(':')[1] === fid)) uses.push({ kind: 'action', text: `button “${a.label}” (step condition)` });

    return uses;
  }

  function routeHTML(d) {
    const targets = new Set(d.teams.map(t => t.nextTeamId).filter(Boolean));
    const seen = new Set();
    const walk = start => {
      const chain = [];
      const local = new Set();
      let cur = start;
      while (cur && !local.has(cur.id)) { chain.push(cur); local.add(cur.id); seen.add(cur.id); cur = d.teams.find(x => x.id === cur.nextTeamId); }
      return { chain, loop: !!cur };
    };
    const chains = d.teams.filter(t => !targets.has(t.id)).map(walk);
    d.teams.forEach(t => { if (!seen.has(t.id)) chains.push(walk(t)); });
    if (!chains.length) return '<div class="muted">No teams yet.</div>';
    return chains.map(({ chain, loop }) => `<div class="route-line">${chain.map(t => tagHTML(t.name || '(unnamed)', teamStyle(t))).join('<span class="arrow">→</span>')}${loop ? '<span class="arrow">↺ loops back</span>' : '<span class="arrow">→</span><span class="route-end">Done</span>'}</div>`).join('');
  }
